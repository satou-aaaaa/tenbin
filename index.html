とき。","- 五　当該個人情報取扱事業者が学術研究機関等である場合であって、当該個人データの提供が学術研究の成果の公表又は教授のためやむを得ないとき（個人の権利利益を不当に侵害するおそれがある場合を除く。）。","- 六　当該個人情報取扱事業者が学術研究機関等である場合であって、当該個人データを学術研究目的で提供する必要があるとき（当該個人データを提供する目的の一部が学術研究目的である場合を含み、個人の権利利益を不当に侵害するおそれがある場合を除く。）（当該個人情報取扱事業者と当該第三者が共同して学術研究を行う場合に限る。）。","- 七　当該第三者が学術研究機関等である場合であって、当該第三者が当該個人データを学術研究目的で取り扱う必要があるとき（当該個人データを取り扱う目的の一部が学術研究目的である場合を含み、個人の権利利益を不当に侵害するおそれがある場合を除く。）。"],["２　個人情報取扱事業者は、第三者に提供される個人データについて、本人の求めに応じて当該本人が識別される個人データの第三者への提供を停止することとしている場合であって、次に掲げる事項について、個人情報保護委員会規則で定めるところにより、あらかじめ、本人に通知し、又は本人が容易に知り得る状態に置くとともに、個人情報保護委員会に届け出たときは、前項の規定にかかわらず、当該個人データを第三者に提供することができる。ただし、第三者に提供される個人データが要配慮個人情報又は第二十条第一項の規定に違反して取得されたもの若しくは他の個人情報取扱事業者からこの項本文の規定により提供されたもの（その全部又は一部を複製し、又は加工したものを含む。）である場合は、この限りでない。","- 一　第三者への提供を行う個人情報取扱事業者の氏名又は名称及び住所並びに法人にあっては、その代表者（法人でない団体で代表者又は管理人の定めのあるものにあっては、その代表者又は管理人。以下この条、第三十条第一項第一号及び第三十二条第一項第一号において同じ。）の氏名","- 二　第三者への提供を利用目的とすること。","- 三　第三者に提供される個人データの項目","- 四　第三者に提供される個人データの取得の方法","- 五　第三者への提供の方法","- 六　本人の求めに応じて当該本人が識別される個人データの第三者への提供を停止すること。","- 七　本人の求めを受け付ける方法","- 八　その他個人の権利利益を保護するために必要なものとして個人情報保護委員会規則で定める事項"],["３　個人情報取扱事業者は、前項第一号に掲げる事項に変更があったとき又は同項の規定による個人データの提供をやめたときは遅滞なく、同項第三号から第五号まで、第七号又は第八号に掲げる事項を変更しようとするときはあらかじめ、その旨について、個人情報保護委員会規則で定めるところにより、本人に通知し、又は本人が容易に知り得る状態に置くとともに、個人情報保護委員会に届け出なければならない。"],["４　個人情報保護委員会は、第二項の規定による届出があったときは、個人情報保護委員会規則で定めるところにより、当該届出に係る事項を公表しなければならない。前項の規定による届出があったときも、同様とする。"],["５　次に掲げる場合において、当該個人データの提供を受ける者は、前各項の規定の適用については、第三者に該当しないものとする。","- 一　個人情報取扱事業者が利用目的の達成に必要な範囲内において個人データの取扱いの全部又は一部を委託することに伴って当該個人データが提供される場合","- 二　合併その他の事由による事業の承継に伴って個人データが提供される場合","- 三　特定の者との間で共同して利用される個人データが当該特定の者に提供される場合であって、その旨並びに共同して利用される個人データの項目、共同して利用する者の範囲、利用する者の利用目的並びに当該個人データの管理について責任を有する者の氏名又は名称及び住所並びに法人にあっては、その代表者の氏名について、あらかじめ、本人に通知し、又は本人が容易に知り得る状態に置いているとき。"],["６　個人情報取扱事業者は、前項第三号に規定する個人データの管理について責任を有する者の氏名、名称若しくは住所又は法人にあっては、その代表者の氏名に変更があったときは遅滞なく、同号に規定する利用する者の利用目的又は当該責任を有する者を変更しようとするときはあらかじめ、その旨について、本人に通知し、又は本人が容易に知り得る状態に置かなければならない。"]]},"行政書士法2条":{"n":"行政書士法第二条","c":"（資格）","p":[["次の各号のいずれかに該当する者は、行政書士となる資格を有する。","- 一　行政書士試験に合格した者","- 二　弁護士となる資格を有する者","- 三　弁理士となる資格を有する者","- 四　公認会計士となる資格を有する者","- 五　税理士となる資格を有する者","- 六　国又は地方公共団体の公務員として行政事務を担当した期間及び行政執行法人（独立行政法人通則法（平成十一年法律第百三号）第二条第四項に規定する行政執行法人をいう。以下同じ。）又は特定地方独立行政法人（地方独立行政法人法（平成十五年法律第百十八号）第二条第二項に規定する特定地方独立行政法人をいう。以下同じ。）の役員又は職員として行政事務に相当する事務を担当した期間が通算して二十年以上（学校教育法（昭和二十二年法律第二十六号）による高等学校を卒業した者その他同法第九十条に規定する者にあつては十七年以上）になる者"]]},"行政書士法2条の2":{"n":"行政書士法第二条の二","c":"（欠格事由）","p":[["次の各号のいずれかに該当する者は、前条の規定にかかわらず、行政書士となる資格を有しない。","- 一　未成年者","- 二　破産手続開始の決定を受けて復権を得ない者","- 三　拘禁刑以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなつてから三年を経過しない者","- 四　公務員（行政執行法人又は特定地方独立行政法人の役員又は職員を含む。）で懲戒免職の処分を受け、当該処分の日から三年を経過しない者","- 五　第六条の五第一項の規定により登録の取消しの処分を受け、当該処分の日から三年を経過しない者","- 六　第十四条の規定により業務の禁止の処分を受け、当該処分の日から三年を経過しない者","- 七　懲戒処分により、弁護士会から除名され、公認会計士の登録の抹消の処分を受け、弁理士、税理士、司法書士若しくは土地家屋調査士の業務を禁止され、又は社会保険労務士の失格処分を受けた者で、これらの処分を受けた日から三年を経過しないもの","- 八　税理士法（昭和二十六年法律第二百三十七号）第四十八条第一項の規定により同法第四十四条第三号に掲げる処分を受けるべきであつたことについて決定を受けた者で、当該決定を受けた日から三年を経過しないもの"]]},"行政書士法9条":{"n":"行政書士法第九条","c":"（帳簿の備付及び保存）","p":[["行政書士は、その業務に関する帳簿を備え、これに事件の名称、年月日、受けた報酬の額、依頼者の住所氏名その他都道府県知事の定める事項を記載しなければならない。"],["２　行政書士は、前項の帳簿をその関係書類とともに、帳簿閉鎖の時から二年間保存しなければならない。行政書士でなくなつたときも、また同様とする。"]]},"行政書士法10条の2":{"n":"行政書士法第十条の二","c":"（報酬の額の掲示等）","p":[["行政書士は、その事務所の見やすい場所に、その業務に関し受ける報酬の額を掲示しなければならない。"],["２　行政書士会及び日本行政書士会連合会は、依頼者の選択及び行政書士の業務の利便に資するため、行政書士がその業務に関し受ける報酬の額について、統計を作成し、これを公表するよう努めなければならない。"]]},"行政書士法11条":{"n":"行政書士法第十一条","c":"（依頼に応ずる義務）","p":[["行政書士は、正当な事由がある場合でなければ、依頼を拒むことができない。"]]},"行政書士法12条":{"n":"行政書士法第十二条","c":"（秘密を守る義務）","p":[["行政書士は、正当な理由がなく、その業務上取り扱つた事項について知り得た秘密を漏らしてはならない。行政書士でなくなつた後も、また同様とする。"]]},"行政書士法19条":{"n":"行政書士法第十九条","c":"（業務の制限）","p":[["行政書士又は行政書士法人でない者は、他人の依頼を受けいかなる名目によるかを問わず報酬を得て、業として第一条の三に規定する業務を行うことができない。ただし、他の法律に別段の定めがある場合及び定型的かつ容易に行えるものとして総務省令で定める手続について、当該手続に関し相当の経験又は能力を有する者として総務省令で定める者が電磁的記録を作成する場合は、この限りでない。"],["２　総務大臣は、前項に規定する総務省令を定めるときは、あらかじめ、当該手続に係る法令を所管する国務大臣の意見を聴くものとする。"]]},"個人情報保護法23条":{"n":"個人情報の保護に関する法律第二十三条","c":"（安全管理措置）","p":[["個人情報取扱事業者は、その取り扱う個人データの漏えい、滅失又は毀損の防止その他の個人データの安全管理のために必要かつ適切な措置を講じなければならない。"]]},"個人情報保護法26条":{"n":"個人情報の保護に関する法律第二十六条","c":"（漏えい等の報告等）","p":[["個人情報取扱事業者は、その取り扱う個人データの漏えい、滅失、毀損その他の個人データの安全の確保に係る事態であって個人の権利利益を害するおそれが大きいものとして個人情報保護委員会規則で定めるものが生じたときは、個人情報保護委員会規則で定めるところにより、当該事態が生じた旨を個人情報保護委員会に報告しなければならない。ただし、当該個人情報取扱事業者が、他の個人情報取扱事業者又は行政機関等から当該個人データの取扱いの全部又は一部の委託を受けた場合であって、個人情報保護委員会規則で定めるところにより、当該事態が生じた旨を当該他の個人情報取扱事業者又は行政機関等に通知したときは、この限りでない。"],["２　前項に規定する場合には、個人情報取扱事業者（同項ただし書の規定による通知をした者を除く。）は、本人に対し、個人情報保護委員会規則で定めるところにより、当該事態が生じた旨を通知しなければならない。ただし、本人への通知が困難な場合であって、本人の権利利益を保護するため必要なこれに代わるべき措置をとるときは、この限りでない。"]]},"個人情報保護法33条":{"n":"個人情報の保護に関する法律第三十三条","c":"（開示）","p":[["本人は、個人情報取扱事業者に対し、当該本人が識別される保有個人データの電磁的記録の提供による方法その他の個人情報保護委員会規則で定める方法による開示を請求することができる。"],["２　個人情報取扱事業者は、前項の規定による請求を受けたときは、本人に対し、同項の規定により当該本人が請求した方法（当該方法による開示に多額の費用を要する場合その他の当該方法による開示が困難である場合にあっては、書面の交付による方法）により、遅滞なく、当該保有個人データを開示しなければならない。ただし、開示することにより次の各号のいずれかに該当する場合は、その全部又は一部を開示しないことができる。","- 一　本人又は第三者の生命、身体、財産その他の権利利益を害するおそれがある場合","- 二　当該個人情報取扱事業者の業務の適正な実施に著しい支障を及ぼすおそれがある場合","- 三　他の法令に違反することとなる場合"],["３　個人情報取扱事業者は、第一項の規定による請求に係る保有個人データの全部若しくは一部について開示しない旨の決定をしたとき、当該保有個人データが存在しないとき、又は同項の規定により本人が請求した方法による開示が困難であるときは、本人に対し、遅滞なく、その旨を通知しなければならない。"],["４　他の法令の規定により、本人に対し第二項本文に規定する方法に相当する方法により当該本人が識別される保有個人データの全部又は一部を開示することとされている場合には、当該全部又は一部の保有個人データについては、第一項及び第二項の規定は、適用しない。"],["５　第一項から第三項までの規定は、当該本人が識別される個人データに係る第二十九条第一項及び第三十条第三項の記録（その存否が明らかになることにより公益その他の利益が害されるものとして政令で定めるものを除く。第三十七条第二項において「第三者提供記録」という。）について準用する。"]]},"個人情報保護法35条":{"n":"個人情報の保護に関する法律第三十五条","c":"（利用停止等）","p":[["本人は、個人情報取扱事業者に対し、当該本人が識別される保有個人データが第十八条若しくは第十九条の規定に違反して取り扱われているとき、又は第二十条の規定に違反して取得されたものであるときは、当該保有個人データの利用の停止又は消去（以下この条において「利用停止等」という。）を請求することができる。"],["２　個人情報取扱事業者は、前項の規定による請求を受けた場合であって、その請求に理由があることが判明したときは、違反を是正するために必要な限度で、遅滞なく、当該保有個人データの利用停止等を行わなければならない。ただし、当該保有個人データの利用停止等に多額の費用を要する場合その他の利用停止等を行うことが困難な場合であって、本人の権利利益を保護するため必要なこれに代わるべき措置をとるときは、この限りでない。"],["３　本人は、個人情報取扱事業者に対し、当該本人が識別される保有個人データが第二十七条第一項又は第二十八条の規定に違反して第三者に提供されているときは、当該保有個人データの第三者への提供の停止を請求することができる。"],["４　個人情報取扱事業者は、前項の規定による請求を受けた場合であって、その請求に理由があることが判明したときは、遅滞なく、当該保有個人データの第三者への提供を停止しなければならない。ただし、当該保有個人データの第三者への提供の停止に多額の費用を要する場合その他の第三者への提供を停止することが困難な場合であって、本人の権利利益を保護するため必要なこれに代わるべき措置をとるときは、この限りでない。"],["５　本人は、個人情報取扱事業者に対し、当該本人が識別される保有個人データを当該個人情報取扱事業者が利用する必要がなくなった場合、当該本人が識別される保有個人データに係る第二十六条第一項本文に規定する事態が生じた場合その他当該本人が識別される保有個人データの取扱いにより当該本人の権利又は正当な利益が害されるおそれがある場合には、当該保有個人データの利用停止等又は第三者への提供の停止を請求することができる。"],["６　個人情報取扱事業者は、前項の規定による請求を受けた場合であって、その請求に理由があることが判明したときは、本人の権利利益の侵害を防止するために必要な限度で、遅滞なく、当該保有個人データの利用停止等又は第三者への提供の停止を行わなければならない。ただし、当該保有個人データの利用停止等又は第三者への提供の停止に多額の費用を要する場合その他の利用停止等又は第三者への提供の停止を行うことが困難な場合であって、本人の権利利益を保護するため必要なこれに代わるべき措置をとるときは、この限りでない。"],["７　個人情報取扱事業者は、第一項若しくは第五項の規定による請求に係る保有個人データの全部若しくは一部について利用停止等を行ったとき若しくは利用停止等を行わない旨の決定をしたとき、又は第三項若しくは第五項の規定による請求に係る保有個人データの全部若しくは一部について第三者への提供を停止したとき若しくは第三者への提供を停止しない旨の決定をしたときは、本人に対し、遅滞なく、その旨を通知しなければならない。"]]},"個人情報保護法130条":{"n":"個人情報の保護に関する法律第百三十条","c":"（設置）","p":[["内閣府設置法第四十九条第三項の規定に基づいて、個人情報保護委員会（以下「委員会」という。）を置く。"],["２　委員会は、内閣総理大臣の所轄に属する。"]]},"行政手続法3条":{"n":"行政手続法第三条","c":"（適用除外）","p":[["次に掲げる処分及び行政指導については、次章から第四章の二までの規定は、適用しない。","- 一　国会の両院若しくは一院又は議会の議決によってされる処分","- 二　裁判所若しくは裁判官の裁判により、又は裁判の執行としてされる処分","- 三　国会の両院若しくは一院若しくは議会の議決を経て、又はこれらの同意若しくは承認を得た上でされるべきものとされている処分","- 四　検査官会議で決すべきものとされている処分及び会計検査の際にされる行政指導","- 五　刑事事件に関する法令に基づいて検察官、検察事務官又は司法警察職員がする処分及び行政指導","- 六　国税又は地方税の犯則事件に関する法令（他の法令において準用する場合を含む。）に基づいて国税庁長官、国税局長、税務署長、国税庁、国税局若しくは税務署の当該職員、税関長、税関職員又は徴税吏員（他の法令の規定に基づいてこれらの職員の職務を行う者を含む。）がする処分及び行政指導並びに金融商品取引の犯則事件に関する法令（他の法令において準用する場合を含む。）に基づいて証券取引等監視委員会、その職員（当該法令においてその職員とみなされる者を含む。）、財務局長又は財務支局長がする処分及び行政指導","- 七　学校、講習所、訓練所又は研修所において、教育、講習、訓練又は研修の目的を達成するために、学生、生徒、児童若しくは幼児若しくはこれらの保護者、講習生、訓練生又は研修生に対してされる処分及び行政指導","- 八　刑務所、少年刑務所、拘置所、留置施設、海上保安留置施設、少年院又は少年鑑別所において、収容の目的を達成するためにされる処分及び行政指導","- 九　公務員（国家公務員法（昭和二十二年法律第百二十号）第二条第一項に規定する国家公務員及び地方公務員法（昭和二十五年法律第二百六十一号）第三条第一項に規定する地方公務員をいう。以下同じ。）又は公務員であった者に対してその職務又は身分に関してされる処分及び行政指導","- 十　外国人の出入国、出入国管理及び難民認定法（昭和二十六年政令第三百十九号）第六十一条の二第一項に規定する難民の認定、同条第二項に規定する補完的保護対象者の認定又は帰化に関する処分及び行政指導","- 十一　専ら人の学識技能に関する試験又は検定の結果についての処分","- 十二　相反する利害を有する者の間の利害の調整を目的として法令の規定に基づいてされる裁定その他の処分（その双方を名宛人とするものに限る。）及び行政指導","- 十三　公衆衛生、環境保全、防疫、保安その他の公益に関わる事象が発生し又は発生する可能性のある現場において警察官若しくは海上保安官又はこれらの公益を確保するために行使すべき権限を法律上直接に与えられたその他の職員によってされる処分及び行政指導","- 十四　報告又は物件の提出を命ずる処分その他その職務の遂行上必要な情報の収集を直接の目的としてされる処分及び行政指導","- 十五　審査請求、再調査の請求その他の不服申立てに対する行政庁の裁決、決定その他の処分","- 十六　前号に規定する処分の手続又は第三章に規定する聴聞若しくは弁明の機会の付与の手続その他の意見陳述のための手続において法令に基づいてされる処分及び行政指導"],["２　次に掲げる命令等を定める行為については、第六章の規定は、適用しない。","- 一　法律の施行期日について定める政令","- 二　恩赦に関する命令","- 三　命令又は規則を定める行為が処分に該当する場合における当該命令又は規則","- 四　法律の規定に基づき施設、区間、地域その他これらに類するものを指定する命令又は規則","- 五　公務員の給与、勤務時間その他の勤務条件について定める命令等","- 六　審査基準、処分基準又は行政指導指針であって、法令の規定により若しくは慣行として、又は命令等を定める機関の判断により公にされるもの以外のもの"],["３　第一項各号及び前項各号に掲げるもののほか、地方公共団体の機関がする処分（その根拠となる規定が条例又は規則に置かれているものに限る。）及び行政指導、地方公共団体の機関に対する届出（前条第七号の通知の根拠となる規定が条例又は規則に置かれているものに限る。）並びに地方公共団体の機関が命令等を定める行為については、次章から第六章までの規定は、適用しない。"]]},"行政手続法39条":{"n":"行政手続法第三十九条","c":"（意見公募手続）","p":[["命令等制定機関は、命令等を定めようとする場合には、当該命令等の案（命令等で定めようとする内容を示すものをいう。以下同じ。）及びこれに関連する資料をあらかじめ公示し、意見（情報を含む。以下同じ。）の提出先及び意見の提出のための期間（以下「意見提出期間」という。）を定めて広く一般の意見を求めなければならない。"],["２　前項の規定により公示する命令等の案は、具体的かつ明確な内容のものであって、かつ、当該命令等の題名及び当該命令等を定める根拠となる法令の条項が明示されたものでなければならない。"],["３　第一項の規定により定める意見提出期間は、同項の公示の日から起算して三十日以上でなければならない。"],["４　次の各号のいずれかに該当するときは、第一項の規定は、適用しない。","- 一　公益上、緊急に命令等を定める必要があるため、第一項の規定による手続（以下「意見公募手続」という。）を実施することが困難であるとき。","- 二　納付すべき金銭について定める法律の制定又は改正により必要となる当該金銭の額の算定の基礎となるべき金額及び率並びに算定方法についての命令等その他当該法律の施行に関し必要な事項を定める命令等を定めようとするとき。","- 三　予算の定めるところにより金銭の給付決定を行うために必要となる当該金銭の額の算定の基礎となるべき金額及び率並びに算定方法その他の事項を定める命令等を定めようとするとき。","- 四　法律の規定により、内閣府設置法第四十九条第一項若しくは第二項若しくは国家行政組織法第三条第二項に規定する委員会又は内閣府設置法第三十七条若しくは第五十四条若しくは国家行政組織法第八条に規定する機関（以下「委員会等」という。）の議を経て定めることとされている命令等であって、相反する利害を有する者の間の利害の調整を目的として、法律又は政令の規定により、これらの者及び公益をそれぞれ代表する委員をもって組織される委員会等において審議を行うこととされているものとして政令で定める命令等を定めようとするとき。","- 五　他の行政機関が意見公募手続を実施して定めた命令等と実質的に同一の命令等を定めようとするとき。","- 六　法律の規定に基づき法令の規定の適用又は準用について必要な技術的読替えを定める命令等を定めようとするとき。","- 七　命令等を定める根拠となる法令の規定の削除に伴い当然必要とされる当該命令等の廃止をしようとするとき。","- 八　他の法令の制定又は改廃に伴い当然必要とされる規定の整理その他の意見公募手続を実施することを要しない軽微な変更として政令で定めるものを内容とする命令等を定めようとするとき。"]]},"行政手続法42条":{"n":"行政手続法第四十二条","c":"（提出意見の考慮）","p":[["命令等制定機関は、意見公募手続を実施して命令等を定める場合には、意見提出期間内に当該命令等制定機関に対し提出された当該命令等の案についての意見（以下「提出意見」という。）を十分に考慮しなければならない。"]]},"行政手続法46条":{"n":"行政手続法第四十六条","c":"（地方公共団体の措置）","p":[["地方公共団体は、第三条第三項において第二章から前章までの規定を適用しないこととされた処分、行政指導及び届出並びに命令等を定める行為に関する手続について、この法律の規定の趣旨にのっとり、行政運営における公正の確保と透明性の向上を図るため必要な措置を講ずるよう努めなければならない。"]]},"情報公開法3条":{"n":"行政機関の保有する情報の公開に関する法律第三条","c":"（開示請求権）","p":[["何人も、この法律の定めるところにより、行政機関の長（前条第一項第四号及び第五号の政令で定める機関にあっては、その機関ごとに政令で定める者をいう。以下同じ。）に対し、当該行政機関の保有する行政文書の開示を請求することができる。"]]},"情報公開法6条":{"n":"行政機関の保有する情報の公開に関する法律第六条","c":"（部分開示）","p":[["行政機関の長は、開示請求に係る行政文書の一部に不開示情報が記録されている場合において、不開示情報が記録されている部分を容易に区分して除くことができるときは、開示請求者に対し、当該部分を除いた部分につき開示しなければならない。ただし、当該部分を除いた部分に有意の情報が記録されていないと認められるときは、この限りでない。"],["２　開示請求に係る行政文書に前条第一号の情報（特定の個人を識別することができるものに限る。）が記録されている場合において、当該情報のうち、氏名、生年月日その他の特定の個人を識別することができることとなる記述等の部分を除くことにより、公にしても、個人の権利利益が害されるおそれがないと認められるときは、当該部分を除いた部分は、同号の情報に含まれないものとみなして、前項の規定を適用する。"]]},"情報公開法8条":{"n":"行政機関の保有する情報の公開に関する法律第八条","c":"（行政文書の存否に関する情報）","p":[["開示請求に対し、当該開示請求に係る行政文書が存在しているか否かを答えるだけで、不開示情報を開示することとなるときは、行政機関の長は、当該行政文書の存否を明らかにしないで、当該開示請求を拒否することができる。"]]},"情報公開法10条":{"n":"行政機関の保有する情報の公開に関する法律第十条","c":"（開示決定等の期限）","p":[["前条各項の決定（以下「開示決定等」という。）は、開示請求があった日から三十日以内にしなければならない。ただし、第四条第二項の規定により補正を求めた場合にあっては、当該補正に要した日数は、当該期間に算入しない。"],["２　前項の規定にかかわらず、行政機関の長は、事務処理上の困難その他正当な理由があるときは、同項に規定する期間を三十日以内に限り延長することができる。この場合において、行政機関の長は、開示請求者に対し、遅滞なく、延長後の期間及び延長の理由を書面により通知しなければならない。"]]},"地方自治法14条":{"n":"地方自治法第十四条","c":"","p":[["普通地方公共団体は、法令に違反しない限りにおいて第二条第二項の事務に関し、条例を制定することができる。"],["普通地方公共団体は、義務を課し、又は権利を制限するには、法令に特別の定めがある場合を除くほか、条例によらなければならない。"],["普通地方公共団体は、法令に特別の定めがあるものを除くほか、その条例中に、条例に違反した者に対し、二年以下の拘禁刑、百万円以下の罰金、拘留、科料若しくは没収の刑又は五万円以下の過料を科する旨の規定を設けることができる。"]]},"地方自治法15条":{"n":"地方自治法第十五条","c":"","p":[["普通地方公共団体の長は、法令に違反しない限りにおいて、その権限に属する事務に関し、規則を制定することができる。"],["普通地方公共団体の長は、法令に特別の定めがあるものを除くほか、普通地方公共団体の規則中に、規則に違反した者に対し、五万円以下の過料を科する旨の規定を設けることができる。"]]},"憲法94条":{"n":"日本国憲法第九十四条","c":"","p":[["地方公共団体は、その財産を管理し、事務を処理し、及び行政を執行する権能を有し、法律の範囲内で条例を制定することができる。"]]},"民法543条":{"n":"民法第五百四十三条","c":"（債権者の責めに帰すべき事由による場合）","p":[["債務の不履行が債権者の責めに帰すべき事由によるものであるときは、債権者は、前二条の規定による契約の解除をすることができない。"]]},"民法545条":{"n":"民法第五百四十五条","c":"（解除の効果）","p":[["当事者の一方がその解除権を行使したときは、各当事者は、その相手方を原状に復させる義務を負う。ただし、第三者の権利を害することはできない。"],["２　前項本文の場合において、金銭を返還するときは、その受領の時から利息を付さなければならない。"],["３　第一項本文の場合において、金銭以外の物を返還するときは、その受領の時以後に生じた果実をも返還しなければならない。"],["４　解除権の行使は、損害賠償の請求を妨げない。"]]},"民法304条":{"n":"民法第三百四条","c":"（物上代位）","p":[["先取特権は、その目的物の売却、賃貸、滅失又は損傷によって債務者が受けるべき金銭その他の物に対しても、行使することができる。ただし、先取特権者は、その払渡し又は引渡しの前に差押えをしなければならない。"],["２　債務者が先取特権の目的物につき設定した物権の対価についても、前項と同様とする。"]]},"民法369条":{"n":"民法第三百六十九条","c":"（抵当権の内容）","p":[["抵当権者は、債務者又は第三者が占有を移転しないで債務の担保に供した不動産について、他の債権者に先立って自己の債権の弁済を受ける権利を有する。"],["２　地上権及び永小作権も、抵当権の目的とすることができる。この場合においては、この章の規定を準用する。"]]},"民法372条":{"n":"民法第三百七十二条","c":"（留置権等の規定の準用）","p":[["第二百九十六条、第三百四条及び第三百五十一条の規定は、抵当権について準用する。"]]},"民法375条":{"n":"民法第三百七十五条","c":"（抵当権の被担保債権の範囲）","p":[["抵当権者は、利息その他の定期金を請求する権利を有するときは、その満期となった最後の二年分についてのみ、その抵当権を行使することができる。ただし、それ以前の定期金についても、満期後に特別の登記をしたときは、その登記の時からその抵当権を行使することを妨げない。"],["２　前項の規定は、抵当権者が債務の不履行によって生じた損害の賠償を請求する権利を有する場合におけるその最後の二年分についても適用する。ただし、利息その他の定期金と通算して二年分を超えることができない。"]]},"民法388条":{"n":"民法第三百八十八条","c":"（法定地上権）","p":[["土地及びその上に存する建物が同一の所有者に属する場合において、その土地又は建物につき抵当権が設定され、その実行により所有者を異にするに至ったときは、その建物について、地上権が設定されたものとみなす。この場合において、地代は、当事者の請求により、裁判所が定める。"]]},"民法249条":{"n":"民法第二百四十九条","c":"（共有物の使用）","p":[["各共有者は、共有物の全部について、その持分に応じた使用をすることができる。"],["２　共有物を使用する共有者は、別段の合意がある場合を除き、他の共有者に対し、自己の持分を超える使用の対価を償還する義務を負う。"],["３　共有者は、善良な管理者の注意をもって、共有物の使用をしなければならない。"]]},"民法251条":{"n":"民法第二百五十一条","c":"（共有物の変更）","p":[["各共有者は、他の共有者の同意を得なければ、共有物に変更（その形状又は効用の著しい変更を伴わないものを除く。次項において同じ。）を加えることができない。"],["２　共有者が他の共有者を知ることができず、又はその所在を知ることができないときは、裁判所は、共有者の請求により、当該他の共有者以外の他の共有者の同意を得て共有物に変更を加えることができる旨の裁判をすることができる。"]]},"民法252条":{"n":"民法第二百五十二条","c":"（共有物の管理）","p":[["共有物の管理に関する事項（次条第一項に規定する共有物の管理者の選任及び解任を含み、共有物に前条第一項に規定する変更を加えるものを除く。次項において同じ。）は、各共有者の持分の価格に従い、その過半数で決する。共有物を使用する共有者があるときも、同様とする。"],["２　裁判所は、次の各号に掲げるときは、当該各号に規定する他の共有者以外の共有者の請求により、当該他の共有者以外の共有者の持分の価格に従い、その過半数で共有物の管理に関する事項を決することができる旨の裁判をすることができる。","- 一　共有者が他の共有者を知ることができず、又はその所在を知ることができないとき。","- 二　共有者が他の共有者に対し相当の期間を定めて共有物の管理に関する事項を決することについて賛否を明らかにすべき旨を催告した場合において、当該他の共有者がその期間内に賛否を明らかにしないとき。"],["３　前二項の規定による決定が、共有者間の決定に基づいて共有物を使用する共有者に特別の影響を及ぼすべきときは、その承諾を得なければならない。"],["４　共有者は、前三項の規定により、共有物に、次の各号に掲げる賃借権その他の使用及び収益を目的とする権利（以下この項において「賃借権等」という。）であって、当該各号に定める期間を超えないものを設定することができる。","- 一　樹木の栽植又は伐採を目的とする山林の賃借権等　十年","- 二　前号に掲げる賃借権等以外の土地の賃借権等　五年","- 三　建物の賃借権等　三年","- 四　動産の賃借権等　六箇月"],["５　各共有者は、前各項の規定にかかわらず、保存行為をすることができる。"]]},"民法256条":{"n":"民法第二百五十六条","c":"（共有物の分割請求）","p":[["各共有者は、いつでも共有物の分割を請求することができる。ただし、五年を超えない期間内は分割をしない旨の契約をすることを妨げない。"],["２　前項ただし書の契約は、更新することができる。ただし、その期間は、更新の時から五年を超えることができない。"]]},"行政手続法37条":{"n":"行政手続法第三十七条","c":"（届出）","p":[["届出が届出書の記載事項に不備がないこと、届出書に必要な書類が添付されていることその他の法令に定められた届出の形式上の要件に適合している場合は、当該届出が法令により当該届出の提出先とされている機関の事務所に到達したときに、当該届出をすべき手続上の義務が履行されたものとする。"]]},"行政不服審査法82条":{"n":"行政不服審査法第八十二条","c":"（不服申立てをすべき行政庁等の教示）","p":[["行政庁は、審査請求若しくは再調査の請求又は他の法令に基づく不服申立て（以下この条において「不服申立て」と総称する。）をすることができる処分をする場合には、処分の相手方に対し、当該処分につき不服申立てをすることができる旨並びに不服申立てをすべき行政庁及び不服申立てをすることができる期間を書面で教示しなければならない。ただし、当該処分を口頭でする場合は、この限りでない。"],["２　行政庁は、利害関係人から、当該処分が不服申立てをすることができる処分であるかどうか並びに当該処分が不服申立てをすることができるものである場合における不服申立てをすべき行政庁及び不服申立てをすることができる期間につき教示を求められたときは、当該事項を教示しなければならない。"],["３　前項の場合において、教示を求めた者が書面による教示を求めたときは、当該教示は、書面でしなければならない。"]]},"行政不服審査法83条":{"n":"行政不服審査法第八十三条","c":"（教示をしなかった場合の不服申立て）","p":[["行政庁が前条の規定による教示をしなかった場合には、当該処分について不服がある者は、当該処分庁に不服申立書を提出することができる。"],["２　第十九条（第五項第一号及び第二号を除く。）の規定は、前項の不服申立書について準用する。"],["３　第一項の規定により不服申立書の提出があった場合において、当該処分が処分庁以外の行政庁に対し審査請求をすることができる処分であるときは、処分庁は、速やかに、当該不服申立書を当該行政庁に送付しなければならない。当該処分が他の法令に基づき、処分庁以外の行政庁に不服申立てをすることができる処分であるときも、同様とする。"],["４　前項の規定により不服申立書が送付されたときは、初めから当該行政庁に審査請求又は当該法令に基づく不服申立てがされたものとみなす。"],["５　第三項の場合を除くほか、第一項の規定により不服申立書が提出されたときは、初めから当該処分庁に審査請求又は当該法令に基づく不服申立てがされたものとみなす。"]]},"民法415条":{"n":"民法第四百十五条","c":"（債務不履行による損害賠償）","p":[["債務者がその債務の本旨に従った履行をしないとき又は債務の履行が不能であるときは、債権者は、これによって生じた損害の賠償を請求することができる。ただし、その債務の不履行が契約その他の債務の発生原因及び取引上の社会通念に照らして債務者の責めに帰することができない事由によるものであるときは、この限りでない。"],["２　前項の規定により損害賠償の請求をすることができる場合において、債権者は、次に掲げるときは、債務の履行に代わる損害賠償の請求をすることができる。","- 一　債務の履行が不能であるとき。","- 二　債務者がその債務の履行を拒絶する意思を明確に表示したとき。","- 三　債務が契約によって生じたものである場合において、その契約が解除され、又は債務の不履行による契約の解除権が発生したとき。"]]},"民法416条":{"n":"民法第四百十六条","c":"（損害賠償の範囲）","p":[["債務の不履行に対する損害賠償の請求は、これによって通常生ずべき損害の賠償をさせることをその目的とする。"],["２　特別の事情によって生じた損害であっても、当事者がその事情を予見すべきであったときは、債権者は、その賠償を請求することができる。"]]},"民法419条":{"n":"民法第四百十九条","c":"（金銭債務の特則）","p":[["金銭の給付を目的とする債務の不履行については、その損害賠償の額は、債務者が遅滞の責任を負った最初の時点における法定利率によって定める。ただし、約定利率が法定利率を超えるときは、約定利率による。"],["２　前項の損害賠償については、債権者は、損害の証明をすることを要しない。"],["３　第一項の損害賠償については、債務者は、不可抗力をもって抗弁とすることができない。"]]},"民法420条":{"n":"民法第四百二十条","c":"（賠償額の予定）","p":[["当事者は、債務の不履行について損害賠償の額を予定することができる。"],["２　賠償額の予定は、履行の請求又は解除権の行使を妨げない。"],["３　違約金は、賠償額の予定と推定する。"]]},"民法1004条":{"n":"民法第千四条","c":"（遺言書の検認）","p":[["遺言書の保管者は、相続の開始を知った後、遅滞なく、これを家庭裁判所に提出して、その検認を請求しなければならない。遺言書の保管者がない場合において、相続人が遺言書を発見した後も、同様とする。"],["２　前項の規定は、公正証書による遺言については、適用しない。"],["３　封印のある遺言書は、家庭裁判所において相続人又はその代理人の立会いがなければ、開封することができない。"]]},"民法1022条":{"n":"民法第千二十二条","c":"（遺言の撤回）","p":[["遺言者は、いつでも、遺言の方式に従って、その遺言の全部又は一部を撤回することができる。"]]},"民法1023条":{"n":"民法第千二十三条","c":"（前の遺言と後の遺言との抵触等）","p":[["前の遺言が後の遺言と抵触するときは、その抵触する部分については、後の遺言で前の遺言を撤回したものとみなす。"],["２　前項の規定は、遺言が遺言後の生前処分その他の法律行為と抵触する場合について準用する。"]]},"憲法84条":{"n":"日本国憲法第八十四条","c":"","p":[["あらたに租税を課し、又は現行の租税を変更するには、法律又は法律の定める条件によることを必要とする。"]]},"憲法86条":{"n":"日本国憲法第八十六条","c":"","p":[["内閣は、毎会計年度の予算を作成し、国会に提出して、その審議を受け議決を経なければならない。"]]},"憲法87条":{"n":"日本国憲法第八十七条","c":"","p":[["予見し難い予算の不足に充てるため、国会の議決に基いて予備費を設け、内閣の責任でこれを支出することができる。"],["すべて予備費の支出については、内閣は、事後に国会の承諾を得なければならない。"]]},"憲法89条":{"n":"日本国憲法第八十九条","c":"","p":[["公金その他の公の財産は、宗教上の組織若しくは団体の使用、便益若しくは維持のため、又は公の支配に属しない慈善、教育若しくは博愛の事業に対し、これを支出し、又はその利用に供してはならない。"]]},"憲法90条":{"n":"日本国憲法第九十条","c":"","p":[["国の収入支出の決算は、すべて毎年会計検査院がこれを検査し、内閣は、次の年度に、その検査報告とともに、これを国会に提出しなければならない。"],["会計検査院の組織及び権限は、法律でこれを定める。"]]},"憲法93条":{"n":"日本国憲法第九十三条","c":"","p":[["地方公共団体には、法律の定めるところにより、その議事機関として議会を設置する。"],["地方公共団体の長、その議会の議員及び法律の定めるその他の吏員は、その地方公共団体の住民が、直接これを選挙する。"]]},"憲法95条":{"n":"日本国憲法第九十五条","c":"","p":[["一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その地方公共団体の住民の投票においてその過半数の同意を得なければ、国会は、これを制定することができない。"]]},"憲法96条":{"n":"日本国憲法第九十六条","c":"","p":[["この憲法の改正は、各議院の総議員の三分の二以上の賛成で、国会が、これを発議し、国民に提案してその承認を経なければならない。この承認には、特別の国民投票又は国会の定める選挙の際行はれる投票において、その過半数の賛成を必要とする。"],["憲法改正について前項の承認を経たときは、天皇は、国民の名で、この憲法と一体を成すものとして、直ちにこれを公布する。"]]},"会社法25条":{"n":"会社法第二十五条","c":"","p":[["株式会社は、次に掲げるいずれかの方法により設立することができる。","- 一　次節から第八節までに規定するところにより、発起人が設立時発行株式（株式会社の設立に際して発行する株式をいう。以下同じ。）の全部を引き受ける方法","- 二　次節、第三節、第三十九条及び第六節から第九節までに規定するところにより、発起人が設立時発行株式を引き受けるほか、設立時発行株式を引き受ける者の募集をする方法"],["２　各発起人は、株式会社の設立に際し、設立時発行株式を一株以上引き受けなければならない。"]]},"会社法26条":{"n":"会社法第二十六条","c":"（定款の作成）","p":[["株式会社を設立するには、発起人が定款を作成し、その全員がこれに署名し、又は記名押印しなければならない。"],["２　前項の定款は、電磁的記録（電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものとして法務省令で定めるものをいう。以下同じ。）をもって作成することができる。この場合において、当該電磁的記録に記録された情報については、法務省令で定める署名又は記名押印に代わる措置をとらなければならない。"]]},"会社法30条":{"n":"会社法第三十条","c":"（定款の認証）","p":[["第二十六条第一項の定款は、公証人の認証を受けなければ、その効力を生じない。"],["２　前項の公証人の認証を受けた定款は、株式会社の成立前は、第三十三条第七項若しくは第九項又は第三十七条第一項若しくは第二項の規定による場合を除き、これを変更することができない。"]]},"会社法49条":{"n":"会社法第四十九条","c":"（株式会社の成立）","p":[["株式会社は、その本店の所在地において設立の登記をすることによって成立する。"]]},"行政不服審査法54条":{"n":"行政不服審査法第五十四条","c":"（再調査の請求期間）","p":[["再調査の請求は、処分があったことを知った日の翌日から起算して三月を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。"],["２　再調査の請求は、処分があった日の翌日から起算して一年を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。"]]},"行政不服審査法62条":{"n":"行政不服審査法第六十二条","c":"（再審査請求期間）","p":[["再審査請求は、原裁決があったことを知った日の翌日から起算して一月を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。"],["２　再審査請求は、原裁決があった日の翌日から起算して一年を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。"]]},"行政事件訴訟法27条":{"n":"行政事件訴訟法第二十七条","c":"（内閣総理大臣の異議）","p":[["第二十五条第二項の申立てがあつた場合には、内閣総理大臣は、裁判所に対し、異議を述べることができる。執行停止の決定があつた後においても、同様とする。"],["２　前項の異議には、理由を附さなければならない。"],["３　前項の異議の理由においては、内閣総理大臣は、処分の効力を存続し、処分を執行し、又は手続を続行しなければ、公共の福祉に重大な影響を及ぼすおそれのある事情を示すものとする。"],["４　第一項の異議があつたときは、裁判所は、執行停止をすることができず、また、すでに執行停止の決定をしているときは、これを取り消さなければならない。"],["５　第一項後段の異議は、執行停止の決定をした裁判所に対して述べなければならない。ただし、その決定に対する抗告が抗告裁判所に係属しているときは、抗告裁判所に対して述べなければならない。"],["６　内閣総理大臣は、やむをえない場合でなければ、第一項の異議を述べてはならず、また、異議を述べたときは、次の常会において国会にこれを報告しなければならない。"]]},"憲法53条":{"n":"日本国憲法第五十三条","c":"","p":[["内閣は、国会の臨時会の召集を決定することができる。いづれかの議院の総議員の四分の一以上の要求があれば、内閣は、その召集を決定しなければならない。"]]},"憲法57条":{"n":"日本国憲法第五十七条","c":"","p":[["両議院の会議は、公開とする。但し、出席議員の三分の二以上の多数で議決したときは、秘密会を開くことができる。"],["両議院は、各々その会議の記録を保存し、秘密会の記録の中で特に秘密を要すると認められるもの以外は、これを公表し、且つ一般に頒布しなければならない。"],["出席議員の五分の一以上の要求があれば、各議員の表決は、これを会議録に記載しなければならない。"]]},"憲法58条":{"n":"日本国憲法第五十八条","c":"","p":[["両議院は、各々その議長その他の役員を選任する。"],["両議院は、各々その会議その他の手続及び内部の規律に関する規則を定め、又、院内の秩序をみだした議員を懲罰することができる。但し、議員を除名するには、出席議員の三分の二以上の多数による議決を必要とする。"]]},"民法167条":{"n":"民法第百六十七条","c":"（人の生命又は身体の侵害による損害賠償請求権の消滅時効）","p":[["人の生命又は身体の侵害による損害賠償請求権の消滅時効についての前条第一項第二号の規定の適用については、同号中「十年間」とあるのは、「二十年間」とする。"]]},"民法724条の2":{"n":"民法第七百二十四条の二","c":"（人の生命又は身体を害する不法行為による損害賠償請求権の消滅時効）","p":[["人の生命又は身体を害する不法行為による損害賠償請求権の消滅時効についての前条第一号の規定の適用については、同号中「三年間」とあるのは、「五年間」とする。"]]},"行政事件訴訟法5条":{"n":"行政事件訴訟法第五条","c":"（民衆訴訟）","p":[["この法律において「民衆訴訟」とは、国又は公共団体の機関の法規に適合しない行為の是正を求める訴訟で、選挙人たる資格その他自己の法律上の利益にかかわらない資格で提起するものをいう。"]]},"行政事件訴訟法6条":{"n":"行政事件訴訟法第六条","c":"（機関訴訟）","p":[["この法律において「機関訴訟」とは、国又は公共団体の機関相互間における権限の存否又はその行使に関する紛争についての訴訟をいう。"]]},"行政事件訴訟法42条":{"n":"行政事件訴訟法第四十二条","c":"（訴えの提起）","p":[["民衆訴訟及び機関訴訟は、法律に定める場合において、法律に定める者に限り、提起することができる。"]]},"地方自治法178条":{"n":"地方自治法第百七十八条","c":"","p":[["普通地方公共団体の議会において、当該普通地方公共団体の長の不信任の議決をしたときは、直ちに議長からその旨を当該普通地方公共団体の長に通知しなければならない。この場合においては、普通地方公共団体の長は、その通知を受けた日から十日以内に議会を解散することができる。"],["議会において当該普通地方公共団体の長の不信任の議決をした場合において、前項の期間内に議会を解散しないとき、又はその解散後初めて招集された議会において再び不信任の議決があり、議長から当該普通地方公共団体の長に対しその旨の通知があつたときは、普通地方公共団体の長は、同項の期間が経過した日又は議長から通知があつた日においてその職を失う。"],["前二項の規定による不信任の議決については、議員数の三分の二以上の者が出席し、第一項の場合においてはその四分の三以上の者の、前項の場合においてはその過半数の者の同意がなければならない。"]]},"民法505条":{"n":"民法第五百五条","c":"（相殺の要件等）","p":[["二人が互いに同種の目的を有する債務を負担する場合において、双方の債務が弁済期にあるときは、各債務者は、その対当額について相殺によってその債務を免れることができる。ただし、債務の性質がこれを許さないときは、この限りでない。"],["２　前項の規定にかかわらず、当事者が相殺を禁止し、又は制限する旨の意思表示をした場合には、その意思表示は、第三者がこれを知り、又は重大な過失によって知らなかったときに限り、その第三者に対抗することができる。"]]},"民法506条":{"n":"民法第五百六条","c":"（相殺の方法及び効力）","p":[["相殺は、当事者の一方から相手方に対する意思表示によってする。この場合において、その意思表示には、条件又は期限を付することができない。"],["２　前項の意思表示は、双方の債務が互いに相殺に適するようになった時にさかのぼってその効力を生ずる。"]]},"民法508条":{"n":"民法第五百八条","c":"（時効により消滅した債権を自働債権とする相殺）","p":[["時効によって消滅した債権がその消滅以前に相殺に適するようになっていた場合には、その債権者は、相殺をすることができる。"]]},"民法509条":{"n":"民法第五百九条","c":"（不法行為等により生じた債権を受働債権とする相殺の禁止）","p":[["次に掲げる債務の債務者は、相殺をもって債権者に対抗することができない。ただし、その債権者がその債務に係る債権を他人から譲り受けたときは、この限りでない。","- 一　悪意による不法行為に基づく損害賠償の債務","- 二　人の生命又は身体の侵害による損害賠償の債務（前号に掲げるものを除く。）"]]},"民法915条":{"n":"民法第九百十五条","c":"（相続の承認又は放棄をすべき期間）","p":[["相続人は、自己のために相続の開始があったことを知った時から三箇月以内に、相続について、単純若しくは限定の承認又は放棄をしなければならない。ただし、この期間は、利害関係人又は検察官の請求によって、家庭裁判所において伸長することができる。"],["２　相続人は、相続の承認又は放棄をする前に、相続財産の調査をすることができる。"]]},"民法921条":{"n":"民法第九百二十一条","c":"（法定単純承認）","p":[["次に掲げる場合には、相続人は、単純承認をしたものとみなす。","- 一　相続人が相続財産の全部又は一部を処分したとき。ただし、保存行為及び第六百二条に定める期間を超えない賃貸をすることは、この限りでない。","- 二　相続人が第九百十五条第一項の期間内に限定承認又は相続の放棄をしなかったとき。","- 三　相続人が、限定承認又は相続の放棄をした後であっても、相続財産の全部若しくは一部を隠匿し、私にこれを消費し、又は悪意でこれを相続財産の目録中に記載しなかったとき。ただし、その相続人が相続の放棄をしたことによって相続人となった者が相続の承認をした後は、この限りでない。"]]},"民法923条":{"n":"民法第九百二十三条","c":"（共同相続人の限定承認）","p":[["相続人が数人あるときは、限定承認は、共同相続人の全員が共同してのみこれをすることができる。"]]},"民法939条":{"n":"民法第九百三十九条","c":"（相続の放棄の効力）","p":[["相続の放棄をした者は、その相続に関しては、初めから相続人とならなかったものとみなす。"]]},"会社法339条":{"n":"会社法第三百三十九条","c":"（解任）","p":[["役員及び会計監査人は、いつでも、株主総会の決議によって解任することができる。"],["２　前項の規定により解任された者は、その解任について正当な理由がある場合を除き、株式会社に対し、解任によって生じた損害の賠償を請求することができる。"]]},"行政不服審査法11条":{"n":"行政不服審査法第十一条","c":"（総代）","p":[["多数人が共同して審査請求をしようとするときは、三人を超えない総代を互選することができる。"],["２　共同審査請求人が総代を互選しない場合において、必要があると認めるときは、第九条第一項の規定により指名された者（以下「審理員」という。）は、総代の互選を命ずることができる。"],["３　総代は、各自、他の共同審査請求人のために、審査請求の取下げを除き、当該審査請求に関する一切の行為をすることができる。"],["４　総代が選任されたときは、共同審査請求人は、総代を通じてのみ、前項の行為をすることができる。"],["５　共同審査請求人に対する行政庁の通知その他の行為は、二人以上の総代が選任されている場合においても、一人の総代に対してすれば足りる。"],["６　共同審査請求人は、必要があると認める場合には、総代を解任することができる。"]]},"情報公開法19条":{"n":"行政機関の保有する情報の公開に関する法律第十九条","c":"（審査会への諮問）","p":[["開示決定等又は開示請求に係る不作為について審査請求があったときは、当該審査請求に対する裁決をすべき行政機関の長は、次の各号のいずれかに該当する場合を除き、情報公開・個人情報保護審査会（審査請求に対する裁決をすべき行政機関の長が会計検査院の長である場合にあっては、別に法律で定める審査会）に諮問しなければならない。","- 一　審査請求が不適法であり、却下する場合","- 二　裁決で、審査請求の全部を認容し、当該審査請求に係る行政文書の全部を開示することとする場合（当該行政文書の開示について反対意見書が提出されている場合を除く。）"],["２　前項の規定により諮問をした行政機関の長は、次に掲げる者に対し、諮問をした旨を通知しなければならない。","- 一　審査請求人及び参加人（行政不服審査法第十三条第四項に規定する参加人をいう。以下この項及び次条第一項第二号において同じ。）","- 二　開示請求者（開示請求者が審査請求人又は参加人である場合を除く。）","- 三　当該審査請求に係る行政文書の開示について反対意見書を提出した第三者（当該第三者が審査請求人又は参加人である場合を除く。）"]]},"民法115条":{"n":"民法第百十五条","c":"（無権代理の相手方の取消権）","p":[["代理権を有しない者がした契約は、本人が追認をしない間は、相手方が取り消すことができる。ただし、契約の時において代理権を有しないことを相手方が知っていたときは、この限りでない。"]]},"民法452条":{"n":"民法第四百五十二条","c":"（催告の抗弁）","p":[["債権者が保証人に債務の履行を請求したときは、保証人は、まず主たる債務者に催告をすべき旨を請求することができる。ただし、主たる債務者が破産手続開始の決定を受けたとき、又はその行方が知れないときは、この限りでない。"]]},"憲法7条":{"n":"日本国憲法第七条","c":"","p":[["天皇は、内閣の助言と承認により、国民のために、左の国事に関する行為を行ふ。","- 一　憲法改正、法律、政令及び条約を公布すること。","- 二　国会を召集すること。","- 三　衆議院を解散すること。","- 四　国会議員の総選挙の施行を公示すること。","- 五　国務大臣及び法律の定めるその他の官吏の任免並びに全権委任状及び大使及び公使の信任状を認証すること。","- 六　大赦、特赦、減刑、刑の執行の免除及び復権を認証すること。","- 七　栄典を授与すること。","- 八　批准書及び法律の定めるその他の外交文書を認証すること。","- 九　外国の大使及び公使を接受すること。","- 十　儀式を行ふこと。"]]},"憲法73条":{"n":"日本国憲法第七十三条","c":"","p":[["内閣は、他の一般行政事務の外、左の事務を行ふ。","- 一　法律を誠実に執行し、国務を総理すること。","- 二　外交関係を処理すること。","- 三　条約を締結すること。但し、事前に、時宜によつては事後に、国会の承認を経ることを必要とする。","- 四　法律の定める基準に従ひ、官吏に関する事務を掌理すること。","- 五　予算を作成して国会に提出すること。","- 六　この憲法及び法律の規定を実施するために、政令を制定すること。但し、政令には、特にその法律の委任がある場合を除いては、罰則を設けることができない。","- 七　大赦、特赦、減刑、刑の執行の免除及び復権を決定すること。"]]},"会社法297条":{"n":"会社法第二百九十七条","c":"（株主による招集の請求）","p":[["総株主の議決権の百分の三（これを下回る割合を定款で定めた場合にあっては、その割合）以上の議決権を六箇月（これを下回る期間を定款で定めた場合にあっては、その期間）前から引き続き有する株主は、取締役に対し、株主総会の目的である事項（当該株主が議決権を行使することができる事項に限る。）及び招集の理由を示して、株主総会の招集を請求することができる。"],["２　公開会社でない株式会社における前項の規定の適用については、同項中「六箇月（これを下回る期間を定款で定めた場合にあっては、その期間）前から引き続き有する」とあるのは、「有する」とする。"],["３　第一項の株主総会の目的である事項について議決権を行使することができない株主が有する議決権の数は、同項の総株主の議決権の数に算入しない。"],["４　次に掲げる場合には、第一項の規定による請求をした株主は、裁判所の許可を得て、株主総会を招集することができる。","- 一　第一項の規定による請求の後遅滞なく招集の手続が行われない場合","- 二　第一項の規定による請求があった日から八週間（これを下回る期間を定款で定めた場合にあっては、その期間）以内の日を株主総会の日とする株主総会の招集の通知が発せられない場合"]]},"会社法299条":{"n":"会社法第二百九十九条","c":"（株主総会の招集の通知）","p":[["株主総会を招集するには、取締役は、株主総会の日の二週間（前条第一項第三号又は第四号に掲げる事項を定めたときを除き、公開会社でない株式会社にあっては、一週間（当該株式会社が取締役会設置会社以外の株式会社である場合において、これを下回る期間を定款で定めた場合にあっては、その期間））前までに、株主に対してその通知を発しなければならない。"],["２　次に掲げる場合には、前項の通知は、書面でしなければならない。","- 一　前条第一項第三号又は第四号に掲げる事項を定めた場合","- 二　株式会社が取締役会設置会社である場合"],["３　取締役は、前項の書面による通知の発出に代えて、政令で定めるところにより、株主の承諾を得て、電磁的方法により通知を発することができる。この場合において、当該取締役は、同項の書面による通知を発したものとみなす。"],["４　前二項の通知には、前条第一項各号に掲げる事項を記載し、又は記録しなければならない。"]]},"住民基本台帳法7条":{"n":"住民基本台帳法第七条","c":"（住民票の記載事項）","p":[["住民票には、次に掲げる事項について記載（前条第三項の規定により磁気ディスクをもつて調製する住民票にあつては、記録。以下同じ。）をする。","- 一　氏名","- 一の二　氏名の振り仮名（戸籍法（昭和二十二年法律第二百二十四号）第十三条第一項第二号に規定する氏名の振り仮名をいう。以下同じ。）","- 二　出生の年月日","- 三　男女の別","- 四　世帯主についてはその旨、世帯主でない者については世帯主の氏名及び世帯主との続柄","- 五　戸籍の表示。ただし、本籍のない者及び本籍の明らかでない者については、その旨","- 六　住民となつた年月日","- 七　住所及び一の市町村の区域内において新たに住所を変更した者については、その住所を定めた年月日","- 八　新たに市町村の区域内に住所を定めた者については、その住所を定めた旨の届出の年月日（職権で住民票の記載をした者については、その年月日）及び従前の住所","- 八の二　個人番号（行政手続における特定の個人を識別するための番号の利用等に関する法律（平成二十五年法律第二十七号。以下「番号利用法」という。）第二条第五項に規定する個人番号をいう。以下同じ。）","- 九　選挙人名簿に登録された者については、その旨","- 十　国民健康保険の被保険者（国民健康保険法（昭和三十三年法律第百九十二号）第五条及び第六条の規定による国民健康保険の被保険者をいう。第二十八条及び第三十一条第三項において同じ。）である者については、その資格に関する事項で政令で定めるもの","- 十の二　後期高齢者医療の被保険者（高齢者の医療の確保に関する法律（昭和五十七年法律第八十号）第五十条及び第五十一条の規定による後期高齢者医療の被保険者をいう。第二十八条の二及び第三十一条第三項において同じ。）である者については、その資格に関する事項で政令で定めるもの","- 十の三　介護保険の被保険者（介護保険法（平成九年法律第百二十三号）第九条の規定による介護保険の被保険者（同条第二号に規定する第二号被保険者を除く。）をいう。第二十八条の三及び第三十一条第三項において同じ。）である者については、その資格に関する事項で政令で定めるもの","- 十一　国民年金の被保険者（国民年金法（昭和三十四年法律第百四十一号）第七条その他政令で定める法令の規定による国民年金の被保険者（同条第一項第二号に規定する第二号被保険者及び同項第三号に規定する第三号被保険者を除く。）をいう。第二十九条及び第三十一条第三項において同じ。）である者については、その資格に関する事項で政令で定めるもの","- 十一の二　児童手当の支給を受けている者（児童手当法（昭和四十六年法律第七十三号）第七条の規定により認定を受けた受給資格者（同条第二項に規定する施設等受給資格者にあつては、同項第二号に掲げる里親に限る。）をいう。第二十九条の二及び第三十一条第三項において同じ。）については、その受給資格に関する事項で政令で定めるもの","- 十二　米穀の配給を受ける者（主要食糧の需給及び価格の安定に関する法律（平成六年法律第百十三号）第四十条第一項の規定に基づく政令の規定により米穀の配給が実施される場合におけるその配給に基づき米穀の配給を受ける者で政令で定めるものをいう。第三十条及び第三十一条第三項において同じ。）については、その米穀の配給に関する事項で政令で定めるもの","- 十三　住民票コード（番号、記号その他の符号であつて総務省令で定めるものをいう。以下同じ。）","- 十四　前各号に掲げる事項のほか、政令で定める事項"]]},"住民基本台帳法22条":{"n":"住民基本台帳法第二十二条","c":"（転入届）","p":[["転入（新たに市町村の区域内に住所を定めることをいい、出生による場合を除く。以下この条及び第三十条の四十六において同じ。）をした者は、転入をした日から十四日以内に、次に掲げる事項（いずれの市町村においても住民基本台帳に記録されたことがない者にあつては、第一号から第五号まで及び第七号に掲げる事項）を市町村長に届け出なければならない。","- 一　氏名","- 二　住所","- 三　転入をした年月日","- 四　従前の住所","- 五　世帯主についてはその旨、世帯主でない者については世帯主の氏名及び世帯主との続柄","- 六　転入前の住民票コード（転入をした者につき直近に住民票の記載をした市町村長が、当該住民票に直近に記載した住民票コードをいう。）","- 七　国外から転入をした者その他政令で定める者については、前各号に掲げる事項のほか政令で定める事項"],["２　前項の規定による届出をする者（同項第七号の者を除く。）は、住所の異動に関する文書で政令で定めるものを添えて、同項の届出をしなければならない。"]]},"住民基本台帳法23条":{"n":"住民基本台帳法第二十三条","c":"（転居届）","p":[["転居（一の市町村の区域内において住所を変更することをいう。以下この条において同じ。）をした者は、転居をした日から十四日以内に、次に掲げる事項を市町村長に届け出なければならない。","- 一　氏名","- 二　住所","- 三　転居をした年月日","- 四　従前の住所","- 五　世帯主についてはその旨、世帯主でない者については世帯主の氏名及び世帯主との続柄"]]},"住民基本台帳法24条":{"n":"住民基本台帳法第二十四条","c":"（転出届）","p":[["転出をする者は、あらかじめ、その氏名、転出先及び転出の予定年月日を市町村長に届け出なければならない。"]]},"住民基本台帳法25条":{"n":"住民基本台帳法第二十五条","c":"（世帯変更届）","p":[["第二十二条第一項及び第二十三条の場合を除くほか、その属する世帯又はその世帯主に変更があつた者（政令で定める者を除く。）は、その変更があつた日から十四日以内に、その氏名、変更があつた事項及び変更があつた年月日を市町村長に届け出なければならない。"]]},"戸籍法10条":{"n":"戸籍法第十条","c":"","p":[["戸籍に記載されている者（その戸籍から除かれた者（その者に係る全部の記載が市町村長の過誤によつてされたものであつて、当該記載が第二十四条第二項の規定によつて訂正された場合におけるその者を除く。）を含む。）又はその配偶者、直系尊属若しくは直系卑属は、その戸籍の謄本若しくは抄本又は戸籍に記載した事項に関する証明書（以下「戸籍謄本等」という。）の交付の請求をすることができる。"],["市町村長は、前項の請求が不当な目的によることが明らかなときは、これを拒むことができる。"],["第一項の請求をしようとする者は、郵便その他の法務省令で定める方法により、戸籍謄本等の送付を求めることができる。"]]},"戸籍法10条の2":{"n":"戸籍法第十条の二","c":"","p":[["前条第一項に規定する者以外の者は、次の各号に掲げる場合に限り、戸籍謄本等の交付の請求をすることができる。この場合において、当該請求をする者は、それぞれ当該各号に定める事項を明らかにしてこれをしなければならない。","- 一　自己の権利を行使し、又は自己の義務を履行するために戸籍の記載事項を確認する必要がある場合　権利又は義務の発生原因及び内容並びに当該権利を行使し、又は当該義務を履行するために戸籍の記載事項の確認を必要とする理由","- 二　国又は地方公共団体の機関に提出する必要がある場合　戸籍謄本等を提出すべき国又は地方公共団体の機関及び当該機関への提出を必要とする理由","- 三　前二号に掲げる場合のほか、戸籍の記載事項を利用する正当な理由がある場合　戸籍の記載事項の利用の目的及び方法並びにその利用を必要とする事由"],["前項の規定にかかわらず、国又は地方公共団体の機関は、法令の定める事務を遂行するために必要がある場合には、戸籍謄本等の交付の請求をすることができる。この場合において、当該請求の任に当たる権限を有する職員は、その官職、当該事務の種類及び根拠となる法令の条項並びに戸籍の記載事項の利用の目的を明らかにしてこれをしなければならない。"],["第一項の規定にかかわらず、弁護士（弁護士法人及び弁護士・外国法事務弁護士共同法人を含む。次項において同じ。）、司法書士（司法書士法人を含む。次項において同じ。）、土地家屋調査士（土地家屋調査士法人を含む。次項において同じ。）、税理士（税理士法人を含む。次項において同じ。）、社会保険労務士（社会保険労務士法人を含む。次項において同じ。）、弁理士（弁理士法人を含む。次項において同じ。）、海事代理士又は行政書士（行政書士法人を含む。）は、受任している事件又は事務に関する業務を遂行するために必要がある場合には、戸籍謄本等の交付の請求をすることができる。この場合において、当該請求をする者は、その有する資格、当該業務の種類、当該事件又は事務の依頼者の氏名又は名称及び当該依頼者についての第一項各号に定める事項を明らかにしてこれをしなければならない。"],["第一項及び前項の規定にかかわらず、弁護士、司法書士、土地家屋調査士、税理士、社会保険労務士又は弁理士は、受任している事件について次に掲げる業務を遂行するために必要がある場合には、戸籍謄本等の交付の請求をすることができる。この場合において、当該請求をする者は、その有する資格、当該事件の種類、その業務として代理し又は代理しようとする手続及び戸籍の記載事項の利用の目的を明らかにしてこれをしなければならない。","- 一　弁護士にあつては、裁判手続又は裁判外における民事上若しくは行政上の紛争処理の手続についての代理業務（弁護士法人については弁護士法（昭和二十四年法律第二百五号）第三十条の六第一項各号に規定する代理業務を除き、弁護士・外国法事務弁護士共同法人については外国弁護士による法律事務の取扱い等に関する法律（昭和六十一年法律第六十六号）第八十条第一項において準用する弁護士法第三十条の六第一項各号に規定する代理業務を除く。）","- 二　司法書士にあつては、司法書士法（昭和二十五年法律第百九十七号）第三条第一項第三号及び第六号から第八号までに規定する代理業務（同項第七号及び第八号に規定する相談業務並びに司法書士法人については同項第六号に規定する代理業務を除く。）","- 三　土地家屋調査士にあつては、土地家屋調査士法（昭和二十五年法律第二百二十八号）第三条第一項第二号に規定する審査請求の手続についての代理業務並びに同項第四号及び第七号に規定する代理業務","- 四　税理士にあつては、税理士法（昭和二十六年法律第二百三十七号）第二条第一項第一号に規定する不服申立て及びこれに関する主張又は陳述についての代理業務","- 五　社会保険労務士にあつては、社会保険労務士法（昭和四十三年法律第八十九号）第二条第一項第一号の三に規定する審査請求及び再審査請求並びにこれらに係る行政機関等の調査又は処分に関し当該行政機関等に対してする主張又は陳述についての代理業務並びに同項第一号の四から第一号の六までに規定する代理業務（同条第三項第一号に規定する相談業務を除く。）","- 六　弁理士にあつては、弁理士法（平成十二年法律第四十九号）第四条第一項に規定する特許庁における手続（不服申立てに限る。）、審査請求及び裁定に関する経済産業大臣に対する手続（裁定の取消しに限る。）についての代理業務、同条第二項第一号に規定する税関長又は財務大臣に対する手続（不服申立てに限る。）についての代理業務、同項第二号に規定する代理業務、同法第六条に規定する訴訟の手続についての代理業務並びに同法第六条の二第一項に規定する特定侵害訴訟の手続についての代理業務（弁理士法人については同法第六条に規定する訴訟の手続についての代理業務及び同項に規定する特定侵害訴訟の手続についての代理業務を除く。）"],["第一項及び第三項の規定にかかわらず、弁護士は、刑事に関する事件における弁護人としての業務、少年の保護事件若しくは心神喪失等の状態で重大な他害行為を行った者の医療及び観察等に関する法律（平成十五年法律第百十号）第三条に規定する処遇事件における付添人としての業務、逃亡犯罪人引渡審査請求事件における補佐人としての業務、人身保護法（昭和二十三年法律第百九十九号）第十四条第二項の規定により裁判所が選任した代理人としての業務、人事訴訟法（平成十五年法律第百九号）第十三条第二項及び第三項の規定により裁判長が選任した訴訟代理人としての業務又は民事訴訟法（平成八年法律第百九号）第三十五条第一項に規定する特別代理人としての業務を遂行するために必要がある場合には、戸籍謄本等の交付の請求をすることができる。この場合において、当該請求をする者は、弁護士の資格、これらの業務の別及び戸籍の記載事項の利用の目的を明らかにしてこれをしなければならない。"],["前条第三項の規定は、前各項の請求をしようとする者について準用する。"]]},"戸籍法49条":{"n":"戸籍法第四十九条","c":"","p":[["出生の届出は、十四日以内（国外で出生があつたときは、三箇月以内）にこれをしなければならない。"],["届書には、次の事項を記載しなければならない。","- 一　子の男女の別及び嫡出子又は嫡出でない子の別","- 二　出生の年月日時分及び場所","- 三　父母の氏名及び本籍、父又は母が外国人であるときは、その氏名及び国籍","- 四　その他法務省令で定める事項"],["医師、助産師又はその他の者が出産に立ち会つた場合には、医師、助産師、その他の者の順序に従つてそのうちの一人が法務省令・厚生労働省令の定めるところによつて作成する出生証明書を届書に添付しなければならない。ただし、やむを得ない事由があるときは、この限りでない。"]]},"戸籍法86条":{"n":"戸籍法第八十六条","c":"","p":[["死亡の届出は、届出義務者が、死亡の事実を知つた日から七日以内（国外で死亡があつたときは、その事実を知つた日から三箇月以内）に、これをしなければならない。"],["届書には、次の事項を記載し、診断書又は検案書を添付しなければならない。","- 一　死亡の年月日時分及び場所","- 二　その他法務省令で定める事項"],["やむを得ない事由によつて診断書又は検案書を得ることができないときは、死亡の事実を証すべき書面を以てこれに代えることができる。この場合には、届書に診断書又は検案書を得ることができない事由を記載しなければならない。"]]},"地方自治法244条":{"n":"地方自治法第二百四十四条","c":"（公の施設）","p":[["普通地方公共団体は、住民の福祉を増進する目的をもつてその利用に供するための施設（これを公の施設という。）を設けるものとする。"],["２　普通地方公共団体（次条第三項に規定する指定管理者を含む。次項において同じ。）は、正当な理由がない限り、住民が公の施設を利用することを拒んではならない。"],["３　普通地方公共団体は、住民が公の施設を利用することについて、不当な差別的取扱いをしてはならない。"]]},"地方自治法244条の2":{"n":"地方自治法第二百四十四条の二","c":"（公の施設の設置、管理及び廃止）","p":[["普通地方公共団体は、法律又はこれに基づく政令に特別の定めがあるものを除くほか、公の施設の設置及びその管理に関する事項は、条例でこれを定めなければならない。"],["２　普通地方公共団体は、条例で定める重要な公の施設のうち条例で定める特に重要なものについて、これを廃止し、又は条例で定める長期かつ独占的な利用をさせようとするときは、議会において出席議員の三分の二以上の者の同意を得なければならない。"],["３　普通地方公共団体は、公の施設の設置の目的を効果的に達成するため必要があると認めるときは、条例の定めるところにより、法人その他の団体であつて当該普通地方公共団体が指定するもの（以下本条及び第二百四十四条の四において「指定管理者」という。）に、当該公の施設の管理を行わせることができる。"],["４　前項の条例には、指定管理者の指定の手続、指定管理者が行う管理の基準及び業務の範囲その他必要な事項を定めるものとする。"],["５　指定管理者の指定は、期間を定めて行うものとする。"],["６　普通地方公共団体は、指定管理者の指定をしようとするときは、あらかじめ、当該普通地方公共団体の議会の議決を経なければならない。"],["７　指定管理者は、毎年度終了後、その管理する公の施設の管理の業務に関し事業報告書を作成し、当該公の施設を設置する普通地方公共団体に提出しなければならない。"],["８　普通地方公共団体は、適当と認めるときは、指定管理者にその管理する公の施設の利用に係る料金（次項において「利用料金」という。）を当該指定管理者の収入として収受させることができる。"],["９　前項の場合における利用料金は、公益上必要があると認める場合を除くほか、条例の定めるところにより、指定管理者が定めるものとする。この場合において、指定管理者は、あらかじめ当該利用料金について当該普通地方公共団体の承認を受けなければならない。"],["１０　普通地方公共団体の長又は委員会は、指定管理者の管理する公の施設の管理の適正を期するため、指定管理者に対して、当該管理の業務又は経理の状況に関し報告を求め、実地について調査し、又は必要な指示をすることができる。"],["１１　普通地方公共団体は、指定管理者が前項の指示に従わないときその他当該指定管理者による管理を継続することが適当でないと認めるときは、その指定を取り消し、又は期間を定めて管理の業務の全部又は一部の停止を命ずることができる。"]]},"民法144条":{"n":"民法第百四十四条","c":"（時効の効力）","p":[["時効の効力は、その起算日にさかのぼる。"]]},"民法145条":{"n":"民法第百四十五条","c":"（時効の援用）","p":[["時効は、当事者（消滅時効にあっては、保証人、物上保証人、第三取得者その他権利の消滅について正当な利益を有する者を含む。）が援用しなければ、裁判所がこれによって裁判をすることができない。"]]},"民法703条":{"n":"民法第七百三条","c":"（不当利得の返還義務）","p":[["法律上の原因なく他人の財産又は労務によって利益を受け、そのために他人に損失を及ぼした者（以下この章において「受益者」という。）は、その利益の存する限度において、これを返還する義務を負う。"]]},"民法704条":{"n":"民法第七百四条","c":"（悪意の受益者の返還義務等）","p":[["悪意の受益者は、その受けた利益に利息を付して返還しなければならない。この場合において、なお損害があるときは、その賠償の責任を負う。"]]},"民法705条":{"n":"民法第七百五条","c":"（債務の不存在を知ってした弁済）","p":[["債務の弁済として給付をした者は、その時において債務の存在しないことを知っていたときは、その給付したものの返還を請求することができない。"]]},"民法706条":{"n":"民法第七百六条","c":"（期限前の弁済）","p":[["債務者は、弁済期にない債務の弁済として給付をしたときは、その給付したものの返還を請求することができない。ただし、債務者が錯誤によってその給付をしたときは、債権者は、これによって得た利益を返還しなければならない。"]]},"民法708条":{"n":"民法第七百八条","c":"（不法原因給付）","p":[["不法な原因のために給付をした者は、その給付したものの返還を請求することができない。ただし、不法な原因が受益者についてのみ存したときは、この限りでない。"]]},"憲法78条":{"n":"日本国憲法第七十八条","c":"","p":[["裁判官は、裁判により、心身の故障のために職務を執ることができないと決定された場合を除いては、公の弾劾によらなければ罷免されない。裁判官の懲戒処分は、行政機関がこれを行ふことはできない。"]]},"行政書士法14条":{"n":"行政書士法第十四条","c":"（行政書士に対する懲戒）","p":[["行政書士が、この法律若しくはこれに基づく命令、規則その他都道府県知事の処分に違反したとき又は行政書士たるにふさわしくない重大な非行があつたときは、都道府県知事は、当該行政書士に対し、次に掲げる処分をすることができる。","- 一　戒告","- 二　二年以内の業務の停止","- 三　業務の禁止"]]},"行政書士法14条の3":{"n":"行政書士法第十四条の三","c":"（懲戒の手続）","p":[["何人も、行政書士又は行政書士法人について第十四条又は前条第一項若しくは第二項に該当する事実があると思料するときは、当該行政書士又は当該行政書士法人の事務所の所在地を管轄する都道府県知事に対し、当該事実を通知し、適当な措置をとることを求めることができる。"],["２　前項の規定による通知があつたときは、同項の都道府県知事は、通知された事実について必要な調査をしなければならない。"],["３　都道府県知事は、第十四条第二号又は前条第一項第二号若しくは第二項第二号の処分をしようとするときは、行政手続法第十三条第一項の規定による意見陳述のための手続の区分にかかわらず、聴聞を行わなければならない。"],["４　前項に規定する処分又は第十四条第三号若しくは前条第一項第三号の処分に係る行政手続法第十五条第一項の通知は、聴聞の期日の一週間前までにしなければならない。"],["５　前項の聴聞の期日における審理は、公開により行わなければならない。"]]},"行政書士法14条の5":{"n":"行政書士法第十四条の五","c":"（懲戒処分の公告）","p":[["都道府県知事は、第十四条又は第十四条の二の規定により処分をしたときは、遅滞なく、その旨を当該都道府県の公報をもつて公告しなければならない。"]]},"行政不服審査法45条":{"n":"行政不服審査法第四十五条","c":"（処分についての審査請求の却下又は棄却）","p":[["処分についての審査請求が法定の期間経過後にされたものである場合その他不適法である場合には、審査庁は、裁決で、当該審査請求を却下する。"],["２　処分についての審査請求が理由がない場合には、審査庁は、裁決で、当該審査請求を棄却する。"],["３　審査請求に係る処分が違法又は不当ではあるが、これを取り消し、又は撤廃することにより公の利益に著しい障害を生ずる場合において、審査請求人の受ける損害の程度、その損害の賠償又は防止の程度及び方法その他一切の事情を考慮した上、処分を取り消し、又は撤廃することが公共の福祉に適合しないと認めるときは、審査庁は、裁決で、当該審査請求を棄却することができる。この場合には、審査庁は、裁決の主文で、当該処分が違法又は不当であることを宣言しなければならない。"]]},"行政不服審査法46条":{"n":"行政不服審査法第四十六条","c":"（処分についての審査請求の認容）","p":[["処分（事実上の行為を除く。以下この条及び第四十八条において同じ。）についての審査請求が理由がある場合（前条第三項の規定の適用がある場合を除く。）には、審査庁は、裁決で、当該処分の全部若しくは一部を取り消し、又はこれを変更する。ただし、審査庁が処分庁の上級行政庁又は処分庁のいずれでもない場合には、当該処分を変更することはできない。"],["２　前項の規定により法令に基づく申請を却下し、又は棄却する処分の全部又は一部を取り消す場合において、次の各号に掲げる審査庁は、当該申請に対して一定の処分をすべきものと認めるときは、当該各号に定める措置をとる。","- 一　処分庁の上級行政庁である審査庁　当該処分庁に対し、当該処分をすべき旨を命ずること。","- 二　処分庁である審査庁　当該処分をすること。"],["３　前項に規定する一定の処分に関し、第四十三条第一項第一号に規定する議を経るべき旨の定めがある場合において、審査庁が前項各号に定める措置をとるために必要があると認めるときは、審査庁は、当該定めに係る審議会等の議を経ることができる。"],["４　前項に規定する定めがある場合のほか、第二項に規定する一定の処分に関し、他の法令に関係行政機関との協議の実施その他の手続をとるべき旨の定めがある場合において、審査庁が同項各号に定める措置をとるために必要があると認めるときは、審査庁は、当該手続をとることができる。"]]},"行政不服審査法48条":{"n":"行政不服審査法第四十八条","c":"（不利益変更の禁止）","p":[["第四十六条第一項本文又は前条の場合において、審査庁は、審査請求人の不利益に当該処分を変更し、又は当該事実上の行為を変更すべき旨を命じ、若しくはこれを変更することはできない。"]]},"地方自治法176条":{"n":"地方自治法第百七十六条","c":"","p":[["普通地方公共団体の議会の議決について異議があるときは、当該普通地方公共団体の長は、この法律に特別の定めがあるものを除くほか、その議決の日（条例の制定若しくは改廃又は予算に関する議決については、その送付を受けた日）から十日以内に理由を示してこれを再議に付することができる。"],["前項の規定による議会の議決が再議に付された議決と同じ議決であるときは、その議決は、確定する。"],["前項の規定による議決のうち条例の制定若しくは改廃又は予算に関するものについては、出席議員の三分の二以上の者の同意がなければならない。"],["普通地方公共団体の議会の議決又は選挙がその権限を超え又は法令若しくは会議規則に違反すると認めるときは、当該普通地方公共団体の長は、理由を示してこれを再議に付し又は再選挙を行わせなければならない。"],["前項の規定による議会の議決又は選挙がなおその権限を超え又は法令若しくは会議規則に違反すると認めるときは、都道府県知事にあつては総務大臣、市町村長にあつては都道府県知事に対し、当該議決又は選挙があつた日から二十一日以内に、審査を申し立てることができる。"],["前項の規定による申立てがあつた場合において、総務大臣又は都道府県知事は、審査の結果、議会の議決又は選挙がその権限を超え又は法令若しくは会議規則に違反すると認めるときは、当該議決又は選挙を取り消す旨の裁定をすることができる。"],["前項の裁定に不服があるときは、普通地方公共団体の議会又は長は、裁定のあつた日から六十日以内に、裁判所に出訴することができる。"],["前項の訴えのうち第四項の規定による議会の議決又は選挙の取消しを求めるものは、当該議会を被告として提起しなければならない。"]]},"民法423条":{"n":"民法第四百二十三条","c":"（債権者代位権の要件）","p":[["債権者は、自己の債権を保全するため必要があるときは、債務者に属する権利（以下「被代位権利」という。）を行使することができる。ただし、債務者の一身に専属する権利及び差押えを禁じられた権利は、この限りでない。"],["２　債権者は、その債権の期限が到来しない間は、被代位権利を行使することができない。ただし、保存行為は、この限りでない。"],["３　債権者は、その債権が強制執行により実現することのできないものであるときは、被代位権利を行使することができない。"]]},"民法423条の3":{"n":"民法第四百二十三条の三","c":"（債権者への支払又は引渡し）","p":[["債権者は、被代位権利を行使する場合において、被代位権利が金銭の支払又は動産の引渡しを目的とするものであるときは、相手方に対し、その支払又は引渡しを自己に対してすることを求めることができる。この場合において、相手方が債権者に対してその支払又は引渡しをしたときは、被代位権利は、これによって消滅する。"]]},"民法731条":{"n":"民法第七百三十一条","c":"（婚姻適齢）","p":[["婚姻は、十八歳にならなければ、することができない。"]]},"民法732条":{"n":"民法第七百三十二条","c":"（重婚の禁止）","p":[["配偶者のある者は、重ねて婚姻をすることができない。"]]},"民法733条":{"n":"民法第七百三十三条","c":"","p":[["削除"]]},"民法739条":{"n":"民法第七百三十九条","c":"（婚姻の届出）","p":[["婚姻は、戸籍法（昭和二十二年法律第二百二十四号）の定めるところにより届け出ることによって、その効力を生ずる。"],["２　前項の届出は、当事者双方及び成年の証人二人以上が署名した書面で、又はこれらの者から口頭で、しなければならない。"]]},"民法742条":{"n":"民法第七百四十二条","c":"（婚姻の無効）","p":[["婚姻は、次に掲げる場合に限り、無効とする。","- 一　人違いその他の事由によって当事者間に婚姻をする意思がないとき。","- 二　当事者が婚姻の届出をしないとき。ただし、その届出が第七百三十九条第二項に定める方式を欠くだけであるときは、婚姻は、そのためにその効力を妨げられない。"]]},"会社法127条":{"n":"会社法第百二十七条","c":"（株式の譲渡）","p":[["株主は、その有する株式を譲渡することができる。"]]},"会社法128条":{"n":"会社法第百二十八条","c":"（株券発行会社の株式の譲渡）","p":[["株券発行会社の株式の譲渡は、当該株式に係る株券を交付しなければ、その効力を生じない。ただし、自己株式の処分による株式の譲渡については、この限りでない。"],["２　株券の発行前にした譲渡は、株券発行会社に対し、その効力を生じない。"]]},"会社法130条":{"n":"会社法第百三十条","c":"（株式の譲渡の対抗要件）","p":[["株式の譲渡は、その株式を取得した者の氏名又は名称及び住所を株主名簿に記載し、又は記録しなければ、株式会社その他の第三者に対抗することができない。"],["２　株券発行会社における前項の規定の適用については、同項中「株式会社その他の第三者」とあるのは、「株式会社」とする。"]]},"行政書士法6条":{"n":"行政書士法第六条","c":"（登録）","p":[["行政書士となる資格を有する者が、行政書士となるには、行政書士名簿に、住所、氏名、生年月日、事務所の名称及び所在地その他日本行政書士会連合会の会則で定める事項の登録を受けなければならない。"],["２　行政書士名簿は、日本行政書士会連合会に備える。"],["３　行政書士名簿の登録は、日本行政書士会連合会が行う。"]]},"行政書士法6条の2":{"n":"行政書士法第六条の二","c":"（登録の申請及び決定）","p":[["前条第一項の規定による登録を受けようとする者は、行政書士となる資格を有することを証する書類を添えて、日本行政書士会連合会に対し、その事務所の所在地の属する都道府県の区域に設立されている行政書士会を経由して、登録の申請をしなければならない。"],["２　日本行政書士会連合会は、前項の規定による登録の申請を受けた場合において、当該申請者が行政書士となる資格を有し、かつ、次の各号に該当しない者であると認めたときは行政書士名簿に登録し、当該申請者が行政書士となる資格を有せず、又は次の各号の一に該当する者であると認めたときは登録を拒否しなければならない。この場合において、登録を拒否しようとするときは、第十八条の四に規定する資格審査会の議決に基づいてしなければならない。","- 一　心身の故障により行政書士の業務を行うことができない者","- 二　行政書士の信用又は品位を害するおそれがある者その他行政書士の職責に照らし行政書士としての適格性を欠く者"],["３　日本行政書士会連合会は、前項の規定により登録を拒否しようとするときは、あらかじめ、当該申請者にその旨を通知して、相当の期間内に自ら又はその代理人を通じて弁明する機会を与えなければならない。"],["４　日本行政書士会連合会は、第二項の規定により登録をしたときは当該申請者に行政書士証票を交付し、同項の規定により登録を拒否したときはその旨及びその理由を当該申請者に書面により通知しなければならない。"]]},"行政書士法6条の3":{"n":"行政書士法第六条の三","c":"（登録を拒否された場合等の審査請求）","p":[["前条第二項の規定により登録を拒否された者は、当該処分に不服があるときは、総務大臣に対して審査請求をすることができる。"],["２　前条第一項の規定による登録の申請をした者は、当該申請をした日から三月を経過しても当該申請に対して何らの処分がされない場合には、当該登録を拒否されたものとして、総務大臣に対して審査請求をすることができる。この場合においては、審査請求があつた日に日本行政書士会連合会が同条第二項の規定により当該登録を拒否したものとみなす。"],["３　前二項の場合において、総務大臣は、行政不服審査法第二十五条第二項及び第三項並びに第四十六条第二項の規定の適用については、日本行政書士会連合会の上級行政庁とみなす。"]]},"行政書士法7条":{"n":"行政書士法第七条","c":"（登録の抹消）","p":[["日本行政書士会連合会は、行政書士の登録を受けた者が次の各号のいずれかに該当する場合には、その登録を抹消しなければならない。","- 一　第二条の二第二号から第四号まで又は第六号から第八号までに掲げる事由のいずれかに該当するに至つたとき。","- 二　その業を廃止しようとする旨の届出があつたとき。","- 三　死亡したとき。","- 四　前条第一項の規定による登録の取消しの処分を受けたとき。"],["２　日本行政書士会連合会は、行政書士の登録を受けた者が次の各号のいずれかに該当する場合には、その登録を抹消することができる。","- 一　引き続き二年以上行政書士の業務を行わないとき。","- 二　心身の故障により行政書士の業務を行うことができないとき。"],["３　第六条の二第二項後段、第六条の三第一項及び第三項並びに前条第二項の規定は、前項の規定による登録の抹消について準用する。この場合において、第六条の三第三項中「第四十六条第二項」とあるのは、「第四十六条第一項」と読み替えるものとする。"]]},"行政書士法13条の3":{"n":"行政書士法第十三条の三","c":"（設立）","p":[["行政書士は、この章の定めるところにより、行政書士法人（第一条の三及び第一条の四第一項（第二号を除く。）に規定する業務を行うことを目的として、行政書士が設立した法人をいう。以下同じ。）を設立することができる。"]]},"行政書士法13条の5":{"n":"行政書士法第十三条の五","c":"（社員の資格）","p":[["行政書士法人の社員は、行政書士でなければならない。"],["２　次に掲げる者は、社員となることができない。","- 一　第十四条の規定により業務の停止の処分を受け、当該業務の停止の期間を経過しない者","- 二　第十四条の二第一項の規定により行政書士法人が解散又は業務の全部の停止の処分を受けた場合において、その処分を受けた日以前三十日内にその社員であつた者でその処分を受けた日から三年（業務の全部の停止の処分を受けた場合にあつては、当該業務の全部の停止の期間）を経過しないもの"]]},"行政書士法13条の9":{"n":"行政書士法第十三条の九","c":"（成立の時期）","p":[["行政書士法人は、その主たる事務所の所在地において設立の登記をすることによつて成立する。"]]},"行政書士法13条の10":{"n":"行政書士法第十三条の十","c":"（成立の届出等）","p":[["行政書士法人は、成立したときは、成立の日から二週間以内に、登記事項証明書及び定款の写しを添えて、その旨を、その主たる事務所の所在地の属する都道府県の区域に設立されている行政書士会（以下「主たる事務所の所在地の行政書士会」という。）を経由して、日本行政書士会連合会に届け出なければならない。"],["２　日本行政書士会連合会は、その会則の定めるところにより、行政書士法人名簿を作成し、その事務所に備えて置かなければならない。"]]},"行政書士法13条の13":{"n":"行政書士法第十三条の十三","c":"（法人の代表）","p":[["行政書士法人の業務を執行する社員は、各自行政書士法人を代表する。ただし、定款又は総社員の同意によつて、業務を執行する社員のうち特に行政書士法人を代表すべきものを定めることを妨げない。"],["２　特定業務を行うことを目的とする行政書士法人における当該特定業務については、前項本文の規定にかかわらず、当該特定業務に係る特定社員のみが各自行政書士法人を代表する。ただし、当該特定社員の全員の同意によつて、当該特定社員のうち特に当該特定業務について行政書士法人を代表すべきものを定めることを妨げない。"],["３　行政書士法人を代表する社員は、定款によつて禁止されていないときに限り、特定の行為の代理を他人に委任することができる。"]]},"個人情報保護法61条":{"n":"個人情報の保護に関する法律第六十一条","c":"（個人情報の保有の制限等）","p":[["行政機関等は、個人情報を保有するに当たっては、法令（条例を含む。第六十六条第二項第三号及び第四号、第六十九条第二項第二号及び第三号並びに第四節において同じ。）の定める所掌事務又は業務を遂行するため必要な場合に限り、かつ、その利用目的をできる限り特定しなければならない。"],["２　行政機関等は、前項の規定により特定された利用目的の達成に必要な範囲を超えて、個人情報を保有してはならない。"],["３　行政機関等は、利用目的を変更する場合には、変更前の利用目的と相当の関連性を有すると合理的に認められる範囲を超えて行ってはならない。"]]},"個人情報保護法62条":{"n":"個人情報の保護に関する法律第六十二条","c":"（利用目的の明示）","p":[["行政機関等は、本人から直接書面（電磁的記録を含む。）に記録された当該本人の個人情報を取得するときは、次に掲げる場合を除き、あらかじめ、本人に対し、その利用目的を明示しなければならない。","- 一　人の生命、身体又は財産の保護のために緊急に必要があるとき。","- 二　利用目的を本人に明示することにより、本人又は第三者の生命、身体、財産その他の権利利益を害するおそれがあるとき。","- 三　利用目的を本人に明示することにより、国の機関、独立行政法人等、地方公共団体又は地方独立行政法人が行う事務又は事業の適正な遂行に支障を及ぼすおそれがあるとき。","- 四　取得の状況からみて利用目的が明らかであると認められるとき。"]]},"個人情報保護法69条":{"n":"個人情報の保護に関する法律第六十九条","c":"（利用及び提供の制限）","p":[["行政機関の長等は、法令に基づく場合を除き、利用目的以外の目的のために保有個人情報を自ら利用し、又は提供してはならない。"],["２　前項の規定にかかわらず、行政機関の長等は、次の各号のいずれかに該当すると認めるときは、利用目的以外の目的のために保有個人情報を自ら利用し、又は提供することができる。ただし、保有個人情報を利用目的以外の目的のために自ら利用し、又は提供することによって、本人又は第三者の権利利益を不当に侵害するおそれがあると認められるときは、この限りでない。","- 一　本人の同意があるとき、又は本人に提供するとき。","- 二　行政機関等が法令の定める所掌事務又は業務の遂行に必要な限度で保有個人情報を内部で利用する場合であって、当該保有個人情報を利用することについて相当の理由があるとき。","- 三　他の行政機関、独立行政法人等、地方公共団体の機関又は地方独立行政法人に保有個人情報を提供する場合において、保有個人情報の提供を受ける者が、法令の定める事務又は業務の遂行に必要な限度で提供に係る個人情報を利用し、かつ、当該個人情報を利用することについて相当の理由があるとき。","- 四　前三号に掲げる場合のほか、専ら統計の作成又は学術研究の目的のために保有個人情報を提供するとき、本人以外の者に提供することが明らかに本人の利益になるとき、その他保有個人情報を提供することについて特別の理由があるとき。"],["３　前項の規定は、保有個人情報の利用又は提供を制限する他の法令の規定の適用を妨げるものではない。"],["４　行政機関の長等は、個人の権利利益を保護するため特に必要があると認めるときは、保有個人情報の利用目的以外の目的のための行政機関等の内部における利用を特定の部局若しくは機関又は職員に限るものとする。"]]},"個人情報保護法83条":{"n":"個人情報の保護に関する法律第八十三条","c":"（開示決定等の期限）","p":[["開示決定等は、開示請求があった日から三十日以内にしなければならない。ただし、第七十七条第三項の規定により補正を求めた場合にあっては、当該補正に要した日数は、当該期間に算入しない。"],["２　前項の規定にかかわらず、行政機関の長等は、事務処理上の困難その他正当な理由があるときは、同項に規定する期間を三十日以内に限り延長することができる。この場合において、行政機関の長等は、開示請求者に対し、遅滞なく、延長後の期間及び延長の理由を書面により通知しなければならない。"]]},"地方自治法101条":{"n":"地方自治法第百一条","c":"","p":[["普通地方公共団体の議会は、普通地方公共団体の長がこれを招集する。"],["議長は、議会運営委員会の議決を経て、当該普通地方公共団体の長に対し、会議に付議すべき事件を示して臨時会の招集を請求することができる。"],["議員の定数の四分の一以上の者は、当該普通地方公共団体の長に対し、会議に付議すべき事件を示して臨時会の招集を請求することができる。"],["前二項の規定による請求があつたときは、当該普通地方公共団体の長は、請求のあつた日から二十日以内に臨時会を招集しなければならない。"],["第二項の規定による請求のあつた日から二十日以内に当該普通地方公共団体の長が臨時会を招集しないときは、第一項の規定にかかわらず、議長は、臨時会を招集することができる。"],["第三項の規定による請求のあつた日から二十日以内に当該普通地方公共団体の長が臨時会を招集しないときは、第一項の規定にかかわらず、議長は、第三項の規定による請求をした者の申出に基づき、当該申出のあつた日から、都道府県及び市にあつては十日以内、町村にあつては六日以内に臨時会を招集しなければならない。"],["招集は、開会の日前、都道府県及び市にあつては七日、町村にあつては三日までにこれを告示しなければならない。ただし、緊急を要する場合は、この限りでない。"],["前項の規定による招集の告示をした後に当該招集に係る開会の日に会議を開くことが災害その他やむを得ない事由により困難であると認めるときは、当該告示をした者は、当該招集に係る開会の日の変更をすることができる。この場合においては、変更後の開会の日及び変更の理由を告示しなければならない。"]]},"地方自治法113条":{"n":"地方自治法第百十三条","c":"","p":[["普通地方公共団体の議会は、議員の定数の半数以上の議員が出席しなければ、会議を開くことができない。但し、第百十七条の規定による除斥のため半数に達しないとき、同一の事件につき再度招集してもなお半数に達しないとき、又は招集に応じても出席議員が定数を欠き議長において出席を催告してもなお半数に達しないとき若しくは半数に達してもその後半数に達しなくなつたときは、この限りでない。"]]},"地方自治法115条":{"n":"地方自治法第百十五条","c":"","p":[["普通地方公共団体の議会の会議は、これを公開する。但し、議長又は議員三人以上の発議により、出席議員の三分の二以上の多数で議決したときは、秘密会を開くことができる。"],["前項但書の議長又は議員の発議は、討論を行わないでその可否を決しなければならない。"]]},"地方自治法116条":{"n":"地方自治法第百十六条","c":"","p":[["この法律に特別の定がある場合を除く外、普通地方公共団体の議会の議事は、出席議員の過半数でこれを決し、可否同数のときは、議長の決するところによる。"],["前項の場合においては、議長は、議員として議決に加わる権利を有しない。"]]},"行政事件訴訟法32条":{"n":"行政事件訴訟法第三十二条","c":"（取消判決等の効力）","p":[["処分又は裁決を取り消す判決は、第三者に対しても効力を有する。"],["２　前項の規定は、執行停止の決定又はこれを取り消す決定に準用する。"]]},"行政事件訴訟法33条":{"n":"行政事件訴訟法第三十三条","c":"","p":[["処分又は裁決を取り消す判決は、その事件について、処分又は裁決をした行政庁その他の関係行政庁を拘束する。"],["２　申請を却下し若しくは棄却した処分又は審査請求を却下し若しくは棄却した裁決が判決により取り消されたときは、その処分又は裁決をした行政庁は、判決の趣旨に従い、改めて申請に対する処分又は審査請求に対する裁決をしなければならない。"],["３　前項の規定は、申請に基づいてした処分又は審査請求を認容した裁決が判決により手続に違法があることを理由として取り消された場合に準用する。"],["４　第一項の規定は、執行停止の決定に準用する。"]]},"行政事件訴訟法34条":{"n":"行政事件訴訟法第三十四条","c":"（第三者の再審の訴え）","p":[["処分又は裁決を取り消す判決により権利を害された第三者で、自己の責めに帰することができない理由により訴訟に参加することができなかつたため判決に影響を及ぼすべき攻撃又は防御の方法を提出することができなかつたものは、これを理由として、確定の終局判決に対し、再審の訴えをもつて、不服の申立てをすることができる。"],["２　前項の訴えは、確定判決を知つた日から三十日以内に提起しなければならない。"],["３　前項の期間は、不変期間とする。"],["４　第一項の訴えは、判決が確定した日から一年を経過したときは、提起することができない。"]]},"民法474条":{"n":"民法第四百七十四条","c":"（第三者の弁済）","p":[["債務の弁済は、第三者もすることができる。"],["２　弁済をするについて正当な利益を有する者でない第三者は、債務者の意思に反して弁済をすることができない。ただし、債務者の意思に反することを債権者が知らなかったときは、この限りでない。"],["３　前項に規定する第三者は、債権者の意思に反して弁済をすることができない。ただし、その第三者が債務者の委託を受けて弁済をする場合において、そのことを債権者が知っていたときは、この限りでない。"],["４　前三項の規定は、その債務の性質が第三者の弁済を許さないとき、又は当事者が第三者の弁済を禁止し、若しくは制限する旨の意思表示をしたときは、適用しない。"]]},"民法478条":{"n":"民法第四百七十八条","c":"（受領権者としての外観を有する者に対する弁済）","p":[["受領権者（債権者及び法令の規定又は当事者の意思表示によって弁済を受領する権限を付与された第三者をいう。以下同じ。）以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、その弁済をした者が善意であり、かつ、過失がなかったときに限り、その効力を有する。"]]},"民法482条":{"n":"民法第四百八十二条","c":"（代物弁済）","p":[["弁済をすることができる者（以下「弁済者」という。）が、債権者との間で、債務者の負担した給付に代えて他の給付をすることにより債務を消滅させる旨の契約をした場合において、その弁済者が当該他の給付をしたときは、その給付は、弁済と同一の効力を有する。"]]},"民法633条":{"n":"民法第六百三十三条","c":"（報酬の支払時期）","p":[["報酬は、仕事の目的物の引渡しと同時に、支払わなければならない。ただし、物の引渡しを要しないときは、第六百二十四条第一項の規定を準用する。"]]},"民法634条":{"n":"民法第六百三十四条","c":"（注文者が受ける利益の割合に応じた報酬）","p":[["次に掲げる場合において、請負人が既にした仕事の結果のうち可分な部分の給付によって注文者が利益を受けるときは、その部分を仕事の完成とみなす。この場合において、請負人は、注文者が受ける利益の割合に応じて報酬を請求することができる。","- 一　注文者の責めに帰することができない事由によって仕事を完成することができなくなったとき。","- 二　請負が仕事の完成前に解除されたとき。"]]},"民法636条":{"n":"民法第六百三十六条","c":"（請負人の担保責任の制限）","p":[["請負人が種類又は品質に関して契約の内容に適合しない仕事の目的物を注文者に引き渡したとき（その引渡しを要しない場合にあっては、仕事が終了した時に仕事の目的物が種類又は品質に関して契約の内容に適合しないとき）は、注文者は、注文者の供した材料の性質又は注文者の与えた指図によって生じた不適合を理由として、履行の追完の請求、報酬の減額の請求、損害賠償の請求及び契約の解除をすることができない。ただし、請負人がその材料又は指図が不適当であることを知りながら告げなかったときは、この限りでない。"]]},"民法637条":{"n":"民法第六百三十七条","c":"（目的物の種類又は品質に関する担保責任の期間の制限）","p":[["前条本文に規定する場合において、注文者がその不適合を知った時から一年以内にその旨を請負人に通知しないときは、注文者は、その不適合を理由として、履行の追完の請求、報酬の減額の請求、損害賠償の請求及び契約の解除をすることができない。"],["２　前項の規定は、仕事の目的物を注文者に引き渡した時（その引渡しを要しない場合にあっては、仕事が終了した時）において、請負人が同項の不適合を知り、又は重大な過失によって知らなかったときは、適用しない。"]]},"民法641条":{"n":"民法第六百四十一条","c":"（注文者による契約の解除）","p":[["請負人が仕事を完成しない間は、注文者は、いつでも損害を賠償して契約の解除をすることができる。"]]},"民法32条の2":{"n":"民法第三十二条の二","c":"","p":[["数人の者が死亡した場合において、そのうちの一人が他の者の死亡後になお生存していたことが明らかでないときは、これらの者は、同時に死亡したものと推定する。"]]},"民法772条":{"n":"民法第七百七十二条","c":"（嫡出の推定）","p":[["妻が婚姻中に懐胎した子は、当該婚姻における夫の子と推定する。女が婚姻前に懐胎した子であって、婚姻が成立した後に生まれたものも、同様とする。"],["２　前項の場合において、婚姻の成立の日から二百日以内に生まれた子は、婚姻前に懐胎したものと推定し、婚姻の成立の日から二百日を経過した後又は婚姻の解消若しくは取消しの日から三百日以内に生まれた子は、婚姻中に懐胎したものと推定する。"],["３　第一項の場合において、女が子を懐胎した時から子の出生の時までの間に二以上の婚姻をしていたときは、その子は、その出生の直近の婚姻における夫の子と推定する。"],["４　前三項の規定により父が定められた子について、第七百七十四条の規定によりその父の嫡出であることが否認された場合における前項の規定の適用については、同項中「直近の婚姻」とあるのは、「直近の婚姻（第七百七十四条の規定により子がその嫡出であることが否認された夫との間の婚姻を除く。）」とする。"]]},"民法886条":{"n":"民法第八百八十六条","c":"（相続に関する胎児の権利能力）","p":[["胎児は、相続については、既に生まれたものとみなす。"],["２　前項の規定は、胎児が死体で生まれたときは、適用しない。"]]},"裁判所法2条":{"n":"裁判所法第二条","c":"（下級裁判所）","p":[["下級裁判所は、高等裁判所、地方裁判所、家庭裁判所及び簡易裁判所とする。"],["下級裁判所の設立、廃止及び管轄区域は、別に法律でこれを定める。"]]},"裁判所法9条":{"n":"裁判所法第九条","c":"（大法廷・小法廷）","p":[["最高裁判所は、大法廷又は小法廷で審理及び裁判をする。"],["大法廷は、全員の裁判官の、小法廷は、最高裁判所の定める員数の裁判官の合議体とする。但し、小法廷の裁判官の員数は、三人以上でなければならない。"],["各合議体の裁判官のうち一人を裁判長とする。"],["各合議体では、最高裁判所の定める員数の裁判官が出席すれば、審理及び裁判をすることができる。"]]},"裁判所法10条":{"n":"裁判所法第十条","c":"（大法廷及び小法廷の審判）","p":[["事件を大法廷又は小法廷のいずれで取り扱うかについては、最高裁判所の定めるところによる。但し、左の場合においては、小法廷では裁判をすることができない。","- 一　当事者の主張に基いて、法律、命令、規則又は処分が憲法に適合するかしないかを判断するとき。（意見が前に大法廷でした、その法律、命令、規則又は処分が憲法に適合するとの裁判と同じであるときを除く。）","- 二　前号の場合を除いて、法律、命令、規則又は処分が憲法に適合しないと認めるとき。","- 三　憲法その他の法令の解釈適用について、意見が前に最高裁判所のした裁判に反するとき。"]]},"公職選挙法4条":{"n":"公職選挙法第四条","c":"（議員の定数）","p":[["衆議院議員の定数は、四百六十五人とし、そのうち、二百八十九人を小選挙区選出議員、百七十六人を比例代表選出議員とする。"],["２　参議院議員の定数は二百四十八人とし、そのうち、百人を比例代表選出議員、百四十八人を選挙区選出議員とする。"],["３　地方公共団体の議会の議員の定数は、地方自治法（昭和二十二年法律第六十七号）の定めるところによる。"]]},"公職選挙法9条":{"n":"公職選挙法第九条","c":"（選挙権）","p":[["日本国民で年齢満十八年以上の者は、衆議院議員及び参議院議員の選挙権を有する。"],["２　日本国民たる年齢満十八年以上の者で引き続き三箇月以上市町村の区域内に住所を有する者は、その属する地方公共団体の議会の議員及び長の選挙権を有する。"],["３　日本国民たる年齢満十八年以上の者でその属する市町村を包括する都道府県の区域内の一の市町村の区域内に引き続き三箇月以上住所を有していたことがあり、かつ、その後も引き続き当該都道府県の区域内に住所を有するものは、前項に規定する住所に関する要件にかかわらず、当該都道府県の議会の議員及び長の選挙権を有する。"],["４　前二項の市町村には、その区域の全部又は一部が廃置分合により当該市町村の区域の全部又は一部となつた市町村であつて、当該廃置分合により消滅した市町村（この項の規定により当該消滅した市町村に含むものとされた市町村を含む。）を含むものとする。"],["５　第二項及び第三項の三箇月の期間は、市町村の廃置分合又は境界変更のため中断されることがない。"]]},"公職選挙法10条":{"n":"公職選挙法第十条","c":"（被選挙権）","p":[["日本国民は、左の各号の区分に従い、それぞれ当該議員又は長の被選挙権を有する。","- 一　衆議院議員については年齢満二十五年以上の者","- 二　参議院議員については年齢満三十年以上の者","- 三　都道府県の議会の議員についてはその選挙権を有する者で年齢満二十五年以上のもの","- 四　都道府県知事については年齢満三十年以上の者","- 五　市町村の議会の議員についてはその選挙権を有する者で年齢満二十五年以上のもの","- 六　市町村長については年齢満二十五年以上の者"],["２　前項各号の年齢は、選挙の期日により算定する。"]]},"財政法4条":{"n":"財政法第四条","c":"","p":[["国の歳出は、公債又は借入金以外の歳入を以て、その財源としなければならない。但し、公共事業費、出資金及び貸付金の財源については、国会の議決を経た金額の範囲内で、公債を発行し又は借入金をなすことができる。"],["前項但書の規定により公債を発行し又は借入金をなす場合においては、その償還の計画を国会に提出しなければならない。"],["第一項に規定する公共事業費の範囲については、毎会計年度、国会の議決を経なければならない。"]]},"財政法5条":{"n":"財政法第五条","c":"","p":[["すべて、公債の発行については、日本銀行にこれを引き受けさせ、又、借入金の借入については、日本銀行からこれを借り入れてはならない。但し、特別の事由がある場合において、国会の議決を経た金額の範囲内では、この限りでない。"]]},"財政法11条":{"n":"財政法第十一条","c":"","p":[["国の会計年度は、毎年四月一日に始まり、翌年三月三十一日に終るものとする。"]]},"財政法30条":{"n":"財政法第三十条","c":"","p":[["内閣は、必要に応じて、一会計年度のうちの一定期間に係る暫定予算を作成し、これを国会に提出することができる。"],["暫定予算は、当該年度の予算が成立したときは、失効するものとし、暫定予算に基く支出又はこれに基く債務の負担があるときは、これを当該年度の予算に基いてなしたものとみなす。"]]},"地方自治法2条":{"n":"地方自治法第二条","c":"","p":[["地方公共団体は、法人とする。"],["普通地方公共団体は、地域における事務及びその他の事務で法律又はこれに基づく政令により処理することとされるものを処理する。"],["市町村は、基礎的な地方公共団体として、第五項において都道府県が処理するものとされているものを除き、一般的に、前項の事務を処理するものとする。"],["市町村は、前項の規定にかかわらず、次項に規定する事務のうち、その規模又は性質において一般の市町村が処理することが適当でないと認められるものについては、当該市町村の規模及び能力に応じて、これを処理することができる。"],["都道府県は、市町村を包括する広域の地方公共団体として、第二項の事務で、広域にわたるもの、市町村に関する連絡調整に関するもの及びその規模又は性質において一般の市町村が処理することが適当でないと認められるものを処理するものとする。"],["都道府県及び市町村は、その事務を処理するに当つては、相互に競合しないようにしなければならない。"],["特別地方公共団体は、この法律の定めるところにより、その事務を処理する。"],["この法律において「自治事務」とは、地方公共団体が処理する事務のうち、法定受託事務以外のものをいう。"],["この法律において「法定受託事務」とは、次に掲げる事務をいう。","- 一　法律又はこれに基づく政令により都道府県、市町村又は特別区が処理することとされる事務のうち、国が本来果たすべき役割に係るものであつて、国においてその適正な処理を特に確保する必要があるものとして法律又はこれに基づく政令に特に定めるもの（以下「第一号法定受託事務」という。）","- 二　法律又はこれに基づく政令により市町村又は特別区が処理することとされる事務のうち、都道府県が本来果たすべき役割に係るものであつて、都道府県においてその適正な処理を特に確保する必要があるものとして法律又はこれに基づく政令に特に定めるもの（以下「第二号法定受託事務」という。）"],["この法律又はこれに基づく政令に規定するもののほか、法律に定める法定受託事務は第一号法定受託事務にあつては別表第一の上欄に掲げる法律についてそれぞれ同表の下欄に、第二号法定受託事務にあつては別表第二の上欄に掲げる法律についてそれぞれ同表の下欄に掲げるとおりであり、政令に定める法定受託事務はこの法律に基づく政令に示すとおりである。"],["地方公共団体に関する法令の規定は、地方自治の本旨に基づき、かつ、国と地方公共団体との適切な役割分担を踏まえたものでなければならない。"],["地方公共団体に関する法令の規定は、地方自治の本旨に基づいて、かつ、国と地方公共団体との適切な役割分担を踏まえて、これを解釈し、及び運用するようにしなければならない。この場合において、特別地方公共団体に関する法令の規定は、この法律に定める特別地方公共団体の特性にも照応するように、これを解釈し、及び運用しなければならない。"],["法律又はこれに基づく政令により地方公共団体が処理することとされる事務が自治事務である場合においては、国は、地方公共団体が地域の特性に応じて当該事務を処理することができるよう特に配慮しなければならない。"],["地方公共団体は、その事務を処理するに当つては、住民の福祉の増進に努めるとともに、最少の経費で最大の効果を挙げるようにしなければならない。"],["地方公共団体は、常にその組織及び運営の合理化に努めるとともに、他の地方公共団体に協力を求めてその規模の適正化を図らなければならない。"],["地方公共団体は、法令に違反してその事務を処理してはならない。なお、市町村及び特別区は、当該都道府県の条例に違反してその事務を処理してはならない。"],["前項の規定に違反して行つた地方公共団体の行為は、これを無効とする。"]]},"地方自治法245条の2":{"n":"地方自治法第二百四十五条の二","c":"（関与の法定主義）","p":[["普通地方公共団体は、その事務の処理に関し、法律又はこれに基づく政令によらなければ、普通地方公共団体に対する国又は都道府県の関与を受け、又は要することとされることはない。"]]},"民法548条の2":{"n":"民法第五百四十八条の二","c":"（定型約款の合意）","p":[["定型取引（ある特定の者が不特定多数の者を相手方として行う取引であって、その内容の全部又は一部が画一的であることがその双方にとって合理的なものをいう。以下同じ。）を行うことの合意（次条において「定型取引合意」という。）をした者は、次に掲げる場合には、定型約款（定型取引において、契約の内容とすることを目的としてその特定の者により準備された条項の総体をいう。以下同じ。）の個別の条項についても合意をしたものとみなす。","- 一　定型約款を契約の内容とする旨の合意をしたとき。","- 二　定型約款を準備した者（以下「定型約款準備者」という。）があらかじめその定型約款を契約の内容とする旨を相手方に表示していたとき。"],["２　前項の規定にかかわらず、同項の条項のうち、相手方の権利を制限し、又は相手方の義務を加重する条項であって、その定型取引の態様及びその実情並びに取引上の社会通念に照らして第一条第二項に規定する基本原則に反して相手方の利益を一方的に害すると認められるものについては、合意をしなかったものとみなす。"]]},"民法548条の3":{"n":"民法第五百四十八条の三","c":"（定型約款の内容の表示）","p":[["定型取引を行い、又は行おうとする定型約款準備者は、定型取引合意の前又は定型取引合意の後相当の期間内に相手方から請求があった場合には、遅滞なく、相当な方法でその定型約款の内容を示さなければならない。ただし、定型約款準備者が既に相手方に対して定型約款を記載した書面を交付し、又はこれを記録した電磁的記録を提供していたときは、この限りでない。"],["２　定型約款準備者が定型取引合意の前において前項の請求を拒んだときは、前条の規定は、適用しない。ただし、一時的な通信障害が発生した場合その他正当な事由がある場合は、この限りでない。"]]},"民法548条の4":{"n":"民法第五百四十八条の四","c":"（定型約款の変更）","p":[["定型約款準備者は、次に掲げる場合には、定型約款の変更をすることにより、変更後の定型約款の条項について合意があったものとみなし、個別に相手方と合意をすることなく契約の内容を変更することができる。","- 一　定型約款の変更が、相手方の一般の利益に適合するとき。","- 二　定型約款の変更が、契約をした目的に反せず、かつ、変更の必要性、変更後の内容の相当性、この条の規定により定型約款の変更をすることがある旨の定めの有無及びその内容その他の変更に係る事情に照らして合理的なものであるとき。"],["２　定型約款準備者は、前項の規定による定型約款の変更をするときは、その効力発生時期を定め、かつ、定型約款を変更する旨及び変更後の定型約款の内容並びにその効力発生時期をインターネットの利用その他の適切な方法により周知しなければならない。"],["３　第一項第二号の規定による定型約款の変更は、前項の効力発生時期が到来するまでに同項の規定による周知をしなければ、その効力を生じない。"],["４　第五百四十八条の二第二項の規定は、第一項の規定による定型約款の変更については、適用しない。"]]},"行政手続法1条":{"n":"行政手続法第一条","c":"（目的等）","p":[["この法律は、処分、行政指導及び届出に関する手続並びに命令等を定める手続に関し、共通する事項を定めることによって、行政運営における公正の確保と透明性（行政上の意思決定について、その内容及び過程が国民にとって明らかであることをいう。第四十六条において同じ。）の向上を図り、もって国民の権利利益の保護に資することを目的とする。"],["２　処分、行政指導及び届出に関する手続並びに命令等を定める手続に関しこの法律に規定する事項について、他の法律に特別の定めがある場合は、その定めるところによる。"]]},"行政不服審査法1条":{"n":"行政不服審査法第一条","c":"（目的等）","p":[["この法律は、行政庁の違法又は不当な処分その他公権力の行使に当たる行為に関し、国民が簡易迅速かつ公正な手続の下で広く行政庁に対する不服申立てをすることができるための制度を定めることにより、国民の権利利益の救済を図るとともに、行政の適正な運営を確保することを目的とする。"],["２　行政庁の処分その他公権力の行使に当たる行為（以下単に「処分」という。）に関する不服申立てについては、他の法律に特別の定めがある場合を除くほか、この法律の定めるところによる。"]]},"憲法13条":{"n":"日本国憲法第十三条","c":"","p":[["すべて国民は、個人として尊重される。生命、自由及び幸福追求に対する国民の権利については、公共の福祉に反しない限り、立法その他の国政の上で、最大の尊重を必要とする。"]]},"行政事件訴訟法30条":{"n":"行政事件訴訟法第三十条","c":"（裁量処分の取消し）","p":[["行政庁の裁量処分については、裁量権の範囲をこえ又はその濫用があつた場合に限り、裁判所は、その処分を取り消すことができる。"]]},"民法110条":{"n":"民法第百十条","c":"（権限外の行為の表見代理）","p":[["前条第一項本文の規定は、代理人がその権限外の行為をした場合において、第三者が代理人の権限があると信ずべき正当な理由があるときについて準用する。"]]},"民法109条":{"n":"民法第百九条","c":"（代理権授与の表示による表見代理等）","p":[["第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間でした行為について、その責任を負う。ただし、第三者が、その他人が代理権を与えられていないことを知り、又は過失によって知らなかったときは、この限りでない。"],["２　第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間で行為をしたとすれば前項の規定によりその責任を負うべき場合において、その他人が第三者との間でその代理権の範囲外の行為をしたときは、第三者がその行為についてその他人の代理権があると信ずべき正当な理由があるときに限り、その行為についての責任を負う。"]]},"民法467条":{"n":"民法第四百六十七条","c":"（債権の譲渡の対抗要件）","p":[["債権の譲渡（現に発生していない債権の譲渡を含む。）は、譲渡人が債務者に通知をし、又は債務者が承諾をしなければ、債務者その他の第三者に対抗することができない。"],["２　前項の通知又は承諾は、確定日付のある証書によってしなければ、債務者以外の第三者に対抗することができない。"]]},"行政事件訴訟法37条":{"n":"行政事件訴訟法第三十七条","c":"（不作為の違法確認の訴えの原告適格）","p":[["不作為の違法確認の訴えは、処分又は裁決についての申請をした者に限り、提起することができる。"]]},"民法424条":{"n":"民法第四百二十四条","c":"（詐害行為取消請求）","p":[["債権者は、債務者が債権者を害することを知ってした行為の取消しを裁判所に請求することができる。ただし、その行為によって利益を受けた者（以下この款において「受益者」という。）がその行為の時において債権者を害することを知らなかったときは、この限りでない。"],["２　前項の規定は、財産権を目的としない行為については、適用しない。"],["３　債権者は、その債権が第一項に規定する行為の前の原因に基づいて生じたものである場合に限り、同項の規定による請求（以下「詐害行為取消請求」という。）をすることができる。"],["４　債権者は、その債権が強制執行により実現することのできないものであるときは、詐害行為取消請求をすることができない。"]]},"民法424条の7":{"n":"民法第四百二十四条の七","c":"（被告及び訴訟告知）","p":[["詐害行為取消請求に係る訴えについては、次の各号に掲げる区分に応じ、それぞれ当該各号に定める者を被告とする。","- 一　受益者に対する詐害行為取消請求に係る訴え　受益者","- 二　転得者に対する詐害行為取消請求に係る訴え　その詐害行為取消請求の相手方である転得者"],["２　債権者は、詐害行為取消請求に係る訴えを提起したときは、遅滞なく、債務者に対し、訴訟告知をしなければならない。"]]},"行政事件訴訟法31条":{"n":"行政事件訴訟法第三十一条","c":"（特別の事情による請求の棄却）","p":[["取消訴訟については、処分又は裁決が違法ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合において、原告の受ける損害の程度、その損害の賠償又は防止の程度及び方法その他一切の事情を考慮したうえ、処分又は裁決を取り消すことが公共の福祉に適合しないと認めるときは、裁判所は、請求を棄却することができる。この場合には、当該判決の主文において、処分又は裁決が違法であることを宣言しなければならない。"],["２　裁判所は、相当と認めるときは、終局判決前に、判決をもつて、処分又は裁決が違法であることを宣言することができる。"],["３　終局判決に事実及び理由を記載するには、前項の判決を引用することができる。"]]},"民法1046条":{"n":"民法第千四十六条","c":"（遺留分侵害額の請求）","p":[["遺留分権利者及びその承継人は、受遺者（特定財産承継遺言により財産を承継し又は相続分の指定を受けた相続人を含む。以下この章において同じ。）又は受贈者に対し、遺留分侵害額に相当する金銭の支払を請求することができる。"],["２　遺留分侵害額は、第千四十二条の規定による遺留分から第一号及び第二号に掲げる額を控除し、これに第三号に掲げる額を加算して算定する。","- 一　遺留分権利者が受けた遺贈又は第九百三条第一項に規定する贈与の価額","- 二　第九百条から第九百二条まで、第九百三条及び第九百四条の規定により算定した相続分に応じて遺留分権利者が取得すべき遺産の価額","- 三　被相続人が相続開始の時において有した債務のうち、第八百九十九条の規定により遺留分権利者が承継する債務（次条第三項において「遺留分権利者承継債務」という。）の額"]]},"民法1048条":{"n":"民法第千四十八条","c":"（遺留分侵害額請求権の期間の制限）","p":[["遺留分侵害額の請求権は、遺留分権利者が、相続の開始及び遺留分を侵害する贈与又は遺贈があったことを知った時から一年間行使しないときは、時効によって消滅する。相続開始の時から十年を経過したときも、同様とする。"]]},"民法113条":{"n":"民法第百十三条","c":"（無権代理）","p":[["代理権を有しない者が他人の代理人としてした契約は、本人がその追認をしなければ、本人に対してその効力を生じない。"],["２　追認又はその拒絶は、相手方に対してしなければ、その相手方に対抗することができない。ただし、相手方がその事実を知ったときは、この限りで const INTERVALS = [1, 3, 7, 14, 30];

function record(q, ok) {
  const st = S.stats[q.id] || [0, 0]; st[1]++; if (ok) st[0]++; S.stats[q.id] = st;
  const r = S.srs[q.id] || { box: -1, due: today() };
  if (ok) { r.box = Math.min(r.box + 1, INTERVALS.length - 1); r.due = today() + INTERVALS[r.box]; }
  else { r.box = 0; r.due = today(); }
  S.srs[q.id] = r; save();
}

function schedule(key, ok) {
  const r = S.review[key] || { box: -1 };
  if (ok) { r.box = Math.min(r.box + 1, INTERVALS.length - 1); r.due = today() + INTERVALS[r.box]; }
  else { r.box = 0; r.due = today() + 1; }
  S.review[key] = r; save();
}
const isDue = key => S.review[key] && S.review[key].due <= today();
function dueList() {
  const t = today();
  return Object.entries(S.srs).filter(([id, r]) => BANK[id] && r.due <= t).sort((a, b) => a[1].due - b[1].due).map(([id]) => BANK[id]);
}
function refillFreeze() {
  const k = S.streak;
  if (k.freezes < 1 && today() - k.refill >= 7) { k.freezes = 1; k.refill = today(); save(); }
}
function streakAlive() {
  const k = S.streak; if (k.last == null) return 0;
  const gap = today() - k.last;
  if (gap <= 1) return k.count;
  if (gap === 2 && k.freezes > 0) return k.count;
  return 0;
}
function completeDay() {
  const k = S.streak, t = today();
  let note = "";
  if (k.last === t) return "";
  if (k.last === t - 1) k.count++;
  else if (k.last === t - 2 && k.freezes > 0) { k.freezes--; k.refill = t; k.count++; note = "きのうはお休みでしたが、おやすみ券を1枚使って記録をつなぎました。"; }
  else k.count = 1;
  k.last = t; save();
  return note;
}

const TAGS = { ox:"○×", choice:"4択", case:"事例", ronbun:"論文の型" };
const correctText = q => q.t === "ox" ? (q.a === 0 ? "○" : "×") : q.c[q.a];
// show choices in a random order each time (the answer is not always in the same slot)
const viewQ = q => { if (q.t === "ox") return q; const perm = shuffle(q.c.map((_, i) => i)); return { ...q, c: perm.map(i => q.c[i]), a: perm.indexOf(q.a) }; };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const toTop = () => window.scrollTo({ top: 0, behavior: "auto" });
function drawChar(canvas, key, scale) { const ch = CHARS[key]; drawSprite(canvas, ch.sprite, scale, ch.pal); }

function questionHTML(q, tags, counter) {
  const opts = q.t === "ox" ? ["○", "×"] : q.c;
  return `<div class="qhead">${tags.map((t, i) => `<span class="tag" ${i ? 'style="border-color:var(--muted);color:var(--muted)"' : ""}>${esc(t)}</span>`).join("")}

    <p class="question">${esc(q.q)}</p>
    <div class="choices ${q.t === "ox" ? "ox" : ""}">
      ${opts.map((o, i) => `<button data-i="${i}">${q.t === "ox" ? "" : `<span class="key">${i + 1}</span>`}<span>${esc(o)}</span></button>`).join("")}
    </div>`;
}
function bindQuiz(q, onPick, scope) {
  const root = scope || $app;
  quiz = { q, answered: false, pick(i) {
    if (this.answered) return;
    this.answered = true;
    root.querySelectorAll(".choices button").forEach((btn, k) => { btn.disabled = true; if (k === q.a) btn.classList.add("right"); else if (k === i) btn.classList.add("wrong"); });
    onPick(i === q.a, i);
  }};
  root.querySelectorAll(".choices button").forEach(btn => btn.onclick = () => quiz.pick(+btn.dataset.i));
}
function explainHTML(lineHTML, q) {
  return `${lineHTML}
    <p class="explain"><b>正解：${esc(correctText(q))}</b>　${esc(q.e)}</p>
    <p class="article">根拠：${esc(q.art)}</p>
    ${citeList(q.art)}
    ${q.src ? `<p class="article" style="color:var(--muted)">司法試験との関係：${esc(q.src)}</p>` : ""}`;
}
function showNext(container, label, onNext) {
  container.insertAdjacentHTML("beforeend", `<div class="row"><button class="btn-gold" id="next">${label}</button></div>`);
  const nx = document.getElementById("next");
  nx.focus({ preventScroll: true });
  container.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "nearest" });
  nx.onclick = onNext;
}

}

// ===== 記録の書き出し・読み込み（別の端末やPWA版へ移すため） =====
const XFER_KEYS = ["roppo-quest-v2", "tenbin-fs", "tenbin-open"];
function bindXfer() {
  const box = document.getElementById("xferBox"), msg = document.getElementById("xferMsg");
  document.getElementById("expBtn").onclick = async () => {
    const o = { app: "tenbin", v: 1, at: new Date().toISOString(), data: {} };
    XFER_KEYS.forEach(k => { try { const v = localStorage.getItem(k); if (v != null) o.data[k] = v; } catch {} });
    box.value = btoa(unescape(encodeURIComponent(JSON.stringify(o))));
    box.select();
    let copied = false; try { await navigator.clipboard.writeText(box.value); copied = true; } catch {}
    msg.textContent = copied ? "コードをコピーしました。移し先の「コードを読み込む」で貼りつけてください。" : "コードを全部選んでコピーし、移し先で貼りつけてください。";
  };
  document.getElementById("impBtn").onclick = () => {
    let o; try { o = JSON.parse(decodeURIComponent(escape(atob(box.value.trim())))); } catch {}
    if (!o || o.app !== "tenbin" || !o.data || typeof o.data["roppo-quest-v2"] !== "string") { msg.textContent = "コードを読み取れませんでした。書き出したコードを全部貼りつけてください。"; return; }
    if (!confirm("いまのこのブラウザの記録を、読み込んだ記録で置きかえます。よろしいですか？")) return;
    try { XFER_KEYS.forEach(k => { if (typeof o.data[k] === "string") localStorage.setItem(k, o.data[k]); }); } catch { msg.textContent = "このブラウザでは保存できませんでした。"; return; }
    location.reload();
  };
}
const rating = r => r >= 0.9 ? "S" : r >= 0.7 ? "A" : r >= 0.5 ? "B" : "C";

// ===== Case flow: hearing → issues → syllogism → closing =====
function caseHead(c, step) {
  const steps = ["聞き取り", "論点チェック", "三段論法", "解決"];
  return `<div class="chapter-head">${esc(c.label)}「${esc(c.title)}」</div>
    <ol class="steps" aria-label="進み具合">${steps.map((s, i) => `<li class="${i < step ? "done" : i === step ? "now" : ""}">${s}</li>`).join("")}</ol>`;
}
function memoHTML(c, got) {
  return `<section class="win facts">
    <div class="qhead"><span class="tag">事件メモ</span><span class="qcount">${esc(CHARS[c.client].name)}</span></div>
    ${got.length ? `<ul class="memo">${got.map(i => `<li>${esc(c.facts[i].fact)}</li>`).join("")}</ul>` : `<p class="note">まだ何も聞いていません。下の質問をタップして話を聞きましょう。</p>`}
  </section>`;
}
function startCase(id) {
  const c = CASES.find(x => x.id === id);
  const run = { c, score: 0, total: c.issues.length + 3, missed: [], order: shuffle(c.facts.map((f, i) => i)) };
  playScenes(`${c.label}「${c.title}」`, c.intro, () => hearing(run, []));
}
function hearing(run, got) {
  const c = run.c; quiz = null;
  const left = run.order.filter(i => !got.includes(i));
  $app.innerHTML = `${caseHead(c, 0)}
    ${memoHTML(c, got)}
    <section class="win">
      <div class="qhead"><span class="tag">聞き取り</span><span class="qcount tnum">${got.length}/${c.facts.length}</span></div>
      <p class="question" style="font-size:15px">相談者に何を聞きますか？ 事件メモに書いた事実は、あとで「あてはめ」に使います。</p>
      <div class="asks">${left.map(i => `<button data-f="${i}">「${esc(c.facts[i].ask)}」</button>`).join("")}</div>
      ${left.length ? "" : `<div class="row"><button class="btn-gold" id="next">論点チェックへ ▶</button></div>`}
    </section>`;
  $app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => hearing(run, [...got, +b.dataset.f]));
  const nx = document.getElementById("next");
  if (nx) { nx.focus({ preventScroll: true }); nx.onclick = () => issue(run, 0); }
}
function issue(run, k) {
  const c = run.c, orig = c.issues[k], q = viewQ(orig);
  $app.innerHTML = `${caseHead(c, 1)}
    ${memoHTML(c, c.facts.map((f, i) => i))}
    <section class="win" id="qwin">${questionHTML(q, [TAGS[q.t], c.field], `論点 ${k + 1}/${c.issues.length}`)}</section>
    <section class="win msg" id="msg" hidden></section>`;
  toTop();
  bindQuiz(q, ok => {
    record(q, ok);
    if (ok) run.score++; else run.missed.push(q);
    const msg = document.getElementById("msg"); msg.hidden = false;
    msg.innerHTML = explainHTML(ok ? `<p class="line good">せいかい！ 天秤先生「うむ、よく見抜いた」</p>` : `<p class="line bad">おしい… 天秤先生「この問題は復習ドリルに入れておこう」</p>`, q);
    const last = k === c.issues.length - 1;
    showNext(msg, last ? "三段論法で答案をつくる ▶" : "つぎの論点へ ▶", () => last ? sanpo(run) : issue(run, k + 1));
  });
}
function boardHTML(c, st) {
  const sp = c.sanpo;
  const facts = st.picked == null ? "" : c.facts.map((f, i) => i).filter(i => c.facts[i].key).map(i => c.facts[i].fact).join("。") + "。";
  const row = (label, sub, val) => `<div class="brow ${val ? "filled" : ""}"><div class="blabel"><span class="pixel">${label}</span><span>${sub}</span></div><div class="bval">${val ? esc(val) : "　"}</div></div>`;
  return `<section class="win board" aria-label="答案ボード">
    <div class="qhead"><span class="tag">答案ボード</span><span class="qcount">法的三段論法</span></div>
    ${row("大前提", "規範", st.rule != null ? sp.rule.c[sp.rule.a] : "")}
    ${row("小前提", "あてはめ", facts ? `本件では、${facts}` : "")}
    ${row("結論", "", st.concl != null ? `よって、${sp.concl.c[sp.concl.a]}。` : "")}
  </section>`;
}
function sanpo(run, st = {}) {
  const c = run.c, sp = c.sanpo;
  const step = st.rule == null ? 0 : st.picked == null ? 1 : 2;
  const prompts = ["① 大前提：この事件に使う規範（条文・判例のルール）を選ぶ", "② 小前提：規範にあてはまる事実を、事件メモからすべて選ぶ", "③ 結論：規範に事実をあてはめた結論を選ぶ"];
  $app.innerHTML = `${caseHead(c, 2)}
    ${boardHTML(c, st)}
    <section class="win" id="qwin">
      <div class="qhead"><span class="tag">三段論法</span><span class="tag" style="border-color:var(--muted);color:var(--muted)">${esc(c.field)}</span><span class="qcount">${step + 1}/3</span></div>
      <p class="question" style="font-size:15px">${prompts[step]}</p>
      <div id="stepbody"></div>
    </section>
    <section class="win msg" id="msg" hidden></section>`;
  const body = document.getElementById("stepbody");
  const finish = (ok, html, nextSt, label) => {
    if (ok) run.score++;
    const msg = document.getElementById("msg"); msg.hidden = false;
    msg.innerHTML = html;
    showNext(msg, label, () => nextSt ? sanpo(run, nextSt) : closing(run));
  };
  if (step === 0 || step === 2) {
    const part = step === 0 ? sp.rule : sp.concl;
    const q = viewQ({ t: "choice", c: part.c, a: part.a });
    body.innerHTML = `<div class="choices">${q.c.map((o, i) => `<button data-i="${i}"><span class="key">${i + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    bindQuiz(q, ok => {
      if (step === 0) finish(ok, `<p class="line ${ok ? "good" : "bad"}">${ok ? "せいかい！ 正しい規範を選べた。" : "おしい… 正しい規範を答案ボードに書いておくぞ。"}</p><p class="explain">${esc(sp.rule.e)}</p>`, { ...st, rule: 0 }, "あてはめへ ▶");
      else finish(ok, `<p class="line ${ok ? "good" : "bad"}">${ok ? "せいかい！ 答案が完成した。" : "おしい… 正しい結論を答案ボードに書いておくぞ。"}</p><p class="article">根拠：${esc(sp.art)}</p>${citeList(sp.art)}${sp.src ? `<p class="article" style="color:var(--muted)">司法試験との関係：${esc(sp.src)}</p>` : ""}`, null, "事件の解決へ ▶");
      if (step === 2) { const b = document.querySelector(".board"); b.outerHTML = boardHTML(c, { ...st, concl: 0 }); }
    }, body);
  } else {
    quiz = null;
    const sel = new Set();
    body.innerHTML = `<div class="factpick">${run.order.map(i => `<button data-p="${i}" aria-pressed="false">${esc(c.facts[i].fact)}</button>`).join("")}</div>
      <div class="row"><button class="btn-gold" id="decide" disabled>あてはめを確定</button></div>`;
    const decide = document.getElementById("decide");
    body.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
      const i = +b.dataset.p; sel.has(i) ? sel.delete(i) : sel.add(i);
      b.setAttribute("aria-pressed", sel.has(i)); decide.disabled = sel.size === 0;
    });
    decide.onclick = () => {
      const need = c.facts.map((f, i) => i).filter(i => c.facts[i].key);
      const ok = need.length === sel.size && need.every(i => sel.has(i));
      body.querySelectorAll("[data-p]").forEach(b => {
        const i = +b.dataset.p; b.disabled = true;
        b.classList.add(c.facts[i].key ? "right" : sel.has(i) ? "wrong" : "dim");
      });
      decide.remove();
      const extra = [...sel].filter(i => !c.facts[i].key).length, miss = need.filter(i => !sel.has(i)).length;
      finish(ok, `<p class="line ${ok ? "good" : "bad"}">${ok ? "せいかい！ 必要な事実をすべて拾えた。" : `おしい… ${miss ? `拾い忘れが${miss}つ` : ""}${miss && extra ? "、" : ""}${extra ? `関係のない事実が${extra}つ` : ""}あった。`}</p>
        <p class="explain">緑の枠が、規範の要件にあたる事実です。採点実感でも、事実を書き写すだけでなく、要件にあたる事実を拾って評価することが求められています。</p>`, { ...st, picked: [...sel] }, "結論へ ▶");
      document.querySelector(".board").outerHTML = boardHTML(c, { ...st, picked: [...sel] });
    };
  }
}
function closing(run) {
  const c = run.c;
  const ratio = run.score / run.total;
  const prev = S.cases[c.id];
  S.cases[c.id] = Math.max(prev || 0, ratio); save();
  const lines = [...(c.outro || [])];
  if (c.real) lines.push(["sensei", `モデルになった事件：${c.real}。`]);
  playScenes(`${c.label}「${c.title}」`, lines, () => {
    $app.innerHTML = `${caseHead(c, 4)}
      <section class="win msg">
        <p class="line good" style="font-size:20px">事件解決！　評価 ${rating(ratio)}</p>
        <p class="note tnum">論点チェックと三段論法　${run.total}問中 ${run.score}問正解</p>
        ${run.missed.length ? `<p>まちがえた論点 ${run.missed.length}問は、復習ドリルに入れました。</p>` : "<p>まちがいなし。見事じゃ！</p>"}
      </section>
      ${boardHTML(c, { rule: 0, picked: [], concl: 0 })}
      ${(() => { const all = citesIn([c.real, c.sanpo.art, ...c.issues.map(q => q.art)].join(" ")); return all.length ? `<section class="win"><div class="qhead"><span class="tag">参考判例</span><span class="qcount">${all.length}件</span></div><ul class="cites">${all.map(citeHTML).join("")}</ul></section>` : ""; })()}
      <div class="row"><button id="again">もう一度</button><button id="write">意見書（答案）を書く ✎</button><button class="btn-gold" id="home">目次にもどる</button></div>`;

}

const useSample = () => (window.claude && window.claude.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null));
const AI_ERR = {
  rate_limited: "いまは混み合っているか、利用の上限に達しています。少し時間をおいて試してください。",

function aiPrompt(p, mine, checks) {
  const answer = p.big ? mine[0] : WPARTS.map(([t], i) => `【${t}】\n${mine[i] || "（未記入）"}`).join("\n\n");
  const model = p.big ? p.secs.map(s => s.text).join("\n\n") : WPARTS.map(([t], i) => `【${t}】\n${p.m[i]}`).join("\n\n");
  const list = checks.flat().map((t, i) => `${i + 1}. ${t}`).join("\n");
  return `あなたは司法試験の論文式試験の採点に慣れた指導者です。受験生の答案を添削してください。

# ルール
- 日本語で、受験生に話しかけるように、ていねいに書く。
- Markdownの記号（#、**、表）は使わない。見出しは【 】で示す。
- 評価の根拠は、下の「事例」「設問」「模範答案」「採点の観点」にある内容に限る。そこにない判例や条文を新たに持ち出す場合は、「（一般論として）」と明記し、事件番号や日付は書かない。
- 模範答案と言い回しが違っても、内容が同じなら正しく評価する。
- 法的三段論法（問題提起→規範→あてはめ→結論）ができているか、事実を規範の要件にあてはめて評価しているか（事実の書き写しになっていないか）を重視する。

# 出力の形
【総評】2〜3文
【良い点】箇条書き（・）で1〜3個
【直すとよい点】箇条書き（・）で1〜4個。どこをどう直すか具体的に
【書き直し例】いちばん直すとよい部分を1段落だけ書き直した例
最後の1行に「観点判定：」に続けて、採点の観点の番号順に、満たしていれば○、満たしていなければ×を、区切りなしで並べる（例：観点判定：○×○）

# 事例
${p.story.join("\n")}
${p.facts ? p.facts.map(f => "・" + f.fact).join("\n") : ""}

# 設問
${p.toi}

# 模範答案
${model}

# 採点の観点
${list}

# 受験生の答案
${answer}`;
}
function bindAI(p, mine, checks, boxes, onApplied) {
  const box = document.getElementById("ai");
  useSample().then(sample => {
    if (!sample || !box) return;
    box.hidden = false;
    const go = document.getElementById("aiGo"), stop = document.getElementById("aiStop");
    const out = document.getElementById("aiOut"), note = document.getElementById("aiNote"), apply = document.getElementById("aiApply");
    let ctl = null, verdict = null;
    stop.onclick = () => ctl && ctl.abort();
    go.onclick = async () => {
      ctl = new AbortController(); verdict = null;
      go.disabled = true; stop.hidden = false; apply.hidden = true; note.textContent = "";
      out.textContent = "Claudeが答案を読んでいます…";
      const strip = t => t.replace(/\n?観点判定[:：].*$/s, "").trim();
      try {
        const { text, truncated } = await sample(aiPrompt(p, mine, checks), { signal: ctl.signal, onText: ({ text }) => { out.textContent = strip(text); } });
        out.textContent = strip(text);
        const m = text.match(/観点判定[:：]\s*([○◯×xX✕ ]+)/);
        if (m) {
          const marks = m[1].replace(/\s/g, "").split("");
          if (marks.length === boxes.length) { verdict = marks.map(c => c === "○" || c === "◯"); apply.hidden = false; }
        }
        if (truncated) note.textContent = "添削が途中で切れています。";
      } catch (e) {
        out.textContent = e.code === "refused" ? "" : (e.text || "");
        if (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "capability_disabled" || e.code === "not_declared") { box.hidden = true; return; }
        if (e.code !== "cancelled") note.textContent = AI_ERR[e.code] || "通信がうまくいきませんでした。もう一度試してください。";
      } finally {
        go.disabled = false; stop.hidden = true; go.textContent = "もう一度添削してもらう";
      }
    };
    apply.onclick = () => {
      if (!verdict) return;
      boxes.forEach((b, i) => { if (!b.disabled) b.checked = verdict[i]; b.dispatchEvent(new Event("change")); });
      apply.hidden = true; onApplied();
    };
  });
}
