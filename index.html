       "審査請求があったときは、処分の効力、処分の執行または手続の続行は当然に停止される。"],
    a:0, ex:["18条1項のとおりです。再調査の請求をしたときは、その決定を知った日の翌日から1か月です。",
       "他の法律（条例に基づく処分は条例）に口頭でできる旨の定めがある場合を除き、審査請求書を提出してしなければなりません（19条1項）。",
       "申請から「相当の期間が経過したにもかかわらず」処分がされないことが必要です（3条）。",
       "処分に関与した者などは審理員になれません（9条2項1号）。",
       "審査請求は、処分の効力・執行・手続の続行を妨げません（執行不停止の原則、25条1項）。"],
    e:"審査請求期間は「知った日の翌日から3か月」「処分の日の翌日から1年」。取消訴訟の出訴期間（6か月・1年）と混同しないよう注意。", art:"行政不服審査法3条・9条2項・18条1項・19条1項・25条1項" },
  { id:"gy-g5", sub:"行政法", topic:"行政不服審査法（不服申立ての種類と裁決）", q:"行政不服審査法に関する次の記述のうち、誤っているものはどれか。",
    c:["審査庁は、審理員意見書の提出を受けたときは、法律が定める例外に当たる場合を除き、行政不服審査会等に諮問しなければならない。",
       "再調査の請求は、法律に再調査の請求をすることができる旨の定めがあるときに限り、することができる。",
       "審理員は、審査請求人の申立てがあった場合には、原則として、申立人に口頭で意見を述べる機会を与えなければならない。",
       "裁決は、審査庁が記名押印した裁決書によりしなければならず、裁決書には理由を記載しなければならない。",
       "審査請求の裁決に不服がある者は、どのような処分についても、再審査請求をすることができる。"],
    a:4, ex:["43条1項のとおりです。",
       "5条1項のとおりです。",
       "31条1項のとおりです（申立人の所在など、機会を与えることが困難な事情があるときは例外）。",
       "50条1項のとおりです（主文・事案の概要・審理関係人の主張の要旨・理由）。",
       "再審査請求は、法律に再審査請求をすることができる旨の定めがある場合に限られます（6条1項）。"],
    e:"不服申立ての3種類：審査請求（原則）、再調査の請求（法律に定めがあるときだけ・処分庁に）、再審査請求（法律に定めがあるときだけ・裁決の後に）。", art:"行政不服審査法5条1項・6条1項・31条1項・43条1項・50条1項" },
  { id:"gy-g6", sub:"行政法", topic:"行政事件訴訟法（取消訴訟の要件）", q:"行政事件訴訟法が定める処分の取消訴訟に関する次の記述のうち、妥当なものはどれか。",
    c:["取消訴訟は、正当な理由があるときを除き、処分があったことを知った日から6か月を経過したとき、または処分の日から1年を経過したときは、提起することができない。",
       "処分について審査請求をすることができる場合には、法律に特別の定めがなくても、審査請求に対する裁決を経た後でなければ取消訴訟を提起することができない。",
       "処分をした行政庁が国に所属する場合、取消訴訟の被告は、その処分をした行政庁である。",
       "取消訴訟が提起されると、処分の執行は当然に停止される。",
       "処分の取消しの訴えと審査請求を棄却した裁決の取消しの訴えとを提起することができる場合、裁決の取消しの訴えにおいて、処分の違法を理由として裁決の取消しを求めることができる。"],
    a:0, ex:["14条1項・2項のとおりです。",
       "審査請求と取消訴訟のどちらを先にしてもよいのが原則です（自由選択主義、8条1項）。裁決を経ることが必要なのは、法律にその旨の定めがある場合だけです。",
       "被告は、処分をした行政庁の所属する国または公共団体です（11条1項）。",
       "取消訴訟の提起は、処分の効力・執行・手続の続行を妨げません（25条1項）。止めるには執行停止の申立てが必要です。",
       "裁決の取消しの訴えでは、処分の違法を理由として取消しを求めることはできません（原処分主義、10条2項）。"],
    e:"取消訴訟の基本：被告は国・公共団体（11条）、出訴期間は6か月・1年（14条）、自由選択主義（8条）、執行不停止（25条）、原処分主義（10条2項）。", art:"行政事件訴訟法8条1項・10条2項・11条1項・14条1項・2項・25条1項" },
  { id:"gy-g7", sub:"行政法", topic:"行政事件訴訟法（義務付け・差止め）", q:"行政事件訴訟法が定める訴訟類型に関する次の記述のうち、妥当なものはどれか。",
    c:["申請を前提としない義務付けの訴え（非申請型）は、一定の処分がされないことにより重大な損害を生ずるおそれがあり、かつ、その損害を避けるため他に適当な方法がないときに限り、提起することができる。",
       "差止めの訴えは、一定の処分がされようとしていれば、損害の大きさにかかわらず提起することができる。",
       "申請を拒否された者が提起する義務付けの訴え（申請型）は、拒否処分の取消訴訟などを併合して提起する必要はない。",
       "仮の義務付けは、重大な損害を避けるため緊急の必要があれば足り、本案について理由があるとみえることまでは必要ない。",
       "当事者訴訟には、公法上の法律関係に関する確認の訴えは含まれない。"],
    a:0, ex:["37条の2第1項のとおりです。",
       "差止めの訴えも「重大な損害を生ずるおそれがある場合に限り」提起できます（37条の4第1項）。",
       "申請型義務付けの訴えは、不作為の違法確認の訴え、または拒否処分の取消訴訟・無効等確認訴訟を併合して提起しなければなりません（37条の3第3項）。",
       "仮の義務付け・仮の差止めは「償うことのできない損害を避けるため緊急の必要」があり、かつ「本案について理由があるとみえるとき」に限られます（37条の5第1項・2項）。",
       "公法上の法律関係に関する確認の訴えは、当事者訴訟（実質的当事者訴訟）に含まれます（4条）。"],
    e:"損害の要件の言葉を区別：義務付け（非申請型）・差止め＝「重大な損害」、仮の義務付け・仮の差止め＝「償うことのできない損害」、執行停止＝「重大な損害」。", art:"行政事件訴訟法4条・37条の2第1項・37条の3第3項・37条の4第1項・37条の5" },
  { id:"gy-g8", sub:"行政法", topic:"処分性（判例）", q:"抗告訴訟の対象となる「処分」に当たるかどうかに関する次の記述のうち、最高裁判所の判例に照らし、妥当なものはどれか。",
    c:["医療法に基づき都道府県知事が行う病院開設中止の勧告は、行政指導として定められているものの、勧告に従わない場合には相当程度の確実さで保険医療機関の指定を受けられなくなるという結果をもたらすことなどから、処分に当たる。",
       "土地区画整理事業の事業計画の決定は、一般的・抽象的な計画にとどまるから、処分に当たらない。",
       "地方公共団体が行うごみ焼却場の設置行為は、周辺住民の生活に大きな影響を与えるから、処分に当たる。",
       "行政指導は、相手方が従わなかったときに法的効果を生じるから、すべて処分に当たる。",
       "条例の制定は議会の立法作用であるから、特定の保育所を廃止する条例の制定行為であっても、処分に当たることはない。"],
    a:0, ex:["最判平成17年7月15日のとおりです。",
       "最大判平成20年9月10日は、判例を変更し、事業計画の決定は処分に当たるとしました。",
       "最判昭和39年10月29日は、ごみ焼却場の設置は公権力の行使に当たらず、処分ではないとしました。",
       "行政指導は相手方の任意の協力を求めるもので、原則として処分ではありません（行政手続法2条6号・32条）。",
       "最判平成21年11月26日は、特定の保育所を廃止する条例の制定行為は処分と実質的に同視でき、処分に当たるとしました。"],
    e:"処分性の基本の定義は大田区ごみ焼却場事件（昭和39年）。そこから広げた判例（勧告・事業計画・条例）をセットで覚えましょう。", art:"行政事件訴訟法3条2項・最判昭和39年10月29日・最判平成17年7月15日・最大判平成20年9月10日・最判平成21年11月26日" },
  { id:"gy-g9", sub:"行政法", topic:"原告適格（条文と判例）", q:"取消訴訟の原告適格に関する次の記述のうち、妥当なものはどれか。",
    c:["取消訴訟は、処分の取消しを求めるにつき法律上の利益を有する者に限り、提起することができる。",
       "裁判所は、処分の相手方以外の者について法律上の利益の有無を判断するに当たっては、処分の根拠となる法令の規定の文言のみによらなければならない。",
       "鉄道の連続立体交差化を内容とする都市計画事業の認可について、事業地の周辺に住む住民は、事業地内に不動産の権利を持たない限り、原告適格が認められることはない。",
       "場外車券発売施設の設置許可について、施設の周辺に住む住民は、交通や風紀など一般的な生活環境の悪化を理由として、当然に原告適格を有する。",
       "処分の効果が期間の経過によってなくなった後は、処分の取消しによって回復すべき法律上の利益があっても、取消訴訟を提起することはできない。"],
    a:0, ex:["9条1項のとおりです。",
       "文言のみによることなく、法令の趣旨・目的、考慮されるべき利益の内容・性質を考慮します（9条2項）。",
       "最大判平成17年12月7日（小田急線事件）は、騒音・振動などで健康や生活環境に著しい被害を直接的に受けるおそれのある周辺住民に原告適格を認めました。",
       "最判平成21年10月15日（サテライト大阪事件）は、一般的な生活環境の利益を理由とする周辺住民の原告適格を認めませんでした（一定の医療施設等の開設者には認める余地あり）。",
       "期間の経過などで処分の効果がなくなった後でも、取消しによって回復すべき法律上の利益を有する者は提起できます（9条1項かっこ書）。"],
    e:"9条2項は「文言のみによることなく」趣旨・目的・利益の内容と性質を考えるという条文。多肢選択式でも狙われます。", art:"行政事件訴訟法9条1項・2項・最大判平成17年12月7日・最判平成21年10月15日" },
  { id:"gy-g10", sub:"行政法", topic:"国家賠償法", q:"国家賠償法に関する次の記述のうち、誤っているものはどれか。",
    c:["国または公共団体の公権力の行使に当たる公務員が、その職務を行うについて、故意または過失によって違法に他人に損害を加えたときは、国または公共団体が賠償する責任を負う。",
       "公務員に故意または重大な過失があったときは、国または公共団体は、その公務員に対して求償権を有する。",
       "判例によれば、公権力の行使に当たる公務員の職務上の行為について国または公共団体が賠償責任を負う場合、公務員個人は被害者に対して直接には責任を負わない。",
       "判例によれば、公の営造物の設置または管理の瑕疵に基づく国または公共団体の賠償責任については、過失の存在を必要としない。",
       "被害者が外国人である場合でも、その外国人の国籍にかかわらず、常に国家賠償法が適用される。"],
    a:4, ex:["1条1項のとおりです。",
       "1条2項のとおりです。軽過失なら求償できません。",
       "最判昭和47年3月21日のとおりです。",
       "最判昭和45年8月20日（高知落石事件）のとおりです。",
       "外国人が被害者のときは、相互の保証があるときに限り適用されます（6条）。"],
    e:"1条（公権力の行使）は故意・過失が必要、2条（営造物）は過失不要。求償は1条が「故意又は重大な過失」のときだけ。", art:"国家賠償法1条・2条・6条・最判昭和47年3月21日・最判昭和45年8月20日" },
  { id:"gy-g11", sub:"行政法", topic:"地方自治法（直接請求・住民監査請求）", q:"地方自治法が定める住民の権利に関する次の記述のうち、妥当なものはどれか。",
    c:["条例の制定または改廃の請求は、選挙権を有する者の総数の50分の1以上の者の連署をもって、その代表者から、普通地方公共団体の長に対して行う。",
       "事務の監査の請求は、選挙権を有する者の総数の3分の1以上の者の連署をもって、監査委員に対して行う。",
       "議会の解散の請求は、普通地方公共団体の長に対して行う。",
       "住民監査請求は、その普通地方公共団体の議会の議員および長の選挙権を有する者でなければすることができない。",
       "住民訴訟は、住民監査請求をしないで、直ちに提起することができる。"],
    a:0, ex:["74条1項のとおりです。地方税の賦課徴収や使用料・手数料の徴収に関する条例は対象外です。",
       "事務の監査の請求に必要な連署は50分の1以上です（75条1項）。",
       "議会の解散の請求は、選挙管理委員会に対して行います（76条1項。原則3分の1以上の連署）。",
       "住民監査請求は「住民」であればでき、選挙権は要りません（法人も可。242条1項）。",
       "住民訴訟は、住民監査請求を経た住民だけが提起できます（監査請求前置、242条の2第1項）。"],
    e:"直接請求の早見：条例・監査は50分の1（長・監査委員へ）、解散・解職は原則3分の1（選管へ。副知事・副市町村長などの解職は長へ）。", art:"地方自治法74条1項・75条1項・76条1項・242条1項・242条の2第1項" },
  { id:"gy-g12", sub:"行政法", topic:"行政行為の効力（総論）", q:"行政行為（処分）の効力等に関する次の記述のうち、誤っているものはどれか。",
    c:["違法な行政行為であっても、権限のある機関によって取り消されるまでは、有効なものとして扱われる（公定力）。",
       "取消訴訟の出訴期間が経過すると、私人の側からは、原則として取消訴訟で行政行為の効力を争うことができなくなる（不可争力）。",
       "無効な行政行為は、取消訴訟の出訴期間が経過した後は、もはや無効を主張することができない。",
       "行政行為の成立当初からの瑕疵を理由に効力を失わせるのが取消し、成立後に生じた事情を理由に将来に向かって効力を失わせるのが撤回である。",
       "処分の取消しの訴えと無効等確認の訴えは、いずれも抗告訴訟に含まれる。"],
    a:2, ex:["公定力の説明として正しい記述です。",
       "不可争力の説明として正しい記述です。",
       "無効な行政行為には公定力・不可争力が働かず、出訴期間の定めのない無効等確認の訴え（3条4項・36条）や、民事訴訟・当事者訴訟の中でいつでも無効を主張できます。",
       "取消しと撤回の区別として正しい記述です。",
       "行政事件訴訟法3条2項・4項のとおりです。"],
    e:"取消しうる行政行為と無効な行政行為の違い（公定力・不可争力の有無）は、5肢択一でも記述でも出る基本です。", art:"行政事件訴訟法3条・14条・36条" },
  // ---- 民法 ----
  { id:"gy-m1", sub:"民法", topic:"意思表示", q:"意思表示に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["表意者が真意ではないことを知ってした意思表示は、原則として有効であるが、相手方がその意思表示が表意者の真意ではないことを知り、または知ることができたときは、無効となる。",
       "相手方と通じてした虚偽の意思表示の無効は、善意の第三者にも対抗することができる。",
       "錯誤が表意者の重大な過失によるものであった場合には、相手方が表意者に錯誤があることを知っていたときでも、表意者は意思表示を取り消すことができない。",
       "相手方に対する意思表示について第三者が詐欺を行った場合、相手方がその事実を知らなかったときは、知ることができたとしても、表意者は意思表示を取り消すことができない。",
       "強迫による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。"],
    a:0, ex:["心裡留保（93条1項）のとおりです。",
       "虚偽表示の無効は、善意の第三者に対抗できません（94条2項）。",
       "相手方が錯誤を知り、または重大な過失で知らなかったとき、相手方も同じ錯誤に陥っていたときは、重過失があっても取り消せます（95条3項）。",
       "相手方がその事実を「知り、又は知ることができたとき」に取り消せます（96条2項）。",
       "第三者保護（96条3項）は詐欺だけです。強迫による取消しは、善意無過失の第三者にも対抗できます。"],
    e:"第三者保護の要件：虚偽表示＝善意（94条2項）、錯誤・詐欺＝善意無過失（95条4項・96条3項）、強迫＝保護なし。", art:"民法93条1項・94条2項・95条3項・96条2項・3項" },
  { id:"gy-m2", sub:"民法", topic:"代理", q:"代理に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["無権代理人がした契約は、本人が追認すれば、別段の意思表示がないときは、契約の時にさかのぼってその効力を生ずる。",
       "無権代理の相手方は、本人に対し、相当の期間を定めて追認するかどうかを確答すべき旨を催告することができ、本人がその期間内に確答をしないときは、追認を拒絶したものとみなされる。",
       "無権代理人の相手方が、代理権がないことを過失によって知らなかったときは、無権代理人が自己に代理権がないことを知っていた場合を除き、無権代理人の責任を追及することができない。",
       "制限行為能力者が代理人としてした行為は、原則として、行為能力の制限を理由として取り消すことができない。",
       "委任による代理人は、本人の許諾がなくても、いつでも自由に復代理人を選任することができる。"],
    a:4, ex:["116条のとおりです。",
       "114条のとおりです。",
       "117条2項2号のとおりです。",
       "102条本文のとおりです（制限行為能力者が他の制限行為能力者の法定代理人としてした行為は例外）。",
       "任意代理人は、本人の許諾を得たとき、またはやむを得ない事由があるときでなければ、復代理人を選任できません（104条）。"],
    e:"復代理：任意代理人は「許諾またはやむを得ない事由」が必要、法定代理人は自己の責任でいつでも選任できる（105条）。", art:"民法102条・104条・114条・116条・117条2項" },
  { id:"gy-m3", sub:"民法", topic:"時効", q:"時効に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["時効の利益は、あらかじめ放棄することができない。",
       "裁判上の請求をすると、その時点で時効が更新され、新たに時効が進行を始める。",
       "催告があったときは、その時から1年を経過するまでの間は、時効は完成しない。",
       "所有権は、権利を行使することができる時から20年間行使しないときは、時効によって消滅する。",
       "権利についての協議を行う旨の合意は、口頭でしたものであっても、時効の完成を猶予する効力がある。"],
    a:0, ex:["146条のとおりです。",
       "裁判上の請求は、まず時効の完成を猶予し、確定判決などで権利が確定したときに、その手続が終わった時から新たに進行を始めます（147条）。",
       "催告による完成猶予は6か月です（150条1項）。",
       "20年で消滅するのは「債権又は所有権以外の財産権」です（166条2項）。所有権は消滅時効にかかりません。",
       "協議を行う旨の合意は、書面（電磁的記録を含む）でしなければなりません（151条）。"],
    e:"「完成猶予」と「更新」を区別。催告は6か月の猶予だけ、再度の催告では延びません（150条2項）。", art:"民法146条・147条・150条・151条・166条" },
  { id:"gy-m4", sub:"民法", topic:"物権変動と対抗要件", q:"物権変動に関する次の記述のうち、民法の規定および判例に照らし、妥当なものはどれか。",
    c:["不動産の二重譲渡において、先に譲り受けた者が登記をしていないことに乗じて、その者を害する目的で譲り受けた背信的悪意者に対しては、先に譲り受けた者は登記がなくても所有権を対抗することができる。",
       "動産の即時取得は、占有改定による引渡しを受けた場合にも成立する。",
       "動産に関する物権の譲渡は、登記をしなければ第三者に対抗することができない。",
       "不動産の売買契約による所有権の移転は、登記をしなければ、売主と買主の間でも効力を生じない。",
       "留置権は、登記をしなければ第三者に対抗することができない。"],
    a:0, ex:["最判昭和43年8月2日のとおり、背信的悪意者は177条の「第三者」に当たりません。",
       "最判昭和35年2月11日は、占有改定では即時取得は成立しないとしています。",
       "動産の対抗要件は引渡しです（178条）。",
       "物権の設定・移転は、当事者の意思表示のみで効力を生じます（176条）。登記は第三者への対抗要件です（177条）。",
       "留置権は目的物の占有を要件・存続要件とする権利で、登記はできず、その必要もありません（295条・302条）。"],
    e:"177条の第三者は「登記の欠缺を主張する正当な利益を有する者」。単なる悪意者は含まれるが、背信的悪意者は含まれない。", art:"民法176条・177条・178条・192条・295条・最判昭和35年2月11日・最判昭和43年8月2日" },
  { id:"gy-m5", sub:"民法", topic:"保証", q:"保証に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["保証契約は、書面（または電磁的記録）でしなければ、その効力を生じない。",
       "連帯保証人は、催告の抗弁および検索の抗弁を有しない。",
       "個人が保証人となる根保証契約は、極度額を定めなければ、その効力を生じない。",
       "事業のために負担した貸金等債務を主たる債務とする保証契約で保証人が個人であるものは、原則として、契約締結の日前1か月以内に作成された公正証書で保証債務を履行する意思を表示していなければ、その効力を生じない。",
       "保証人の負担が債務の目的または態様において主たる債務より重いときでも、保証人はその約定どおりの負担を負う。"],
    a:4, ex:["446条2項・3項のとおりです。",
       "454条のとおりです。",
       "465条の2第2項のとおりです。",
       "465条の6第1項のとおりです（主たる債務者の取締役などには例外があります。465条の9）。",
       "保証人の負担が主たる債務より重いときは、主たる債務の限度に減縮されます（448条1項）。"],
    e:"保証の付従性：保証人の負担は主たる債務より重くならない（448条）。契約後に主たる債務が加重されても、保証人の負担は加重されない（448条2項）。", art:"民法446条・448条・454条・465条の2・465条の6" },
  { id:"gy-m6", sub:"民法", topic:"売買（契約不適合責任）", q:"売買の目的物が契約の内容に適合しない場合の買主の権利に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["引き渡された目的物が種類、品質または数量に関して契約の内容に適合しないものであるときは、買主は、売主に対し、目的物の修補、代替物の引渡しまたは不足分の引渡しによる履行の追完を請求することができる。",
       "買主は、契約の内容に適合しない目的物が引き渡されたときは、どのような場合でも、催告をすることなく直ちに代金の減額を請求することができる。",
       "数量に関する不適合についても、買主が不適合を知った時から1年以内にその旨を売主に通知しないときは、買主は、その不適合を理由とする権利を行使することができない。",
       "売主に帰責事由がないときは、買主は、契約の内容に適合しないことを理由として契約を解除することができない。",
       "不適合が買主の責めに帰すべき事由によるものであるときでも、買主は、履行の追完を請求することができる。"],
    a:0, ex:["562条1項のとおりです。",
       "代金減額は、原則として相当の期間を定めて追完を催告し、その期間内に追完がないときにできます（563条1項）。追完が不能なときなどは催告不要です（同2項）。",
       "1年以内の通知が必要なのは「種類又は品質」に関する不適合だけです（566条）。数量や権利の不適合には適用されません。",
       "解除には、債務者（売主）の帰責事由は不要です（564条・541条・542条）。",
       "買主の責めに帰すべき事由によるときは、追完を請求できません（562条2項）。"],
    e:"買主の4つの手段：追完請求（562条）・代金減額（563条）・損害賠償・解除（564条）。損害賠償だけは売主の帰責事由が必要（415条1項ただし書）。", art:"民法541条・542条・562条・563条・564条・566条" },
  { id:"gy-m7", sub:"民法", topic:"不法行為", q:"不法行為に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["責任能力のない者が他人に損害を加えた場合、その監督義務者は、監督義務を怠らなかったこと、または義務を怠らなくても損害が生ずべきであったことを証明すれば、責任を負わない。",
       "使用者は、被用者の選任およびその事業の監督について相当の注意をしたとき、または相当の注意をしても損害が生ずべきであったときは、使用者責任を負わない。",
       "他人の名誉を毀損した者に対しては、裁判所は、被害者の請求により、損害賠償に代えて、または損害賠償とともに、名誉を回復するのに適当な処分を命ずることができる。",
       "不法行為による損害賠償の請求権は、不法行為の時から20年間行使しないときは、時効によって消滅する。",
       "胎児は、生まれた後でなければ、不法行為に基づく損害賠償請求権を取得することはない。"],
    a:4, ex:["714条1項のとおりです。",
       "715条1項ただし書のとおりです（実際の裁判で免責が認められることはまれです）。",
       "723条のとおりです。",
       "724条2号のとおりです（知った時から3年。生命・身体の侵害は5年：724条の2）。",
       "胎児は、損害賠償の請求権については、既に生まれたものとみなされます（721条）。"],
    e:"胎児が「生まれたものとみなされる」のは、不法行為の損害賠償（721条）・相続（886条）・遺贈（965条）の3つ。", art:"民法714条・715条・721条・723条・724条" },
  { id:"gy-m8", sub:"民法", topic:"相続", q:"相続に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["自筆証書遺言に相続財産の目録を添付する場合、その目録は自書でなくてもよいが、遺言者は目録の毎葉（両面に自書でない記載があるときはその両面）に署名し、印を押さなければならない。",
       "相続の放棄は、他の相続人全員に対して意思表示をすることで行うことができる。",
       "配偶者と子が相続人であるときは、配偶者の相続分は3分の2である。",
       "兄弟姉妹が相続人となる場合には、兄弟姉妹にも遺留分が認められる。",
       "被相続人の子が相続開始以前に死亡したときは、その子の配偶者が代襲して相続人となる。"],
    a:0, ex:["968条2項のとおりです。",
       "相続の放棄は、家庭裁判所に申述しなければなりません（938条）。",
       "配偶者と子が相続人のとき、配偶者の相続分は2分の1です（900条1号）。3分の2は直系尊属と共同相続するときです。",
       "遺留分は「兄弟姉妹以外の相続人」にだけ認められます（1042条1項）。",
       "代襲相続人になるのは、死亡した子の「子」（被相続人の直系卑属）です（887条2項）。配偶者はなりません。"],
    e:"法定相続分：配偶者と子＝1/2ずつ、配偶者と直系尊属＝2/3と1/3、配偶者と兄弟姉妹＝3/4と1/4（900条）。", art:"民法887条2項・900条・938条・968条・1042条" },
  { id:"gy-g13", sub:"行政法", topic:"行政代執行法", q:"行政代執行法に関する次の記述のうち、妥当なものはどれか。",
    c:["代執行の対象となるのは、法律により直接に命ぜられ、または法律に基づき行政庁により命ぜられた行為のうち、他人が代わってすることのできる行為（代替的作為義務）である。",
       "他人が代わってすることのできない行為（非代替的作為義務）についても、代執行をすることができる。",
       "代執行に要した費用は行政庁が負担し、義務者から徴収することはできない。",
       "代執行をするには、緊急の必要がある場合であっても、あらかじめ文書で戒告をしなければならない。",
       "代執行をするには、あらかじめ裁判所の許可を得なければならない。"],
    a:0, ex:["2条のとおりです。ここでいう「法律」には、法律の委任に基づく命令・規則・条例も含まれます。",
       "代執行は代替的作為義務に限られます（2条かっこ書）。",
       "費用は義務者から徴収でき（2条）、国税滞納処分の例により徴収できます（6条1項）。",
       "非常の場合または危険切迫の場合で、急速な実施について緊急の必要があり、手続をとる暇がないときは、戒告と代執行令書による通知を省略できます（3条3項）。",
       "裁判所の許可は要りません。行政庁が自ら行うことができる仕組みです（2条）。"],
    e:"代執行の流れ：戒告（文書）→ 代執行令書による通知 → 代執行 → 費用の納付命令（文書）→ 国税滞納処分の例で徴収。条例で命じられた義務も対象になる点に注意。", art:"行政代執行法2条・3条・5条・6条1項" },
  { id:"gy-m9", sub:"民法", topic:"賃貸借", q:"賃貸借に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、または賃借物を転貸することができない。",
       "賃借人は、賃借物について賃貸人の負担に属する必要費を支出したときは、賃貸人に対し、直ちにその償還を請求することができる。",
       "賃貸人は、賃貸借が終了し、賃貸物の返還を受けたときは、受け取った敷金から賃借人の債務の額を控除した残額を返還しなければならない。",
       "賃借物の一部が賃借人の責めに帰することができない事由によって使用・収益できなくなったときは、賃料は、その部分の割合に応じて減額される。",
       "賃借人は、賃貸借が終了したときは、通常の使用によって生じた損耗や経年変化についても、原状に復する義務を負う。"],
    a:4, ex:["612条1項のとおりです。",
       "608条1項のとおりです（有益費は賃貸借終了の時に償還：同2項）。",
       "622条の2第1項1号のとおりです。",
       "611条1項のとおりです（当然に減額され、請求は要りません）。",
       "通常損耗と経年変化は、原状回復義務の対象から除かれています（621条）。"],
    e:"2020年改正で、敷金（622条の2）と原状回復（621条）が条文になりました。通常損耗は原状回復の対象外です。", art:"民法608条・611条1項・612条1項・621条・622条の2" },
  // ---- 憲法 ----
  { id:"gy-c1", sub:"憲法", topic:"人権の主体・人権規定", q:"人権に関する次の記述のうち、憲法の規定および最高裁判所の判例に照らし、妥当なものはどれか。",
    c:["憲法第3章の基本的人権の保障は、権利の性質上日本国民のみを対象としていると解されるものを除き、わが国に在留する外国人に対しても等しく及ぶ。",
       "海外に住む日本国民の選挙権の行使を制限することは、国会の広い裁量に委ねられており、違憲となる余地はない。",
       "税関検査によってわいせつな書籍の輸入を止めることは、憲法が禁止する検閲に当たる。",
       "憲法は外国に移住する自由を保障しているが、日本の国籍を離脱する自由までは保障していない。",
       "児童を酷使してはならないとする規定は、憲法には置かれていない。"],
    a:0, ex:["最大判昭和53年10月4日（マクリーン事件）のとおりです。ただし外国人の在留の権利までは保障されないとしました。",
       "最大判平成17年9月14日は、在外国民の選挙権の制限には「やむを得ない事由」が必要であるとし、当時の公職選挙法を違憲としました。",
       "最大判昭和59年12月12日は、税関検査は検閲に当たらないとしました。",
       "「何人も、外国に移住し、又は国籍を離脱する自由を侵されない」と定めています（22条2項）。",
       "「児童は、これを酷使してはならない」と定めています（27条3項）。"],
    e:"人権の主体（外国人・法人・未成年者）と、選挙権・表現の自由の重要判例は、5肢択一の定番です。", art:"憲法22条2項・27条3項・最大判昭和53年10月4日・最大判平成17年9月14日・最大判昭和59年12月12日" },
  { id:"gy-c2", sub:"憲法", topic:"国会", q:"国会に関する次の記述のうち、憲法の規定に照らし、誤っているものはどれか。",
    c:["衆議院で可決し、参議院でこれと異なった議決をした法律案は、衆議院で出席議員の3分の2以上の多数で再び可決したときは、法律となる。",
       "予算は、さきに衆議院に提出しなければならない。",
       "条約の締結に必要な国会の承認について、参議院が衆議院の可決した条約を受け取った後、国会休会中の期間を除いて30日以内に議決しないときは、衆議院の議決が国会の議決となる。",
       "内閣総理大臣の指名について、衆議院が指名の議決をした後、国会休会中の期間を除いて10日以内に参議院が指名の議決をしないときは、衆議院の議決が国会の議決となる。",
       "両議院は、各々その総議員の過半数の出席がなければ、議事を開き議決することができない。"],
    a:4, ex:["59条2項のとおりです。",
       "60条1項のとおりです（予算の衆議院先議）。",
       "61条が60条2項を準用しています。",
       "67条2項のとおりです。両院協議会で意見が一致しないときも同じです。",
       "定足数は総議員の「3分の1以上」です（56条1項）。"],
    e:"衆議院の優越の日数：予算・条約は30日、総理大臣の指名は10日、法律案は60日（参議院が議決しないとき否決とみなせる：59条4項）。", art:"憲法56条1項・59条2項・60条・61条・67条2項" },
  { id:"gy-c3", sub:"憲法", topic:"内閣・裁判所", q:"内閣および裁判所に関する次の記述のうち、憲法の規定に照らし、妥当なものはどれか。",
    c:["内閣総理大臣その他の国務大臣は、文民でなければならない。",
       "国務大臣は、全員が国会議員の中から選ばれなければならない。",
       "参議院で内閣の問責決議が可決されたときは、内閣は、10日以内に衆議院が解散されない限り、総辞職をしなければならない。",
       "裁判官の報酬は、法律の定めるところにより、在任中に減額することができる。",
       "最高裁判所の裁判官の国民審査は、任命後初めて行われる参議院議員通常選挙の際に行う。"],
    a:0, ex:["66条2項のとおりです。",
       "国務大臣は、その過半数が国会議員であればよいとされています（68条1項）。",
       "総辞職か解散かが迫られるのは、衆議院で不信任の決議案が可決（または信任の決議案が否決）されたときです（69条）。参議院の問責決議にその効果はありません。",
       "最高裁・下級裁の裁判官の報酬は、在任中減額することができません（79条6項・80条2項）。",
       "国民審査は、任命後初めて行われる「衆議院議員総選挙」の際に行い、その後10年を経過した後初めて行われる衆議院議員総選挙の際に更に審査します（79条2項）。"],
    e:"「過半数」の数字（国務大臣は過半数が国会議員）と、「衆議院」だけに結びつく制度（不信任決議・国民審査）を押さえましょう。", art:"憲法66条2項・68条1項・69条・79条2項・6項・80条2項" },
  // ---- 商法・会社法 ----
  { id:"gy-s1", sub:"商法", topic:"株式会社の機関", q:"株式会社の機関に関する次の記述のうち、会社法の規定に照らし、妥当なものはどれか。",
    c:["公開会社は、取締役会を置かなければならない。",
       "取締役会設置会社においては、取締役は2人以上でなければならない。",
       "株主総会の普通決議は、定款に別段の定めがある場合を除き、議決権を行使することができる株主の議決権の3分の2以上を有する株主が出席し、出席した株主の議決権の3分の2以上をもって行う。",
       "取締役の任期は、原則として、選任後4年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。",
       "監査役は、その株式会社の取締役を兼ねることができる。"],
    a:0, ex:["327条1項1号のとおりです。",
       "取締役会設置会社の取締役は3人以上です（331条5項）。",
       "普通決議は、議決権の過半数を有する株主が出席し、出席株主の議決権の過半数で行います（309条1項）。3分の2以上は特別決議の要件です（309条2項）。",
       "取締役の任期は原則2年です（332条1項）。4年は監査役の任期です（336条1項）。",
       "監査役は、その会社やその子会社の取締役・支配人などを兼ねることができません（335条2項）。"],
    e:"任期は取締役2年・監査役4年。人数は取締役会設置会社の取締役3人以上。決議要件の過半数（普通）と3分の2（特別）を区別しましょう。", art:"会社法309条1項・327条1項・331条5項・332条1項・335条2項・336条1項" },
  { id:"gy-s2", sub:"商法", topic:"商行為", q:"商行為に関する次の記述のうち、商法の規定に照らし、誤っているものはどれか。",
    c:["商人がその営業の範囲内において他人のために行為をしたときは、相当な報酬を請求することができる。",
       "数人の者がその1人または全員のために商行為となる行為によって債務を負担したときは、その債務は、各自が連帯して負担する。",
       "商行為の代理人が本人のためにすることを示さないでこれをした場合であっても、その行為は、本人に対してその効力を生ずる。",
       "商人間の売買において、買主は、目的物を受領したときは、遅滞なく、その物を検査しなければならない。",
       "商行為によって生じた債務の法定利率は、民法の法定利率とは別に、商法で年6分と定められている。"],
    a:4, ex:["512条のとおりです。民法の委任は原則無償ですが、商人は報酬を請求できます。",
       "511条1項のとおりです。",
       "504条本文のとおりです（相手方が知らなかったときは代理人にも履行を請求できる：同ただし書）。",
       "526条1項のとおりです。不適合を発見したら直ちに売主に通知しないと、追完・減額・損害賠償・解除を請求できません（同2項）。",
       "商事法定利率を定めていた514条は、2020年施行の改正で削除されました。商行為による債務にも民法の法定利率（404条）が適用されます。"],
    e:"商法は民法の特則。報酬請求（512条）・連帯（511条）・非顕名でも本人に効力（504条）・検査通知義務（526条）が典型です。", art:"商法504条・511条1項・512条・526条・民法404条" },
  // ---- 基礎法学 ----
  { id:"gy-b1", sub:"基礎法学", topic:"法の効力と解釈", q:"法の効力と解釈に関する次の記述のうち、妥当なものはどれか。",
    c:["同じ事項について一般法と特別法の両方に定めがあるときは、特別法が一般法に優先して適用される。",
       "新しく制定された一般法は、それより前に制定された特別法に常に優先する。",
       "刑罰法規については、被告人に不利益な方向での類推解釈も広く認められる。",
       "法律は、施行期日の定めがあっても、公布の日から起算して20日を経過した日から施行される。",
       "「反対解釈」とは、法文の言葉の意味を通常よりも広げて解釈する方法をいう。"],
    a:0, ex:["「特別法は一般法を破る」という原則です。",
       "「後法は前法を破る」は同じ種類の法の間の原則で、新しい一般法が古い特別法を当然に廃止するわけではありません（特別法優先が働きます）。",
       "罪刑法定主義から、被告人に不利益な類推解釈は許されません。",
       "公布から20日を経過した日に施行するのは、法律で施行期日を定めていないときです（法の適用に関する通則法2条ただし書）。",
       "それは「拡張解釈」の説明です。反対解釈は、条文が定めていない事柄には逆の効果が生じると解釈する方法です。"],
    e:"解釈の種類（文理・拡張・縮小・類推・反対・勿論）の定義は、基礎法学の定番です。", art:"法の適用に関する通則法2条・憲法31条" },
  { id:"gy-b2", sub:"基礎法学", topic:"裁判制度", q:"日本の裁判制度に関する次の記述のうち、誤っているものはどれか。",
    c:["簡易裁判所は、訴訟の目的の価額が140万円を超えない請求（行政事件訴訟に係る請求を除く。）について、第一審の裁判権を持つ。",
       "最高裁判所は、その長たる裁判官と、法律の定める員数（14人）のその他の裁判官で構成される。",
       "最高裁判所の長たる裁判官は、内閣の指名に基づいて、天皇が任命する。",
       "特別裁判所は、設置することができない。",
       "下級裁判所の裁判官は、最高裁判所が任命する。"],
    a:4, ex:["裁判所法33条1項1号のとおりです。",
       "裁判所法5条1項・3項のとおりです。",
       "憲法6条2項のとおりです。",
       "憲法76条2項のとおりです（行政機関は終審として裁判を行うこともできません）。",
       "下級裁判所の裁判官は、最高裁判所の指名した者の名簿によって、内閣が任命します（憲法80条1項）。"],
    e:"任命の主体：最高裁長官＝内閣の指名→天皇が任命、最高裁判事＝内閣が任命、下級裁判官＝最高裁の名簿→内閣が任命。", art:"憲法6条2項・76条2項・79条1項・80条1項・裁判所法5条・33条1項1号" },
  // ---- 基礎知識（業務関連法令・個人情報保護） ----
  { id:"gy-i1", sub:"基礎知識", topic:"行政書士法", q:"行政書士法に関する次の記述のうち、妥当なものはどれか。",
    c:["行政書士は、その業務を通じて、行政に関する手続の円滑な実施に寄与するとともに国民の利便に資し、もって国民の権利利益の実現に資することを使命とする。",
       "他の法律においてその業務を行うことが制限されている事項であっても、書類の作成であれば、行政書士はその業務として行うことができる。",
       "行政書士が作成できる書類についての行政不服申立ての手続の代理は、すべての行政書士が行うことができる。",
       "行政書士の業務は書類の作成とその提出手続の代理に限られ、書類の作成について相談に応ずることは業務に含まれない。",
       "行政書士が業として作成する書類には、電磁的記録は含まれない。"],
    a:0, ex:["1条のとおりです（2025年の改正で「目的」から「使命」の規定になりました）。",
       "他の法律で制限されている業務は行うことができません（1条の3第2項）。",
       "不服申立ての手続の代理は、日本行政書士会連合会の研修課程を修了した「特定行政書士」に限られます（1条の4第2項）。",
       "書類の作成について相談に応ずることも業務です（1条の4第1項4号）。",
       "電磁的記録の作成も含まれます（1条の3第1項）。"],
    e:"行政書士法は令和8年1月施行の改正で、使命（1条）・職責（1条の2）の規定が置かれました。基準日（令和8年4月1日）の法令が出題されます。", art:"行政書士法1条・1条の2・1条の3・1条の4" },
  { id:"gy-i2", sub:"基礎知識", topic:"個人情報保護法", q:"個人情報の保護に関する法律に関する次の記述のうち、誤っているものはどれか。",
    c:["個人情報取扱事業者は、個人情報を取り扱うに当たっては、その利用の目的をできる限り特定しなければならない。",
       "個人情報取扱事業者は、法令に基づく場合などの例外を除き、あらかじめ本人の同意を得ないで、要配慮個人情報を取得してはならない。",
       "個人情報取扱事業者は、法令に基づく場合などの例外を除き、あらかじめ本人の同意を得ないで、個人データを第三者に提供してはならない。",
       "この法律で「個人情報」とは、生存する個人に関する情報であって、特定の個人を識別することができるものなどをいう。",
       "死亡した人に関する情報も、この法律の「個人情報」に当たる。"],
    a:4, ex:["17条1項のとおりです。",
       "20条2項のとおりです。要配慮個人情報は、人種・信条・病歴・犯罪の経歴など、不当な差別や偏見が生じないよう配慮が必要な情報です。",
       "27条1項のとおりです（オプトアウトなどの例外あり）。",
       "2条1項のとおりです。",
       "個人情報は「生存する個人」に関する情報に限られます（2条1項）。死者の情報が遺族などの生存する個人の情報にも当たるときは、その人の個人情報になります。"],
    e:"個人情報保護法は2021・2022年に大きく改正され、条文番号が変わっています。古い番号で覚えている人は注意。", art:"個人情報保護法2条1項・17条1項・20条2項・27条1項" },
  { id:"gy-i3", trap:true, sub:"基礎知識", topic:"行政書士法（資格と欠格事由）", q:"行政書士となる資格に関する次の記述のうち、行政書士法の規定に照らし、誤っているものはどれか。",
    c:["弁護士となる資格を有する者は、行政書士となる資格を有する。",
       "国または地方公共団体の公務員として行政事務を担当した期間などが通算して20年以上（高等学校を卒業した者などは17年以上）になる者は、行政書士となる資格を有する。",
       "未成年者は、行政書士試験に合格していても、行政書士となる資格を有しない。",
       "破産手続開始の決定を受けて復権を得ない者は、行政書士となる資格を有しない。",
       "公務員で懲戒免職の処分を受けた者は、その処分の日から何年を経過しても、行政書士となる資格を有しない。"],
    a:4, ex:["2条2号のとおりです。",
       "2条6号のとおりです。",
       "2条の2第1号のとおりです。",
       "2条の2第2号のとおりです。",
       "資格を有しないのは、懲戒免職の処分の日から「3年」を経過しない者だけです（2条の2第4号）。「何年を経過しても」が誤り。"],
    e:"欠格事由の「3年」は、拘禁刑の執行終了など（3号）、懲戒免職（4号）、登録の取消し（5号）、業務の禁止（6号）で共通です。「永久に」「何年たっても」と言い切る肢は疑います。", art:"行政書士法2条・2条の2" },
  { id:"gy-i4", trap:true, sub:"基礎知識", topic:"行政書士法（行政書士の義務と業務の制限）", q:"行政書士法に関する次の記述のうち、妥当なものはどれか。",
    c:["行政書士は、業務に関する帳簿を、その関係書類とともに、帳簿閉鎖の時から5年間保存しなければならない。",
       "行政書士は、正当な事由がある場合でなければ、依頼を拒むことができない。",
       "行政書士は、正当な理由がなく、業務上取り扱った事項について知り得た秘密を漏らしてはならないが、行政書士でなくなった後は、この義務を負わない。",
       "行政書士は、業務に関し受ける報酬の額を、依頼者から求められたときに示せば足り、事務所に掲示する必要はない。",
       "行政書士でない者は、報酬を得て業として官公署に提出する書類を作成することはできないが、「手数料」や「会費」の名目で金銭を受け取る場合は報酬に当たらないので、行うことができる。"],
    a:1, ex:["保存期間は「2年間」です（9条2項）。",
       "11条のとおりです。",
       "行政書士でなくなった後も、秘密を守る義務を負います（12条後段）。",
       "事務所の見やすい場所に報酬の額を掲示しなければなりません（10条の2第1項）。",
       "「いかなる名目によるかを問わず」報酬を得て業として行うことはできません（19条1項）。令和8年1月施行の改正で明記されました。"],
    e:"数字（帳簿の保存は2年）、期間の延長（守秘義務は行政書士でなくなった後も）、名目のすり替え（19条1項）がよく狙われます。", art:"行政書士法9条2項・10条の2第1項・11条・12条・19条1項" },
  { id:"gy-i5", trap:true, sub:"基礎知識", topic:"個人情報保護法（安全管理・漏えい報告・本人の請求）", q:"個人情報の保護に関する法律に関する次の記述のうち、誤っているものはどれか。",
    c:["個人情報取扱事業者は、その取り扱う個人データの漏えい、滅失または毀損の防止その他の個人データの安全管理のために必要かつ適切な措置を講じなければならない。",
       "個人情報取扱事業者は、個人の権利利益を害するおそれが大きい個人データの漏えい等として個人情報保護委員会規則で定めるものが生じたときは、委託を受けた者が委託元に通知した場合などを除き、その旨を個人情報保護委員会に報告しなければならない。",
       "個人情報取扱事業者は、本人から保有個人データの開示の請求を受けたときは、遅滞なく開示しなければならないが、本人または第三者の生命、身体、財産その他の権利利益を害するおそれがある場合などは、その全部または一部を開示しないことができる。",
       "個人情報保護委員会は、内閣総理大臣の所轄に属する。",
       "保有個人データが本人の同意なく利用目的の達成に必要な範囲を超えて取り扱われている場合であっても、本人は、個人情報取扱事業者に対してその利用の停止を請求することはできず、個人情報保護委員会に申し出ることができるだけである。"],
    a:4, ex:["23条のとおりです。",
       "26条1項のとおりです。本人への通知も必要です（同条2項）。",
       "33条1項・2項のとおりです。",
       "130条2項のとおりです。",
       "18条（利用目的による制限）に違反して取り扱われているときは、本人は利用の停止または消去を請求できます（35条1項）。"],
    e:"本人の請求（開示33条・訂正等34条・利用停止等35条）は、事業者に直接できる権利です。「委員会に申し出るだけ」とする肢は誤りです。", art:"個人情報保護法23条・26条1項・33条1項・2項・35条1項・130条2項" },
  { id:"gy-g14", sub:"行政法", topic:"行政手続法（意見公募手続）", q:"行政手続法が定める意見公募手続に関する次の記述のうち、妥当なものはどれか。",
    c:["命令等制定機関は、命令等を定めようとする場合には、その案と関連する資料をあらかじめ公示し、意見提出期間を定めて広く一般の意見を求めなければならず、その期間は公示の日から起算して30日以上でなければならない。",
       "意見公募手続の対象となる「命令等」には、国会が制定する法律も含まれる。",
       "意見公募手続で意見を提出できるのは、その命令等について利害関係を有する者に限られる。",
       "命令等制定機関は、提出された意見を、命令等を定めるに当たって考慮する必要はない。",
       "地方公共団体の機関が規則を定める行為にも、行政手続法の意見公募手続の規定が適用される。"],
    a:0, ex:["39条1項・3項のとおりです。",
       "「命令等」は、法律に基づく命令（政令・省令など）・規則、審査基準、処分基準、行政指導指針をいいます（2条8号）。法律は含まれません。",
       "「広く一般の意見」を求める手続で、誰でも意見を提出できます（39条1項）。",
       "提出意見は「十分に考慮しなければならない」とされています（42条）。",
       "地方公共団体の機関が命令等を定める行為は、適用除外です（3条3項）。地方公共団体は、法の趣旨にのっとり必要な措置を講ずるよう努めます（46条）。"],
    e:"行政手続法は、地方公共団体の機関について「条例・規則に根拠がある処分」「行政指導」「届出（条例・規則に根拠）」「命令等を定める行為」を適用除外にしています（3条3項）。", art:"行政手続法2条8号・3条3項・39条1項・3項・42条・46条" },
  { id:"gy-g15", sub:"行政法", topic:"行政不服審査法（執行停止）", q:"行政不服審査法が定める執行停止に関する次の記述のうち、誤っているものはどれか。",
    c:["審査請求は、処分の効力、処分の執行または手続の続行を妨げない。",
       "処分庁の上級行政庁または処分庁である審査庁は、必要があると認める場合には、審査請求人の申立てによりまたは職権で、執行停止をすることができる。",
       "審査請求人の申立てがあった場合において、処分により生ずる重大な損害を避けるために緊急の必要があると認めるときは、審査庁は、公共の福祉に重大な影響を及ぼすおそれがあるときなどを除き、執行停止をしなければならない。",
       "執行停止の申立てがあったときは、審査庁は、速やかに、執行停止をするかどうかを決定しなければならない。",
       "処分庁の上級行政庁でも処分庁でもない審査庁も、必要があると認める場合には、職権で執行停止をすることができる。"],
    a:4, ex:["25条1項のとおりです（執行不停止の原則）。",
       "25条2項のとおりです。",
       "25条4項のとおりです。",
       "25条7項のとおりです。",
       "上級行政庁でも処分庁でもない審査庁は、審査請求人の「申立て」により、処分庁の意見を聴取した上でなければ執行停止ができず、職権ではできません。また、効力・執行・続行の停止以外の措置はとれません（25条3項）。"],
    e:"行政不服審査法の執行停止は「職権でもできる」場合がある点が、裁判所の執行停止（行政事件訴訟法25条、申立てが必要）との違いです。", art:"行政不服審査法25条1項〜4項・7項" },
  { id:"gy-g16", sub:"行政法", topic:"情報公開法", q:"行政機関の保有する情報の公開に関する法律（情報公開法）に関する次の記述のうち、妥当なものはどれか。",
    c:["何人も、行政機関の長に対し、その行政機関の保有する行政文書の開示を請求することができる。",
       "開示請求をすることができるのは、日本国籍を有する者に限られる。",
       "開示決定等は、原則として、開示請求があった日から60日以内にしなければならない。",
       "開示決定等の期間は、事務処理上の困難その他正当な理由があっても延長することができない。",
       "開示請求に対し、文書があるかないかを答えるだけで不開示情報を開示することになる場合でも、行政機関の長は、必ず文書の存否を明らかにしなければならない。"],
    a:0, ex:["3条のとおりです。",
       "「何人も」請求でき、外国人や法人も請求できます（3条）。",
       "原則30日以内です（10条1項）。",
       "正当な理由があるときは、30日以内に限り延長できます（10条2項）。",
       "存否を明らかにしないで開示請求を拒否できます（存否応答拒否、8条）。"],
    e:"情報公開法の数字：決定は30日以内、延長は30日以内。不開示情報を除いて開示できるときは部分開示が義務です（6条1項）。", art:"情報公開法3条・6条1項・8条・10条" },
  { id:"gy-g17", sub:"行政法", topic:"地方自治法（条例と規則）", q:"地方自治法が定める条例および規則に関する次の記述のうち、妥当なものはどれか。",
    c:["普通地方公共団体は、法令に特別の定めがあるものを除くほか、条例中に、条例に違反した者に対し、2年以下の拘禁刑、100万円以下の罰金、拘留、科料もしくは没収の刑または5万円以下の過料を科する旨の規定を設けることができる。",
       "普通地方公共団体は、地域の実情に応じて必要があれば、法令に違反する内容の条例を制定することもできる。",
       "普通地方公共団体の長は、規則中に、規則に違反した者に対し、罰金を科する旨の規定を設けることができる。",
       "普通地方公共団体が義務を課し、または権利を制限するには、法令に特別の定めがある場合を除き、長の定める規則によれば足りる。",
       "地方税の賦課徴収に関する条例についても、住民は、条例の制定または改廃の直接請求をすることができる。"],
    a:0, ex:["14条3項のとおりです（2025年6月から「懲役・禁錮」は「拘禁刑」に）。",
       "条例は「法令に違反しない限りにおいて」制定できます（14条1項。憲法94条は「法律の範囲内で」）。",
       "規則で科すことができるのは、5万円以下の過料だけです（15条2項）。",
       "義務を課し、または権利を制限するには、条例によらなければなりません（14条2項）。",
       "地方税の賦課徴収、分担金・使用料・手数料の徴収に関する条例は、直接請求の対象外です（74条1項）。"],
    e:"条例は刑罰も過料も置けるが、規則は5万円以下の過料だけ。この違いは毎年のように問われます。", art:"地方自治法14条・15条2項・74条1項・憲法94条" },
  { id:"gy-m10", sub:"民法", topic:"契約の解除", q:"契約の解除に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["債務の全部の履行が不能であるときは、債権者は、催告をすることなく、直ちに契約の解除をすることができる。",
       "債務不履行を理由に契約を解除するには、債務者に帰責事由があることが必要である。",
       "催告をして相当の期間が経過した時における債務の不履行が、その契約および取引上の社会通念に照らして軽微であっても、債権者は契約を解除することができる。",
       "債務の不履行が債権者の責めに帰すべき事由によるものであるときでも、債権者は契約を解除することができる。",
       "契約が解除されたときは、各当事者は原状回復義務を負い、その効果は第三者の権利を害する場合にも及ぶ。"],
    a:0, ex:["542条1項1号のとおりです。",
       "2020年施行の改正で、解除に債務者の帰責事由は不要になりました（541条・542条）。損害賠償とは違います。",
       "不履行が軽微であるときは解除できません（541条ただし書）。",
       "債権者の責めに帰すべき事由によるときは解除できません（543条）。",
       "解除は第三者の権利を害することができません（545条1項ただし書）。"],
    e:"解除は「債務者を責めるため」ではなく「債権者を契約から解放するため」の制度。だから債務者の帰責事由は不要で、債権者に帰責事由があると解除できません。", art:"民法541条・542条1項・543条・545条1項" },
  { id:"gy-m11", sub:"民法", topic:"抵当権", q:"抵当権に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["抵当権は、不動産のほか、地上権および永小作権にも設定することができる。",
       "抵当権は、目的物の賃貸によって債務者が受けるべき金銭（賃料）に対しても行使することができるが、抵当権者は、その払渡しまたは引渡しの前に差押えをしなければならない。",
       "土地とその上の建物が同一の所有者に属する場合に、土地または建物に抵当権が設定され、その実行により所有者が異なるに至ったときは、その建物について地上権が設定されたものとみなされる。",
       "抵当権者は、利息を請求する権利を有するときは、原則として、その満期となった最後の2年分についてのみ、抵当権を行使することができる。",
       "抵当権を設定した者は、抵当権の設定後は、その不動産を自ら使用することも、第三者に賃貸することもできなくなる。"],
    a:4, ex:["369条のとおりです。",
       "372条が304条1項を準用しています（物上代位）。",
       "388条のとおりです（法定地上権）。",
       "375条1項のとおりです。",
       "抵当権は、目的物の占有を設定者に残したまま優先弁済を受ける権利です（369条1項）。設定者は引き続き使用・収益・賃貸ができます。"],
    e:"抵当権は「占有を移さない担保」。使用収益は設定者に残り、債務不履行があったときに競売などで優先弁済を受けます。", art:"民法304条・369条・372条・375条・388条" },
  { id:"gy-m12", sub:"民法", topic:"共有", q:"共有に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["各共有者は、共有物の全部について、その持分に応じた使用をすることができる。",
       "各共有者は、他の共有者の同意がなくても、共有物の保存行為をすることができる。",
       "共有物の管理に関する事項は、各共有者の持分の価格に従い、その過半数で決する。",
       "各共有者は、他の共有者の同意を得なければ、共有物に変更（その形状または効用の著しい変更を伴わないものを除く。）を加えることができない。",
       "各共有者はいつでも共有物の分割を請求することができ、分割をしない旨の契約をすることは一切できない。"],
    a:4, ex:["249条1項のとおりです。",
       "252条5項のとおりです。",
       "252条1項のとおりです。",
       "251条1項のとおりです。形状・効用の著しい変更を伴わない軽微な変更は、管理と同じく持分の過半数で決められます（2023年施行の改正）。",
       "5年を超えない期間内は分割をしない旨の契約をすることができます（256条1項ただし書）。"],
    e:"共有の意思決定：保存＝各自単独、管理（軽微な変更を含む）＝持分の過半数、変更＝全員の同意。", art:"民法249条1項・251条1項・252条1項・5項・256条1項" },
  { id:"gy-g18", sub:"行政法", topic:"行政手続法（処分等の求め・届出）", q:"行政手続法が定める処分等の求めおよび届出に関する次の記述のうち、妥当なものはどれか。",
    c:["処分等の求めをすることができるのは、法令違反の事実によって直接に権利を侵害されている者に限られる。",
       "処分等の求めの対象となる行政指導には、その根拠となる規定が条例にのみ置かれているものも含まれる。",
       "処分等の求めは、口頭ですることもでき、申出書を提出する必要はない。",
       "処分等の求めを受けた行政庁または行政機関は、必要な調査を行い、その結果に基づき必要があると認めるときは、その処分または行政指導をしなければならない。",
       "届出が法令に定められた形式上の要件に適合していても、行政庁がこれを受理するまでは、届出をすべき手続上の義務は履行されたことにならない。"],
    a:3, ex:["「何人も」求めることができます（36条の3第1項）。",
       "対象の行政指導は「その根拠となる規定が法律に置かれているものに限る」とされています（36条の3第1項）。",
       "申出書を提出してしなければなりません（36条の3第2項）。",
       "36条の3第3項のとおりです。",
       "形式上の要件に適合していれば、提出先とされる機関の事務所に到達したときに義務が履行されたものとされます（37条）。「受理」は要りません。"],
    e:"36条の2（行政指導の中止等の求め）は行政指導の相手方がするもの、36条の3（処分等の求め）は「何人も」できるもの、という違いがよく問われます。", art:"行政手続法36条の2・36条の3・37条" },
  { id:"gy-g19", trap:true, sub:"行政法", topic:"行政不服審査法（審査請求期間・教示）", q:"行政不服審査法が定める審査請求期間および教示に関する次の記述のうち、誤っているものはどれか。なお、再調査の請求はしていないものとする。",
    c:["処分についての審査請求は、正当な理由があるときを除き、処分があったことを知った日の翌日から起算して3月を経過したときは、することができない。",
       "処分についての審査請求は、正当な理由があるときを除き、処分があった日の翌日から起算して1年を経過したときは、することができない。",
       "行政庁は、審査請求をすることができる処分を書面でする場合には、処分の相手方に対し、不服申立てをすることができる旨、不服申立てをすべき行政庁および不服申立てをすることができる期間を書面で教示しなければならない。",
       "行政庁が必要な教示をしなかった場合には、その処分に不服がある者は、その処分庁に不服申立書を提出することができる。",
       "処分を口頭でする場合であっても、行政庁は、処分の相手方に対し、不服申立てに関する事項を書面で教示しなければならない。"],
    a:4, ex:["18条1項のとおりです（再調査の請求をしたときは、その決定を知った日の翌日から1月）。",
       "18条2項のとおりです。",
       "82条1項本文のとおりです。",
       "83条1項のとおりです。処分庁以外の行政庁に審査請求できる処分なら、処分庁が速やかにその行政庁へ送付し、初めからそこに審査請求があったものとみなされます（同条3項・4項）。",
       "処分を口頭でする場合は、相手方への書面による教示の義務はありません（82条1項ただし書）。ただし、利害関係人から求められたときは教示しなければなりません（82条2項）。"],
    e:"利害関係人から求められたときは、処分が不服申立てできるものか、できる場合の行政庁と期間を教示しなければなりません（82条2項）。", art:"行政不服審査法18条1項・2項・82条・83条" },
  { id:"gy-g20", trap:true, sub:"行政法", topic:"行政事件訴訟法（被告と出訴期間）", q:"取消訴訟の被告および出訴期間に関する次の記述のうち、妥当なものはどれか。",
    c:["国の行政庁がした処分の取消訴訟は、その処分をした行政庁を被告として提起しなければならない。",
       "審査請求をしていない場合、取消訴訟は、正当な理由があるときを除き、処分があったことを知った日から6箇月を経過したときは、提起することができない。",
       "取消訴訟は、正当な理由があるときを除き、処分の日から3年を経過したときは、提起することができない。",
       "処分について審査請求をした場合でも、取消訴訟の出訴期間は、処分があったことを知った日から起算する。",
       "処分をした行政庁が国または公共団体に所属しない場合には、取消訴訟は、その事務の帰属する国を被告として提起しなければならない。"],
    a:1, ex:["行政庁の所属する国が被告です（11条1項1号）。訴状には処分をした行政庁も記載します（同条4項）。",
       "14条1項のとおりです。",
       "処分の日から「1年」です（14条2項）。",
       "審査請求をしたときは、その者については、裁決があったことを知った日から6箇月・裁決の日から1年が基準になります（14条3項）。",
       "国や公共団体に所属しない行政庁（指定法人など）の処分は、その行政庁が被告です（11条2項）。"],
    e:"被告とすべき国・公共団体・行政庁がない場合は、事務の帰属する国または公共団体が被告です（11条3項）。", art:"行政事件訴訟法11条・14条" },
  { id:"gy-g21", sub:"行政法", topic:"地方自治法（住民訴訟）", q:"地方自治法が定める住民訴訟に関する次の記述のうち、妥当なものはどれか。",
    c:["住民訴訟は、住民監査請求をしていなくても提起することができる。",
       "住民訴訟では、執行機関または職員に対し、違法な財務会計上の行為の全部または一部の差止めを請求することができる。",
       "住民訴訟は、監査の結果の通知があった日から6箇月以内に提起しなければならない。",
       "その普通地方公共団体の住民でなくても、利害関係を有する者であれば住民訴訟を提起することができる。",
       "住民訴訟では、住民は、違法な行為をした職員に対し、自分へ直接に損害賠償を支払うよう請求することができる。"],
    a:1, ex:["住民監査請求をした住民だけが提起できます（監査請求前置。242条の2第1項）。",
       "242条の2第1項1号のとおりです。",
       "監査の結果の通知があった日から「30日以内」です（242条の2第2項1号）。",
       "提起できるのは、住民監査請求をした「住民」です（242条の2第1項）。",
       "4号請求は、職員などに損害賠償等を請求することを、執行機関または職員に対して求める訴えです（242条の2第1項4号）。住民が自分に払わせるものではありません。"],
    e:"住民訴訟の4類型：1号 差止め、2号 処分の取消し・無効確認、3号 怠る事実の違法確認、4号 損害賠償・不当利得返還の請求をすることの義務付け。", art:"地方自治法242条・242条の2第1項・2項" },
  { id:"gy-m13", sub:"民法", topic:"債務不履行による損害賠償", q:"債務不履行による損害賠償に関する次の記述のうち、誤っているものはどれか。",
    c:["債務の不履行が、契約その他の債務の発生原因および取引上の社会通念に照らして債務者の責めに帰することができない事由によるものであるときは、債権者は損害賠償を請求できない。",
       "債務者がその債務の履行を拒絶する意思を明確に表示したときは、債権者は、債務の履行に代わる損害賠償を請求することができる。",
       "特別の事情によって生じた損害であっても、当事者がその事情を予見すべきであったときは、債権者はその賠償を請求することができる。",
       "金銭債務の不履行による損害賠償については、債権者は、損害の証明をすることを要しない。",
       "金銭債務の不履行について、債務者は、それが不可抗力によるものであることを証明すれば、損害賠償の責任を免れる。"],
    a:4, ex:["415条1項ただし書のとおりです。",
       "415条2項2号のとおりです（1号 履行不能、3号 契約の解除・解除権の発生も同じ）。",
       "416条2項のとおりです。",
       "419条2項のとおりです。",
       "金銭債務では、債務者は不可抗力をもって抗弁とすることができません（419条3項）。"],
    e:"当事者は損害賠償の額を予定することができ、違約金は賠償額の予定と推定されます（420条1項・3項）。", art:"民法415条・416条・419条・420条" },
  { id:"gy-m14", sub:"民法", topic:"遺言", q:"遺言に関する次の記述のうち、妥当なものはどれか。",
    c:["自筆証書遺言に相続財産の目録を一体のものとして添付する場合、その目録も遺言者が自書しなければならない。",
       "遺言者は、いつでも、遺言の方式に従って、その遺言の全部または一部を撤回することができる。",
       "前の遺言と後の遺言とが抵触するときは、その抵触する部分については、前の遺言が効力を有する。",
       "公正証書による遺言も、相続の開始後、家庭裁判所の検認を受けなければならない。",
       "自筆証書遺言の加除その他の変更は、変更の場所に印を押せば、変更した旨の付記や署名がなくても効力を生ずる。"],
    a:1, ex:["目録は自書しなくてよく、その毎葉に署名し印を押せば足ります（968条2項）。",
       "1022条のとおりです。",
       "抵触する部分は、後の遺言で前の遺言を撤回したものとみなされます（1023条1項）。",
       "公正証書遺言には、検認の規定は適用されません（1004条2項）。",
       "場所を指示し、変更した旨を付記して特に署名し、かつ変更の場所に印を押さなければ効力を生じません（968条3項）。"],
    e:"自筆証書遺言は「全文・日付・氏名を自書し、印を押す」（968条1項）。目録だけは自書でなくてよい、という改正点が狙われます。", art:"民法968条・1004条・1022条・1023条" },
  { id:"gy-c4", sub:"憲法", topic:"財政", q:"日本国憲法が定める財政に関する次の記述のうち、妥当なものはどれか。",
    c:["内閣は、毎会計年度の予算を作成し、国会に提出して、その審議を受け議決を経なければならない。",
       "予見し難い予算の不足に充てるため、内閣は、国会の議決に基づかずに、その判断で予備費を設けることができる。",
       "予備費の支出については、内閣は、事前に国会の承諾を得なければならない。",
       "国の収入支出の決算は、内閣が自ら検査し、その検査報告とともに国会に提出する。",
       "あらたに租税を課すには法律によることが必要であり、法律の定める条件によって課すことは許されない。"],
    a:0, ex:["86条のとおりです。",
       "予備費は「国会の議決に基いて」設けます（87条1項）。",
       "国会の承諾は「事後に」得ます（87条2項）。",
       "決算は会計検査院が検査し、内閣が次の年度にその検査報告とともに国会に提出します（90条1項）。",
       "「法律又は法律の定める条件による」とされています（84条、租税法律主義）。"],
    e:"公金を宗教上の組織・団体のためや、公の支配に属しない慈善・教育・博愛の事業に支出することは禁止されています（89条）。", art:"日本国憲法84条・86条・87条・89条・90条" },
  { id:"gy-c5", trap:true, sub:"憲法", topic:"地方自治・憲法改正", q:"日本国憲法が定める地方自治および憲法改正に関する次の記述のうち、誤っているものはどれか。",
    c:["地方公共団体の長、その議会の議員および法律の定めるその他の吏員は、その地方公共団体の住民が、直接これを選挙する。",
       "地方公共団体は、法律の範囲内で条例を制定することができる。",
       "一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その住民の投票においてその過半数の同意を得なければ、国会はこれを制定することができない。",
       "憲法の改正は、各議院の出席議員の3分の2以上の賛成で、国会がこれを発議する。",
       "憲法改正について国民の承認を経たときは、天皇は、国民の名で、この憲法と一体を成すものとして、直ちにこれを公布する。"],
    a:3, ex:["93条2項のとおりです。",
       "94条のとおりです。",
       "95条のとおりです（地方自治特別法の住民投票）。",
       "「出席議員」ではなく「総議員」の3分の2以上です（96条1項）。",
       "96条2項のとおりです。"],
    e:"「総議員の3分の2」（憲法改正の発議）と「出席議員の3分の2」（議員の除名・秘密会・衆議院の再可決など）の区別がよく問われます。", art:"日本国憲法93条・94条・95条・96条" },
  { id:"gy-s3", sub:"商法", topic:"株式会社の設立", q:"株式会社の設立に関する次の記述のうち、会社法の規定に照らし、妥当なものはどれか。",
    c:["発起人が作成した定款は、公証人の認証を受けなくても、その効力を生ずる。",
       "株式会社は、定款について公証人の認証を受けた時に成立する。",
       "各発起人は、株式会社の設立に際し、設立時発行株式を1株以上引き受けなければならない。",
       "募集設立の場合には、発起人は、設立時発行株式を引き受ける必要はない。",
       "定款は書面で作成しなければならず、電磁的記録で作成することはできない。"],
    a:2, ex:["公証人の認証を受けなければ効力を生じません（30条1項）。",
       "本店の所在地で設立の登記をすることによって成立します（49条）。",
       "25条2項のとおりです。",
       "25条2項は発起設立・募集設立のどちらにも当てはまります。発起人は必ず1株以上引き受けます。",
       "電磁的記録で作成することもできます（26条2項）。"],
    e:"発起設立は発起人が設立時発行株式の全部を引き受ける方法、募集設立は発起人が引き受けるほか、引き受ける者を募集する方法です（25条1項）。", art:"会社法25条・26条・30条1項・49条" },
  { id:"gy-g22", trap:true, sub:"行政法", topic:"不服申立てと取消訴訟の期間", q:"不服申立てと取消訴訟の期間に関する次の記述のうち、誤っているものはどれか。なお、いずれも正当な理由はないものとし、審査請求については再調査の請求をしていないものとする。",
    c:["処分についての審査請求は、処分があったことを知った日の翌日から起算して3月を経過したときは、することができない。",
       "再調査の請求は、処分があったことを知った日の翌日から起算して3月を経過したときは、することができない。",
       "再審査請求は、原裁決があったことを知った日の翌日から起算して3月を経過したときは、することができない。",
       "審査請求をしていない場合、取消訴訟は、処分があったことを知った日から6箇月を経過したときは、提起することができない。",
       "審査請求と再調査の請求は処分があった日の翌日から起算して、取消訴訟は審査請求をしていない場合に処分の日から、それぞれ1年を経過したときは、することができない。"],
    a:2, ex:["行政不服審査法18条1項のとおりです。",
       "行政不服審査法54条1項のとおりです。",
       "再審査請求は「1月」です（行政不服審査法62条1項）。原裁決があった日の翌日から1年でもできなくなります（同条2項）。",
       "行政事件訴訟法14条1項のとおりです。審査請求をしたときは、裁決を知った日から6箇月・裁決の日から1年が基準です（同条3項）。",
       "行政不服審査法18条2項・54条2項、行政事件訴訟法14条2項のとおりです。"],
    e:"覚え方：審査請求・再調査の請求は「3月」、再審査請求だけ「1月」、取消訴訟は「6箇月」。客観的な期間はどれも「1年」です。", art:"行政不服審査法18条・54条・62条、行政事件訴訟法14条" },
  { id:"gy-g23", trap:true, sub:"行政法", topic:"聴聞と弁明の機会の付与", q:"行政手続法が定める聴聞と弁明の機会の付与に関する次の記述のうち、妥当なものはどれか。",
    c:["許認可等を取り消す不利益処分をしようとするときは、弁明の機会の付与の手続をとらなければならない。",
       "名あて人の資格または地位を直接にはく奪する不利益処分をしようとするときは、弁明の機会の付与の手続で足りる。",
       "弁明は、行政庁が口頭ですることを認めたときを除き、弁明書を提出してするものとされている。",
       "聴聞をしなければならない場合に当たらない不利益処分については、行政庁が相当と認めるときであっても、聴聞をすることはできない。",
       "弁明をするときは、証拠書類等を提出することはできない。"],
    a:2, ex:["許認可等の取消しは「聴聞」です（13条1項1号イ）。",
       "資格・地位の直接のはく奪も「聴聞」です（13条1項1号ロ）。",
       "29条1項のとおりです（弁明は書面が原則）。",
       "行政庁が相当と認めるときは、聴聞をすることができます（13条1項1号ニ）。",
       "証拠書類等を提出することができます（29条2項）。"],
    e:"重い処分（許認可の取消し、資格・地位のはく奪など）は聴聞、それ以外は弁明の機会の付与（13条1項2号）。弁明は書面が原則です。", art:"行政手続法13条1項・29条" },
  { id:"gy-g24", trap:true, sub:"行政法", topic:"執行停止（訴訟と審査請求の違い）", q:"執行停止に関する次の記述のうち、誤っているものはどれか。",
    c:["処分の取消しの訴えの提起は、処分の効力、処分の執行または手続の続行を妨げない。",
       "取消訴訟における執行停止は、裁判所が、申立てにより、決定をもってする。",
       "取消訴訟における執行停止は、裁判所が必要と認めるときは、職権ですることもできる。",
       "審査請求において、処分庁の上級行政庁である審査庁は、必要があると認める場合には、職権で執行停止をすることができる。",
       "取消訴訟で執行停止の申立てがあった場合、内閣総理大臣は裁判所に異議を述べることができ、異議があったときは、裁判所は執行停止をすることができない。"],
    a:2, ex:["行政事件訴訟法25条1項のとおりです（執行不停止の原則）。",
       "行政事件訴訟法25条2項のとおりです。",
       "取消訴訟の執行停止は「申立てにより」するもので、職権ではできません（行政事件訴訟法25条2項）。",
       "行政不服審査法25条2項のとおりです。審査請求では、上級行政庁・処分庁である審査庁は職権でもできます。",
       "行政事件訴訟法27条1項・4項のとおりです。"],
    e:"裁判所は職権で執行停止できない、審査庁（上級行政庁・処分庁）は職権でもできる。この違いがよく狙われます。", art:"行政事件訴訟法25条・27条、行政不服審査法25条" },
  { id:"gy-g25", trap:true, sub:"行政法", topic:"国家賠償法1条と2条の違い", q:"国家賠償法1条と2条に関する次の記述のうち、妥当なものはどれか。",
    c:["2条の責任は、条文上、営造物の設置・管理者に故意または過失があることが要件とされている。",
       "1条により賠償した国または公共団体は、公務員に故意または過失があれば、常にその公務員に求償することができる。",
       "2条により賠償した国または公共団体は、他に損害の原因について責に任ずべき者があるときは、これに対して求償権を有する。",
       "2条の「公の営造物」は、道路と河川に限られる。",
       "1条は、公務員が職務と無関係に行った行為によって生じた損害にも適用される。"],
    a:2, ex:["2条1項は「設置又は管理に瑕疵があつた」ことを要件とし、故意・過失は要件にしていません。",
       "求償できるのは、公務員に「故意又は重大な過失」があったときです（1条2項）。",
       "2条2項のとおりです。",
       "「道路、河川その他の公の営造物」です（2条1項）。道路・河川は例示です。",
       "公務員が「その職務を行うについて」加えた損害が対象です（1条1項）。"],
    e:"1条は「故意又は過失」が要件、2条は「瑕疵」が要件。求償は、1条が公務員の故意・重過失、2条が他に責任のある者に対して、です。", art:"国家賠償法1条・2条" },
  { id:"gy-c6", trap:true, sub:"憲法", topic:"国会の議決・定足数の数字", q:"日本国憲法が定める国会の議事・議決に関する次の記述のうち、妥当なものはどれか。",
    c:["両議院は、各々その出席議員の3分の1以上の出席がなければ、議事を開き議決することができない。",
       "議員を除名するには、総議員の3分の2以上の多数による議決を必要とする。",
       "両議院の会議は公開とするが、出席議員の3分の2以上の多数で議決したときは、秘密会を開くことができる。",
       "衆議院で可決し、参議院でこれと異なった議決をした法律案は、衆議院で総議員の3分の2以上の多数で再び可決したときは、法律となる。",
       "いずれかの議院の出席議員の4分の1以上の要求があれば、内閣は、臨時会の召集を決定しなければならない。"],
    a:2, ex:["定足数は「総議員」の3分の1以上です（56条1項）。",
       "除名は「出席議員」の3分の2以上です（58条2項）。",
       "57条1項のとおりです。",
       "再可決は「出席議員」の3分の2以上です（59条2項）。",
       "臨時会の要求は「総議員」の4分の1以上です（53条）。"],
    e:"「総議員」：定足数3分の1・臨時会4分の1・憲法改正の発議3分の2。「出席議員」：通常の議決は過半数、除名・秘密会・法律案の再可決は3分の2。", art:"日本国憲法53条・56条・57条・58条2項・59条2項・96条1項" },
  { id:"gy-m15", trap:true, sub:"民法", topic:"意思表示の無効・取消しと第三者", q:"意思表示の無効・取消しと第三者に関する次の記述のうち、妥当なものはどれか。",
    c:["心裡留保による意思表示の無効は、善意でかつ過失がない第三者に限り、対抗することができない。",
       "相手方と通じてした虚偽の意思表示の無効は、善意の第三者に対抗することができない。",
       "錯誤による意思表示の取消しは、善意の第三者であれば、過失があっても対抗することができない。",
       "強迫による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。",
       "相手方に対する意思表示について第三者が詐欺を行った場合、相手方がその事実を知らなかったときは、知ることができたとしても、取り消すことができない。"],
    a:1, ex:["心裡留保は「善意の第三者」です（93条2項）。過失は問いません。",
       "94条2項のとおりです。",
       "錯誤は「善意でかつ過失がない第三者」です（95条4項）。",
       "第三者保護の規定（96条3項）は詐欺だけです。強迫による取消しは、善意無過失の第三者にも対抗できます。",
       "相手方が「知り、又は知ることができたとき」は取り消せます（96条2項）。"],
    e:"第三者の保護：心裡留保・虚偽表示は「善意」、錯誤・詐欺は「善意無過失」、強迫は保護なし。", art:"民法93条・94条・95条4項・96条" },
  { id:"gy-m16", trap:true, sub:"民法", topic:"消滅時効の期間", q:"消滅時効の期間に関する次の記述のうち、誤っているものはどれか。",
    c:["債権は、債権者が権利を行使することができることを知った時から5年間行使しないときは、時効によって消滅する。",
       "債権は、権利を行使することができる時から10年間行使しないときは、時効によって消滅する。",
       "人の生命または身体の侵害による損害賠償請求権は、権利を行使することができる時から20年間行使しないときに、時効によって消滅する。",
       "不法行為による損害賠償請求権は、被害者またはその法定代理人が損害および加害者を知った時から3年間行使しないとき、または不法行為の時から20年間行使しないときは、時効によって消滅する。",
       "人の生命または身体を害する不法行為による損害賠償請求権も、損害および加害者を知った時から3年間行使しないときは、時効によって消滅する。"],
    a:4, ex:["166条1項1号のとおりです。",
       "166条1項2号のとおりです。",
       "167条のとおりです（10年が20年になる）。",
       "724条のとおりです。",
       "生命・身体の侵害は「5年間」です（724条の2）。"],
    e:"生命・身体の侵害は、債務不履行でも不法行為でも「知った時から5年・権利行使できる時（不法行為の時）から20年」にそろいます。", art:"民法166条1項・167条・724条・724条の2" },
  { id:"gy-g26", trap:true, sub:"行政法", topic:"行政事件訴訟の類型", q:"行政事件訴訟法が定める訴訟の類型に関する次の記述のうち、妥当なものはどれか。",
    c:["民衆訴訟とは、国または公共団体の機関相互間における権限の存否またはその行使に関する紛争についての訴訟をいう。",
       "機関訴訟とは、国または公共団体の機関の法規に適合しない行為の是正を求める訴訟で、選挙人たる資格その他自己の法律上の利益にかかわらない資格で提起するものをいう。",
       "民衆訴訟および機関訴訟は、法律に定める場合において、法律に定める者に限り、提起することができる。",
       "当事者訴訟には、公法上の法律関係に関する確認の訴えは含まれない。",
       "無効等確認の訴えは、処分の効力の有無を前提とする現在の法律関係に関する訴えによって目的を達することができる場合でも、提起することができる。"],
    a:2, ex:["これは「機関訴訟」の定義です（6条）。",
       "これは「民衆訴訟」の定義です（5条）。選挙の効力に関する訴訟などが例です。",
       "42条のとおりです。",
       "公法上の法律関係に関する確認の訴えも、当事者訴訟に含まれます（4条）。",
       "現在の法律関係に関する訴えで目的を達することができないものに限り、提起できます（36条）。判例は、これには、その訴えでは不利益を除けない場合だけでなく、無効確認の訴えの方がより直截的で適切な争訟形態といえる場合も含まれるとしています（最三小判平成4年9月22日・平成元年(行ツ)第131号・民集46巻6号1090頁）。この肢は、そうした限定なしに「目的を達することができる場合でも」提起できるとしているので誤りです。"],
    e:"民衆訴訟（5条）と機関訴訟（6条）の定義を入れ替えたひっかけがよく出ます。「自己の法律上の利益にかかわらない資格」＝民衆訴訟、「機関相互間の権限」＝機関訴訟。", art:"行政事件訴訟法4条・5条・6条・36条・42条" },
  { id:"gy-g27", sub:"行政法", topic:"行政不服審査法（審理員と行政不服審査会）", q:"行政不服審査法が定める審理員および行政不服審査会等への諮問に関する次の記述のうち、誤っているものはどれか。",
    c:["審査庁は、9条1項ただし書の例外（委員会等が審査庁である場合や、条例に基づく処分で条例に特別の定めがある場合）に当たる場合を除き、審査庁に所属する職員のうちから審理手続を行う者（審理員）を指名し、その旨を審査請求人および処分庁等（審査庁以外の処分庁等に限る）に通知しなければならない。",
       "審査請求に係る処分に関与した者は、審理員に指名することができない。",
       "審査請求人の配偶者、四親等内の親族または同居の親族は、審理員に指名することができない。",
       "審査庁が主任の大臣である場合には、原則として、行政不服審査会に諮問しなければならない。",
       "審査請求人から行政不服審査会等への諮問を希望しない旨の申出がされている場合には、参加人が諮問しないことに反対する旨の申出をしているときでも、諮問は不要である。"],
    a:4, ex:["9条1項本文のとおりです。例外に当たる場合を除く、と限定しているので正しい記述です。",
       "9条2項1号のとおりです。",
       "9条2項3号のとおりです。",
       "43条1項本文のとおりです（地方公共団体の長が審査庁なら、81条1項・2項の機関に諮問）。",
       "参加人が諮問しないことに反対する旨の申出をしているときは、この例外は使えません（43条1項4号）。"],
    e:"審理員が審理し（意見書を作成）、審査庁は原則として第三者機関（行政不服審査会等）に諮問してから裁決します。", art:"行政不服審査法9条・43条1項" },
  { id:"gy-g28", trap:true, sub:"行政法", topic:"地方自治法（長の不信任議決と議会の解散）", q:"地方自治法が定める普通地方公共団体の長の不信任議決に関する次の記述のうち、妥当なものはどれか。",
    c:["不信任の議決には、議員数の過半数の者が出席し、その3分の2以上の者の同意が必要である。",
       "長は、議長から不信任の議決の通知を受けた日から30日以内に、議会を解散することができる。",
       "不信任の議決には、議員数の3分の2以上の者が出席し、その4分の3以上の者の同意が必要である。",
       "議会が解散された後、初めて招集された議会で再び不信任の議決をするには、1回目と同じく出席者の4分の3以上の同意が必要である。",
       "長は、不信任の議決を受けても、議会を解散しない限り、その職を失うことはない。"],
    a:2, ex:["議員数の3分の2以上が出席し、その4分の3以上の同意です（178条3項）。",
       "「10日以内」です（178条1項）。",
       "178条3項のとおりです。",
       "解散後の2回目は、議員数の3分の2以上が出席し、その「過半数」の同意で足ります（178条3項）。",
       "10日以内に解散しないときは、その期間が経過した日に職を失います（178条2項）。"],
    e:"1回目：3分の2出席・4分の3同意。長は10日以内に解散できる。解散後の2回目：3分の2出席・過半数同意で長は失職。", art:"地方自治法178条" },
  { id:"gy-m17", sub:"民法", topic:"相殺", q:"相殺に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["相殺の意思表示には、条件または期限を付することができる。",
       "相殺の効力は、相殺の意思表示をした時から将来に向かって生ずる。",
       "時効によって消滅した債権がその消滅以前に相殺に適するようになっていた場合には、その債権者は、相殺をすることができる。",
       "悪意による不法行為に基づく損害賠償の債務の債務者は、相殺をもって債権者に対抗することができる。",
       "当事者が相殺を禁止する旨の意思表示をした場合、その意思表示は、善意の第三者に対しても常に対抗することができる。"],
    a:2, ex:["条件または期限を付することはできません（506条1項）。",
       "双方の債務が互いに相殺に適するようになった時にさかのぼって効力を生じます（506条2項）。",
       "508条のとおりです。",
       "悪意による不法行為に基づく損害賠償の債務の債務者は、相殺をもって対抗できません（509条1号）。",
       "第三者が知り、または重大な過失によって知らなかったときに限り対抗できます（505条2項）。"],
    e:"不法行為の加害者側から相殺できないのは「悪意による不法行為」と「人の生命・身体の侵害」の損害賠償債務です（509条）。", art:"民法505条・506条・508条・509条" },
  { id:"gy-m18", trap:true, sub:"民法", topic:"相続の承認と放棄", q:"相続の承認および放棄に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["相続人は、相続の開始の時から3箇月以内に、単純もしくは限定の承認または放棄をしなければならない。",
       "相続人が数人あるときは、各相続人は、単独で限定承認をすることができる。",
       "相続の放棄をしようとする者は、その旨を家庭裁判所に申述しなければならない。",
       "相続の放棄をした者の子は、放棄した者を代襲して相続人となる。",
       "相続人が相続財産の保存行為をしたときは、単純承認をしたものとみなされる。"],
    a:2, ex:["「自己のために相続の開始があったことを知った時から」3箇月以内です（915条1項）。家庭裁判所で伸長できます（同項ただし書）。",
       "限定承認は、共同相続人の全員が共同してのみすることができます（923条）。",
       "938条のとおりです。",
       "放棄した者は初めから相続人とならなかったものとみなされます（939条）。放棄は代襲原因ではありません。",
       "相続財産の処分は単純承認とみなされますが、保存行為は除かれます（921条1号ただし書）。"],
    e:"起算点は「相続開始の時」ではなく「自己のために相続の開始があったことを知った時」。限定承認は全員で、放棄は一人でできます。", art:"民法915条1項・921条・923条・938条・939条" },
  { id:"gy-s4", sub:"商法", topic:"取締役", q:"株式会社の取締役に関する次の記述のうち、会社法の規定に照らし、妥当なものはどれか。",
    c:["公開会社は、取締役が株主でなければならない旨を定款で定めることができる。",
       "取締役会設置会社においては、取締役は2人以上でなければならない。",
       "取締役の任期は、原則として、選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。",
       "公開会社でない株式会社（監査等委員会設置会社・指名委員会等設置会社を除く）は、定款で取締役の任期を選任後20年以内に伸長することができる。",
       "取締役は、正当な理由がなければ、株主総会の決議によって解任することができない。"],
    a:2, ex:["株主に限る定款の定めは、公開会社ではできません（331条2項。公開会社でない会社はできる）。",
       "取締役会設置会社の取締役は「3人以上」です（331条5項）。",
       "332条1項のとおりです。",
       "伸長できるのは「10年以内」までです（332条2項）。",
       "いつでも株主総会の決議で解任できます（339条1項）。正当な理由なく解任されたときは損害賠償を請求できます（同条2項）。"],
    e:"数字の整理：取締役会設置会社は取締役3人以上、任期は原則2年（非公開会社は定款で10年まで）。", art:"会社法331条・332条・339条" },
  { id:"gy-g29", trap:true, sub:"行政法", topic:"行政指導（「常に」のひっかけ）", q:"行政手続法が定める行政指導に関する次の記述のうち、誤っているものはどれか。",
    c:["行政指導に携わる者は、その相手方に対して、当該行政指導の趣旨および内容ならびに責任者を明確に示さなければならない。",
       "行政指導が口頭でされた場合において、その相手方から行政指導の趣旨・内容・責任者などを記載した書面の交付を求められたときは、その場で完了する行為を求めるものなどの例外に当たる場合を除き、行政指導に携わる者は、行政上特別の支障がない限り、これを交付しなければならない。",
       "同一の行政目的を実現するため一定の条件に該当する複数の者に対し行政指導をしようとするときは、行政機関は、あらかじめ、事案に応じ、行政指導指針を定め、かつ、行政上特別の支障がない限り、これを公表しなければならない。",
       "法令に違反する行為の是正を求める行政指導（その根拠となる規定が法律に置かれているもの）の相手方は、その行政指導が法律の要件に適合しないと思料するときは、弁明その他意見陳述のための手続を経てされたものであっても、常に、行政指導の中止その他必要な措置をとることを求めることができる。",
       "行政指導に携わる者は、その相手方が行政指導に従わなかったことを理由として、不利益な取扱いをしてはならない。"],
    a:3, ex:["35条1項のとおりです。",
       "35条3項・4項のとおりです。",
       "36条のとおりです。",
       "弁明その他意見陳述のための手続を経てされた行政指導は、中止等の求めの対象外です（36条の2第1項ただし書）。「常に」が誤り。",
       "32条2項のとおりです。"],
    e:"「常に」「必ず」「いかなる場合も」と言い切る肢は、ただし書の例外がないかを疑います。行政指導の中止等の求めは、法律に根拠がある是正の行政指導に限られ、意見陳述の手続を経たものは除かれます。", art:"行政手続法32条2項・35条・36条・36条の2第1項" },
  { id:"gy-g30", trap:true, sub:"行政法", topic:"行政不服審査法（総代と不服申立ての種類）", q:"行政不服審査法に関する次の記述のうち、誤っているものはどれか。",
    c:["法令に基づき行政庁に対して処分についての申請をした者は、当該申請から相当の期間が経過したにもかかわらず、行政庁の不作為がある場合には、当該不作為についての審査請求をすることができる。",
       "処分庁以外の行政庁に対して審査請求をすることができる処分について、法律に再調査の請求をすることができる旨の定めがあるときは、当該処分に不服がある者は、当該処分について審査請求をした場合を除き、処分庁に対して再調査の請求をすることができる。",
       "再審査請求は、法律に再審査請求をすることができる旨の定めがある場合にすることができる。",
       "多数人が共同して審査請求をしようとするときは、3人を超えない総代を互選することができる。",
       "総代は、各自、他の共同審査請求人のために、審査請求の取下げを含め、当該審査請求に関する一切の行為をすることができる。"],
    a:4, ex:["3条のとおりです。",
       "5条1項のとおりです（審査請求をしたときは再調査の請求はできません）。",
       "6条1項のとおりです。",
       "11条1項のとおりです。",
       "総代ができるのは、審査請求の取下げを「除き」一切の行為です（11条3項）。"],
    e:"「除き」と「含め」を入れ替えるのは定番のひっかけです。総代は取下げができず（11条3項）、代理人は特別の委任があるときに限り取下げができます（12条2項）。", art:"行政不服審査法3条・5条1項・6条1項・11条" },
  { id:"gy-g31", trap:true, sub:"行政法", topic:"情報公開法（「必ず」のひっかけ）", q:"行政機関の保有する情報の公開に関する法律（情報公開法）に関する次の記述のうち、誤っているものはどれか。",
    c:["何人も、行政機関の長に対し、当該行政機関の保有する行政文書の開示を請求することができる。",
       "開示決定等は、原則として開示請求があった日から30日以内にしなければならないが、事務処理上の困難その他正当な理由があるときは、30日以内に限り延長することができる。",
       "開示請求に係る行政文書の一部に不開示情報が記録されている場合において、不開示情報が記録されている部分を容易に区分して除くことができるときは、行政機関の長は、原則として、当該部分を除いた部分につき開示しなければならない。",
       "開示請求に対し、当該開示請求に係る行政文書が存在しているか否かを答えるだけで不開示情報を開示することとなるときは、行政機関の長は、当該行政文書の存否を明らかにしないで、当該開示請求を拒否することができる。",
       "開示決定等について審査請求があったときは、裁決をすべき行政機関の長（会計検査院の長を除く）は、審査請求が不適法で却下する場合であっても、必ず情報公開・個人情報保護審査会に諮問しなければならない。"],
    a:4, ex:["3条のとおりです。日本国民に限られません。",
       "10条1項・2項のとおりです。延長するときは、開示請求者に延長後の期間と理由を書面で通知します。",
       "6条1項のとおりです（残りの部分に有意の情報がないときは除きます）。",
       "8条のとおりです（グローマー拒否）。",
       "審査請求が不適法で却下するときや、全部を開示するとき（反対意見書が出ている場合を除く）は、諮問は不要です（19条1項）。「必ず」が誤り。"],
    e:"「何人も」（国籍を問わない）を「日本国民は」に変える肢や、「必ず諮問」と言い切る肢がよく出ます。", art:"情報公開法3条・6条1項・8条・10条・19条1項" },
  { id:"gy-m19", trap:true, sub:"民法", topic:"無権代理（催告・取消し・責任）", q:"無権代理に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["無権代理の相手方が、本人に対し、相当の期間を定めて追認をするかどうかを確答すべき旨の催告をした場合、本人がその期間内に確答をしないときは、追認をしたものとみなされる。",
       "無権代理人がした契約は、本人が追認をしない間は、相手方が取り消すことができるが、契約の時に代理権がないことを相手方が過失によって知らなかったときは、取り消すことができない。",
       "相手方が代理権のないことを過失によって知らなかったときは、無権代理人が自己に代理権がないことを知っていたときであっても、相手方は無権代理人の責任を追及することができない。",
       "無権代理人が行為能力の制限を受けていた場合であっても、本人の追認を得られなかったときは、相手方は無権代理人に対して履行または損害賠償の責任を追及することができる。",
       "本人が無権代理行為を追認したときは、別段の意思表示がない限り、契約の時にさかのぼってその効力を生ずるが、第三者の権利を害することはできない。"],
    a:4, ex:["確答がないときは、追認を「拒絶」したものとみなされます（114条）。",
       "取消しができないのは、相手方が代理権のないことを「知っていた」ときだけです（115条ただし書）。過失があっても取り消せます。",
       "無権代理人が自分に代理権がないことを知っていたときは、相手方に過失があっても責任を追及できます（117条2項2号ただし書）。",
       "無権代理人が行為能力の制限を受けていたときは、責任を追及できません（117条2項3号）。",
       "116条のとおりです。"],
    e:"催告への無回答は「拒絶」（制限行為能力者の相手方の催告で「追認」とみなされる場合がある20条と混同しやすい）。取消権は善意なら過失があっても使えるが、無権代理人の責任は善意無過失が原則、という違いが狙われます。", art:"民法114条・115条・116条・117条" },
  { id:"gy-m20", trap:true, sub:"民法", topic:"保証（原則と例外の入れ替え）", q:"保証に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["保証契約は、書面（またはその内容を記録した電磁的記録）でしなければ、その効力を生じない。",
       "保証人が主たる債務者と連帯して債務を負担したときは、債権者から請求を受けても、まず主たる債務者に催告をすべき旨を請求することはできない。",
       "保証人が法人でない根保証契約は、極度額を定めなければ、その効力を生じない。",
       "事業のために負担した貸金等債務を主たる債務とする保証契約は、保証人になろうとする者が個人である場合、主たる債務者の取締役などの例外に当たるときを除き、契約の締結の日前1箇月以内に作成された公正証書で保証債務を履行する意思を表示していなければ、その効力を生じない。",
       "債権者が保証人に債務の履行を請求したときは、保証人は、主たる債務者が破産手続開始の決定を受けたときであっても、まず主たる債務者に催告をすべき旨を請求することができる。"],
    a:4, ex:["446条2項・3項のとおりです。",
       "454条のとおりです（連帯保証人には催告の抗弁も検索の抗弁もありません）。",
       "465条の2第2項のとおりです。",
       "465条の6第1項・3項、465条の9のとおりです。",
       "主たる債務者が破産手続開始の決定を受けたときや、行方が知れないときは、催告の抗弁は使えません（452条ただし書）。"],
    e:"原則（催告の抗弁がある）だけを書いて、ただし書の場面（破産・行方不明）に当てはめるのが典型のひっかけです。", art:"民法446条・452条・454条・465条の2・465条の6" },
  { id:"gy-c7", trap:true, sub:"憲法", topic:"天皇・内閣・国会・裁判所の権限（主語のすり替え）", q:"日本国憲法の規定に関する次の記述のうち、妥当なものはどれか。",
    c:["条約を締結するのは国会であり、内閣は、事前に、時宜によっては事後に、その承認を経ることを必要とする。",
       "最高裁判所の長たる裁判官は、内閣の指名に基づいて、天皇が任命する。",
       "下級裁判所の裁判官は、最高裁判所の指名した者の名簿によって、最高裁判所が任命する。",
       "大赦、特赦、減刑、刑の執行の免除および復権を決定するのは天皇であり、内閣はこれを認証する。",
       "内閣は、国会の臨時会の召集を決定することができるが、いずれかの議院の総議員の3分の1以上の要求があれば、その召集を決定しなければならない。"],
    a:1, ex:["条約を締結するのは「内閣」で、国会の承認を経ます（73条3号）。主語が逆です。",
       "6条2項のとおりです。",
       "任命するのは「内閣」です（80条1項）。",
       "決定するのは「内閣」（73条7号）、認証するのは「天皇」（7条6号）です。逆になっています。",
       "要求に必要なのは総議員の「4分の1」以上です（53条）。"],
    e:"「誰が」を入れ替える肢は、指名・任命・決定・認証・承認の組み合わせで確かめます。最高裁長官＝内閣が指名・天皇が任命、その他の最高裁判事と下級裁判所裁判官＝内閣が任命。", art:"日本国憲法6条2項・7条6号・53条・73条3号・7号・80条1項" },
  { id:"gy-s5", trap:true, sub:"商法", topic:"株主総会の招集と取締役の任期（数字）", q:"会社法に関する次の記述のうち、誤っているものはどれか。",
    c:["取締役の任期は、原則として、選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである。",
       "公開会社でない株式会社（監査等委員会設置会社および指名委員会等設置会社を除く）は、定款によって、取締役の任期を選任後10年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで伸長することができる。",
       "公開会社が株主総会を招集するには、取締役は、株主総会の日の2週間前までに、株主に対してその通知を発しなければならない。",
       "公開会社では、総株主の議決権の100分の3以上の議決権を6箇月前から引き続き有する株主は、取締役に対し、株主総会の目的である事項および招集の理由を示して、株主総会の招集を請求することができる（定款でこれらの要件を緩めることができる）。",
       "公開会社でない株式会社が株主総会を招集する場合も、書面投票などを定めたかどうかにかかわらず、必ず株主総会の日の2週間前までに招集通知を発しなければならない。"],
    a:4, ex:["332条1項のとおりです。",
       "332条2項のとおりです。",
       "299条1項のとおりです。",
       "297条1項のとおりです。",
       "公開会社でない株式会社は、書面投票・電子投票を定めた場合を除き、原則1週間前まででよく、取締役会設置会社でなければ定款でさらに短くできます（299条1項かっこ書）。"],
    e:"公開会社＝2週間、非公開会社＝1週間（取締役会がなければ定款で短縮可）、書面投票などを定めたら2週間。数字と例外の組み合わせが狙われます。", art:"会社法297条1項・299条1項・332条1項・2項" },
  { id:"gy-i6", trap:true, sub:"基礎知識", topic:"住民基本台帳法（住所の届出）", q:"住民基本台帳法に関する次の記述のうち、誤っているものはどれか。",
    c:["転入（出生による場合を除く）をした者は、転入をした日から14日以内に、氏名、住所などを市町村長に届け出なければならない。",
       "一の市町村の区域内で住所を変更した者は、転居をした日から14日以内に、転居届をしなければならない。",
       "転出をする者は、転出をした日から14日以内に、転出先などを市町村長に届け出なければならない。",
       "転入・転居の場合を除き、属する世帯または世帯主に変更があった者は、政令で定める者を除き、変更があった日から14日以内に届け出なければならない。",
       "住民票には、個人番号（マイナンバー）が記載される。"],
    a:2, ex:["22条1項のとおりです。",
       "23条のとおりです。",
       "転出届は、転出を「する」者が「あらかじめ」するものです（24条）。転出後14日以内ではありません。",
       "25条のとおりです。",
       "7条8号の2のとおりです。"],
    e:"転入・転居・世帯変更は「した日から14日以内」、転出だけは「あらかじめ」。届出の時期の違いが狙われます。", art:"住民基本台帳法7条・22条1項・23条・24条・25条" },
  { id:"gy-i7", trap:true, sub:"基礎知識", topic:"戸籍法（届出の期間と戸籍謄本等の請求）", q:"戸籍法に関する次の記述のうち、妥当なものはどれか。",
    c:["出生の届出は、国内で出生があったときは、30日以内にしなければならない。",
       "死亡の届出は、届出義務者が死亡の事実を知った日から14日以内（国外で死亡があったときは3箇月以内）にしなければならない。",
       "戸籍に記載されている者またはその配偶者、直系尊属もしくは直系卑属は、戸籍謄本等の交付を請求することができるが、市町村長は、その請求が不当な目的によることが明らかなときは、これを拒むことができる。",
       "戸籍に記載されている者やその配偶者・直系血族以外の者は、いかなる場合も、戸籍謄本等の交付を請求することができない。",
       "行政書士は、受任している事件または事務に関する業務を遂行するために必要がある場合であっても、戸籍謄本等の交付を請求することはできない。"],
    a:2, ex:["出生の届出は「14日以内」（国外で出生したときは3箇月以内）です（49条1項）。",
       "死亡の届出は、死亡の事実を知った日から「7日以内」です（86条1項）。",
       "10条1項・2項のとおりです。",
       "自己の権利を行使するため戸籍の記載事項を確認する必要がある場合など、理由を明らかにすれば請求できます（10条の2第1項）。",
       "行政書士は、受任している事件・事務の業務を遂行するために必要があれば、請求できます（10条の2第3項）。"],
    e:"出生は14日、死亡は7日（どちらも国外は3箇月）。「いかなる場合も」「できない」と言い切る肢は、例外がないか確かめます。", art:"戸籍法10条・10条の2第1項・3項・49条1項・86条1項" },
  { id:"gy-g32", trap:true, sub:"行政法", topic:"地方自治法（公の施設と指定管理者）", q:"地方自治法が定める公の施設に関する次の記述のうち、妥当なものはどれか。",
    c:["公の施設の設置およびその管理に関する事項は、法律またはこれに基づく政令に特別の定めがあるものを除き、長の定める規則で定めなければならない。",
       "普通地方公共団体の長は、指定管理者の指定を、議会の議決を経ることなく行うことができる。",
       "普通地方公共団体は、いかなる場合も、住民が公の施設を利用することを拒んではならない。",
       "条例で定める重要な公の施設のうち条例で定める特に重要なものを廃止し、または条例で定める長期かつ独占的な利用をさせようとするときは、議会において出席議員の3分の2以上の者の同意を得なければならない。",
       "普通地方公共団体は、公の施設の利用に係る料金を、指定管理者の収入として収受させることはできない。"],
    a:3, ex:["規則ではなく「条例」で定めます（244条の2第1項）。",
       "指定管理者の指定をしようとするときは、あらかじめ議会の議決を経なければなりません（244条の2第6項）。",
       "「正当な理由がない限り」拒んではならない、です（244条2項）。正当な理由があれば拒めます。",
       "244条の2第2項のとおりです。",
       "適当と認めるときは、利用料金を指定管理者の収入として収受させることができます（244条の2第8項）。"],
    e:"「条例か規則か」「議会の議決が要るか」「正当な理由がない限り」の3点がよく入れ替えられます。", art:"地方自治法244条・244条の2第1項・2項・6項・8項" },
  { id:"gy-g33", trap:true, sub:"行政法", topic:"行政事件訴訟法（民衆訴訟と機関訴訟）", q:"行政事件訴訟法が定める民衆訴訟および機関訴訟に関する次の記述のうち、誤っているものはどれか。",
    c:["民衆訴訟とは、国または公共団体の機関の法規に適合しない行為の是正を求める訴訟で、選挙人たる資格その他自己の法律上の利益にかかわらない資格で提起するものをいう。",
       "機関訴訟とは、国または公共団体の機関相互間における権限の存否またはその行使に関する紛争についての訴訟をいう。",
       "機関訴訟は、法律に定める場合において、法律に定める者に限り、提起することができる。",
       "地方自治法が定める住民訴訟は、民衆訴訟の一つである。",
       "民衆訴訟は、自己の法律上の利益にかかわらない資格で提起するものであるから、選挙人たる資格があれば、法律に定めがなくても提起することができる。"],
    a:4, ex:["5条のとおりです。",
       "6条のとおりです。",
       "42条のとおりです。",
       "住民訴訟は、住民という資格で、自己の法律上の利益にかかわらず財務会計上の行為の是正を求める訴訟なので、民衆訴訟に当たります。",
       "民衆訴訟も、法律に定める場合に、法律に定める者だけが提起できます（42条）。"],
    e:"民衆訴訟・機関訴訟は「客観訴訟」で、法律に定めがあるときだけ使えます。抗告訴訟・当事者訴訟（主観訴訟）との区別が問われます。", art:"行政事件訴訟法5条・6条・42条" },
  { id:"gy-m21", trap:true, sub:"民法", topic:"時効の援用と放棄", q:"時効に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["時効の利益は、時効が完成する前であっても、あらかじめ放棄することができる。",
       "消滅時効を援用することができるのは債務者に限られ、保証人は主たる債務の消滅時効を援用することができない。",
       "物上保証人は、被担保債権の消滅時効を援用することができる。",
       "時効が完成していれば、当事者が援用しなくても、裁判所は時効によって裁判をすることができる。",
       "時効の効力は、時効が完成した時から生じ、その起算日にさかのぼることはない。"],
    a:2, ex:["時効の利益は、あらかじめ放棄することができません（146条）。",
       "保証人も援用できます（145条かっこ書）。",
       "145条かっこ書のとおりです（物上保証人・第三取得者など、権利の消滅について正当な利益を有する者）。",
       "当事者が援用しなければ、裁判所は時効によって裁判をすることができません（145条）。",
       "時効の効力は、起算日にさかのぼります（144条）。"],
    e:"「あらかじめ放棄できない」「援用しないと裁判できない」「起算日にさかのぼる」。保証人・物上保証人・第三取得者も援用権者です。", art:"民法144条・145条・146条" },
  { id:"gy-m22", trap:true, sub:"民法", topic:"不当利得（返還請求ができない場合）", q:"不当利得に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["法律上の原因なく他人の財産によって利益を受け、そのために他人に損失を及ぼした者は、その利益の存する限度において、これを返還する義務を負う。",
       "悪意の受益者は、その受けた利益に利息を付して返還しなければならず、なお損害があるときは、その賠償の責任を負う。",
       "債務の弁済として給付をした者は、その時において債務の存在しないことを知っていたときは、その給付したものの返還を請求することができない。",
       "債務者が弁済期にない債務の弁済として給付をしたときは、その給付したものの返還を請求することはできないが、錯誤によって給付をしたときは、債権者は、これによって得た利益を返還しなければならない。",
       "不法な原因のために給付をした者は、不法な原因が受益者についてのみ存したときであっても、その給付したものの返還を請求することができない。"],
    a:4, ex:["703条のとおりです。",
       "704条のとおりです。",
       "705条のとおりです。",
       "706条のとおりです。",
       "不法な原因が受益者についてのみ存したときは、返還を請求できます（708条ただし書）。"],
    e:"原則（返還できない）だけを書いて、ただし書の場面に当てはめるのが典型のひっかけです。705条・706条・708条は「返還請求できない」グループとしてまとめて覚えます。", art:"民法703条・704条・705条・706条・708条" },
  { id:"gy-c8", trap:true, sub:"憲法", topic:"裁判官の身分保障", q:"裁判官に関する次の記述のうち、日本国憲法の規定に照らし、妥当なものはどれか。",
    c:["最高裁判所の裁判官は、任期を10年とし、再任されることができる。",
       "最高裁判所の裁判官の任命は、その任命後初めて行われる参議院議員通常選挙の際、国民の審査に付される。",
       "裁判官の懲戒処分は、行政機関がこれを行うことはできない。",
       "下級裁判所の裁判官の報酬は、在任中であっても、法律で定めれば減額することができる。",
       "裁判官は、裁判により心身の故障のために職務を執ることができないと決定された場合であっても、公の弾劾によらなければ罷免されない。"],
    a:2, ex:["任期10年・再任ありは「下級裁判所」の裁判官です（80条1項）。最高裁判所の裁判官は、法律の定める年齢に達した時に退官します（79条5項）。",
       "「衆議院議員総選挙」の際です（79条2項）。",
       "78条後段のとおりです。",
       "在任中、減額することができません（80条2項。最高裁判所の裁判官も同じ、79条6項）。",
       "心身の故障のため職務を執ることができないと裁判で決定された場合は、公の弾劾によらずに罷免されます（78条前段）。"],
    e:"最高裁と下級裁の取り違え（任期・国民審査）と、78条の「除いては」の読み落としが狙われます。", art:"日本国憲法78条・79条2項・5項・6項・80条1項・2項" },
  { id:"gy-i8", trap:true, sub:"基礎知識", topic:"行政書士法（懲戒）", q:"行政書士に対する懲戒に関する次の記述のうち、行政書士法の規定に照らし、誤っているものはどれか。",
    c:["都道府県知事は、行政書士が行政書士法に違反したときなどは、戒告、2年以内の業務の停止または業務の禁止の処分をすることができる。",
       "何人も、行政書士に懲戒の事由に当たる事実があると思料するときは、その事務所の所在地を管轄する都道府県知事に対し、当該事実を通知し、適当な措置をとることを求めることができる。",
       "前の記述の通知があったときは、都道府県知事は、通知された事実について必要な調査をしなければならない。",
       "都道府県知事は、行政書士に対し業務の停止の処分をしようとするときは、行政手続法が定める意見陳述のための手続の区分にかかわらず、聴聞を行わなければならない。",
       "都道府県知事は、行政書士を懲戒処分にしたときは、本人に通知すれば足り、その旨を公告する必要はない。"],
    a:4, ex:["14条のとおりです。",
       "14条の3第1項のとおりです。",
       "14条の3第2項のとおりです。",
       "14条の3第3項のとおりです。聴聞の審理は公開で行います（同条5項）。",
       "遅滞なく、都道府県の公報で公告しなければなりません（14条の5）。"],
    e:"懲戒は「都道府県知事」が行い、種類は戒告・2年以内の業務停止・業務禁止の3つ。誰でも知事に申し出られ、業務停止には必ず聴聞、処分したら公告します。", art:"行政書士法14条・14条の3・14条の5" },
  { id:"gy-i9", trap:true, sub:"基礎知識", topic:"個人情報保護法（定義）", q:"個人情報の保護に関する法律の定義に関する次の記述のうち、妥当なものはどれか。",
    c:["特定の個人の身体の一部の特徴を電子計算機の用に供するために変換した符号は、政令で定めるものであっても、個人識別符号に当たらない。",
       "本人の犯罪の経歴が含まれる個人情報は、要配慮個人情報に当たらない。",
       "匿名加工情報とは、定められた措置を講じて特定の個人を識別することができないように個人情報を加工して得られる個人に関する情報であって、当該個人情報を復元することができないようにしたものをいう。",
       "仮名加工情報とは、他の情報と照合したとしても特定の個人を識別することができないように個人情報を加工して得られる個人に関する情報をいう。",
       "個人関連情報とは、生存する個人に関する情報であって、個人情報、仮名加工情報または匿名加工情報のいずれかに該当するものをいう。"],
    a:2, ex:["政令で定めるものは個人識別符号に当たります（2条2項1号）。指紋や顔の特徴のデータなどです。",
       "犯罪の経歴は、要配慮個人情報の例として条文に挙がっています（2条3項）。",
       "2条6項のとおりです。",
       "仮名加工情報は、「他の情報と照合しない限り」特定の個人を識別できないように加工したものです（2条5項）。照合すれば識別できる余地が残ります。",
       "個人関連情報は、個人情報・仮名加工情報・匿名加工情報の「いずれにも該当しない」ものです（2条7項）。"],
    e:"仮名加工情報（照合しない限り識別できない）と匿名加工情報（識別できず、復元もできない）の違いが最重要です。", art:"個人情報保護法2条2項・3項・5項〜7項" },
  { id:"gy-g34", trap:true, sub:"行政法", topic:"行政不服審査法（裁決の種類と不利益変更の禁止）", q:"行政不服審査法が定める処分についての審査請求の裁決に関する次の記述のうち、誤っているものはどれか。",
    c:["審査請求が法定の期間経過後にされたものである場合その他不適法である場合には、審査庁は、裁決で、当該審査請求を却下する。",
       "審査請求が理由がない場合には、審査庁は、裁決で、当該審査請求を棄却する。",
       "処分が違法または不当ではあるが、これを取り消すことにより公の利益に著しい障害を生ずる場合などには、審査庁は、審査請求を棄却することができ、この場合には、裁決の主文で処分が違法または不当であることを宣言しなければならない。",
       "審査庁が処分庁の上級行政庁または処分庁のいずれでもない場合には、審査庁は、処分を取り消すことはできても、変更することはできない。",
       "審査庁は、審査請求に理由があり処分を変更する場合において、公益上必要があると認めるときは、審査請求人の不利益に当該処分を変更することができる。"],
    a:4, ex:["45条1項のとおりです。",
       "45条2項のとおりです。",
       "45条3項のとおりです（事情裁決）。",
       "46条1項ただし書のとおりです。",
       "審査請求人の不利益に処分を変更することはできません（48条）。公益上の必要という例外もありません。"],
    e:"却下（不適法）・棄却（理由なし）・認容（取消し・変更）と事情裁決。変更は審査請求人に有利な方向だけです（不利益変更の禁止）。", art:"行政不服審査法45条・46条1項・48条" },
  { id:"gy-g35", trap:true, sub:"行政法", topic:"地方自治法（長の再議権）", q:"地方自治法が定める普通地方公共団体の長の再議に関する次の記述のうち、妥当なものはどれか。",
    c:["長は、議会の議決について異議があるときは、議決の日（条例の制定・改廃または予算に関する議決については、その送付を受けた日）から30日以内に、理由を示して再議に付することができる。",
       "異議による再議に付された議決が条例の制定に関するものである場合、議会が出席議員の過半数で再議に付された議決と同じ議決をしたときは、その議決は確定する。",
       "長は、議会の議決がその権限を超え、または法令もしくは会議規則に違反すると認めるときは、理由を示してこれを再議に付さなければならない。",
       "違法な議決として再議に付した議決がなお違法であると認めるときは、長は、直ちに裁判所に出訴しなければならない。",
       "違法な議決についての総務大臣または都道府県知事の裁定に不服がある議会または長は、裁定のあった日から90日以内に、裁判所に出訴することができる。"],
    a:2, ex:["期間は「10日以内」です（176条1項）。",
       "条例の制定・改廃や予算に関するものは「出席議員の3分の2以上」の同意が必要です（176条3項）。",
       "176条4項のとおりです。違法な議決の再議は、長の義務です。",
       "まず、都道府県知事は総務大臣に、市町村長は都道府県知事に、議決の日から21日以内に審査を申し立てます（176条5項）。",
       "出訴期間は「60日以内」です（176条7項）。"],
    e:"一般再議（異議）は「できる」・10日以内・条例と予算は3分の2。違法再議は「しなければならない」・審査申立て21日・出訴60日。数字と義務か任意かが入れ替えられます。", art:"地方自治法176条" },
  { id:"gy-m23", trap:true, sub:"民法", topic:"債権者代位権", q:"債権者代位権に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["債権者は、自己の債権を保全するため必要があるときは、債務者の一身に専属する権利であっても、代位行使することができる。",
       "債権者は、その債権の期限が到来しない間は、保存行為であっても、被代位権利を行使することができない。",
       "債権者は、被代位権利が金銭の支払を目的とするものであるときは、相手方に対し、その支払を自己に対してすることを求めることができる。",
       "債権者は、その債権が強制執行により実現することのできないものであっても、被代位権利を行使することができる。",
       "相手方が債権者に対して金銭の支払をしても、被代位権利は消滅しない。"],
    a:2, ex:["一身に専属する権利は代位行使できません（423条1項ただし書）。",
       "保存行為は、期限到来前でも代位行使できます（423条2項ただし書）。",
       "423条の3前段のとおりです。",
       "強制執行により実現できない債権では、代位行使できません（423条3項）。",
       "相手方が債権者に支払ったときは、被代位権利は消滅します（423条の3後段）。"],
    e:"要件（保全の必要・期限の到来・強制執行できる債権）と例外（保存行為）、対象外（一身専属権・差押禁止の権利）をセットで覚えます。", art:"民法423条・423条の3" },
  { id:"gy-m24", trap:true, sub:"民法", topic:"婚姻の成立（改正点）", q:"婚姻に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["婚姻は、18歳にならなければ、することができない。",
       "配偶者のある者は、重ねて婚姻をすることができない。",
       "女性は、前婚の解消または取消しの日から起算して100日を経過した後でなければ、再婚をすることができない。",
       "婚姻は、戸籍法の定めるところにより届け出ることによって効力を生じ、その届出は、当事者双方および成年の証人2人以上が署名した書面で、またはこれらの者から口頭でしなければならない。",
       "婚姻の届出が、当事者双方と成年の証人2人以上の署名などの方式を欠くだけであるときは、婚姻は、そのためにその効力を妨げられない。"],
    a:2, ex:["731条のとおりです（2022年4月から男女とも18歳）。",
       "732条のとおりです。",
       "再婚禁止期間の規定（733条）は、2024年4月1日施行の改正で削除されました。",
       "739条のとおりです。",
       "742条2号ただし書のとおりです。"],
    e:"親族法の改正点（婚姻適齢は男女とも18歳、再婚禁止期間の廃止）は、古い知識のままだと誤りに気づけません。", art:"民法731条・732条・733条・739条・742条" },
  { id:"gy-s6", trap:true, sub:"商法", topic:"株式の譲渡と対抗要件", q:"株式の譲渡に関する次の記述のうち、会社法の規定に照らし、妥当なものはどれか。",
    c:["株主は、定款に定めがある場合に限り、その有する株式を譲渡することができる。",
       "株券発行会社の株式の譲渡は、自己株式の処分による場合を除き、当該株式に係る株券を交付しなければ、その効力を生じない。",
       "株券発行会社でない株式会社の株式の譲渡は、取得者の氏名などを株主名簿に記載しなくても、株式会社その他の第三者に対抗することができる。",
       "株券の発行前にした株式の譲渡は、株券発行会社に対しても、その効力を生ずる。",
       "株券発行会社では、株式の譲渡は、株主名簿の記載がなくても、株式会社に対抗することができる。"],
    a:1, ex:["株式は自由に譲渡できるのが原則です（127条）。",
       "128条1項のとおりです。",
       "株主名簿に記載・記録しなければ、株式会社その他の第三者に対抗できません（130条1項）。",
       "株券の発行前にした譲渡は、株券発行会社に対し効力を生じません（128条2項）。",
       "株券発行会社でも、株式会社に対抗するには株主名簿の記載が必要です（130条2項）。第三者には株券の占有で対抗します。"],
    e:"株券発行会社：効力は株券の交付、会社への対抗は株主名簿。株券不発行会社：会社にも第三者にも株主名簿で対抗。この組み合わせが狙われます。", art:"会社法127条・128条・130条" },
  { id:"gy-i10", trap:true, sub:"基礎知識", topic:"行政書士法（登録）", q:"行政書士の登録に関する次の記述のうち、行政書士法の規定に照らし、誤っているものはどれか。",
    c:["行政書士となる資格を有する者が行政書士となるには、日本行政書士会連合会に備える行政書士名簿に、登録を受けなければならない。",
       "登録を受けようとする者は、その事務所の所在地の属する都道府県の区域に設立されている行政書士会を経由して、日本行政書士会連合会に対し、登録の申請をしなければならない。",
       "登録を拒否された者は、当該処分に不服があるときは、その事務所の所在地を管轄する都道府県知事に対して審査請求をすることができる。",
       "登録の申請をした者は、申請をした日から3か月を経過しても何らの処分がされない場合には、登録を拒否されたものとして、審査請求をすることができる。",
       "日本行政書士会連合会は、行政書士の登録を受けた者が引き続き2年以上行政書士の業務を行わないときは、その登録を抹消することができる。"],
    a:2, ex:["6条1項〜3項のとおりです。名簿は連合会に備え、登録も連合会が行います。",
       "6条の2第1項のとおりです。拒否するときは資格審査会の議決に基づき、あらかじめ弁明の機会を与えます（同条2項・3項）。",
       "審査請求先は「総務大臣」です（6条の3第1項）。都道府県知事ではありません。",
       "6条の3第2項のとおりです。審査請求があった日に、連合会が登録を拒否したものとみなされます。",
       "7条2項1号のとおりです。抹消「できる」（任意）です。業の廃止の届出・死亡などは抹消「しなければならない」（7条1項）。"],
    e:"登録は「日本行政書士会連合会」が行い、不服は「総務大臣」へ審査請求。懲戒（都道府県知事）と取り違えさせるのが定番のひっかけです。", art:"行政書士法6条・6条の2・6条の3・7条" },
  { id:"gy-i11", trap:true, sub:"基礎知識", topic:"行政書士法人", q:"行政書士法人に関する次の記述のうち、行政書士法の規定に照らし、正しいものはどれか。",
    c:["行政書士法人は、行政書士2人以上が共同して設立しなければならず、行政書士1人で設立することはできない。",
       "行政書士法人は、その主たる事務所の所在地において設立の登記をすることによって成立する。",
       "行政書士法人の社員は、業務を執行する社員を除き、行政書士でなくてもよい。",
       "行政書士法人は、成立したときは、成立の日から2週間以内に、その主たる事務所の所在地を管轄する都道府県知事に届け出なければならない。",
       "行政書士法人の業務を執行する社員は、定款または総社員の同意によっても代表者を定めることはできず、各自行政書士法人を代表する。"],
    a:1, ex:["条文は「行政書士が設立した法人」（13条の3）で、人数の下限はありません。社員1人の行政書士法人も設立できます。",
       "13条の9のとおりです。",
       "社員は全員、行政書士でなければなりません（13条の5第1項）。",
       "届出先は、主たる事務所の所在地の行政書士会を経由して「日本行政書士会連合会」です（13条の10第1項）。",
       "各自代表が原則ですが、定款または総社員の同意で代表社員を定めることができます（13条の13第1項ただし書）。"],
    e:"成立は「設立の登記」、社員は全員「行政書士」、届出は「行政書士会経由で連合会」へ。1人でも設立できる点も確認しておきます。", art:"行政書士法13条の3・13条の5・13条の9・13条の10・13条の13" },
  { id:"gy-i12", trap:true, sub:"基礎知識", topic:"個人情報保護法（行政機関等の義務）", q:"個人情報の保護に関する法律が定める行政機関等の義務に関する次の記述のうち、誤っているものはどれか。",
    c:["行政機関等は、個人情報を保有するに当たっては、法令の定める所掌事務または業務を遂行するため必要な場合に限り、かつ、その利用目的をできる限り特定しなければならない。",
       "行政機関等は、利用目的を変更する場合には、変更前の利用目的と相当の関連性を有すると合理的に認められる範囲を超えて行ってはならない。",
       "行政機関等は、本人から直接書面に記録された当該本人の個人情報を取得するときは、取得の状況からみて利用目的が明らかであると認められるときであっても、あらかじめ、本人に対し、その利用目的を明示しなければならない。",
       "行政機関の長等は、本人の同意があるときは、利用目的以外の目的のために保有個人情報を提供することができるが、本人または第三者の権利利益を不当に侵害するおそれがあると認められるときは、この限りでない。",
       "開示決定等は、開示請求があった日から30日以内にしなければならないが、事務処理上の困難その他正当な理由があるときは、30日以内に限り延長することができる。"],
    a:2, ex:["61条1項のとおりです。",
       "61条3項のとおりです。民間の事業者は「関連性」（17条2項）、行政機関等は「相当の関連性」と、より厳しくなっています。",
       "取得の状況からみて利用目的が明らかなときは、明示しなくてよい例外に当たります（62条4号）。",
       "69条2項1号とただし書のとおりです。",
       "83条1項・2項のとおりです。補正に要した日数は30日に算入しません（同条1項ただし書）。"],
    e:"行政機関等の規律（61条以下）は、民間の事業者の規律と似ていますが、利用目的の変更は「相当の関連性」と一段厳しい点が狙われます。", art:"個人情報保護法61条・62条・69条・83条" },
  { id:"gy-g36", trap:true, sub:"行政法", topic:"地方自治法（議会の招集と会議）", q:"普通地方公共団体の議会に関する次の記述のうち、地方自治法の規定に照らし、正しいものはどれか。",
    c:["普通地方公共団体の議会は、議長がこれを招集する。",
       "議員の定数の4分の1以上の者は、長に対し、会議に付議すべき事件を示して臨時会の招集を請求することができ、請求があったときは、長は、請求のあった日から20日以内に臨時会を招集しなければならない。",
       "普通地方公共団体の議会は、議員の定数の3分の1以上の議員が出席しなければ、会議を開くことができない。",
       "議会の会議は公開が原則であるが、議長または議員3人以上の発議により、出席議員の過半数で議決したときは、秘密会を開くことができる。",
       "議会の議事は、出席議員の過半数でこれを決し、可否同数のときは、否決されたものとみなす。"],
    a:1, ex:["議会を招集するのは「長」です（101条1項）。議長が招集できるのは、長が20日以内に招集しないときなどの例外です（同条5項・6項）。",
       "101条3項・4項のとおりです。",
       "定足数は「半数以上」です（113条）。",
       "秘密会の議決は「出席議員の3分の2以上」です（115条1項ただし書）。",
       "可否同数のときは「議長の決するところ」によります（116条1項）。この場合、議長は議員として議決に加わりません（同条2項）。"],
    e:"招集は長、臨時会の請求は定数の4分の1・20日以内、定足数は半数、秘密会は3分の2、可否同数は議長が決する。数字の入れ替えが狙われます。", art:"地方自治法101条・113条・115条・116条" },
  { id:"gy-g37", sub:"行政法", topic:"行政事件訴訟法（取消判決の効力）", q:"取消訴訟の判決の効力に関する次の記述のうち、行政事件訴訟法の規定に照らし、誤っているものはどれか。",
    c:["処分または裁決を取り消す判決は、第三者に対しても効力を有する。",
       "取消判決の第三者効の規定は、執行停止の決定またはこれを取り消す決定に準用される。",
       "処分または裁決を取り消す判決は、その事件について、処分または裁決をした行政庁その他の関係行政庁を拘束する。",
       "申請を却下した処分が判決により取り消されたときは、その処分をした行政庁は、判決の趣旨に従い、改めて申請に対する処分をしなければならない。",
       "取消判決により権利を害された第三者は、自己の責めに帰することができない理由により訴訟に参加することができなかった場合であっても、確定した取消判決に対して不服を申し立てることはできない。"],
    a:4, ex:["32条1項のとおりです。",
       "32条2項のとおりです。",
       "33条1項のとおりです（拘束力）。",
       "33条2項のとおりです。手続の違法を理由に認容処分が取り消された場合にも準用されます（同条3項）。",
       "第三者は「再審の訴え」で不服を申し立てられます（34条1項）。確定判決を知った日から30日以内、判決確定から1年以内です（同条2項・4項）。"],
    e:"取消判決の効力は「第三者効（32条）」「拘束力（33条）」、そして第三者を守る「再審の訴え（34条）」の3点セットで覚えます。", art:"行政事件訴訟法32条・33条・34条" },
  { id:"gy-m25", trap:true, sub:"民法", topic:"弁済（第三者弁済・受領権者の外観・代物弁済）", q:"弁済に関する次の記述のうち、民法の規定に照らし、妥当なものはどれか。",
    c:["弁済をするについて正当な利益を有する者でない第三者は、債務者の意思に反して弁済をすることができず、債務者の意思に反することを債権者が知らなかったときも同様である。",
       "弁済をするについて正当な利益を有する者でない第三者は、債権者の意思に反して弁済をすることができないが、その第三者が債務者の委託を受けて弁済をする場合において、そのことを債権者が知っていたときは、この限りでない。",
       "当事者が第三者の弁済を禁止する旨の意思表示をしたときであっても、弁済をするについて正当な利益を有する第三者は、弁済をすることができる。",
       "受領権者以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、弁済をした者が善意であれば、過失があっても効力を有する。",
       "代物弁済は、債権者との間で他の給付をすることにより債務を消滅させる旨の契約をした時点で、他の給付をしなくても、弁済と同一の効力を有する。"],
    a:1, ex:["債務者の意思に反することを債権者が知らなかったときは、弁済は有効です（474条2項ただし書）。",
       "474条3項とただし書のとおりです。",
       "第三者弁済を禁止・制限する意思表示があるときは、474条1項〜3項は適用されません（同条4項）。",
       "善意で、かつ「過失がなかった」ときに限り効力を有します（478条）。",
       "弁済と同一の効力を生じるのは、弁済者が他の給付を「したとき」です（482条）。契約だけでは足りません。"],
    e:"第三者弁済は「正当な利益」の有無で分け、ただし書（債権者の善意・委託を債権者が知っていた）までセットで覚えます。", art:"民法474条・478条・482条" },
  { id:"gy-m26", sub:"民法", topic:"請負", q:"請負に関する次の記述のうち、民法の規定に照らし、誤っているものはどれか。",
    c:["請負の報酬は、仕事の目的物の引渡しを要する場合には、その引渡しと同時に支払わなければならない。",
       "注文者の責めに帰することができない事由によって仕事を完成することができなくなった場合において、請負人が既にした仕事の結果のうち可分な部分の給付によって注文者が利益を受けるときは、請負人は、注文者が受ける利益の割合に応じて報酬を請求することができる。",
       "注文者の与えた指図によって生じた契約不適合については、注文者は、請負人の担保責任を追及できないが、請負人がその指図が不適当であることを知りながら告げなかったときは、この限りでない。",
       "注文者が不適合を知った時から1年以内にその旨を請負人に通知しないときは、注文者は担保責任を追及できなくなるが、引渡しの時に請負人が不適合を知り、または重大な過失によって知らなかったときは、この限りでない。",
       "請負人が仕事を完成しない間は、注文者は、損害を賠償することなく、いつでも契約の解除をすることができる。"],
    a:4, ex:["633条本文のとおりです。引渡しを要しないときは、雇用の624条1項（後払い）が準用されます（同条ただし書）。",
       "634条1号のとおりです。仕事の完成前に解除された場合も同じです（同条2号）。",
       "636条とただし書のとおりです。",
       "637条1項・2項のとおりです。",
       "注文者は、いつでも解除できますが、「損害を賠償して」しなければなりません（641条）。"],
    e:"請負は「報酬は引渡しと同時」「割合的報酬（634条）」「指図による不適合の免責とただし書」「知った時から1年の通知」「注文者の任意解除は損害賠償つき」を押さえます。", art:"民法633条・634条・636条・637条・641条" },
  // ---- 基礎知識（文章理解）：本文はこのアプリのために書き下ろしたもの ----
  { id:"gy-i13", sub:"基礎知識", topic:"文章理解（要旨の把握）", q:"次の文章の要旨として、最も妥当なものはどれか。\n\n　説明が上手な人は、相手が知らないことを知っている。逆説めいて聞こえるが、要するに、自分の頭の中にある知識のうち、どこまでが相手と共有されていて、どこからが共有されていないのかを見きわめる力のことである。専門家の説明がしばしば伝わらないのは、知識が足りないからではない。むしろ知識が多すぎて、自分が当たり前だと思っている前提を、相手も持っていると思い込んでしまうからだ。この思い込みは、知識を身につける過程そのものが生む。いったん理解してしまうと、理解する前の自分がどこでつまずいたのかを思い出せなくなるのである。だから、説明の腕を上げるために必要なのは、知識をさらに積み上げることよりも、相手の立場に立って、自分の前提を一つずつ言葉にしてみることである。",
    c:["専門家の説明が伝わらないのは知識が足りないからであり、説明の腕を上げるには、まず知識をさらに積み上げる必要がある。",
       "よい説明をするには、自分の前提のうち相手と共有されていないものを見きわめ、それを一つずつ言葉にすることが大切である。",
       "人は理解したことをすぐに忘れてしまうので、学ぶときは、自分がつまずいた箇所を記録しておくべきである。",
       "説明が上手な人は、相手よりも多くの知識を持っているので、相手の知らないことを知っている。",
       "専門家は相手の立場に立つことができないので、説明は専門家でない者に任せるべきである。"],
    a:1, ex:["本文は「知識が足りないからではない」と否定し、「知識をさらに積み上げることよりも」前提を言葉にすることが必要だと述べています。逆の内容です。",
       "本文の最後の文（結論）と、冒頭の「見きわめる力」をまとめたもので、要旨として妥当です。",

       "冒頭の逆説の意味を取り違えています。本文の「知らないことを知っている」は、相手が何を知らないかを見きわめる力のことです。",
       "本文は専門家が説明に失敗しやすい理由を述べているだけで、専門家でない者に任せるべきだとは言っていません。言い過ぎです。"],
    e:"要旨の問題は、最後の「だから〜」の結論と、冒頭の問題提起を結ぶ肢を選びます。本文の否定（〜ではない）を肯定に変えた肢と、本文にない主張を足した肢を外します。", art:"" },
  { id:"gy-i14", sub:"基礎知識", topic:"文章理解（空欄補充）", q:"次の文章の空欄［　］に入る語句として、最も妥当なものはどれか。\n\n　記録は、過去を残すためのものだと考えられがちである。しかし、記録の価値が本当に試されるのは、それが未来に読まれるときだ。書いた本人にとって明らかだった事情は、時間がたつと本人にさえわからなくなる。だから、よい記録とは、そのときの事実を並べるだけでなく、［　］を書き添えたものである。なぜその判断をしたのか、ほかにどんな選択肢があったのかがわかれば、後の読み手は、同じような状況に出会ったときに、その記録を手がかりに自分で考えることができる。",

       "読み手が抱くであろう感想",

       "将来起こりうる出来事の予測"],
    a:1, ex:["名前や日付も記録には必要ですが、空欄のあとの「なぜその判断をしたのか、ほかにどんな選択肢があったのか」とつながりません。",
       "直後の文の「なぜその判断をしたのか」（理由）、直前の「本人にとって明らかだった事情」（前提）の両方と対応します。",
       "本文は読み手の感想には触れていません。",
       "細かな数字は「事実を並べる」側に入るもので、「事実を並べるだけでなく」と対比されている空欄には合いません。",
       "本文は、後の読み手が「自分で考える」手がかりを残すことを述べており、書き手が将来を予測することは求めていません。"],
    e:"空欄補充は、空欄の直前（〜だけでなく）と直後（なぜ〜、ほかに〜）の両方に合う語句を選びます。片方にしか合わない肢がひっかけです。", art:"" },
  { id:"gy-i15", sub:"基礎知識", topic:"文章理解（並べ替え）", q:"次の文章のあとに続くア〜エの文を、意味が通るように並べ替えたとき、その順序として最も妥当なものはどれか。\n\n　新しい制度を作るときに見落とされやすいことがある。\n\nア　そこで、制度を作る側は、利用する人がどこで迷うのかを、実際に試してもらって確かめる必要がある。\nイ　ところが、作る側は制度の仕組みを知り尽くしているため、その迷いに気づきにくい。\nウ　どれほどよく考えられた制度でも、使う人が手続の途中で迷えば、その効果は十分に発揮されない。\nエ　こうして見つかった迷いの一つ一つを取り除いていくことが、制度を生かす近道である。",
    c:["ウ → イ → ア → エ",

       "ウ → ア → イ → エ",
       "ア → ウ → イ → エ",
       "イ → ア → ウ → エ"],
    a:0, ex:["ウ（問題の提示）→イ（「ところが」「その迷い」でウを受ける）→ア（「そこで」対策）→エ（「こうして見つかった」でアを受けてまとめ）と、つなぎの言葉がすべて合います。",
       "イの「その迷い」が指すものが前にありません。また、エの「こうして見つかった」が、見つける方法（ア）より前に来てしまいます。",
       "アの「そこで」は、作る側が気づきにくいという理由（イ）を受けるものです。ウのすぐ後では、なぜ試してもらう必要があるのかがつながりません。また、エの「こうして見つかった」がイを受けることになり、意味が通りません。",
       "アの「そこで」が、受ける内容のない冒頭に来てしまいます。",
       "イの「その迷い」が指すものがなく、ウの一般論が途中に割り込みます。"],
    e:"並べ替えは、指示語（その・こうして）と接続語（ところが・そこで）が何を受けるかで決めます。まず最初に来られない文（指示語・接続語で始まる文）を外すと早く解けます。", art:"" },

  "gy-g1":[["考え方", "申請に対する処分は「受け付けたら審査する」流れで考えます。到達→遅滞なく審査開始（7条）→審査基準に照らして判断（5条）→拒否なら理由を示す（8条）。この順に肢を当てはめると、正しい肢が見えます。"], ["ひっかけ所", "「定めなければならない（義務）」と「定めるよう努める（努力義務）」の入れ替え。審査基準は義務、標準処理期間は努力義務です。肢1・肢2は、この二つを逆にしたひっかけです。"], ["関連知識", "申請の拒否は、申請者にとって不利益でも「不利益処分」には当たりません（2条4号ロ）。そのため聴聞も弁明の機会の付与も要らず、その代わりに理由の提示（8条）で手続を守ります。"]],

  "gy-g4":[["考え方", "審査請求の基本ルール（期間・方式・審理員・執行不停止）を一つずつ確かめます。期間は「知った日の翌日から3か月」「処分の日の翌日から1年」が原則です（18条）。"], ["ひっかけ所", "口頭が原則（肢2）、申請の直後からできる（肢3）、処分に関与した者も審理員になれる（肢4）、当然に停止される（肢5）は、どれも原則と例外を逆にしたひっかけです。"], ["関連知識", "不作為についての審査請求には期間の制限がありません。不作為が続いている間はいつでもできます。審査請求書の提出が原則で、口頭でできるのは他の法律や条例に定めがある場合だけです（19条1項）。"]],

  "gy-g7":[["考え方", "訴訟の類型ごとに「損害の要件」と「補充性（他に適当な方法がない）」を表にして覚えると、肢の正誤がすぐ分かります。非申請型の義務付けは、重大な損害と補充性の両方が必要です（37条の2第1項）。"], ["ひっかけ所", "「重大な損害」と「償うことのできない損害」の取り違え、併合提起が必要かどうかの入れ替えが典型です。申請型の義務付けは、取消訴訟などとの併合提起が必要です（37条の3第3項）。"], ["関連知識", "仮の義務付け・仮の差止めは、本案（義務付け・差止めの訴え）を提起した上で申し立てます。要件は「償うことのできない損害を避けるため緊急の必要」と「本案について理由があるとみえるとき」です（37条の5）。"]],

  "gy-g11":[["考え方", "直接請求は「何を」「何人の連署で」「誰に」の3点で整理します。条例の制定改廃と事務の監査は50分の1、議会の解散と議員・長の解職は原則3分の1です。"], ["ひっかけ所", "連署の数字（50分の1と3分の1）と、請求先（長・監査委員・選挙管理委員会）の入れ替えが定番です。住民監査請求に選挙権は要らない点（法人も可）もよく狙われます。"], ["関連知識", "住民訴訟は住民監査請求を経た住民だけが起こせます（監査請求前置）。住民監査請求は「財務会計上の行為」が対象で、事務の監査請求（75条）とは別の制度です。"]],

  "gy-m1":[["考え方", "意思表示の問題は「無効か取消しか」「相手方の主観」「第三者の保護要件」の3段で整理します。心裡留保は原則有効で、相手方が悪意・有過失なら無効です（93条1項）。"], ["ひっかけ所", "第三者の保護要件（善意か、善意無過失か）の入れ替えと、強迫にも第三者保護があるかのように書く肢が定番です。錯誤の重過失の例外（95条3項）を消した肢もよく出ます。"], ["関連知識", "第三者による詐欺は、相手方が悪意または有過失のときだけ取り消せます（96条2項）。第三者による強迫は、相手方の主観に関係なく取り消せます。"]],
  "gy-m2":[["考え方", "代理は「代理権あり（有権代理）」「なし（無権代理）」「ないが責任を負わせる（表見代理）」の3つに分けます。復代理は、任意代理か法定代理かで要件が違います。"], ["ひっかけ所", "「いつでも自由に」（肢5）という言い切り。任意代理人は本人の信頼を受けて選ばれているので、許諾かやむを得ない事由がなければ復代理人を選べません（104条）。"], ["関連知識", "法定代理人は自己の責任で復代理人を選任でき、やむを得ない事由があるときは選任・監督の責任だけを負います（105条）。復代理人は本人を代理し、本人に対して代理人と同じ権利義務を負います（106条）。"]],
  "gy-m3":[["考え方", "時効の問題は「完成猶予（止まる）」と「更新（ゼロから数え直す）」を分けて考えます。裁判上の請求は、まず完成猶予、判決で権利が確定すると更新です（147条）。"], ["ひっかけ所", "催告の猶予期間「6か月」を「1年」に変える肢、所有権も消滅時効にかかるとする肢、協議の合意を口頭でもよいとする肢が典型です。"], ["関連知識", "時効の利益は、時効が完成した後なら放棄できます（あらかじめの放棄だけが禁止、146条）。協議を行う旨の書面の合意による猶予は、原則1年です（151条1項）。"]],
  "gy-m4":[["考え方", "物権変動は「当事者の間では意思表示だけで移る（176条）」「第三者に主張するには対抗要件が必要（不動産は登記、動産は引渡し）」の二段で考えます。"], ["ひっかけ所", "動産の対抗要件を登記とする肢、登記がないと当事者の間でも移転しないとする肢、占有改定でも即時取得できるとする肢。どれも基本の入れ替えです。"], ["関連知識", "177条の「第三者」から外れるのは、背信的悪意者、不法占拠者、無権利者などです。単なる悪意者（知っていただけの者）は第三者に含まれ、登記がないと対抗できません。"]],
  "gy-m5":[["考え方", "保証の「付従性」（主たる債務より重くならない、主たる債務が消えれば消える）と、「補充性」（催告・検索の抗弁）を分けて確かめます。連帯保証には補充性がありません。"], ["ひっかけ所", "「約定どおりの負担を負う」（肢5）は付従性を無視した肢です。保証人の負担が重いときは、主たる債務の限度まで減ります（448条1項）。"], ["関連知識", "保証契約は書面（電磁的記録を含む）が必要（446条2項・3項）。個人根保証は極度額が必要、事業のための貸金等債務の個人保証は公正証書による意思確認が必要（主たる債務者の取締役などは例外）。"]],
  "gy-m6":[["考え方", "契約不適合のときの買主の手段は「追完請求→代金減額→損害賠償・解除」の4つ。どの手段に、どんな要件（催告・帰責事由）が要るかを比べて読みます。"], ["ひっかけ所", "「どのような場合でも催告なしに減額」「数量も1年以内に通知が必要」「売主に帰責事由がないと解除できない」は、要件の付け外しのひっかけです。"], ["関連知識", "1年以内の通知が必要なのは種類・品質の不適合だけで、売主が引渡し時に不適合を知り、または重過失で知らなかったときは不要です（566条ただし書）。損害賠償だけは売主の帰責事由が必要です。"]],
  "gy-m7":[["考え方", "特殊な不法行為（監督義務者・使用者・工作物など）は、誰が、どんな免責の証明をすれば責任を免れるかで整理します。胎児の扱い（721条）は条文の例外として覚えます。"], ["ひっかけ所", "「生まれた後でなければ取得しない」（肢5）は、721条の例外を消した肢です。時効期間の数字（3年・5年・20年）の入れ替えもよく出ます。"], ["関連知識", "使用者が賠償したときは、被用者に信義則上相当な範囲で求償できます（715条3項と判例）。名誉毀損では、損害賠償のほかに謝罪広告などの名誉回復処分を求められます（723条）。"]],
  "gy-m8":[["考え方", "相続は「誰が相続人か（順位・代襲）」「どれだけ（相続分・遺留分）」「どう承認・放棄するか」の3つに分けて肢を見ます。"], ["ひっかけ所", "配偶者の相続分（子と2分の1、直系尊属と3分の2、兄弟姉妹と4分の3）の入れ替え、兄弟姉妹にも遺留分があるとする肢、子の配偶者が代襲するとする肢が典型です。"], ["関連知識", "兄弟姉妹の代襲は、その子（おい・めい）までです（889条2項・887条2項）。自筆証書遺言の財産目録は自書でなくてよく、毎葉に署名・押印が必要です（968条2項）。"]],
  "gy-g13":[["考え方", "代執行の要件は「代替的作為義務の不履行」「他の手段で履行を確保することが困難」「放置すると著しく公益に反する」の3つ（2条）。手続は戒告→代執行令書→実施→費用徴収の順です。"], ["ひっかけ所", "「緊急の場合でも必ず戒告が必要」（肢4）は、3条3項の例外を消したひっかけです。裁判所の許可が要る（肢5）という肢もよく出ますが、行政代執行は裁判所を通さない仕組みです。"], ["関連知識", "「法律」には、法律の委任に基づく命令・規則・条例も含まれます（2条かっこ書）。そのため、条例で命じられた義務も代執行の対象になります。費用は国税滞納処分の例で強制徴収できます（6条1項）。"]],
  "gy-m9":[["考え方", "賃貸借は「賃貸人の義務（修繕・費用償還）」と「賃借人の義務（無断譲渡・転貸の禁止、原状回復）」に分けます。2020年改正で条文になった敷金・原状回復が狙われます。"], ["ひっかけ所", "通常損耗・経年変化も原状回復の対象とする肢（肢5）。賃借人の原状回復義務から、通常の使用による損耗と経年変化は除かれています（621条）。"], ["関連知識", "必要費はすぐに、有益費は賃貸借の終了時に、価格の増加が残る場合に限り償還を求められます（608条）。無断転貸でも、背信的行為と認めるに足りない特段の事情があれば解除できない（判例）。"]],
  "gy-c1":[["考え方", "人権の問題は「誰に保障されるか（主体）」「どの条文か」「判例の結論と理由」の3点で確かめます。外国人には、権利の性質上日本国民のみを対象とするものを除き保障が及びます（性質説、マクリーン事件）。"], ["ひっかけ所", "判例の結論を逆にした肢（在外国民の選挙権の制限は「違憲となる余地はない」、税関検査は「検閲に当たる」）と、条文にあるものを「ない」とする肢が典型です。"], ["関連知識", "マクリーン事件は、外国人の政治活動の自由も、わが国の政治的意思決定に影響を及ぼす活動などを除いて保障されるとしつつ、在留期間の更新の判断で考慮されることは妨げないとしました。"]],
  "gy-c2":[["考え方", "国会の数字は「総議員」か「出席議員」か、「過半数」か「3分の2」かの組み合わせで整理します。定足数は総議員の3分の1以上です（56条1項）。"], ["ひっかけ所", "定足数を「過半数」に変える肢（肢5）。衆議院の優越の日数（30日・10日・60日）の入れ替えもよく出ます。"], ["関連知識", "両院協議会を必ず開くのは、予算・条約・総理大臣の指名で議決が異なったとき。法律案は任意（59条3項）です。"]],
  "gy-c3":[["考え方", "内閣は「文民・過半数が国会議員・連帯責任」、裁判官は「身分保障（報酬減額禁止）・国民審査」の特徴で確かめます。"], ["ひっかけ所", "参議院の問責決議に衆議院の不信任と同じ効果を持たせる肢、国民審査を参議院選挙のときとする肢。どちらも「衆議院」だけの制度のすり替えです。"], ["関連知識", "内閣総理大臣は国会議員の中から指名します（67条1項）。国務大臣は過半数が国会議員であればよく、総理大臣が任命・罷免します（68条）。"]],
  "gy-s1":[["考え方", "株式会社の機関は「どの会社で置く義務があるか」「人数」「任期」「決議要件」を表にして確かめます。公開会社は取締役会が必須です（327条1項1号）。"], ["ひっかけ所", "取締役会設置会社の取締役「3人」を2人に、取締役の任期「2年」を監査役の4年に、普通決議の「過半数」を特別決議の3分の2に、と数字を入れ替える肢が中心です。"], ["関連知識", "監査役は会社や子会社の取締役・支配人などを兼ねられません（335条2項）。取締役会設置会社は、原則として監査役を置く必要があります（327条2項）。"]],
  "gy-s2":[["考え方", "商行為の規定は「民法ならどうなるか」と比べて読みます。民法の委任は原則無償だが商人は報酬請求できる、民法の代理は顕名が必要だが商行為は不要、などの違いが問われます。"], ["ひっかけ所", "改正で削除された規定（商事法定利率 年6分）を今も有効のように書く肢（肢5）。2020年からは民法の法定利率（年3%、3年ごとに見直し）に一本化されています。"], ["関連知識", "商人間の売買の検査・通知義務（526条）は、商人同士の取引を早く確定させるための特則です。種類・品質の不適合で直ちに発見できないものは、6箇月以内に発見して通知すれば権利を失いません。"]],
  "gy-b1":[["考え方", "法の適用の原則（特別法優先・後法優先・法律不遡及）と、解釈の種類（文理・拡張・縮小・類推・反対・勿論）の定義を正確に覚え、肢の説明と照らし合わせます。"], ["ひっかけ所", "解釈方法の定義を入れ替える肢（拡張解釈の説明を反対解釈として書くなど）と、「常に」優先すると言い切る肢が典型です。"], ["関連知識", "法律は、施行期日の定めがないときは公布の日から起算して20日を経過した日から施行されます（法の適用に関する通則法2条）。刑罰法規の類推解釈が許されないのは、罪刑法定主義（憲法31条）によります。"]],
  "gy-b2":[["考え方", "裁判所の組織は「最高裁（長官＋14人）」「下級裁判所（高裁・地裁・家裁・簡裁）」に分け、任命の主体を確かめます。"], ["ひっかけ所", "下級裁判所の裁判官の任命の主体を「最高裁判所」とする肢（肢5）。最高裁は名簿で指名するだけで、任命するのは内閣です。"], ["関連知識", "簡易裁判所は訴額140万円以下の請求（行政事件訴訟を除く）を扱います。特別裁判所は設置できず、行政機関は終審として裁判できませんが、前審としてなら裁判できます（76条2項）。"]],
  "gy-i1":[["考え方", "行政書士法は、行政書士の使命・職責（1条・1条の2）と業務の範囲（1条の3・1条の4）を条文で確認します。業務は、書類の作成、提出手続の代理、相談などです。"], ["ひっかけ所", "他の法律で制限されている業務もできるとする肢、不服申立ての代理を「すべての行政書士」ができるとする肢。代理ができるのは研修を修了した特定行政書士だけです。"], ["関連知識", "行政書士法は近年改正が続いており、本試験は基準日（令和8年4月1日）現在の条文で出題されます。条文番号と文言は最新の条文で確かめましょう。"]],
  "gy-i2":[["考え方", "個人情報保護法は、定義（個人情報・要配慮個人情報・個人データ）と、事業者の義務（利用目的の特定・取得・第三者提供）をつなげて理解します。"], ["ひっかけ所", "死者の情報も個人情報に当たるとする肢（肢5）。個人情報は「生存する個人」に関する情報に限られます。"], ["関連知識", "要配慮個人情報は、本人の同意なしの取得が原則禁止で、オプトアウトによる第三者提供もできません（27条2項）。2021・2022年の改正で行政機関の規定も一つの法律にまとめられました。"]],
  "gy-i3":[["考え方", "行政書士の資格は「試験合格・弁護士・弁理士・公認会計士・税理士・公務員として行政事務20年（高卒等17年）」の6つ（2条）。そのうえで欠格事由（2条の2）に当たると資格がありません。"], ["ひっかけ所", "欠格事由の期間は「3年」で、「永久に」ではありません（肢5）。未成年者と破産者（復権を得ない者）は、期間に関係なく欠格です。"], ["関連知識", "資格があっても、行政書士となるには日本行政書士会連合会に備える名簿に登録を受けなければなりません（6条1項）。"]],
  "gy-i4":[["考え方", "行政書士の義務は「帳簿（9条）・信用失墜行為の禁止（10条）・報酬の掲示（10条の2）・依頼に応ずる義務（11条）・守秘義務（12条）」と整理します。"], ["ひっかけ所", "帳簿の保存期間「2年」を「5年」に、守秘義務を「在職中だけ」に変えた肢が典型です。「手数料」「会費」などの名目で報酬規制を逃れる肢も誤りです（肢5）。"], ["関連知識", "行政書士でない者は、行政書士またはこれと紛らわしい名称を用いてはなりません（19条の2第1項）。"]],
  "gy-i5":[["考え方", "事業者の義務（安全管理23条・漏えい報告26条）と、本人の請求（開示33条・利用停止等35条）、監督機関（個人情報保護委員会）に分けて読みます。"], ["ひっかけ所", "本人の利用停止等の請求を「できない」「委員会に申し出るだけ」とすり替えた肢が誤りです（肢5）。開示しないことができる例外（33条2項ただし書）は正しい内容です。"], ["関連知識", "個人情報保護委員会は、内閣府設置法49条3項に基づいて置かれる合議制の機関です（130条1項）。事業者に勧告・命令ができ（148条）、命令違反には罰則があります。"]],
  "gy-g14":[["考え方", "意見公募手続は「案の公示→30日以上の意見提出期間→提出意見の十分な考慮→結果の公示」の流れ（39条〜43条）。対象の「命令等」の範囲（2条8号）が出発点です。"], ["ひっかけ所", "「法律も含まれる」「利害関係人に限る」「考慮する必要はない」はどれも誤り。行政手続法は地方公共団体の機関が命令等を定める行為に適用されない点（3条3項）も狙われます。"], ["関連知識", "命令等には、政令・省令などの法律に基づく命令と規則のほか、審査基準・処分基準・行政指導指針が含まれます（2条8号）。意見提出期間は「公示の日から起算して30日以上」です。"]],
  "gy-g15":[["考え方", "審査庁が「処分庁の上級行政庁または処分庁」か、「それ以外」かで、できる範囲が変わります。上級行政庁・処分庁は職権でも、効力等の停止以外の措置もできます（25条2項）。"], ["ひっかけ所", "それ以外の審査庁（第三者機関など）を、上級行政庁と同じ扱いにする肢（肢5）。申立てが必要で、処分庁の意見を聴く必要があり、停止以外の措置はとれません（25条3項）。"], ["関連知識", "重大な損害を避けるため緊急の必要があるときは、原則として執行停止を「しなければならない」（義務的執行停止、25条4項）。審理員は、執行停止をすべき旨の意見書を審査庁に出せます（40条）。"]],
  "gy-g16":[["考え方", "情報公開法は「誰でも請求できる→原則として開示→不開示情報だけ例外」という仕組みです。開示が原則で、不開示は限られた場合だけ、という方向で肢を読みます。"], ["ひっかけ所", "「何人も」を「日本国民に限る」に変える、30日を60日に変える、「延長できない」「必ず存否を明らかに」と言い切る、の4つが典型です。"], ["関連知識", "開示請求の対象は「行政文書」（組織的に用いるものとして行政機関が保有しているもの）です。開示決定等に不服があれば審査請求ができ、原則として情報公開・個人情報保護審査会に諮問されます（19条）。"]],
