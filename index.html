<style>
/* Layout: one column like a bound statute book: deep green cloth, gold-foil rules and mincho headings. Deliberate single dark look. */
:root {
  --night: #14302a;      /* cloth binding */
  --window: #1a3a32;     /* panel */
  --deep: #10261f;       /* writing field */
  --chalk: #efe9d8;      /* text (paper) */
  --muted: #b2c0b6;
  --line: #2f5a4e;       /* quiet rule */
  --gold: #d4b25a;       /* gold foil / accent */
  --hit: #9fe0b6;        /* correct */
  --miss: #f3a08f;       /* wrong */
  --font-pixel: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(circle at 50% -10%, #1c3f36 0%, transparent 55%), repeating-linear-gradient(45deg, rgb(255 255 255 / .012) 0 2px, transparent 2px 5px);
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wgrid, .wcol { display: flex; flex-direction: column; gap: 16px; }
.due { color: var(--gold); font-weight: 700; }
.today { display: grid; gap: 8px; border-color: var(--gold); }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.todo .linkish { width: 100%; display: flex; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 6px 2px; min-height: 44px; font-size: 14px; }
.todo .linkish:hover:not(:disabled) { background: rgb(255 255 255 / .04); }
.todo .num { color: var(--gold); font-size: 16px; }
.today .big { width: 100%; min-height: 48px; font-size: 16px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles button { display: grid; justify-items: center; gap: 2px; padding: 10px 4px; background: var(--window); }
.tiles b { font-family: var(--font-pixel); color: var(--gold); font-size: 22px; line-height: 1.2; }
.tiles .note { margin: 0; font-size: 11px; }
.wrap details.kgroup > summary .mbar { width: 64px; flex: none; margin-left: auto; }
.wrap details.kgroup > summary .kcount { margin-left: 8px; width: 128px; flex: none; text-align: right; }
.others > summary { color: var(--gold); }
.gyentry { grid-template-columns: auto 1fr auto; border-color: var(--gold); }
.gyentry > b { font-size: 26px; color: var(--gold); width: 48px; text-align: center; }
/* 答え合わせ：見出し・ポイント・肢ごとの正誤 */
#msg { scroll-margin-top: 12px; }
#msg:focus { outline: none; }
.gyres { display: flex; align-items: center; gap: 12px; margin: -2px 0 12px; padding: 10px 12px; border-radius: 4px; border: 1px solid; }
.gyres.ok { border-color: var(--hit); background: color-mix(in srgb, var(--hit) 12%, transparent); }
.gyres.ng { border-color: var(--miss); background: color-mix(in srgb, var(--miss) 12%, transparent); }
.gyres-mark { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: 700; color: var(--deep); }
.gyres.ok .gyres-mark { background: var(--hit); }
.gyres.ng .gyres-mark { background: var(--miss); }
.gyres b { display: block; font-family: var(--font-pixel); font-size: 19px; font-weight: 600; }
.gyres.ok b { color: var(--hit); }
.gyres.ng b { color: var(--miss); }
.gyres div > span { display: block; font-size: 14px; color: var(--chalk); }
.gyres span b { display: inline; font-size: 17px; color: var(--gold); font-family: inherit; }
.gypoint { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--deep); border-radius: 0 4px 4px 0; }
.gypoint h4, .gyexw h4 { margin: 0 0 4px; font-size: 14px; color: var(--gold); }
.gypoint p { margin: 0; font-size: 15px; line-height: 1.75; }
.gyexw { margin: 0 0 8px; }
.gyex, .gyblank { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gyex li { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 4px 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; }
.gyex li p { grid-column: 1 / -1; margin: 0; font-size: 14.5px; line-height: 1.7; color: var(--chalk); }
.gyex li.ans { border-color: var(--hit); }
.gyex li.mine:not(.ans) { border-color: var(--miss); }
.gyn { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 4px; border: 1px solid var(--muted); border-radius: 3px; font-size: 13px; color: var(--muted); }
.gytf { font-size: 13px; font-weight: 700; }
.gytf.t { color: var(--hit); }
.gytf.f { color: var(--miss); }
.gytag { justify-self: start; font-size: 12px; padding: 1px 6px; border-radius: 10px; background: var(--hit); color: var(--deep); font-weight: 700; }
.gytag.mine { background: var(--miss); }
.gyex li .gytag + .gytag { grid-column: 3; }
.gyblank li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 14.5px; }
.gyblank li.r { border-color: var(--hit); }
.gyblank li.w { border-color: var(--miss); }
.gyblank small { display: block; color: var(--muted); font-size: 13px; }
.gyart { margin: 8px 0 0; font-size: 13px; }
.gytext .blank { color: var(--gold); }
.gywords { margin: 4px 0 10px; padding-left: 2.2em; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 2px 12px; font-size: 14px; }
.gysel { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; margin-bottom: 8px; }
.gysel label { display: flex; gap: 6px; align-items: center; font-family: var(--font-pixel); color: var(--gold); border: 1px solid transparent; border-radius: 3px; padding: 2px 4px; }
.gysel label.right { border-color: var(--hit); }
.gysel label.wrong { border-color: var(--miss); }
.gysel select { flex: 1; min-width: 0; min-height: 44px; font: inherit; font-family: var(--font-body); color: var(--chalk); background: var(--deep); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; }
.gydet { margin: 10px 0 0; border-top: 1px dashed var(--line); padding-top: 8px; }
.gydet h4, .jobun > summary { margin: 0 0 4px; font-size: 14px; color: var(--gold); }
.gydet ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: 14px; line-height: 1.7; }
.gydet li b { color: var(--gold); margin-right: .5em; }
.jobun { margin: 10px 0 0; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; background: var(--deep); }
.jobun > summary { cursor: pointer; }
.jbart { margin: 8px 0 0; font-size: 13.5px; line-height: 1.8; }
.jbart p { margin: 2px 0 6px; }
.jbh, .jbart > summary { font-weight: bold; color: var(--chalk); margin: 0 0 2px; }
details.jbart > summary { cursor: pointer; }
.jbpart { color: var(--muted); font-weight: normal; margin-left: .3em; }
.jbn { display: inline-block; min-width: 1.4em; color: var(--muted); }
.jbi { display: inline-block; padding-left: 1em; text-indent: -1em; margin-left: 1em; }
.jbi2 { margin-left: 2em; }
.jbsrc { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.gymock h3{margin:0 0 6px;font-size:17px}
.gymh{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.gytimer{margin-left:auto}
.gytimer.over{color:var(--miss);border-color:var(--miss)}
.gymr{width:100%;border-collapse:collapse;margin:8px 0}
.gymr th,.gymr td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.gymr td.ok{color:var(--hit);font-weight:700}
.gymr td.ng{color:var(--miss);font-weight:700}
.gyleft{margin:0 0 6px;font-family:var(--font-pixel);color:var(--gold);font-size:15px}
.gyleft b{font-size:26px;margin:0 4px}
/* 解説と条文が長いので、「つぎへ」を画面の下に貼りつける */
#msg:has(.gydet) > .row:last-child{position:sticky;bottom:0;margin:0 -16px -14px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--window) 30%)}
.gyq .question{white-space:pre-line}
.gyexam{border-color:var(--gold)}
.gxc button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent);font-weight:700}
.gxflag{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.gxnav{flex-wrap:wrap}
.gxh{font-size:14px;margin:12px 0 6px}
.gxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.gxgrid button{min-height:44px;padding:4px 0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.gxgrid button small{font-size:11px}
.gxgrid button.done{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.gxgrid button.flag{outline:2px solid var(--miss);outline-offset:-2px}
.gxgrid button.cur{border-color:var(--gold);border-width:2px}
.gxgrid button.ok{color:var(--hit)}
.gxgrid button.ng{color:var(--miss)}
.gxgrid button.part{color:var(--gold)}
.gxk{font-size:13px;margin:0 2px}
.gxk.flag{color:var(--miss)}
.gxtabs{justify-content:flex-start;flex-wrap:wrap;margin:0 0 8px}
.gxtabs button[aria-pressed="true"]{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.gxsheet{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.gxsheet button{width:100%;display:grid;grid-template-columns:3.4em 1fr auto;grid-template-areas:"n a t";gap:0 8px;align-items:center;text-align:left;padding:6px 10px;min-height:44px}
.gxsheet .gxno{grid-area:n;font-family:var(--font-pixel);color:var(--gold)}
.gxsheet .gxsub{display:none}
.gxsheet .gxans{grid-area:a;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.gxsheet .gxstar{grid-area:t;color:var(--miss)}
.gxsheet button.none{border-color:var(--miss)}
.gxsheet button.none .gxans{color:var(--miss);font-weight:700}
.gxsheet .gxsh{font-size:13px;color:var(--gold);margin:8px 0 2px}
.others .fsw { justify-content: flex-start; margin: 8px 0; }
.others details.win { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 0; box-shadow: none; margin: 0; }
.kname { white-space: nowrap; }
@media (max-width: 420px) { .wrap details.kgroup > summary .kcount { width: 108px; font-size: 11px; } .wrap details.kgroup > summary .mbar { width: 48px; } }
@media (max-width: 420px) { html[data-fs="l"] .wrap details.kgroup > summary .mbar { display: none; } html[data-fs="l"] .tiles .note { font-size: 10px; } }
.hs { margin: 6px 0; padding-left: 1.2em; font-size: 13px; line-height: 1.7; }
.xfer { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.xfer button { min-height: 44px; font-size: 13px; }
#xferBox { min-height: 0; font-size: 12px; word-break: break-all; }
.others details.training > summary.section-label { margin: 12px 0 6px; }
.wlist .new { color: var(--muted); }
.chapter-head { position: relative; padding-inline: 64px; }
.topback { position: absolute; left: 0; top: 50%; transform: translateY(-50%); min-height: 40px; padding: 4px 10px; font-size: 13px; font-family: var(--font-body); }
.fsw { display: flex; gap: 6px; justify-content: center; align-items: center; }
.fsw button { min-height: 36px; padding: 4px 12px; font-size: 13px; }
.fsw button[aria-pressed="true"], .fsw button[aria-pressed="true"]:hover { background: var(--gold); color: var(--deep); border-color: var(--gold); }
html[data-fs="l"] .wrap { zoom: 1.15; }
.factbtn { position: fixed; right: 16px; bottom: 16px; z-index: 20; border-color: var(--gold); background: var(--window); color: var(--gold); box-shadow: 0 4px 14px rgb(0 0 0 / .45); }
.factdlg { max-width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--window); color: var(--chalk); border: 2px solid var(--gold); border-radius: 6px; padding: 16px; }
.factdlg::backdrop { background: rgb(0 0 0 / .6); }
.modeld > summary { font-size: 14px; }
.modeld[open] > summary { margin-bottom: 4px; }
.stickybar { position: sticky; bottom: 0; z-index: 10; box-shadow: 0 -6px 16px rgb(0 0 0 / .4); padding-block: 8px; }
.win.msg.stickybar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stickybar .row { flex-wrap: nowrap; gap: 6px; }
.stickybar button { padding: 8px 10px; font-size: 14px; white-space: nowrap; }
.stickybar p { margin: 0; }
@media (min-width: 1000px) {
  .wrap:has(> .wgrid), .wrap:has(> .cmpwide) { max-width: 1200px; }
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .wgrid > .facts { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}
.win {
  background: var(--window);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 14px 16px;
  box-shadow: 0 1px 0 rgb(0 0 0 / .25);
}
.pixel { font-family: var(--font-pixel); letter-spacing: .04em; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
button {
  font: inherit; color: inherit; cursor: pointer;
  background: transparent; border: 1px solid var(--muted); border-radius: 3px;
  padding: 10px 14px;
}
button:hover:not(:disabled) { background: #22473d; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button:disabled { cursor: default; opacity: .55; }
.btn-gold { border-color: var(--gold); background: var(--gold); color: #14302a; font-weight: 700; }
.btn-gold:hover:not(:disabled) { background: #e2c374; }

/* title */
.title { text-align: center; padding-block: 18px; display: grid; gap: 6px; }
.title h1 { font-family: var(--font-pixel); font-size: clamp(34px, 9vw, 54px); color: var(--gold); line-height: 1.2; font-weight: 800; letter-spacing: .08em; }
.title p { margin: 0; color: var(--muted); font-size: 14px; }

/* status bar */
.status { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-family: var(--font-pixel); }
.status .hearts { color: var(--miss); letter-spacing: .1em; }
.expbar { flex: 1 1 140px; min-width: 120px; height: 8px; border: 1px solid var(--muted); border-radius: 2px; overflow: hidden; }
.expbar i { display: block; height: 100%; background: var(--gold); transition: width .4s; }
.tnum { font-variant-numeric: tabular-nums; }

/* map */
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.area { text-align: left; display: grid; gap: 6px; padding: 12px; border-width: 2px; background: var(--window); }
.area canvas { width: 72px; height: 72px; image-rendering: pixelated; }
.area .name { font-family: var(--font-pixel); font-size: 17px; }
.area .law { font-size: 12px; color: var(--muted); }
.area .badge { font-family: var(--font-pixel); font-size: 12px; color: var(--gold); min-height: 1.4em; }
.area.cleared { border-color: var(--gold); }
.note { color: var(--muted); font-size: 13px; margin: 0; }

/* battle */
.stage { display: grid; justify-items: center; gap: 8px; padding-block: 4px; }
.enemy-name { font-family: var(--font-pixel); font-size: 18px; }
.hpbar { width: min(320px, 100%); height: 12px; border: 2px solid var(--chalk); border-radius: 2px; overflow: hidden; background: #2a1f14; }
.hpbar i { display: block; height: 100%; background: var(--miss); transition: width .5s; }
#enemyCanvas { width: 168px; height: 168px; image-rendering: pixelated; }
.shake { animation: shake .35s; }
.flash { animation: flash .35s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(7px)} 75%{transform:translateX(-4px)} }
@keyframes flash { 0%,100%{filter:none} 50%{filter:brightness(2.4)} }
.hurt { animation: hurt .4s; }
@keyframes hurt { 0%,100%{background:var(--night)} 40%{background:#3d2a1d} }
@media (prefers-reduced-motion: reduce) { .shake, .flash, .hurt { animation: none; } }

.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.tag { font-family: var(--font-pixel); font-weight: 600; font-size: 12px; border: 1px solid var(--gold); color: var(--gold); padding: 0 8px; border-radius: 2px; }
.qcount { font-family: var(--font-pixel); font-size: 12px; color: var(--muted); margin-left: auto; }
.question { font-size: 17px; margin: 0 0 12px; }
.choices { display: grid; gap: 8px; }
.choices.ox { grid-template-columns: 1fr 1fr; }
.choices.ox button { font-family: var(--font-pixel); font-size: 34px; padding-block: 6px; }
.choices button { text-align: left; display: flex; gap: 10px; align-items: baseline; }
.choices.ox button { justify-content: center; }
.choices .key { font-family: var(--font-pixel); color: var(--muted); font-size: 13px; }
.choices button.right { border-color: var(--hit); color: var(--hit); opacity: 1; background: rgba(159,224,182,.10); }
.choices button.right::after { content: "✓ 正解"; margin-left: auto; padding-left: 8px; font-size: 13px; white-space: nowrap; }
.choices button.wrong::after { content: "✗"; margin-left: auto; padding-left: 8px; font-size: 13px; }
.choices button.wrong { border-color: var(--miss); color: var(--miss); opacity: 1; background: rgba(243,160,143,.10); }

.msg { display: grid; gap: 8px; }
.msg .line { font-family: var(--font-pixel); font-size: 16px; margin: 0; }
.msg .line.good { color: var(--hit); }
.msg .line.bad { color: var(--miss); }
.explain { margin: 0; }
.article { font-size: 13px; color: var(--gold); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

/* review */
.review { display: grid; gap: 10px; }
.review article { border-top: 1px dashed var(--line); padding-top: 10px; }
.review article:first-child { border-top: 0; padding-top: 0; }
.review h3 { font-size: 15px; font-weight: 700; }
.review p { margin: 2px 0 0; font-size: 14px; }

/* story */
.section-label { font-family: var(--font-pixel); color: var(--gold); font-size: 15px; margin: 4px 0 -6px; }
.chapters { display: grid; gap: 8px; }
.chapter { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--window); }
.chapter canvas { width: 48px; height: 48px; image-rendering: pixelated; }
.chapter .ch-title { font-family: var(--font-pixel); font-size: 16px; display: block; }
.chapter .ch-sub { font-size: 12px; color: var(--muted); display: block; }
.chapter .ch-state { font-family: var(--font-pixel); font-size: 12px; color: var(--gold); }
.chapter.done { border-color: var(--gold); }
.chapter-head { font-family: var(--font-pixel); color: var(--gold); text-align: center; font-size: 18px; padding-block: 6px; }
.scene { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; min-height: 140px; }
.scene canvas { width: 84px; height: 84px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 4px; }
.scene .speaker { font-family: var(--font-pixel); color: var(--gold); font-size: 14px; }
.scene p { margin: 4px 0 0; font-size: 16px; }
.scene > div { min-width: 0; }
.facts { border-color: var(--gold); }
.facts p { margin: 6px 0 0; }
@media (max-width: 420px) { .scene canvas { width: 60px; height: 60px; } }

/* adventure */
.bunya-label { font-size: 13px; font-weight: 700; color: var(--chalk); margin: 10px 0 -2px; padding-left: 8px; border-left: 3px solid var(--gold); }
.sub-label { font-family: var(--font-pixel); font-weight: 400; font-size: 14px; color: var(--muted); margin: 6px 0 -4px; }
.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0 0 4px; justify-content: center; }

.steps li.now { border-color: var(--gold); color: var(--gold); }
.steps li.done { border-color: var(--hit); color: var(--hit); }
.memo { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
.memo li { font-size: 14px; }
.asks { display: grid; gap: 8px; }
.asks button { text-align: left; }
.board { border-color: var(--gold); display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; align-items: start; border-top: 1px dashed var(--line); padding-top: 8px; }
.brow .blabel { display: grid; font-size: 11px; color: var(--muted); }
.brow .blabel .pixel { font-size: 14px; color: var(--chalk); }
.brow .bval { font-size: 14px; min-width: 0; color: var(--muted); }
.brow.filled .bval { color: var(--chalk); }
.brow.filled .blabel .pixel { color: var(--gold); }
.factpick { display: grid; gap: 8px; }
.factpick button { text-align: left; font-size: 14px; }
.factpick button[aria-pressed="true"] { border-color: var(--gold); background: #2a2614; }
.factpick button.right { border-color: var(--hit); color: var(--hit); opacity: 1; }
.factpick button.wrong { border-color: var(--miss); color: var(--miss); opacity: 1; }

.drillcard { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; border-color: var(--gold); }
.drill-main { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.streak { display: grid; justify-items: center; text-align: center; gap: 2px; }
.streak-num { font-family: var(--font-pixel); font-size: 34px; color: var(--gold); line-height: 1; }
.streak-inline .streak-num { font-size: 24px; }
.mastery { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 6.5em 1fr 7.5em; gap: 10px; align-items: center; font-size: 14px; }
.mbar, .dprog { height: 8px; border: 1px solid var(--muted); border-radius: 2px; overflow: hidden; display: block; }
.mbar i, .dprog i { display: block; height: 100%; background: var(--hit); }

.ph { margin: 10px 0 4px; font-family: var(--font-pixel); font-weight: 400; font-size: 13px; color: var(--gold); }
.quote { margin: 4px 0 0; font-size: 14px; }

.timerbar .over { color: var(--gold); }

.ai .aiout { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; }
.ai .aiout:empty { display: none; }
details.training > summary.section-label { margin: 22px 0 6px; }
.wlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 6px; }
.wlist button { text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 6px 12px; background: var(--window); }
.wlist .ch-title { font-family: var(--font-pixel); font-size: 14px; line-height: 1.4; }
.wlist .ch-title .star { color: var(--gold); margin-right: 4px; font-weight: 400; }

details.kgroup { border-bottom: 1px solid var(--line); }
details.kgroup > summary { justify-content: space-between; padding: 2px; margin: 0; font-size: 16px; color: var(--chalk); }
details.kgroup > summary .kcount { margin-left: auto; font-family: var(--font-body); font-size: 12px; color: var(--muted); }
details.kgroup[open] { padding-bottom: 10px; }
details summary { cursor: pointer; font-family: var(--font-pixel); color: var(--gold); min-height: 44px; display: flex; align-items: center; gap: 6px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "▶"; font-size: 11px; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
details ul { margin: 8px 0 0; padding-left: 1.2em; font-size: 14px; }
details li + li { margin-top: 4px; }

/* 六法全書: gold double rule under the title, and gold frames on the featured panels */
.title { border-bottom: 3px double var(--gold); padding-bottom: 16px; }
.title p { letter-spacing: .06em; }
.drillcard, .facts { border-color: var(--gold); }
.section-label { font-weight: 600; letter-spacing: .06em; }
.chapter-head { font-weight: 600; letter-spacing: .06em; }
.cmp .model { color: var(--chalk); white-space: pre-wrap; }

  const s = { map: base.map, pal: Object.assign({}, base.pal, palOverride || {}) };

}

function fieldOf(q, areaId) {
  const tag = (q.src || "") + " " + (q.art || "");
  if (areaId === "tower" || areaId === "koho") {
    if (/行政/.test(tag)) return "行政法";
    if (/民法|民事/.test(tag)) return "民法";
    if (/刑法|刑事/.test(tag)) return "刑法";
    return "憲法";
  }
  return FIELD_OF_AREA[areaId];
}
