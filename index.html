  "gy-g17":[["考え方", "条例と規則の違い（制定する者、置ける罰則、義務を課せるか）を表にします。義務を課し、権利を制限するには条例が必要です（14条2項）。"], ["ひっかけ所", "規則で罰金を科せる（肢3）、規則で義務を課せる（肢4）、法令に反する条例も作れる（肢2）は、条例と規則の入れ替えや原則の否定です。"], ["関連知識", "条例の罰則は「2年以下の拘禁刑・100万円以下の罰金・拘留・科料・没収」または「5万円以下の過料」。規則は「5万円以下の過料」だけ。地方税や使用料・手数料の条例は直接請求の対象外です（74条1項）。"]],
  "gy-m10":[["考え方", "解除は「債権者を契約から解放する」制度なので、債務者の帰責事由は要りません。催告解除（541条）と無催告解除（542条）のどちらの場面かを先に決めます。"], ["ひっかけ所", "旧法の「帰責事由が必要」をそのまま書いた肢、軽微な不履行でも解除できるとする肢、債権者に帰責事由があっても解除できるとする肢。どれも改正点・ただし書のひっかけです。"], ["関連知識", "解除すると各当事者は原状回復義務を負い、金銭は受け取った時からの利息を付けて返します（545条2項）。解除しても損害賠償は請求できます（545条4項）。"]],
  "gy-m11":[["考え方", "抵当権は「占有を移さない担保」です。設定者は使い続けられ、債務不履行のときに競売などで優先弁済を受けます。物上代位・法定地上権・利息の範囲という特徴を順に確かめます。"], ["ひっかけ所", "「設定後は使用も賃貸もできない」（肢5）は、質権（占有を移す担保）と混同させるひっかけです。"], ["関連知識", "物上代位は、払渡しや引渡しの前に差押えが必要です（372条・304条1項）。法定地上権は、抵当権設定時に土地と建物が同じ所有者だったことが要件です（388条）。"]],
  "gy-m12":[["考え方", "共有物について「何をするか」で必要な同意が変わります。保存＝各自、管理（軽微な変更を含む）＝持分の過半数、変更＝全員。この3段階に当てはめます。"], ["ひっかけ所", "「分割をしない契約は一切できない」（肢5）という言い切り。5年を超えない期間なら、分割しない契約ができます（256条1項ただし書）。"], ["関連知識", "2023年施行の改正で、形状・効用の著しい変更を伴わない「軽微な変更」は過半数でできるようになりました（251条1項かっこ書・252条1項）。所在の分からない共有者がいるときの裁判所の手続も新設されました。"]],
  "gy-g18":[["考え方", "処分等の求め（36条の3）は、法令違反を見つけた人が行政に「処分や行政指導をしてほしい」と求める制度です。行政指導の中止等の求め（36条の2）と、主体と対象を比べて読みます。"], ["ひっかけ所", "「直接に権利を侵害されている者に限る」（肢1）は、「何人も」をすり替えたひっかけです。届出は「受理」がなくても到達で義務が果たされる（37条）点も定番です。"], ["関連知識", "処分等の求めは申出書を出してします（36条の3第2項）。申出を受けた行政庁等は必要な調査をし、必要があると認めるときは処分や行政指導をしなければなりません（同条3項）。"]],
  "gy-g19":[["考え方", "教示は「処分を書面でするとき、相手方に、書面で」が原則です（82条1項）。口頭の処分には相手方への教示義務がない一方、利害関係人から求められれば教示が必要です（82条2項）。"], ["ひっかけ所", "「口頭でする場合であっても」（肢5）のように、ただし書の例外を消した肢です。教示をしなかったときの救済（処分庁に不服申立書を出せる、83条）もセットで狙われます。"], ["関連知識", "教示の内容は「不服申立てができる旨」「すべき行政庁」「期間」の3つ。誤った教示で別の行政庁に審査請求書が出されたときは、正しい審査庁に送付され、初めから適法な審査請求があったものとみなされます（22条）。"]],
  "gy-g20":[["考え方", "被告は「処分をした行政庁が所属する国・公共団体」が原則（11条1項）、所属先がない行政庁はその行政庁自身（11条2項）、どれもなければ事務の帰属する国・公共団体（11条3項）、の3段階です。"], ["ひっかけ所", "出訴期間の数字（6箇月・1年）を3年などに変える肢、行政庁を被告にする肢、審査請求をした場合の起算点を処分時のままにする肢が典型です。"], ["関連知識", "取消訴訟を提起するときは、訴状に処分をした行政庁も書きます（11条4項）。審査請求をした場合の出訴期間は、裁決を知った日から6箇月・裁決の日から1年です（14条3項）。"]],
  "gy-g21":[["考え方", "住民訴訟は「住民監査請求を経た住民」が「財務会計上の違法な行為・怠る事実」について起こす訴訟です。4つの請求の型（242条の2第1項1号〜4号）を見て、肢がどれに当たるかを確かめます。"], ["ひっかけ所", "出訴期間の「30日」を「6箇月」に変える肢、住民でなくてもよいとする肢、4号請求を「住民に直接払わせる」と読み替える肢が典型です。"], ["関連知識", "4号請求で住民が勝訴すると、長は職員などに損害賠償等を請求しなければなりません（242条の3）。住民監査請求は、行為があった日または終わった日から1年以内が原則です（242条2項）。"]],
  "gy-m13":[["考え方", "損害賠償は「要件（不履行・帰責事由・因果関係）」と「範囲（通常損害・予見すべき特別損害）」に分けます。金銭債務は特則（419条）があり、別に考えます。"], ["ひっかけ所", "金銭債務でも不可抗力なら免責されるとする肢（肢5）。金銭債務は、損害の証明も不要、不可抗力の抗弁もできない、という二つの特則がセットです。"], ["関連知識", "金銭債務の損害賠償の額は、原則として法定利率（年3%、変動制）によります（419条1項・404条）。違約金は賠償額の予定と推定されます（420条3項）。"]],
  "gy-m14":[["考え方", "遺言は「方式（どう作るか）」「撤回」「検認」の3つに分けます。自筆証書遺言は全文・日付・氏名の自書と押印が要件で、目録だけ自書でなくてよい（968条）。"], ["ひっかけ所", "後の遺言と前の遺言が抵触したとき「前の遺言が優先」とする肢（肢3）は逆。後の遺言で前の遺言を撤回したものとみなされます（1023条1項）。"], ["関連知識", "検認がいらないのは、公正証書遺言と、法務局に保管された自筆証書遺言です（遺言書保管法11条）。遺言の撤回は、遺言の方式に従ってしなければなりません（1022条）。"]],
  "gy-c4":[["考え方", "財政の規定は「国会が決める（財政民主主義、83条）」が出発点です。予算・予備費・決算で、国会がいつ関わるか（事前の議決・事後の承諾・報告）を確かめます。"], ["ひっかけ所", "予備費の「事後」の承諾を「事前」に変える肢、決算の検査を内閣がするとする肢、租税法律主義から「法律の定める条件」を外す肢が典型です。"], ["関連知識", "会計検査院は内閣から独立した機関で、決算を検査します（90条）。内閣は、少なくとも毎年1回、国の財政状況を国会と国民に報告します（91条）。"]],
  "gy-c5":[["考え方", "地方自治は「地方自治の本旨（住民自治・団体自治）」、憲法改正は「発議（国会）→国民投票→公布（天皇）」の流れで整理します。"], ["ひっかけ所", "憲法改正の発議の「総議員」を「出席議員」に変える肢（肢4）。数字（3分の2）は同じでも、分母が違えば誤りです。"], ["関連知識", "国民の承認は、国民投票で過半数の賛成が必要です（96条1項）。地方自治特別法の住民投票（95条）は、その地方公共団体の住民の過半数の同意が必要です。"]],
  "gy-s3":[["考え方", "設立の流れ「定款作成→公証人の認証→株式の引受け・出資→（設立時役員の選任・調査）→設立登記で成立」を頭に置くと、各肢の誤りがすぐ分かります。"], ["ひっかけ所", "会社が成立する時点を「認証の時」にすり替える肢と、「募集設立なら発起人は引き受けなくてよい」とする肢が典型です。発起人は、どちらの方法でも1株以上引き受けます。"], ["関連知識", "定款は電磁的記録でも作成できます（26条2項）。発起人は、成立後の会社に対し、出資された財産等の価額が定款に記載された価額に著しく不足するときに不足額を支払う責任を負う場合があります（52条）。"]],
  "gy-g22":[["考え方", "期間の問題は、まず「主観的期間（知った日から）」と「客観的期間（あった日から）」に分け、次に制度ごとの数字を当てはめます。主観的期間：審査請求・再調査の請求3月、再審査請求1月、取消訴訟6箇月。"], ["ひっかけ所", "再審査請求の「1月」を「3月」に変える肢（肢3）。客観的期間はどれも1年なので、主観的期間の数字で差をつけてきます。"], ["関連知識", "不服申立ての期間は「知った日の翌日から起算」（初日不算入）、取消訴訟は「知った日から6箇月」と書かれています。再調査の請求をしたときの審査請求は、決定を知った日の翌日から1月です（18条1項）。"]],
  "gy-g23":[["考え方", "まず「聴聞が必要な処分」（13条1項1号イ〜ニ）に当たるかを見て、当たらなければ弁明の機会の付与です。聴聞は口頭の審理、弁明は書面が原則と覚えます。"], ["ひっかけ所", "許認可の取消しや資格のはく奪を「弁明で足りる」とする肢、「聴聞をすることはできない」と言い切る肢。行政庁が相当と認めるときは聴聞もできます（13条1項1号ニ）。"], ["関連知識", "公益上緊急に処分をする必要があるときなどは、聴聞・弁明の手続をとらなくてもよい例外があります（13条2項）。弁明の機会の付与では、証拠書類等の提出もできます（29条2項）。"]],
  "gy-g24":[["考え方", "執行停止は「誰が」「申立てが必要か」で比べます。裁判所（行訴法25条）は申立てが必要、審査庁（行審法25条）は上級行政庁・処分庁なら職権でもできます。"], ["ひっかけ所", "裁判所も職権で執行停止できるとする肢（肢3）。行政不服審査法のルールを行政事件訴訟法にすり替えたひっかけです。"], ["関連知識", "内閣総理大臣の異議（行訴法27条）があると、裁判所は執行停止ができず、すでにした執行停止も取り消さなければなりません。内閣総理大臣は、次の常会で国会に報告しなければなりません（同条6項）。"]],
  "gy-g25":[["考え方", "1条は「人（公務員）」の責任、2条は「物（営造物）」の責任と分けます。要件（故意・過失か、瑕疵か）と、求償の相手（公務員か、他の原因者か）を比べると正解が出ます。"], ["ひっかけ所", "2条に故意・過失を要求する肢、1条の求償を「故意又は過失」で認める肢（正しくは故意又は重大な過失）、営造物を道路・河川に限る肢が典型です。"], ["関連知識", "公の営造物の瑕疵とは「通常有すべき安全性を欠いていること」（高知落石事件）。予算が足りないことは、賠償責任を免れる理由になりません。"]],
  "gy-c6":[["考え方", "数字の問題は「分母（総議員か出席議員か）」と「割合」を分けて覚えます。総議員：定足数3分の1・臨時会4分の1・憲法改正3分の2。出席議員：除名・秘密会・再可決が3分の2。"], ["ひっかけ所", "割合は合っていて分母だけ入れ替えた肢が中心です。除名を「総議員」、再可決を「総議員」、臨時会の要求を「出席議員」とする肢に注意します。"], ["関連知識", "議員の資格争訟で議席を失わせるのも出席議員の3分の2以上です（55条）。秘密会の記録も、特に秘密を要すると認められるもの以外は公表します（57条2項）。"]],
  "gy-m15":[["考え方", "無効・取消しを第三者に主張できるかは「第三者に何が要るか（善意か、善意無過失か、保護なしか）」の一覧で判断します。心裡留保・虚偽表示＝善意、錯誤・詐欺＝善意無過失、強迫＝保護なし。"], ["ひっかけ所", "善意と善意無過失の入れ替えが中心です。心裡留保を「善意無過失」にする肢、錯誤を「善意（過失があってもよい）」にする肢に注意します。"], ["関連知識", "帰責性が大きいほど第三者が保護されやすい、と考えると覚えやすくなります。わざと嘘をついた心裡留保・虚偽表示は「善意」で保護、だまされた詐欺・勘違いの錯誤は「善意無過失」、脅された強迫は保護なし。"]],
  "gy-m16":[["考え方", "消滅時効は「主観的起算点（知った時から）」と「客観的起算点（行使できる時・不法行為の時から）」の2本立て。債権は5年・10年、不法行為は3年・20年、生命・身体の侵害は5年・20年です。"], ["ひっかけ所", "生命・身体の侵害による不法行為も「3年」とする肢（肢5）。724条の2で5年に延びています。"], ["関連知識", "生命・身体の侵害は、債務不履行（167条で10年→20年）でも不法行為（724条の2で3年→5年）でも、結果として「5年・20年」にそろいます。"]],
  "gy-g26":[["考え方", "行政事件訴訟の4類型（抗告訴訟・当事者訴訟・民衆訴訟・機関訴訟）の定義を正確に覚えます。民衆訴訟と機関訴訟は「客観訴訟」で、法律に定めがあるときだけ起こせます（42条）。"], ["ひっかけ所", "民衆訴訟と機関訴訟の定義を入れ替えた肢（肢1・肢2）。定義のキーワード（自己の法律上の利益にかかわらない資格／機関相互間の権限）で見分けます。"], ["関連知識", "民衆訴訟の例は選挙の効力に関する訴訟や住民訴訟、機関訴訟の例は国の関与に関する訴訟などです。無効等確認の訴えは、現在の法律関係に関する訴えで目的を達せないときに限って使えます（36条）。"]],
  "gy-g27":[["考え方", "審査請求の審理は「審理員（審査庁の職員）が審理→意見書→第三者機関（行政不服審査会等）に諮問→審査庁が裁決」の二段構えです。それぞれの例外がどこにあるかを確かめます。"], ["ひっかけ所", "諮問が不要になる例外（43条1項4号）は「審査請求人が希望しない」だけでは足りず、「参加人が反対していない」ことも必要です。片方の条件を落とした肢がひっかけです。"], ["関連知識", "審理員になれない者：処分に関与した者、審査請求人、その配偶者・四親等内の親族・同居の親族、代理人など（9条2項）。行政不服審査会は総務省に置かれます（67条）。"]],
  "gy-g28":[["考え方", "不信任議決は「1回目→長は10日以内に解散できる→解散後の2回目」の流れで数字を整理します。1回目は3分の2出席・4分の3同意、2回目は3分の2出席・過半数同意です。"], ["ひっかけ所", "10日を30日に、4分の3を3分の2に変えるなど、数字の入れ替えが中心です。2回目も4分の3が必要とする肢（肢4）もよく出ます。"], ["関連知識", "長が10日以内に解散しないとき（178条2項）や、解散後の議会で再び不信任議決があったときは、長は職を失います。議会の解散の直接請求（76条）とは別の仕組みです。"]],
  "gy-m17":[["考え方", "相殺は「要件（相殺適状）」「方法（意思表示）」「効果（さかのぼる）」「禁止（509条・505条2項など）」の4つで整理します。"], ["ひっかけ所", "条件・期限を付けられる、将来に向かって効力が生じる、相殺禁止の特約は常に第三者に対抗できる、の3つは逆。時効消滅した債権でも、消滅前に相殺適状なら相殺できます（508条）。"], ["関連知識", "加害者の側から相殺できないのは「悪意による不法行為」と「人の生命・身体の侵害」による損害賠償債務です（509条）。被害者の側から相殺するのは自由です。"]],
  "gy-m18":[["考え方", "相続の承認・放棄は「いつまでに（熟慮期間3箇月）」「どこで（家庭裁判所）」「誰と（限定承認は全員、放棄は単独）」の3点で整理します。"], ["ひっかけ所", "起算点を「相続開始の時」とする肢（正しくは自己のために相続の開始があったことを知った時）、限定承認を単独でできるとする肢、放棄を代襲原因とする肢が典型です。"], ["関連知識", "相続財産の処分は単純承認とみなされますが、保存行為や短期賃貸は除かれます（921条1号）。熟慮期間は、利害関係人や検察官の請求で家庭裁判所が伸ばせます（915条1項ただし書）。"]],
  "gy-s4":[["考え方", "取締役は「資格（株主に限れるか）」「人数」「任期」「解任」の4点で確かめます。解任は、いつでも株主総会の普通決議でできます（339条1項・341条）。"], ["ひっかけ所", "非公開会社の任期の上限「10年」を20年に、人数の「3人」を2人に、解任に「正当な理由」が要るとする肢、と数字と要件の入れ替えが中心です。"], ["関連知識", "正当な理由なく解任された取締役は、会社に損害賠償を請求できます（339条2項）。公開会社でない会社は、取締役を株主に限る定款を置けます（331条2項ただし書）。"]],
  "gy-g29":[["考え方", "行政指導の条文は「一般原則（32条）→申請・許認可に関連する指導（33・34条）→方式（35条）→指針（36条）→中止等の求め（36条の2）」と並びます。どの条文の話かを肢ごとに当てはめます。"], ["ひっかけ所", "「常に」の一語が誤りです。中止等の求めは、弁明その他意見陳述の手続を経てされた行政指導には使えません（36条の2第1項ただし書）。"], ["関連知識", "法令違反の是正のための処分や行政指導がされていないときは、何人も、その処分や行政指導を求めることができます（36条の3、処分等の求め）。中止等の求めとの違い（申出できる人・対象）も押さえます。"]],
  "gy-g30":[["考え方", "不服申立ては「審査請求（原則）・再調査の請求（法律に定めがあるとき）・再審査請求（法律に定めがあるとき）」の3種類です。共同審査請求の総代の権限は11条で確かめます。"], ["ひっかけ所", "11条3項の「取下げを除き」を「取下げを含め」に変えています。総代が取下げできると、ほかの審査請求人の利益を害するからです。"], ["関連知識", "代理人は、特別の委任を受けた場合に限り取下げができます（12条2項ただし書）。総代は「互選できる」が原則で、審理員は必要なときに総代の互選を命じることができます（11条2項）。"]],
  "gy-g31":[["考え方", "情報公開法は「何人も請求できる（3条）→原則開示・例外の不開示情報（5条）→部分開示（6条）→存否応答拒否（8条）→30日以内に決定（10条）→審査会への諮問（19条）」の流れで整理します。"], ["ひっかけ所", "「必ず諮問」と言い切った肢が誤りです。審査請求が不適法で却下するときや、全部を開示するとき（第三者の反対意見書が出ている場合を除く）は諮問しません（19条1項）。"], ["関連知識", "開示請求に係る行政文書が著しく大量なときは、相当の部分を60日以内に決定し、残りは相当の期間内に決定する特例があります（11条）。"]],
  "gy-m19":[["考え方", "無権代理の相手方の手段は「催告（114条）」「取消し（115条）」「無権代理人の責任追及（117条）」の3つ。それぞれ相手方に必要な主観（悪意でも可か、善意か、善意無過失か）を比べます。"], ["ひっかけ所", "催告に返事がないと「追認」とみなす（正しくは拒絶）、取消しに無過失まで要求する（正しくは善意だけ）、117条2項2号ただし書を消す、が狙われます。"], ["関連知識", "催告は悪意の相手方でもできます。取消しは善意の相手方だけ、責任追及は原則として善意無過失の相手方だけ（無権代理人が自分の無権限を知っていたときは善意で足りる）。"]],
  "gy-m20":[["考え方", "保証の問題は、原則（催告の抗弁・検索の抗弁がある）と、例外（連帯保証、主たる債務者の破産・行方不明）を組み合わせて正誤を判断します。"], ["ひっかけ所", "原則だけを書いて、ただし書の場面（破産手続開始・行方不明）に当てはめた肢（肢5）。原則の文章として正しく見えても、場面が例外なら誤りです。"], ["関連知識", "検索の抗弁は、主たる債務者に弁済の資力があり、かつ執行が容易であることを証明したときに使えます（453条）。連帯保証人は、催告の抗弁も検索の抗弁も使えません（454条）。"]],
  "gy-c7":[["考え方", "国家機関の権限の問題は「誰が」を必ず確かめます。指名・任命・決定・認証・承認のどれを誰がするかを表にすると、主語のすり替えにすぐ気づけます。"], ["ひっかけ所", "内閣の権限を国会や天皇に、天皇の国事行為を内閣に入れ替えた肢が中心です。数字（臨時会の要求は4分の1）の入れ替えも混ぜてきます。"], ["関連知識", "天皇の国事行為には、内閣の助言と承認が必要で、内閣が責任を負います（3条）。恩赦は、内閣が決定し、天皇が認証します（73条7号・7条6号）。"]],
  "gy-s5":[["考え方", "株主総会の招集は「公開会社か」「書面投票などを定めたか」「取締役会があるか」で通知期間が変わります。この3つの分岐を順に当てはめます。"], ["ひっかけ所", "「必ず2週間」（肢5）という言い切り。非公開会社は原則1週間で、取締役会がなければ定款でさらに短くできます。"], ["関連知識", "株主総会の招集請求は、公開会社では議決権3%以上・6箇月以上の保有が要件で、非公開会社では保有期間の要件がありません（297条2項）。"]],
  "gy-i6":[["考え方", "住所の届出は4種類。転入（22条）・転居（23条）・転出（24条）・世帯変更（25条）。どれが「した日から14日以内」で、どれが「あらかじめ」かを区別します。"], ["ひっかけ所", "転出届の時期を、ほかの届出と同じ「14日以内」にそろえた肢3が誤りです。転出だけは、出ていく前に届けます。"], ["関連知識", "転入届には、住所の異動に関する文書で政令で定めるもの（転出証明書など）を添えます（22条2項）。住民票には、氏名の振り仮名や個人番号なども記載されます（7条）。"]],
  "gy-i7":[["考え方", "戸籍法は「届出の期間」と「戸籍謄本等を請求できる人」に分けて整理します。本人・配偶者・直系血族（10条）、第三者（10条の2第1項）、国・地方公共団体（2項）、士業の職務上請求（3項）です。"], ["ひっかけ所", "出生14日・死亡7日の数字の入れ替え（肢1・肢2）と、「いかなる場合も」「できない」という言い切り（肢4・肢5）。"], ["関連知識", "行政書士が職務上請求をするときは、資格、業務の種類、依頼者の氏名、依頼者についての請求理由などを明らかにします（10条の2第3項後段）。"]],
  "gy-g32":[["考え方", "公の施設は「設置・管理は条例（244条の2第1項）」「利用拒否は正当な理由が必要（244条2項）」「指定管理者は条例＋議会の議決（3項・6項）」の3本柱で押さえます。"], ["ひっかけ所", "「条例」を「規則」に、「議会の議決を経て」を「経ることなく」に、「正当な理由がない限り」を「いかなる場合も」に変えるのが定番です。"], ["関連知識", "指定管理者の指定は期間を定めて行い（244条の2第5項）、長などは報告を求め、指示ができ、従わないときは指定を取り消せます（10項・11項）。"]],
  "gy-g33":[["考え方", "行政事件訴訟は4類型。主観訴訟（抗告訴訟・当事者訴訟）は自分の権利利益のため、客観訴訟（民衆訴訟・機関訴訟）は法秩序の維持のための訴訟です。"], ["ひっかけ所", "「自己の法律上の利益にかかわらない」から「誰でも・いつでも」と飛躍させた肢5が誤り。客観訴訟は、法律に定める場合に限られます（42条）。"], ["関連知識", "民衆訴訟の例は、選挙訴訟（公職選挙法203条・204条）と住民訴訟（地方自治法242条の2）。機関訴訟の例は、国の関与に関する訴え（地方自治法251条の5）などです。"]],
  "gy-m21":[["考え方", "時効は「援用しないと効果が出ない（145条）」「効果は起算日にさかのぼる（144条）」「あらかじめ放棄できない（146条）」の3点が土台です。"], ["ひっかけ所", "援用できる人を「債務者に限る」と狭める肢2が典型です。保証人・物上保証人・第三取得者など、権利の消滅について正当な利益を有する者も援用できます。"], ["関連知識", "完成「後」の放棄はできます。あらかじめの放棄を許すと、債権者が立場の強さを利用して放棄を強いるおそれがあるためです。"]],
  "gy-m22":[["考え方", "不当利得は、原則（703条：現存利益の返還、704条：悪意なら利息も）と、返還請求できない特則（705条・706条・708条）に分けて読みます。"], ["ひっかけ所", "708条の原則だけを書き、ただし書の場面（不法な原因が受益者にだけある）に当てはめた肢5が誤りです。"], ["関連知識", "706条の期限前弁済でも、債務者が錯誤で弁済したときは、債権者は弁済期までの中間利息などの利益を返します（706条ただし書）。"]],
  "gy-c8":[["考え方", "裁判官の身分保障は「罷免（78条）」「国民審査（79条2項〜4項）」「任期と定年（79条5項・80条1項）」「報酬（79条6項・80条2項）」に分けて覚えます。"], ["ひっかけ所", "最高裁と下級裁の入れ替え（肢1）、衆議院と参議院の入れ替え（肢2）、「除いては」の読み落とし（肢5）。"], ["関連知識", "国民審査は、任命後初めての衆議院議員総選挙の際と、その後10年を経過した後初めての総選挙の際ごとに行われます（79条2項）。"]],
  "gy-i8":[["考え方", "懲戒の条文は「処分の種類（14条）→申出と調査（14条の3第1項・2項）→聴聞（3項〜5項）→公告（14条の5）」の流れで読みます。"], ["ひっかけ所", "処分の後の「公告」を外した肢5が誤りです。懲戒処分は、遅滞なく都道府県の公報で公告しなければなりません。"], ["関連知識", "行政書士法人の懲戒は、戒告・2年以内の業務の全部または一部の停止・解散です（14条の2第1項）。個人の行政書士の「業務の禁止」に当たるのが法人の「解散」です。"]],
  "gy-i9":[["考え方", "個人情報保護法の定義は「個人情報→個人識別符号→要配慮個人情報→仮名加工情報→匿名加工情報→個人関連情報」の順に、2条の各項で定められています。"], ["ひっかけ所", "仮名加工情報の「照合しない限り」を「照合したとしても」に変えた肢4と、個人関連情報の「いずれにも該当しない」を「いずれかに該当する」に変えた肢5が典型です。"], ["関連知識", "要配慮個人情報は、本人の同意なく取得できないのが原則で（20条2項）、オプトアウトによる第三者提供もできません（27条2項ただし書）。"]],
  "gy-g34":[["考え方", "処分についての審査請求の裁決は、却下（45条1項）・棄却（2項）・事情裁決（3項）・認容（46条）。認容のとき、取り消すか変更するかは審査庁の立場で変わります。"], ["ひっかけ所", "「公益上必要があれば不利益に変更できる」という例外を作った肢5が誤り。不利益変更の禁止（48条）に例外はありません。"], ["関連知識", "申請を拒否した処分を取り消す場合、上級行政庁である審査庁は処分庁に処分を命じ、処分庁である審査庁は自ら処分をします（46条2項）。"]],
  "gy-g35":[["考え方", "再議は2種類。一般再議（176条1項〜3項：異議があるとき・できる）と、違法再議（4項〜8項：違法と認めるとき・しなければならない）に分けて整理します。"], ["ひっかけ所", "数字（10日→30日、21日、60日→90日）と、議決の要件（3分の2→過半数）の入れ替え。違法再議のあとは、出訴の前に審査の申立てがあります（肢4）。"], ["関連知識", "義務費の削除・減額の議決や、非常災害対策費などの削除・減額の議決についても、長は再議に付さなければなりません（177条）。"]],
  "gy-m23":[["考え方", "債権者代位権は「被保全債権の要件（保全の必要・期限到来・強制執行できる）」と「被代位権利の要件（一身専属・差押禁止でない）」を分けて確かめます。"], ["ひっかけ所", "423条2項の原則（期限前は不可）だけを書き、ただし書（保存行為は可）を消した肢2が典型です。"], ["関連知識", "債権者が被代位権利を行使しても、債務者は自ら取立てなどの処分ができ、相手方も債務者に履行できます（423条の5）。"]],
  "gy-m24":[["考え方", "婚姻の成立は、実質的要件（婚姻適齢・重婚禁止・近親婚の禁止など）と形式的要件（届出）に分けて読みます。"], ["ひっかけ所", "削除された再婚禁止期間（旧733条）を、今も有効な条文として出す肢3が誤りです。古い知識で解くと引っかかります。"], ["関連知識", "嫡出推定も2024年4月施行の改正で変わり、婚姻の解消から300日以内に生まれた子でも、母が再婚した後に生まれた子は再婚後の夫の子と推定されます（772条3項）。"]],
  "gy-s6":[["考え方", "株式の譲渡は「効力が生じる要件」と「対抗要件」を分け、株券発行会社かどうかで当てはめます。"], ["ひっかけ所", "株券発行会社では、会社への対抗にも株主名簿が要ることを外した肢5、株券の発行前の譲渡の扱いを逆にした肢4が狙われます。"], ["関連知識", "定款で、譲渡による株式の取得に会社の承認を要する旨（譲渡制限）を定めることができます（107条1項1号・108条1項4号）。"]],
  "gy-i10":[["考え方", "登録の流れは「行政書士会を経由して連合会に申請（6条の2第1項）→連合会が登録または拒否（同条2項）→不服は総務大臣へ審査請求（6条の3）」です。"], ["ひっかけ所", "肢3は審査請求先を「都道府県知事」にすり替えています。都道府県知事が出てくるのは懲戒（14条）や立入検査（13条の22）の場面です。"], ["関連知識", "抹消には「しなければならない」（業の廃止の届出・死亡・登録の取消しなど、7条1項）と「できる」（2年以上業務を行わない・心身の故障、7条2項）の2種類があります。"]],
  "gy-i11":[["考え方", "行政書士法人の章（13条の3以下）は、会社法の持分会社に近い仕組みです。設立は定款→登記で成立→連合会へ届出、の順で覚えます。"], ["ひっかけ所", "肢1の「2人以上でなければならない」が狙いです。条文は「行政書士が設立した法人」とだけ定め、社員1人の法人も認められています。"], ["関連知識", "事務所には、その都道府県の行政書士会の会員である社員を常駐させなければなりません（13条の14）。名称には「行政書士法人」の文字が必要です（13条の4）。"]],
  "gy-i12":[["考え方", "行政機関等の個人情報の取扱いは「保有の制限（61条）→利用目的の明示（62条）→利用・提供の制限（69条）→開示請求（76条以下）」の順に並んでいます。"], ["ひっかけ所", "肢3は例外（62条4号「取得の状況からみて利用目的が明らか」）を消して「それでも明示が必要」と言い切っています。"], ["関連知識", "開示請求は「何人も」でき、未成年者・成年被後見人の法定代理人や本人の委任による代理人も請求できます（76条1項・2項）。"]],
  "gy-g36":[["考え方", "議会の手続は「招集（101条）→会期（102条）→定足数（113条）→公開（115条）→表決（116条）」の順で、数字を1つずつ確認します。"], ["ひっかけ所", "肢3（定足数3分の1）、肢4（秘密会は過半数）、肢5（可否同数は否決）と、数字や結論をすり替えた肢が並びます。"], ["関連知識", "議長が議会運営委員会の議決を経て臨時会の招集を請求し、長が20日以内に招集しないときは、議長が招集できます（101条2項・5項）。"]],
  "gy-g37":[["考え方", "取消判決は、①みんなに効く（第三者効）、②行政庁を縛る（拘束力）、③巻き込まれた第三者には再審の道がある、の3つで整理します。"], ["ひっかけ所", "肢5は再審の訴え（34条）の存在を消しています。第三者効がある以上、訴訟に参加できなかった第三者の救済手段が用意されています。"], ["関連知識", "再審の訴えの期間は、確定判決を知った日から30日以内（不変期間）、判決が確定した日から1年以内です（34条2項〜4項）。"]],
  "gy-m25":[["考え方", "第三者弁済は「正当な利益がある第三者は自由」「正当な利益がない第三者は、債務者の意思・債権者の意思に反してできない（ただし書あり）」の2段で整理します。"], ["ひっかけ所", "肢1は474条2項ただし書（債権者が債務者の意思に反することを知らなかったとき）を消しています。肢4は478条の「無過失」を落としています。"], ["関連知識", "代物弁済は、契約しただけでは債務は消えず、他の給付を「した」ときに弁済と同じ効力が生じます（482条）。"]],
  "gy-m26":[["考え方", "請負は「仕事の完成」に報酬を払う契約です（632条）。報酬の時期・割合的報酬・担保責任の制限・期間制限・注文者の解除の順に条文が並びます。"], ["ひっかけ所", "肢5は641条の「損害を賠償して」を「損害を賠償することなく」に変えています。"], ["関連知識", "注文者が破産手続開始の決定を受けたときは、請負人または破産管財人が解除できます。ただし請負人は、仕事を完成した後は解除できません（642条1項）。"]],
  "gy-i13":[["考え方", "要旨は「筆者がいちばん言いたいこと」です。この文章は「だから、〜必要なのは…である」の最後の文が結論で、冒頭の逆説（相手が知らないことを知っている）はその前振りです。"], ["ひっかけ所", "肢1は本文の否定（知識が足りないからではない）を肯定にすり替え、肢5は本文にない主張（専門家以外に任せる）を足しています。本文の一部だけ正しい肢3・肢4も、要旨にはなりません。"], ["関連知識", "本試験の基礎知識14問のうち、文章理解は例年3問ほど出ます。法令の知識が要らない確実な得点源なので、1問3分程度で解けるよう練習しておくと、基礎知識の基準点（6問分）を越えやすくなります。"]],
  "gy-i14":[["考え方", "空欄の直前は「事実を並べるだけでなく」、直後は「なぜその判断をしたのか、ほかにどんな選択肢があったのか」です。事実とは別の、判断の理由や前提を指す語句が入ります。"], ["ひっかけ所", "肢4（細かな数字）は記録らしく見えますが「事実」の側に入るので、「だけでなく」の対比に合いません。肢1も記録に必要なものですが、直後の文とつながりません。"], ["関連知識", "空欄補充は、空欄に候補を入れて前後の2文と一緒に読み直すのが確実です。対比（だけでなく・しかし）、言い換え（つまり・要するに）、理由（なぜなら）の接続語に印をつけて読みます。"]],
  "gy-i15":[["考え方", "指示語・接続語で始まるア（そこで）・イ（ところが・その迷い）・エ（こうして）は最初に来られないので、ウが先頭です。あとは「その迷い」「そこで」「こうして」が何を受けるかで順に決まります。"], ["ひっかけ所", "肢3（ウ→ア→イ→エ）は、ウからアへのつながりがそれらしく見えますが、エの「こうして見つかった」がイ（気づきにくい）を受けることになり、意味が通りません。"], ["関連知識", "並べ替えは、選択肢の先頭の文を見て、指示語・接続語で始まるものを外すと候補が絞れます。この問題では、それだけで肢1と肢3の2つに絞れます。"]],
  "gy-b3":[["考え方", "「推定する」は、とりあえずそう扱うが反証で覆る。「みなす」は、事実と違ってもそう扱い、反証では覆らない。この違いを条文の例で覚えます。"], ["ひっかけ所", "肢4（同時死亡）と肢5（嫡出）は、本当は「推定する」なのに「みなす」にすり替えています。肢1・肢2は定義そのものを入れ替えています。"], ["関連知識", "失踪の宣告を受けた者は死亡したものと「みなす」（民法31条）。覆すには失踪宣告の取消し（民法32条）が必要で、反証だけでは足りません。"]],
  "gy-b4":[["考え方", "最高裁は普段は小法廷（3人以上）で裁判し、重要な場面だけ全員（15人）の大法廷で裁判します。その「重要な場面」が裁判所法10条の各号です。"], ["ひっかけ所", "肢5は判例変更（10条3号）を「小法廷でもできる」と言い換えています。判例変更は大法廷でなければできません。"], ["関連知識", "当事者の主張に基づく憲法判断でも、前に大法廷が合憲とした判断と同じ意見なら小法廷で裁判できます（10条1号かっこ書）。"]],
  "gy-i16":[["考え方", "選挙制度は「定数（4条）→選挙権（9条）→被選挙権（10条）」の順に、数字を1つずつ確認します。"], ["ひっかけ所", "肢1は小選挙区と比例代表の人数を入れ替えています。肢3は住所要件を3か月から6か月に、肢4は参議院・知事の年齢を30歳から25歳に変えています。"], ["関連知識", "選挙権は満18年以上（9条1項）。年齢は選挙の期日で数えます（10条2項）。"]],
  "gy-i17":[["考え方", "財政法は「借金に頼らない（4条本文）→例外の建設国債（4条ただし書）→日銀引受けの禁止（5条）」の流れで、財政の健全性を守る仕組みです。"], ["ひっかけ所", "肢4は会計年度を暦年（1月〜12月）にすり替えています。国の会計年度は4月1日〜翌年3月31日です（11条）。"], ["関連知識", "いわゆる赤字国債（特例公債）は財政法では発行できないため、毎年度の特例法に基づいて発行されています。予算の追加・変更は補正予算です（29条）。"]],
  "gy-g38":[["考え方", "地方公共団体の事務は「法定受託事務（2条9項）」と「それ以外の自治事務（2条8項）」の2つ。どちらも地方公共団体の事務なので、条例の対象になります。"], ["ひっかけ所", "肢5は「法定受託事務は条例の対象外」と言い切っています。14条1項は「第2条第2項の事務に関し」と定め、事務の種類で区別していません。"], ["関連知識", "国の関与は法律または政令の根拠が必要（245条の2）で、必要最小限度で、地方公共団体の自主性・自立性に配慮しなければなりません（245条の3第1項）。"]],
  "gy-m27":[["考え方", "定型約款は「みなし合意（548条の2第1項）→不当条項の排除（同条2項）→内容の表示（548条の3）→変更（548条の4）」の順に並んでいます。"], ["ひっかけ所", "肢1は「合意したときに限り」と言い切り、「表示していたとき」（548条の2第1項2号）を消しています。肢5は事前周知の要件（548条の4第3項）を外しています。"], ["関連知識", "定型約款の変更では、不当条項の規定（548条の2第2項）は適用されず、変更の合理性で判断します（548条の4第4項）。"]],
  "gy-t1":[["考え方", "目的規定の空欄は「対象（何の手続か）」「目指すもの（公正・透明性）」「最終目的（権利利益の保護）」の3層で埋めます。行政手続法の対象は、処分・行政指導・届出・命令等の4つです。"], ["ひっかけ所", "語群に「行政計画」「行政契約」「効率」「公平」など、もっともらしい語が並びます。行政手続法は計画や契約の手続を定めていない、と知っていれば迷いません。"], ["関連知識", "「透明性」はかっこ書で「行政上の意思決定について、その内容及び過程が国民にとって明らかであること」と定義されています。行政不服審査法1条の「公正」「簡易迅速」と混同しないようにします。"]],
  "gy-t2":[["考え方", "9条2項は「文言だけで判断しない→法令の趣旨・目的と利益の内容・性質を考える→関係法令の趣旨・目的も参酌→害される態様・程度も勘案」の順に読む条文です。"], ["ひっかけ所", "語群の「解釈」「沿革」「所管を同じくする」など、似た語との取り違え。正しくは「文言」「趣旨及び目的」「利益の内容及び性質」「目的を共通にする」です。"], ["関連知識", "この規定は2004年改正で加わり、小田急線事件（最大判平成17年12月7日）で周辺住民の原告適格を認める根拠になりました。"]],
  "gy-t3":[["考え方", "行政不服審査法の目的は「違法または不当な処分」を「簡易迅速かつ公正な手続」で争い「権利利益の救済」と「行政の適正な運営」を図ることです。"], ["ひっかけ所", "「不当」を「不適切」「不合理」に、「簡易迅速」を「慎重」「厳格」に変えた語が並びます。審査請求は裁判より手軽で早い手続、と考えると選べます。"], ["関連知識", "取消訴訟では違法な処分だけが取り消されますが、審査請求では違法でなくても「不当」な処分を取り消せます。この違いが行政不服審査制度の大きな特徴です。"]],
  "gy-t4":[["考え方", "13条は前段「個人として尊重」と後段「生命、自由及び幸福追求に対する国民の権利」に分かれます。後段の制約原理は「公共の福祉」です。"], ["ひっかけ所", "「人間」「人格」など似た語や、「財産」「平等」などの別の人権の語が混ざります。条文の語順「生命、自由及び幸福追求」をそのまま覚えるのが確実です。"], ["関連知識", "幸福追求権は、プライバシー権や肖像権など、憲法に書かれていない人権の根拠とされます（京都府学連事件など）。"]],
  "gy-t5":[["考え方", "1条1項の要件は「公権力の行使に当たる公務員」「職務を行うについて」「故意又は過失」「違法に他人に損害」の4つ。空欄はこの要件の言葉です。"], ["ひっかけ所", "「故意又は過失」を求償の要件「故意又は重大な過失」（1条2項）と取り違える語が語群にあります。"], ["関連知識", "「職務を行うについて」は、客観的に職務の外形を備えていれば足りるとされます（外形標準説、最判昭和31年11月30日）。"]],
  "gy-t6":[["考え方", "30条は、裁量処分でも「裁量権の範囲をこえ（逸脱）」または「その濫用」があれば、裁判所が取り消せるという条文です。"], ["ひっかけ所", "主語の「裁判所」を「行政庁」や「審査庁」に変えた語が並びます。30条は取消訴訟での裁判所の審査の範囲を定めた規定です。"], ["関連知識", "裁判所は裁量の当不当までは審査できず、逸脱・濫用（違法）だけを審査します。審査請求では「不当」も審査できる点と比べて覚えます。"]],
  "gy-t7":[["考え方", "96条1項は「各議院の総議員の3分の2以上の賛成で国会が発議→国民の承認（国民投票で過半数）」の流れです。"], ["ひっかけ所", "「総議員」を「出席議員」に、「三分の二」を「過半数」に変えた語が並びます。分母と割合の両方を正確に覚えます。"], ["関連知識", "国民投票の手続は「日本国憲法の改正手続に関する法律」で定められ、投票権は18歳以上の日本国民にあります。承認されたら天皇が国民の名で直ちに公布します（96条2項）。"]],
  "gy-k1":[["書き方", "40字の記述は「誰を被告に」「どの訴えを」「どう提起するか」の順で書くと落としが減ります。この問題では、被告（A市）、取消訴訟、義務付け訴訟、併合提起の4点です。"], ["落としやすい点", "被告を「A市長」と書くと減点です。処分をした行政庁ではなく、その所属する公共団体が被告です（11条1項）。"], ["関連知識", "義務付けの判決が出るには、取消訴訟などの請求に理由があり、かつ行政庁が処分をすべきことが根拠法令の規定から明らかであるなどの要件が必要です（37条の3第5項）。"]],
  "gy-k2":[["書き方", "「被告」「本案の訴え（差止め）」「仮の救済（仮の差止め）」の3点を一文にまとめます。仮の差止めは、差止めの訴えの提起が前提なので「あわせて」と書きます。"], ["落としやすい点", "執行停止と混同しないこと。執行停止は、処分がされた後に取消訴訟とともに使う制度です。まだ処分がされていない段階では、差止めと仮の差止めを使います。"], ["関連知識", "要件の言葉：差止めの訴え＝「重大な損害を生ずるおそれ」、仮の差止め＝「償うことのできない損害を避けるため緊急の必要」と「本案について理由があるとみえるとき」。"]],
  "gy-k3":[["書き方", "「誰に（C市）」「何に基づき（国家賠償法1条1項）」「Zはどうか（直接請求できない）」の3点を、判例の立場として書きます。"], ["落としやすい点", "「Z個人に請求できない」理由まで書こうとして字数が足りなくなりがちです。結論を優先し、根拠条文と相手方を必ず入れます。"], ["関連知識", "C市は、Zに故意または重大な過失があったときだけ、Zに求償できます（1条2項）。今回のように過失（軽過失）なら求償できません。"]],
  "gy-k4":[["書き方", "「Cの立場（善意・有過失）」→「詐欺取消しの第三者保護の要件（善意無過失）」→「結論（対抗できる）」の順で書きます。"], ["落としやすい点", "改正前の「善意の第三者」で考えると、逆の結論になってしまいます。2020年施行の改正で、詐欺の第三者保護は「善意でかつ過失がない」第三者になりました（96条3項）。"], ["関連知識", "取消し後に現れた第三者との関係は、判例上、対抗問題（177条、登記の先後）として扱われます。取消し前か後かで使う条文が変わる点も押さえます。"]],
  "gy-k5":[["書き方", "「Cは背信的悪意者」→「177条の第三者に当たらない」→「Bは登記なく対抗できる」の3段で書きます。"], ["落としやすい点", "単に「悪意」と書くだけでは足りません。単純な悪意者は177条の第三者に含まれるので、「背信的」悪意者であることを明記します。"], ["関連知識", "背信的悪意者から土地を買い受けた転得者は、その転得者自身が背信的悪意者でない限り、第一の買主に対し登記がないことを主張できます（最判平成8年10月29日）。"]],
  "gy-k6":[["書き方", "代金減額の手順「相当の期間を定めて→追完（不足分の引渡し）を催告→期間内に追完がない→減額請求」を一文にします。"], ["落としやすい点", "「すぐに減額を請求する」と書くのは誤りです。追完ができる状態なので、原則どおり催告が先です（563条1項）。"], ["関連知識", "数量の不足には、種類・品質の不適合のような「知った時から1年以内の通知」の期間制限（566条）がありません。一般の消滅時効（166条）で処理されます。"]],
  "gy-k7":[["書き方", "「催告に当たる」「6か月の完成猶予」「その間に裁判上の請求などをする」の3点を入れます。"], ["落としやすい点", "催告で時効が「更新」されると書くのは誤りです。催告は完成を一時的に止めるだけで、数え直しにはなりません。"], ["関連知識", "催告による猶予期間中にした再度の催告には、完成猶予の効力がありません（150条2項）。裁判上の請求をすると、確定判決などで権利が確定した時から新たに時効が進行します（147条2項）。"]],
  "gy-k8":[["書き方", "「何を申し立てるか（執行停止）」と「要件（重大な損害を避けるため緊急の必要）」を一文にします。"], ["落としやすい点", "取消訴訟を起こせば自動的に止まると考えないこと。執行不停止が原則なので、執行停止の申立てが必要です（25条1項・2項）。"], ["関連知識", "執行停止は、公共の福祉に重大な影響を及ぼすおそれがあるとき、または本案について理由がないとみえるときはできません（25条4項）。内閣総理大臣の異議の制度もあります（27条）。"]],
  "gy-k9":[["書き方", "「権限外の行為の表見代理（110条）」「Cの正当な理由」「Bに効果が帰属し履行を請求できる」の3点で書きます。"], ["落としやすい点", "基本代理権（賃貸の代理権）があることがこの表見代理の前提です。「代理権授与の表示による表見代理（109条）」と混同しないようにします。"], ["関連知識", "表見代理が成立する場面でも、相手方は無権代理人の責任（117条）を選んで追及することもできます（判例）。"]],
  "gy-k10":[["書き方", "「通知（譲渡人から）または承諾（債務者の）」「確定日付のある証書」の2点が中心です。第三者への対抗要件であることも示します。"], ["落としやすい点", "通知は「譲受人C」からでは足りず、「譲渡人A」からする必要があります。確定日付の要件を落とすと大きく減点されます。"], ["関連知識", "両方の譲受人が確定日付のある通知をしたときは、通知が債務者に到達した日時の先後で優劣が決まります（最判昭和49年3月7日）。"]],
  "gy-k11":[["書き方", "「不作為の違法確認の訴え」「許可をすべき旨を命ずる義務付けの訴え」「併合して提起」の3点で書きます。"], ["落としやすい点", "拒否処分の取消訴訟と書くのは誤りです。今回は処分がされていない（不作為）ので、組み合わせるのは不作為の違法確認の訴えです。"], ["関連知識", "不作為についての審査請求（行政不服審査法3条）を先にすることもできます。不作為の違法確認の訴えは、法令に基づく申請をした者だけが提起できます（行訴法37条）。"]],
  "gy-k12":[["書き方", "「誰を被告に（受益者C）」「どこに（裁判所）」「何を（贈与の取消し＝詐害行為取消請求）」の3点で書きます。"], ["落としやすい点", "債務者Bを被告にするのは誤りです。被告は受益者（または転得者）で、債務者には訴訟告知をします（424条の7第2項）。"], ["関連知識", "詐害行為取消請求の訴えは、債務者が詐害行為を知った時から2年、行為の時から10年を経過すると提起できません（426条）。"]],
  "gy-k13":[["書き方", "「取消しが公共の福祉に適合しない」「請求を棄却」「主文で違法を宣言」の3点で書きます。"], ["落としやすい点", "「処分は違法なので取り消す」と書くと逆です。違法でも取り消さないのが事情判決で、その代わり主文で違法を宣言します（31条1項）。"], ["関連知識", "裁判所は、判決の前に、判決で処分が違法であることを宣言することができます（中間判決、31条2項）。原告は国家賠償などで損害の回復を図ることになります。"]],
  "gy-k14":[["書き方", "「誰に（受遺者C）」「何の権利で（遺留分侵害額請求権）」「何を（金銭1500万円）」の3点で書きます。"], ["落としやすい点", "改正前の「遺留分減殺請求」で書くと、物の返還を求める内容になってしまいます。今は金銭の支払を求める権利です（1046条1項）。"], ["関連知識", "遺留分侵害額請求権は、相続の開始と遺留分を侵害する贈与・遺贈を知った時から1年、相続開始の時から10年で消滅します（1048条）。"]],
  "gy-k15":[["書き方", "「基礎とした事情が表示されていた」「重要な錯誤」「取消し」の3点を入れます。動機の錯誤（基礎事情の錯誤）では、表示の要件が最も大事です。"], ["落としやすい点", "「無効」と書くのは改正前の考え方です。2020年施行の改正で、錯誤の効果は「取消し」になりました（95条1項）。"], ["関連知識", "表意者に重大な過失があるときは、相手方が錯誤を知り、または重大な過失で知らなかったときなどを除き、取り消せません（95条3項）。"]],
  "gy-k16":[["書き方", "「返還を求められる」という結論→「強迫による取消し」→「詐欺と違い善意無過失の第三者にも対抗できる」の順で書きます。"], ["落としやすい点", "詐欺の第三者保護（96条3項）を強迫にも当てはめると、逆の結論になります。"], ["関連知識", "取消し「後」に現れた第三者との関係は、強迫でも詐欺でも、対抗問題（登記の先後）になるのが判例の立場です。"]],
  "gy-k17":[["書き方", "「いつまでに（知った時から3箇月以内）」「どこで（家庭裁判所）」「何を（相続の放棄の申述）」の3点で書きます。"], ["落としやすい点", "起算点を「相続開始の時（死亡の時）」と書くと減点です。正しくは「自己のために相続の開始があったことを知った時」です。"], ["関連知識", "期間内に限定承認も放棄もしないと単純承認とみなされます（921条2号）。放棄した者は初めから相続人でなかったものとみなされ、その子は代襲相続しません（939条）。"]],
  "gy-k18":[["書き方", "「相当の期間を定めて」「追認するかどうか確答を催告」「期間内に確答がなければ追認拒絶とみなす」の3点で書きます。"], ["落としやすい点", "「追認したものとみなされる」と書くのは典型の誤りです。返事がなければ「拒絶」です（114条後段）。"], ["関連知識", "催告は、相手方が代理権のないことを知っていても（悪意でも）できます。善意の相手方は、本人が追認するまで契約を取り消すこともできます（115条）。"]]
};

// 条文の本文。e-Gov 法令検索の一括データ（2026年10月10日時点の現行法令）を一字一句そのまま使う。手で直さない（jobun.py で作る）。
// p: 項ごとの行。"- " で始まる行は号、"-- " は号の細分。GY_JB: 問題id → [[条のキー, [[項, [号…]]…]]]（項の指定が空なら条全体、号の指定が空なら項全体）
const GY_JOBUN_ASOF = "2026年10月10日時点の現行法令（e-Gov 法令検索）";
const GY_JOBUN = {"行政手続法2条":{"n":"行政手続法第二条","c":"（定義）","p":[["この法律において、次の各号に掲げる用語の意義は、当該各号に定めるところによる。","- 一　法令　法律、法律に基づく命令（告示を含む。）、条例及び地方公共団体の執行機関の規則（規程を含む。以下「規則」という。）をいう。","- 二　処分　行政庁の処分その他公権力の行使に当たる行為をいう。","- 三　申請　法令に基づき、行政庁の許可、認可、免許その他の自己に対し何らかの利益を付与する処分（以下「許認可等」という。）を求める行為であって、当該行為に対して行政庁が諾否の応答をすべきこととされているものをいう。","- 四　不利益処分　行政庁が、法令に基づき、特定の者を名あて人として、直接に、これに義務を課し、又はその権利を制限する処分をいう。ただし、次のいずれかに該当するものを除く。","-- イ　事実上の行為及び事実上の行為をするに当たりその範囲、時期等を明らかにするために法令上必要とされている手続としての処分","-- ロ　申請により求められた許認可等を拒否する処分その他申請に基づき当該申請をした者を名あて人としてされる処分","-- ハ　名あて人となるべき者の同意の下にすることとされている処分","-- ニ　許認可等の効力を失わせる処分であって、当該許認可等の基礎となった事実が消滅した旨の届出があったことを理由としてされるもの","- 五　行政機関　次に掲げる機関をいう。","-- イ　法律の規定に基づき内閣に置かれる機関若しくは内閣の所轄の下に置かれる機関、宮内庁、内閣府設置法（平成十一年法律第八十九号）第四十九条第一項若しくは第二項に規定する機関、国家行政組織法（昭和二十三年法律第百二十号）第三条第二項に規定する機関、会計検査院若しくはこれらに置かれる機関又はこれらの機関の職員であって法律上独立に権限を行使することを認められた職員","-- ロ　地方公共団体の機関（議会を除く。）","- 六　行政指導　行政機関がその任務又は所掌事務の範囲内において一定の行政目的を実現するため特定の者に一定の作為又は不作為を求める指導、勧告、助言その他の行為であって処分に該当しないものをいう。","- 七　届出　行政庁に対し一定の事項の通知をする行為（申請に該当するものを除く。）であって、法令により直接に当該通知が義務付けられているもの（自己の期待する一定の法律上の効果を発生させるためには当該通知をすべきこととされているものを含む。）をいう。","- 八　命令等　内閣又は行政機関が定める次に掲げるものをいう。","-- イ　法律に基づく命令（処分の要件を定める告示を含む。次条第二項において単に「命令」という。）又は規則","-- ロ　審査基準（申請により求められた許認可等をするかどうかをその法令の定めに従って判断するために必要とされる基準をいう。以下同じ。）","-- ハ　処分基準（不利益処分をするかどうか又はどのような不利益処分とするかについてその法令の定めに従って判断するために必要とされる基準をいう。以下同じ。）","-- ニ　行政指導指針（同一の行政目的を実現するため一定の条件に該当する複数の者に対し行政指導をしようとするときにこれらの行政指導に共通してその内容となるべき事項をいう。以下同じ。）"]]},"行政手続法5条":{"n":"行政手続法第五条","c":"（審査基準）","p":[["行政庁は、審査基準を定めるものとする。"],["２　行政庁は、審査基準を定めるに当たっては、許認可等の性質に照らしてできる限り具体的なものとしなければならない。"],["３　行政庁は、行政上特別の支障があるときを除き、法令により申請の提出先とされている機関の事務所における備付けその他の適当な方法により審査基準を公にしておかなければならない。"]]},"行政手続法6条":{"n":"行政手続法第六条","c":"（標準処理期間）","p":[["行政庁は、申請がその事務所に到達してから当該申請に対する処分をするまでに通常要すべき標準的な期間（法令により当該行政庁と異なる機関が当該申請の提出先とされている場合は、併せて、当該申請が当該提出先とされている機関の事務所に到達してから当該行政庁の事務所に到達するまでに通常要すべき標準的な期間）を定めるよう努めるとともに、これを定めたときは、これらの当該申請の提出先とされている機関の事務所における備付けその他の適当な方法により公にしておかなければならない。"]]},"行政手続法7条":{"n":"行政手続法第七条","c":"（申請に対する審査、応答）","p":[["行政庁は、申請がその事務所に到達したときは遅滞なく当該申請の審査を開始しなければならず、かつ、申請書の記載事項に不備がないこと、申請書に必要な書類が添付されていること、申請をすることができる期間内にされたものであることその他の法令に定められた申請の形式上の要件に適合しない申請については、速やかに、申請をした者（以下「申請者」という。）に対し相当の期間を定めて当該申請の補正を求め、又は当該申請により求められた許認可等を拒否しなければならない。"]]},"行政手続法8条":{"n":"行政手続法第八条","c":"（理由の提示）","p":[["行政庁は、申請により求められた許認可等を拒否する処分をする場合は、申請者に対し、同時に、当該処分の理由を示さなければならない。ただし、法令に定められた許認可等の要件又は公にされた審査基準が数量的指標その他の客観的指標により明確に定められている場合であって、当該申請がこれらに適合しないことが申請書の記載又は添付書類その他の申請の内容から明らかであるときは、申請者の求めがあったときにこれを示せば足りる。"],["２　前項本文に規定する処分を書面でするときは、同項の理由は、書面により示さなければならない。"]]},"行政手続法12条":{"n":"行政手続法第十二条","c":"（処分の基準）","p":[["行政庁は、処分基準を定め、かつ、これを公にしておくよう努めなければならない。"],["２　行政庁は、処分基準を定めるに当たっては、不利益処分の性質に照らしてできる限り具体的なものとしなければならない。"]]},"行政手続法13条":{"n":"行政手続法第十三条","c":"（不利益処分をしようとする場合の手続）","p":[["行政庁は、不利益処分をしようとする場合には、次の各号の区分に従い、この章の定めるところにより、当該不利益処分の名あて人となるべき者について、当該各号に定める意見陳述のための手続を執らなければならない。","- 一　次のいずれかに該当するとき　聴聞","-- イ　許認可等を取り消す不利益処分をしようとするとき。","-- ロ　イに規定するもののほか、名あて人の資格又は地位を直接にはく奪する不利益処分をしようとするとき。","-- ハ　名あて人が法人である場合におけるその役員の解任を命ずる不利益処分、名あて人の業務に従事する者の解任を命ずる不利益処分又は名あて人の会員である者の除名を命ずる不利益処分をしようとするとき。","-- ニ　イからハまでに掲げる場合以外の場合であって行政庁が相当と認めるとき。","- 二　前号イからニまでのいずれにも該当しないとき　弁明の機会の付与"],["２　次の各号のいずれかに該当するときは、前項の規定は、適用しない。","- 一　公益上、緊急に不利益処分をする必要があるため、前項に規定する意見陳述のための手続を執ることができないとき。","- 二　法令上必要とされる資格がなかったこと又は失われるに至ったことが判明した場合に必ずすることとされている不利益処分であって、その資格の不存在又は喪失の事実が裁判所の判決書又は決定書、一定の職に就いたことを証する当該任命権者の書類その他の客観的な資料により直接証明されたものをしようとするとき。","- 三　施設若しくは設備の設置、維持若しくは管理又は物の製造、販売その他の取扱いについて遵守すべき事項が法令において技術的な基準をもって明確にされている場合において、専ら当該基準が充足されていないことを理由として当該基準に従うべきことを命ずる不利益処分であってその不充足の事実が計測、実験その他客観的な認定方法によって確認されたものをしようとするとき。","- 四　納付すべき金銭の額を確定し、一定の額の金銭の納付を命じ、又は金銭の給付決定の取消しその他の金銭の給付を制限する不利益処分をしようとするとき。","- 五　当該不利益処分の性質上、それによって課される義務の内容が著しく軽微なものであるため名あて人となるべき者の意見をあらかじめ聴くことを要しないものとして政令で定める処分をしようとするとき。"]]},"行政手続法14条":{"n":"行政手続法第十四条","c":"（不利益処分の理由の提示）","p":[["行政庁は、不利益処分をする場合には、その名あて人に対し、同時に、当該不利益処分の理由を示さなければならない。ただし、当該理由を示さないで処分をすべき差し迫った必要がある場合は、この限りでない。"],["２　行政庁は、前項ただし書の場合においては、当該名あて人の所在が判明しなくなったときその他処分後において理由を示すことが困難な事情があるときを除き、処分後相当の期間内に、同項の理由を示さなければならない。"],["３　不利益処分を書面でするときは、前二項の理由は、書面により示さなければならない。"]]},"行政手続法18条":{"n":"行政手続法第十八条","c":"（文書等の閲覧）","p":[["当事者及び当該不利益処分がされた場合に自己の利益を害されることとなる参加人（以下この条及び第二十四条第三項において「当事者等」という。）は、聴聞の通知があった時から聴聞が終結する時までの間、行政庁に対し、当該事案についてした調査の結果に係る調書その他の当該不利益処分の原因となる事実を証する資料の閲覧を求めることができる。この場合において、行政庁は、第三者の利益を害するおそれがあるときその他正当な理由があるときでなければ、その閲覧を拒むことができない。"],["２　前項の規定は、当事者等が聴聞の期日における審理の進行に応じて必要となった資料の閲覧を更に求めることを妨げない。"],["３　行政庁は、前二項の閲覧について日時及び場所を指定することができる。"]]},"行政手続法29条":{"n":"行政手続法第二十九条","c":"（弁明の機会の付与の方式）","p":[["弁明は、行政庁が口頭ですることを認めたときを除き、弁明を記載した書面（以下「弁明書」という。）を提出してするものとする。"],["２　弁明をするときは、証拠書類等を提出することができる。"]]},"行政手続法32条":{"n":"行政手続法第三十二条","c":"（行政指導の一般原則）","p":[["行政指導にあっては、行政指導に携わる者は、いやしくも当該行政機関の任務又は所掌事務の範囲を逸脱してはならないこと及び行政指導の内容があくまでも相手方の任意の協力によってのみ実現されるものであることに留意しなければならない。"],["２　行政指導に携わる者は、その相手方が行政指導に従わなかったことを理由として、不利益な取扱いをしてはならない。"]]},"行政手続法35条":{"n":"行政手続法第三十五条","c":"（行政指導の方式）","p":[["行政指導に携わる者は、その相手方に対して、当該行政指導の趣旨及び内容並びに責任者を明確に示さなければならない。"],["２　行政指導に携わる者は、当該行政指導をする際に、行政機関が許認可等をする権限又は許認可等に基づく処分をする権限を行使し得る旨を示すときは、その相手方に対して、次に掲げる事項を示さなければならない。","- 一　当該権限を行使し得る根拠となる法令の条項","- 二　前号の条項に規定する要件","- 三　当該権限の行使が前号の要件に適合する理由"],["３　行政指導が口頭でされた場合において、その相手方から前二項に規定する事項を記載した書面の交付を求められたときは、当該行政指導に携わる者は、行政上特別の支障がない限り、これを交付しなければならない。"],["４　前項の規定は、次に掲げる行政指導については、適用しない。","- 一　相手方に対しその場において完了する行為を求めるもの","- 二　既に文書（前項の書面を含む。）又は電磁的記録（電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。）によりその相手方に通知されている事項と同一の内容を求めるもの"]]},"行政手続法36条":{"n":"行政手続法第三十六条","c":"（複数の者を対象とする行政指導）","p":[["同一の行政目的を実現するため一定の条件に該当する複数の者に対し行政指導をしようとするときは、行政機関は、あらかじめ、事案に応じ、行政指導指針を定め、かつ、行政上特別の支障がない限り、これを公表しなければならない。"]]},"行政手続法36条の2":{"n":"行政手続法第三十六条の二","c":"（行政指導の中止等の求め）","p":[["法令に違反する行為の是正を求める行政指導（その根拠となる規定が法律に置かれているものに限る。）の相手方は、当該行政指導が当該法律に規定する要件に適合しないと思料するときは、当該行政指導をした行政機関に対し、その旨を申し出て、当該行政指導の中止その他必要な措置をとることを求めることができる。ただし、当該行政指導がその相手方について弁明その他意見陳述のための手続を経てされたものであるときは、この限りでない。"],["２　前項の申出は、次に掲げる事項を記載した申出書を提出してしなければならない。","- 一　申出をする者の氏名又は名称及び住所又は居所","- 二　当該行政指導の内容","- 三　当該行政指導がその根拠とする法律の条項","- 四　前号の条項に規定する要件","- 五　当該行政指導が前号の要件に適合しないと思料する理由","- 六　その他参考となる事項"],["３　当該行政機関は、第一項の規定による申出があったときは、必要な調査を行い、当該行政指導が当該法律に規定する要件に適合しないと認めるときは、当該行政指導の中止その他必要な措置をとらなければならない。"]]},"行政手続法36条の3":{"n":"行政手続法第三十六条の三","c":"","p":[["何人も、法令に違反する事実がある場合において、その是正のためにされるべき処分又は行政指導（その根拠となる規定が法律に置かれているものに限る。）がされていないと思料するときは、当該処分をする権限を有する行政庁又は当該行政指導をする権限を有する行政機関に対し、その旨を申し出て、当該処分又は行政指導をすることを求めることができる。"],["２　前項の申出は、次に掲げる事項を記載した申出書を提出してしなければならない。","- 一　申出をする者の氏名又は名称及び住所又は居所","- 二　法令に違反する事実の内容","- 三　当該処分又は行政指導の内容","- 四　当該処分又は行政指導の根拠となる法令の条項","- 五　当該処分又は行政指導がされるべきであると思料する理由","- 六　その他参考となる事項"],["３　当該行政庁又は行政機関は、第一項の規定による申出があったときは、必要な調査を行い、その結果に基づき必要があると認めるときは、当該処分又は行政指導をしなければならない。"]]},"行政不服審査法3条":{"n":"行政不服審査法第三条","c":"（不作為についての審査請求）","p":[["法令に基づき行政庁に対して処分についての申請をした者は、当該申請から相当の期間が経過したにもかかわらず、行政庁の不作為（法令に基づく申請に対して何らの処分をもしないことをいう。以下同じ。）がある場合には、次条の定めるところにより、当該不作為についての審査請求をすることができる。"]]},"行政不服審査法9条":{"n":"行政不服審査法第九条","c":"（審理員）","p":[["第四条又は他の法律若しくは条例の規定により審査請求がされた行政庁（第十四条の規定により引継ぎを受けた行政庁を含む。以下「審査庁」という。）は、審査庁に所属する職員（第十七条に規定する名簿を作成した場合にあっては、当該名簿に記載されている者）のうちから第三節に規定する審理手続（この節に規定する手続を含む。）を行う者を指名するとともに、その旨を審査請求人及び処分庁等（審査庁以外の処分庁等に限る。）に通知しなければならない。ただし、次の各号のいずれかに掲げる機関が審査庁である場合若しくは条例に基づく処分について条例に特別の定めがある場合又は第二十四条の規定により当該審査請求を却下する場合は、この限りでない。","- 一　内閣府設置法第四十九条第一項若しくは第二項又は国家行政組織法第三条第二項に規定する委員会","- 二　内閣府設置法第三十七条若しくは第五十四条又は国家行政組織法第八条に規定する機関","- 三　地方自治法（昭和二十二年法律第六十七号）第百三十八条の四第一項に規定する委員会若しくは委員又は同条第三項に規定する機関"],["２　審査庁が前項の規定により指名する者は、次に掲げる者以外の者でなければならない。","- 一　審査請求に係る処分若しくは当該処分に係る再調査の請求についての決定に関与した者又は審査請求に係る不作為に係る処分に関与し、若しくは関与することとなる者","- 二　審査請求人","- 三　審査請求人の配偶者、四親等内の親族又は同居の親族","- 四　審査請求人の代理人","- 五　前二号に掲げる者であった者","- 六　審査請求人の後見人、後見監督人、保佐人、保佐監督人、補助人又は補助監督人","- 七　第十三条第一項に規定する利害関係人"],["３　審査庁が第一項各号に掲げる機関である場合又は同項ただし書の特別の定めがある場合においては、別表第一の上欄に掲げる規定の適用については、これらの規定中同表の中欄に掲げる字句は、それぞれ同表の下欄に掲げる字句に読み替えるものとし、第十七条、第四十条、第四十二条及び第五十条第二項の規定は、適用しない。"],["４　前項に規定する場合において、審査庁は、必要があると認めるときは、その職員（第二項各号（第一項各号に掲げる機関の構成員にあっては、第一号を除く。）に掲げる者以外の者に限る。）に、前項において読み替えて適用する第三十一条第一項の規定による審査請求人若しくは第十三条第四項に規定する参加人の意見の陳述を聴かせ、前項において読み替えて適用する第三十四条の規定による参考人の陳述を聴かせ、同項において読み替えて適用する第三十五条第一項の規定による検証をさせ、前項において読み替えて適用する第三十六条の規定による第二十八条に規定する審理関係人に対する質問をさせ、又は同項において読み替えて適用する第三十七条第一項若しくは第二項の規定による意見の聴取を行わせることができる。"]]},"行政不服審査法18条":{"n":"行政不服審査法第十八条","c":"（審査請求期間）","p":[["処分についての審査請求は、処分があったことを知った日の翌日から起算して三月（当該処分について再調査の請求をしたときは、当該再調査の請求についての決定があったことを知った日の翌日から起算して一月）を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。"],["２　処分についての審査請求は、処分（当該処分について再調査の請求をしたときは、当該再調査の請求についての決定）があった日の翌日から起算して一年を経過したときは、することができない。ただし、正当な理由があるときは、この限りでない。"],["３　次条に規定する審査請求書を郵便又は民間事業者による信書の送達に関する法律（平成十四年法律第九十九号）第二条第六項に規定する一般信書便事業者若しくは同条第九項に規定する特定信書便事業者による同条第二項に規定する信書便で提出した場合における前二項に規定する期間（以下「審査請求期間」という。）の計算については、送付に要した日数は、算入しない。"]]},"行政不服審査法19条":{"n":"行政不服審査法第十九条","c":"（審査請求書の提出）","p":[["審査請求は、他の法律（条例に基づく処分については、条例）に口頭ですることができる旨の定めがある場合を除き、政令で定めるところにより、審査請求書を提出してしなければならない。"],["２　処分についての審査請求書には、次に掲げる事項を記載しなければならない。","- 一　審査請求人の氏名又は名称及び住所又は居所","- 二　審査請求に係る処分の内容","- 三　審査請求に係る処分（当該処分について再調査の請求についての決定を経たときは、当該決定）があったことを知った年月日","- 四　審査請求の趣旨及び理由","- 五　処分庁の教示の有無及びその内容","- 六　審査請求の年月日"],["３　不作為についての審査請求書には、次に掲げる事項を記載しなければならない。","- 一　審査請求人の氏名又は名称及び住所又は居所","- 二　当該不作為に係る処分についての申請の内容及び年月日","- 三　審査請求の年月日"],["４　審査請求人が、法人その他の社団若しくは財団である場合、総代を互選した場合又は代理人によって審査請求をする場合には、審査請求書には、第二項各号又は前項各号に掲げる事項のほか、その代表者若しくは管理人、総代又は代理人の氏名及び住所又は居所を記載しなければならない。"],["５　処分についての審査請求書には、第二項及び前項に規定する事項のほか、次の各号に掲げる場合においては、当該各号に定める事項を記載しなければならない。","- 一　第五条第二項第一号の規定により再調査の請求についての決定を経ないで審査請求をする場合　再調査の請求をした年月日","- 二　第五条第二項第二号の規定により再調査の請求についての決定を経ないで審査請求をする場合　その決定を経ないことについての正当な理由","- 三　審査請求期間の経過後において審査請求をする場合　前条第一項ただし書又は第二項ただし書に規定する正当な理由"]]},"行政不服審査法25条":{"n":"行政不服審査法第二十五条","c":"（執行停止）","p":[["審査請求は、処分の効力、処分の執行又は手続の続行を妨げない。"],["２　処分庁の上級行政庁又は処分庁である審査庁は、必要があると認める場合には、審査請求人の申立てにより又は職権で、処分の効力、処分の執行又は手続の続行の全部又は一部の停止その他の措置（以下「執行停止」という。）をとることができる。"],["３　処分庁の上級行政庁又は処分庁のいずれでもない審査庁は、必要があると認める場合には、審査請求人の申立てにより、処分庁の意見を聴取した上、執行停止をすることができる。ただし、処分の効力、処分の執行又は手続の続行の全部又は一部の停止以外の措置をとることはできない。"],["４　前二項の規定による審査請求人の申立てがあった場合において、処分、処分の執行又は手続の続行により生ずる重大な損害を避けるために緊急の必要があると認めるときは、審査庁は、執行停止をしなければならない。ただし、公共の福祉に重大な影響を及ぼすおそれがあるとき、又は本案について理由がないとみえるときは、この限りでない。"],["５　審査庁は、前項に規定する重大な損害を生ずるか否かを判断するに当たっては、損害の回復の困難の程度を考慮するものとし、損害の性質及び程度並びに処分の内容及び性質をも勘案するものとする。"],["６　第二項から第四項までの場合において、処分の効力の停止は、処分の効力の停止以外の措置によって目的を達することができるときは、することができない。"],["７　執行停止の申立てがあったとき、又は審理員から第四十条に規定する執行停止をすべき旨の意見書が提出されたときは、審査庁は、速やかに、執行停止をするかどうかを決定しなければならない。"]]},"行政不服審査法5条":{"n":"行政不服審査法第五条","c":"（再調査の請求）","p":[["行政庁の処分につき処分庁以外の行政庁に対して審査請求をすることができる場合において、法律に再調査の請求をすることができる旨の定めがあるときは、当該処分に不服がある者は、処分庁に対して再調査の請求をすることができる。ただし、当該処分について第二条の規定により審査請求をしたときは、この限りでない。"],["２　前項本文の規定により再調査の請求をしたときは、当該再調査の請求についての決定を経た後でなければ、審査請求をすることができない。ただし、次の各号のいずれかに該当する場合は、この限りでない。","- 一　当該処分につき再調査の請求をした日（第六十一条において読み替えて準用する第二十三条の規定により不備を補正すべきことを命じられた場合にあっては、当該不備を補正した日）の翌日から起算して三月を経過しても、処分庁が当該再調査の請求につき決定をしない場合","- 二　その他再調査の請求についての決定を経ないことにつき正当な理由がある場合"]]},"行政不服審査法6条":{"n":"行政不服審査法第六条","c":"（再審査請求）","p":[["行政庁の処分につき法律に再審査請求をすることができる旨の定めがある場合には、当該処分についての審査請求の裁決に不服がある者は、再審査請求をすることができる。"],["２　再審査請求は、原裁決（再審査請求をすることができる処分についての審査請求の裁決をいう。以下同じ。）又は当該処分（以下「原裁決等」という。）を対象として、前項の法律に定める行政庁に対してするものとする。"]]},"行政不服審査法31条":{"n":"行政不服審査法第三十一条","c":"（口頭意見陳述）","p":[["審査請求人又は参加人の申立てがあった場合には、審理員は、当該申立てをした者（以下この条及び第四十一条第二項第二号において「申立人」という。）に口頭で審査請求に係る事件に関する意見を述べる機会を与えなければならない。ただし、当該申立人の所在その他の事情により当該意見を述べる機会を与えることが困難であると認められる場合には、この限りでない。"],["２　前項本文の規定による意見の陳述（以下「口頭意見陳述」という。）は、審理員が期日及び場所を指定し、全ての審理関係人を招集してさせるものとする。"],["３　口頭意見陳述において、申立人は、審理員の許可を得て、補佐人とともに出頭することができる。"],["４　口頭意見陳述において、審理員は、申立人のする陳述が事件に関係のない事項にわたる場合その他相当でない場合には、これを制限することができる。"],["５　口頭意見陳述に際し、申立人は、審理員の許可を得て、審査請求に係る事件に関し、処分庁等に対して、質問を発することができる。"]]},"行政不服審査法43条":{"n":"行政不服審査法第四十三条","c":"","p":[["審査庁は、審理員意見書の提出を受けたときは、次の各号のいずれかに該当する場合を除き、審査庁が主任の大臣又は宮内庁長官若しくは内閣府設置法第四十九条第一項若しくは第二項若しくは国家行政組織法第三条第二項に規定する庁の長である場合にあっては行政不服審査会に、審査庁が地方公共団体の長（地方公共団体の組合にあっては、長、管理者又は理事会）である場合にあっては第八十一条第一項又は第二項の機関に、それぞれ諮問しなければならない。","- 一　審査請求に係る処分をしようとするときに他の法律又は政令（条例に基づく処分については、条例）に第九条第一項各号に掲げる機関若しくは地方公共団体の議会又はこれらの機関に類するものとして政令で定めるもの（以下「審議会等」という。）の議を経るべき旨又は経ることができる旨の定めがあり、かつ、当該議を経て当該処分がされた場合","- 二　裁決をしようとするときに他の法律又は政令（条例に基づく処分については、条例）に第九条第一項各号に掲げる機関若しくは地方公共団体の議会又はこれらの機関に類するものとして政令で定めるものの議を経るべき旨又は経ることができる旨の定めがあり、かつ、当該議を経て裁決をしようとする場合","- 三　第四十六条第三項又は第四十九条第四項の規定により審議会等の議を経て裁決をしようとする場合","- 四　審査請求人から、行政不服審査会又は第八十一条第一項若しくは第二項の機関（以下「行政不服審査会等」という。）への諮問を希望しない旨の申出がされている場合（参加人から、行政不服審査会等に諮問しないことについて反対する旨の申出がされている場合を除く。）","- 五　審査請求が、行政不服審査会等によって、国民の権利利益及び行政の運営に対する影響の程度その他当該事件の性質を勘案して、諮問を要しないものと認められたものである場合","- 六　審査請求が不適法であり、却下する場合","- 七　第四十六条第一項の規定により審査請求に係る処分（法令に基づく申請を却下し、又は棄却する処分及び事実上の行為を除く。）の全部を取り消し、又は第四十七条第一号若しくは第二号の規定により審査請求に係る事実上の行為の全部を撤廃すべき旨を命じ、若しくは撤廃することとする場合（当該処分の全部を取り消すこと又は当該事実上の行為の全部を撤廃すべき旨を命じ、若しくは撤廃することについて反対する旨の意見書が提出されている場合及び口頭意見陳述においてその旨の意見が述べられている場合を除く。）","- 八　第四十六条第二項各号又は第四十九条第三項各号に定める措置（法令に基づく申請の全部を認容すべき旨を命じ、又は認容するものに限る。）をとることとする場合（当該申請の全部を認容することについて反対する旨の意見書が提出されている場合及び口頭意見陳述においてその旨の意見が述べられている場合を除く。）"],["２　前項の規定による諮問は、審理員意見書及び事件記録の写しを添えてしなければならない。"],["３　第一項の規定により諮問をした審査庁は、審理関係人（処分庁等が審査庁である場合にあっては、審査請求人及び参加人）に対し、当該諮問をした旨を通知するとともに、審理員意見書の写しを送付しなければならない。"]]},"行政不服審査法50条":{"n":"行政不服審査法第五十条","c":"（裁決の方式）","p":[["裁決は、次に掲げる事項を記載し、審査庁が記名押印した裁決書によりしなければならない。","- 一　主文","- 二　事案の概要","- 三　審理関係人の主張の要旨","- 四　理由（第一号の主文が審理員意見書又は行政不服審査会等若しくは審議会等の答申書と異なる内容である場合には、異なることとなった理由を含む。）"],["２　第四十三条第一項の規定による行政不服審査会等への諮問を要しない場合には、前項の裁決書には、審理員意見書を添付しなければならない。"],["３　審査庁は、再審査請求をすることができる裁決をする場合には、裁決書に再審査請求をすることができる旨並びに再審査請求をすべき行政庁及び再審査請求期間（第六十二条に規定する期間をいう。）を記載して、これらを教示しなければならない。"]]},"行政事件訴訟法8条":{"n":"行政事件訴訟法第八条","c":"（処分の取消しの訴えと審査請求との関係）","p":[["処分の取消しの訴えは、当該処分につき法令の規定により審査請求をすることができる場合においても、直ちに提起することを妨げない。ただし、法律に当該処分についての審査請求に対する裁決を経た後でなければ処分の取消しの訴えを提起することができない旨の定めがあるときは、この限りでない。"],["２　前項ただし書の場合においても、次の各号の一に該当するときは、裁決を経ないで、処分の取消しの訴えを提起することができる。","- 一　審査請求があつた日から三箇月を経過しても裁決がないとき。","- 二　処分、処分の執行又は手続の続行により生ずる著しい損害を避けるため緊急の必要があるとき。","- 三　その他裁決を経ないことにつき正当な理由があるとき。"],["３　第一項本文の場合において、当該処分につき審査請求がされているときは、裁判所は、その審査請求に対する裁決があるまで（審査請求があつた日から三箇月を経過しても裁決がないときは、その期間を経過するまで）、訴訟手続を中止することができる。"]]},"行政事件訴訟法10条":{"n":"行政事件訴訟法第十条","c":"（取消しの理由の制限）","p":[["取消訴訟においては、自己の法律上の利益に関係のない違法を理由として取消しを求めることができない。"],["２　処分の取消しの訴えとその処分についての審査請求を棄却した裁決の取消しの訴えとを提起することができる場合には、裁決の取消しの訴えにおいては、処分の違法を理由として取消しを求めることができない。"]]},"行政事件訴訟法11条":{"n":"行政事件訴訟法第十一条","c":"（被告適格等）","p":[["処分又は裁決をした行政庁（処分又は裁決があつた後に当該行政庁の権限が他の行政庁に承継されたときは、当該他の行政庁。以下同じ。）が国又は公共団体に所属する場合には、取消訴訟は、次の各号に掲げる訴えの区分に応じてそれぞれ当該各号に定める者を被告として提起しなければならない。","- 一　処分の取消しの訴え　当該処分をした行政庁の所属する国又は公共団体","- 二　裁決の取消しの訴え　当該裁決をした行政庁の所属する国又は公共団体"],["２　処分又は裁決をした行政庁が国又は公共団体に所属しない場合には、取消訴訟は、当該行政庁を被告として提起しなければならない。"],["３　前二項の規定により被告とすべき国若しくは公共団体又は行政庁がない場合には、取消訴訟は、当該処分又は裁決に係る事務の帰属する国又は公共団体を被告として提起しなければならない。"],["４　第一項又は前項の規定により国又は公共団体を被告として取消訴訟を提起する場合には、訴状には、民事訴訟の例により記載すべき事項のほか、次の各号に掲げる訴えの区分に応じてそれぞれ当該各号に定める行政庁を記載するものとする。","- 一　処分の取消しの訴え　当該処分をした行政庁","- 二　裁決の取消しの訴え　当該裁決をした行政庁"],["５　第一項又は第三項の規定により国又は公共団体を被告として取消訴訟が提起された場合には、被告は、遅滞なく、裁判所に対し、前項各号に掲げる訴えの区分に応じてそれぞれ当該各号に定める行政庁を明らかにしなければならない。"],["６　処分又は裁決をした行政庁は、当該処分又は裁決に係る第一項の規定による国又は公共団体を被告とする訴訟について、裁判上の一切の行為をする権限を有する。"]]},"行政事件訴訟法14条":{"n":"行政事件訴訟法第十四条","c":"（出訴期間）","p":[["取消訴訟は、処分又は裁決があつたことを知つた日から六箇月を経過したときは、提起することができない。ただし、正当な理由があるときは、この限りでない。"],["２　取消訴訟は、処分又は裁決の日から一年を経過したときは、提起することができない。ただし、正当な理由があるときは、この限りでない。"],["３　処分又は裁決につき審査請求をすることができる場合又は行政庁が誤つて審査請求をすることができる旨を教示した場合において、審査請求があつたときは、処分又は裁決に係る取消訴訟は、その審査請求をした者については、前二項の規定にかかわらず、これに対する裁決があつたことを知つた日から六箇月を経過したとき又は当該裁決の日から一年を経過したときは、提起することができない。ただし、正当な理由があるときは、この限りでない。"]]},"行政事件訴訟法25条":{"n":"行政事件訴訟法第二十五条","c":"（執行停止）","p":[["処分の取消しの訴えの提起は、処分の効力、処分の執行又は手続の続行を妨げない。"],["２　処分の取消しの訴えの提起があつた場合において、処分、処分の執行又は手続の続行により生ずる重大な損害を避けるため緊急の必要があるときは、裁判所は、申立てにより、決定をもつて、処分の効力、処分の執行又は手続の続行の全部又は一部の停止（以下「執行停止」という。）をすることができる。ただし、処分の効力の停止は、処分の執行又は手続の続行の停止によつて目的を達することができる場合には、することができない。"],["３　裁判所は、前項に規定する重大な損害を生ずるか否かを判断するに当たつては、損害の回復の困難の程度を考慮するものとし、損害の性質及び程度並びに処分の内容及び性質をも勘案するものとする。"],["４　執行停止は、公共の福祉に重大な影響を及ぼすおそれがあるとき、又は本案について理由がないとみえるときは、することができない。"],["５　第二項の決定は、疎明に基づいてする。"],["６　第二項の決定は、口頭弁論を経ないですることができる。ただし、あらかじめ、当事者の意見をきかなければならない。"],["７　第二項の申立てに対する決定に対しては、即時抗告をすることができる。"],["８　第二項の決定に対する即時抗告は、その決定の執行を停止する効力を有しない。"]]},"行政事件訴訟法4条":{"n":"行政事件訴訟法第四条","c":"（当事者訴訟）","p":[["この法律において「当事者訴訟」とは、当事者間の法律関係を確認し又は形成する処分又は裁決に関する訴訟で法令の規定によりその法律関係の当事者の一方を被告とするもの及び公法上の法律関係に関する確認の訴えその他の公法上の法律関係に関する訴訟をいう。"]]},"行政事件訴訟法37条の2":{"n":"行政事件訴訟法第三十七条の二","c":"（義務付けの訴えの要件等）","p":[["第三条第六項第一号に掲げる場合において、義務付けの訴えは、一定の処分がされないことにより重大な損害を生ずるおそれがあり、かつ、その損害を避けるため他に適当な方法がないときに限り、提起することができる。"],["２　裁判所は、前項に規定する重大な損害を生ずるか否かを判断するに当たつては、損害の回復の困難の程度を考慮するものとし、損害の性質及び程度並びに処分の内容及び性質をも勘案するものとする。"],["３　第一項の義務付けの訴えは、行政庁が一定の処分をすべき旨を命ずることを求めるにつき法律上の利益を有する者に限り、提起することができる。"],["４　前項に規定する法律上の利益の有無の判断については、第九条第二項の規定を準用する。"],["５　義務付けの訴えが第一項及び第三項に規定する要件に該当する場合において、その義務付けの訴えに係る処分につき、行政庁がその処分をすべきであることがその処分の根拠となる法令の規定から明らかであると認められ又は行政庁がその処分をしないことがその裁量権の範囲を超え若しくはその濫用となると認められるときは、裁判所は、行政庁がその処分をすべき旨を命ずる判決をする。"]]},"行政事件訴訟法37条の3":{"n":"行政事件訴訟法第三十七条の三","c":"","p":[["第三条第六項第二号に掲げる場合において、義務付けの訴えは、次の各号に掲げる要件のいずれかに該当するときに限り、提起することができる。","- 一　当該法令に基づく申請又は審査請求に対し相当の期間内に何らの処分又は裁決がされないこと。","- 二　当該法令に基づく申請又は審査請求を却下し又は棄却する旨の処分又は裁決がされた場合において、当該処分又は裁決が取り消されるべきものであり、又は無効若しくは不存在であること。"],["２　前項の義務付けの訴えは、同項各号に規定する法令に基づく申請又は審査請求をした者に限り、提起することができる。"],["３　第一項の義務付けの訴えを提起するときは、次の各号に掲げる区分に応じてそれぞれ当該各号に定める訴えをその義務付けの訴えに併合して提起しなければならない。この場合において、当該各号に定める訴えに係る訴訟の管轄について他の法律に特別の定めがあるときは、当該義務付けの訴えに係る訴訟の管轄は、第三十八条第一項において準用する第十二条の規定にかかわらず、その定めに従う。","- 一　第一項第一号に掲げる要件に該当する場合　同号に規定する処分又は裁決に係る不作為の違法確認の訴え","- 二　第一項第二号に掲げる要件に該当する場合　同号に規定する処分又は裁決に係る取消訴訟又は無効等確認の訴え"],["４　前項の規定により併合して提起された義務付けの訴え及び同項各号に定める訴えに係る弁論及び裁判は、分離しないでしなければならない。"],["５　義務付けの訴えが第一項から第三項までに規定する要件に該当する場合において、同項各号に定める訴えに係る請求に理由があると認められ、かつ、その義務付けの訴えに係る処分又は裁決につき、行政庁がその処分若しくは裁決をすべきであることがその処分若しくは裁決の根拠となる法令の規定から明らかであると認められ又は行政庁がその処分若しくは裁決をしないことがその裁量権の範囲を超え若しくはその濫用となると認められるときは、裁判所は、その義務付けの訴えに係る処分又は裁決をすべき旨を命ずる判決をする。"],["６　第四項の規定にかかわらず、裁判所は、審理の状況その他の事情を考慮して、第三項各号に定める訴えについてのみ終局判決をすることがより迅速な争訟の解決に資すると認めるときは、当該訴えについてのみ終局判決をすることができる。この場合において、裁判所は、当該訴えについてのみ終局判決をしたときは、当事者の意見を聴いて、当該訴えに係る訴訟手続が完結するまでの間、義務付けの訴えに係る訴訟手続を中止することができる。"],["７　第一項の義務付けの訴えのうち、行政庁が一定の裁決をすべき旨を命ずることを求めるものは、処分についての審査請求がされた場合において、当該処分に係る処分の取消しの訴え又は無効等確認の訴えを提起することができないときに限り、提起することができる。"]]},"行政事件訴訟法37条の4":{"n":"行政事件訴訟法第三十七条の四","c":"（差止めの訴えの要件）","p":[["差止めの訴えは、一定の処分又は裁決がされることにより重大な損害を生ずるおそれがある場合に限り、提起することができる。ただし、その損害を避けるため他に適当な方法があるときは、この限りでない。"],["２　裁判所は、前項に規定する重大な損害を生ずるか否かを判断するに当たつては、損害の回復の困難の程度を考慮するものとし、損害の性質及び程度並びに処分又は裁決の内容及び性質をも勘案するものとする。"],["３　差止めの訴えは、行政庁が一定の処分又は裁決をしてはならない旨を命ずることを求めるにつき法律上の利益を有する者に限り、提起することができる。"],["４　前項に規定する法律上の利益の有無の判断については、第九条第二項の規定を準用する。"],["５　差止めの訴えが第一項及び第三項に規定する要件に該当する場合において、その差止めの訴えに係る処分又は裁決につき、行政庁がその処分若しくは裁決をすべきでないことがその処分若しくは裁決の根拠となる法令の規定から明らかであると認められ又は行政庁がその処分若しくは裁決をすることがその裁量権の範囲を超え若しくはその濫用となると認められるときは、裁判所は、行政庁がその処分又は裁決をしてはならない旨を命ずる判決をする。"]]},"行政事件訴訟法37条の5":{"n":"行政事件訴訟法第三十七条の五","c":"（仮の義務付け及び仮の差止め）","p":[["義務付けの訴えの提起があつた場合において、その義務付けの訴えに係る処分又は裁決がされないことにより生ずる償うことのできない損害を避けるため緊急の必要があり、かつ、本案について理由があるとみえるときは、裁判所は、申立てにより、決定をもつて、仮に行政庁がその処分又は裁決をすべき旨を命ずること（以下この条において「仮の義務付け」という。）ができる。"],["２　差止めの訴えの提起があつた場合において、その差止めの訴えに係る処分又は裁決がされることにより生ずる償うことのできない損害を避けるため緊急の必要があり、かつ、本案について理由があるとみえるときは、裁判所は、申立てにより、決定をもつて、仮に行政庁がその処分又は裁決をしてはならない旨を命ずること（以下この条において「仮の差止め」という。）ができる。"],["３　仮の義務付け又は仮の差止めは、公共の福祉に重大な影響を及ぼすおそれがあるときは、することができない。"],["４　第二十五条第五項から第八項まで、第二十六条から第二十八条まで及び第三十三条第一項の規定は、仮の義務付け又は仮の差止めに関する事項について準用する。"],["５　前項において準用する第二十五条第七項の即時抗告についての裁判又は前項において準用する第二十六条第一項の決定により仮の義務付けの決定が取り消されたときは、当該行政庁は、当該仮の義務付けの決定に基づいてした処分又は裁決を取り消さなければならない。"]]},"行政事件訴訟法3条":{"n":"行政事件訴訟法第三条","c":"（抗告訴訟）","p":[["この法律において「抗告訴訟」とは、行政庁の公権力の行使に関する不服の訴訟をいう。"],["２　この法律において「処分の取消しの訴え」とは、行政庁の処分その他公権力の行使に当たる行為（次項に規定する裁決、決定その他の行為を除く。以下単に「処分」という。）の取消しを求める訴訟をいう。"],["３　この法律において「裁決の取消しの訴え」とは、審査請求その他の不服申立て（以下単に「審査請求」という。）に対する行政庁の裁決、決定その他の行為（以下単に「裁決」という。）の取消しを求める訴訟をいう。"],["４　この法律において「無効等確認の訴え」とは、処分若しくは裁決の存否又はその効力の有無の確認を求める訴訟をいう。"],["５　この法律において「不作為の違法確認の訴え」とは、行政庁が法令に基づく申請に対し、相当の期間内に何らかの処分又は裁決をすべきであるにかかわらず、これをしないことについての違法の確認を求める訴訟をいう。"],["６　この法律において「義務付けの訴え」とは、次に掲げる場合において、行政庁がその処分又は裁決をすべき旨を命ずることを求める訴訟をいう。","- 一　行政庁が一定の処分をすべきであるにかかわらずこれがされないとき（次号に掲げる場合を除く。）。","- 二　行政庁に対し一定の処分又は裁決を求める旨の法令に基づく申請又は審査請求がされた場合において、当該行政庁がその処分又は裁決をすべきであるにかかわらずこれがされないとき。"],["７　この法律において「差止めの訴え」とは、行政庁が一定の処分又は裁決をすべきでないにかかわらずこれがされようとしている場合において、行政庁がその処分又は裁決をしてはならない旨を命ずることを求める訴訟をいう。"]]},"行政事件訴訟法9条":{"n":"行政事件訴訟法第九条","c":"（原告適格）","p":[["処分の取消しの訴え及び裁決の取消しの訴え（以下「取消訴訟」という。）は、当該処分又は裁決の取消しを求めるにつき法律上の利益を有する者（処分又は裁決の効果が期間の経過その他の理由によりなくなつた後においてもなお処分又は裁決の取消しによつて回復すべき法律上の利益を有する者を含む。）に限り、提起することができる。"],["２　裁判所は、処分又は裁決の相手方以外の者について前項に規定する法律上の利益の有無を判断するに当たつては、当該処分又は裁決の根拠となる法令の規定の文言のみによることなく、当該法令の趣旨及び目的並びに当該処分において考慮されるべき利益の内容及び性質を考慮するものとする。この場合において、当該法令の趣旨及び目的を考慮するに当たつては、当該法令と目的を共通にする関係法令があるときはその趣旨及び目的をも参酌するものとし、当該利益の内容及び性質を考慮するに当たつては、当該処分又は裁決がその根拠となる法令に違反してされた場合に害されることとなる利益の内容及び性質並びにこれが害される態様及び程度をも勘案するものとする。"]]},"国家賠償法1条":{"n":"国家賠償法第一条","c":"","p":[["国又は公共団体の公権力の行使に当る公務員が、その職務を行うについて、故意又は過失によつて違法に他人に損害を加えたときは、国又は公共団体が、これを賠償する責に任ずる。"],["前項の場合において、公務員に故意又は重大な過失があつたときは、国又は公共団体は、その公務員に対して求償権を有する。"]]},"国家賠償法2条":{"n":"国家賠償法第二条","c":"","p":[["道路、河川その他の公の営造物の設置又は管理に瑕疵があつたために他人に損害を生じたときは、国又は公共団体は、これを賠償する責に任ずる。"],["前項の場合において、他に損害の原因について責に任ずべき者があるときは、国又は公共団体は、これに対して求償権を有する。"]]},"国家賠償法6条":{"n":"国家賠償法第六条","c":"","p":[["この法律は、外国人が被害者である場合には、相互の保証があるときに限り、これを適用する。"]]},"地方自治法74条":{"n":"地方自治法第七十四条","c":"","p":[["普通地方公共団体の議会の議員及び長の選挙権を有する者（以下この編において「選挙権を有する者」という。）は、政令で定めるところにより、その総数の五十分の一以上の者の連署をもつて、その代表者から、普通地方公共団体の長に対し、条例（地方税の賦課徴収並びに分担金、使用料及び手数料の徴収に関するものを除く。）の制定又は改廃の請求をすることができる。"],["前項の請求があつたときは、当該普通地方公共団体の長は、直ちに請求の要旨を公表しなければならない。"],["普通地方公共団体の長は、第一項の請求を受理した日から二十日以内に議会を招集し、意見を付けてこれを議会に付議し、その結果を同項の代表者（以下この条において「代表者」という。）に通知するとともに、これを公表しなければならない。"],["議会は、前項の規定により付議された事件の審議を行うに当たつては、政令で定めるところにより、代表者に意見を述べる機会を与えなければならない。"],["第一項の選挙権を有する者とは、公職選挙法（昭和二十五年法律第百号）第二十二条第一項又は第三項の規定による選挙人名簿の登録が行われた日において選挙人名簿に登録されている者とし、その総数の五十分の一の数は、当該普通地方公共団体の選挙管理委員会において、その登録が行われた日後直ちに告示しなければならない。"],["選挙権を有する者のうち次に掲げるものは、代表者となり、又は代表者であることができない。","- 一　公職選挙法第二十七条第一項又は第二項の規定により選挙人名簿にこれらの項の表示をされている者（都道府県に係る請求にあつては、同法第九条第三項の規定により当該都道府県の議会の議員及び長の選挙権を有するものとされた者（同法第十一条第一項若しくは第二百五十二条又は政治資金規正法（昭和二十三年法律第百九十四号）第二十八条の規定により選挙権を有しなくなつた旨の表示をされている者を除く。）を除く。）","- 二　前項の選挙人名簿の登録が行われた日以後に公職選挙法第二十八条の規定により選挙人名簿から抹消された者","- 三　第一項の請求に係る普通地方公共団体（当該普通地方公共団体が、都道府県である場合には当該都道府県の区域内の市町村並びに第二百五十二条の十九第一項に規定する指定都市（以下この号において「指定都市」という。）の区及び総合区を含み、指定都市である場合には当該市の区及び総合区を含む。）の選挙管理委員会の委員又は職員である者"],["第一項の場合において、当該地方公共団体の区域内で衆議院議員、参議院議員又は地方公共団体の議会の議員若しくは長の選挙が行われることとなるときは、政令で定める期間、当該選挙が行われる区域内においては請求のための署名を求めることができない。"],["選挙権を有する者は、心身の故障その他の事由により条例の制定又は改廃の請求者の署名簿に署名することができないときは、その者の属する市町村の選挙権を有する者（代表者及び代表者の委任を受けて当該市町村の選挙権を有する者に対し当該署名簿に署名することを求める者を除く。）に委任して、自己の氏名（以下「請求者の氏名」という。）を当該署名簿に記載させることができる。この場合において、委任を受けた者による当該請求者の氏名の記載は、第一項の規定による請求者の署名とみなす。"],["前項の規定により委任を受けた者（以下「氏名代筆者」という。）が請求者の氏名を条例の制定又は改廃の請求者の署名簿に記載する場合には、氏名代筆者は、当該署名簿に氏名代筆者としての署名をしなければならない。"]]},"地方自治法75条":{"n":"地方自治法第七十五条","c":"","p":[["選挙権を有する者（道の方面公安委員会については、当該方面公安委員会の管理する方面本部の管轄区域内において選挙権を有する者）は、政令で定めるところにより、その総数の五十分の一以上の者の連署をもつて、その代表者から、普通地方公共団体の監査委員に対し、当該普通地方公共団体の事務の執行に関し、監査の請求をすることができる。"],["前項の請求があつたときは、監査委員は、直ちに当該請求の要旨を公表しなければならない。"],["監査委員は、第一項の請求に係る事項につき監査し、監査の結果に関する報告を決定し、これを同項の代表者（第五項及び第六項において「代表者」という。）に送付し、かつ、公表するとともに、これを当該普通地方公共団体の議会及び長並びに関係のある教育委員会、選挙管理委員会、人事委員会若しくは公平委員会、公安委員会、労働委員会、農業委員会その他法律に基づく委員会又は委員に提出しなければならない。"],["前項の規定による監査の結果に関する報告の決定は、監査委員の合議によるものとする。"],["監査委員は、第三項の規定による監査の結果に関する報告の決定について、各監査委員の意見が一致しないことにより、前項の合議により決定することができない事項がある場合には、その旨及び当該事項についての各監査委員の意見を代表者に送付し、かつ、公表するとともに、これらを当該普通地方公共団体の議会及び長並びに関係のある教育委員会、選挙管理委員会、人事委員会若しくは公平委員会、公安委員会、労働委員会、農業委員会その他法律に基づく委員会又は委員に提出しなければならない。"],["第七十四条第五項の規定は第一項の選挙権を有する者及びその総数の五十分の一の数について、同条第六項の規定は代表者について、同条第七項から第九項まで及び第七十四条の二から前条までの規定は第一項の規定による請求者の署名について、それぞれ準用する。この場合において、第七十四条第六項第三号中「区域内」とあるのは、「区域内（道の方面公安委員会に係る請求については、当該方面公安委員会の管理する方面本部の管轄区域内）」と読み替えるものとする。"]]},"地方自治法76条":{"n":"地方自治法第七十六条","c":"","p":[["選挙権を有する者は、政令の定めるところにより、その総数の三分の一（その総数が四十万を超え八十万以下の場合にあつてはその四十万を超える数に六分の一を乗じて得た数と四十万に三分の一を乗じて得た数とを合算して得た数、その総数が八十万を超える場合にあつてはその八十万を超える数に八分の一を乗じて得た数と四十万に六分の一を乗じて得た数と四十万に三分の一を乗じて得た数とを合算して得た数）以上の者の連署をもつて、その代表者から、普通地方公共団体の選挙管理委員会に対し、当該普通地方公共団体の議会の解散の請求をすることができる。"],["前項の請求があつたときは、委員会は、直ちに請求の要旨を公表しなければならない。"],["第一項の請求があつたとき、委員会は、これを選挙人の投票に付さなければならない。"],["第七十四条第五項の規定は第一項の選挙権を有する者及びその総数の三分の一の数（その総数が四十万を超え八十万以下の場合にあつてはその四十万を超える数に六分の一を乗じて得た数と四十万に三分の一を乗じて得た数とを合算して得た数、その総数が八十万を超える場合にあつてはその八十万を超える数に八分の一を乗じて得た数と四十万に六分の一を乗じて得た数と四十万に三分の一を乗じて得た数とを合算して得た数）について、同条第六項の規定は第一項の代表者について、同条第七項から第九項まで及び第七十四条の二から第七十四条の四までの規定は第一項の規定による請求者の署名について準用する。"]]},"地方自治法242条":{"n":"地方自治法第二百四十二条","c":"（住民監査請求）","p":[["普通地方公共団体の住民は、当該普通地方公共団体の長若しくは委員会若しくは委員又は当該普通地方公共団体の職員について、違法若しくは不当な公金の支出、財産の取得、管理若しくは処分、契約の締結若しくは履行若しくは債務その他の義務の負担がある（当該行為がなされることが相当の確実さをもつて予測される場合を含む。）と認めるとき、又は違法若しくは不当に公金の賦課若しくは徴収若しくは財産の管理を怠る事実（以下「怠る事実」という。）があると認めるときは、これらを証する書面を添え、監査委員に対し、監査を求め、当該行為を防止し、若しくは是正し、若しくは当該怠る事実を改め、又は当該行為若しくは怠る事実によつて当該普通地方公共団体の被つた損害を補塡するために必要な措置を講ずべきことを請求することができる。"],["２　前項の規定による請求は、当該行為のあつた日又は終わつた日から一年を経過したときは、これをすることができない。ただし、正当な理由があるときは、この限りでない。"],["３　第一項の規定による請求があつたときは、監査委員は、直ちに当該請求の要旨を当該普通地方公共団体の議会及び長に通知しなければならない。"],["４　第一項の規定による請求があつた場合において、当該行為が違法であると思料するに足りる相当な理由があり、当該行為により当該普通地方公共団体に生ずる回復の困難な損害を避けるため緊急の必要があり、かつ、当該行為を停止することによつて人の生命又は身体に対する重大な危害の発生の防止その他公共の福祉を著しく阻害するおそれがないと認めるときは、監査委員は、当該普通地方公共団体の長その他の執行機関又は職員に対し、理由を付して次項の手続が終了するまでの間当該行為を停止すべきことを勧告することができる。この場合において、監査委員は、当該勧告の内容を第一項の規定による請求人（以下この条において「請求人」という。）に通知するとともに、これを公表しなければならない。"],["５　第一項の規定による請求があつた場合には、監査委員は、監査を行い、当該請求に理由がないと認めるときは、理由を付してその旨を書面により請求人に通知するとともに、これを公表し、当該請求に理由があると認めるときは、当該普通地方公共団体の議会、長その他の執行機関又は職員に対し期間を示して必要な措置を講ずべきことを勧告するとともに、当該勧告の内容を請求人に通知し、かつ、これを公表しなければならない。"],["６　前項の規定による監査委員の監査及び勧告は、第一項の規定による請求があつた日から六十日以内に行わなければならない。"],["７　監査委員は、第五項の規定による監査を行うに当たつては、請求人に証拠の提出及び陳述の機会を与えなければならない。"],["８　監査委員は、前項の規定による陳述の聴取を行う場合又は関係のある当該普通地方公共団体の長その他の執行機関若しくは職員の陳述の聴取を行う場合において、必要があると認めるときは、関係のある当該普通地方公共団体の長その他の執行機関若しくは職員又は請求人を立ち会わせることができる。"],["９　第五項の規定による監査委員の勧告があつたときは、当該勧告を受けた議会、長その他の執行機関又は職員は、当該勧告に示された期間内に必要な措置を講ずるとともに、その旨を監査委員に通知しなければならない。この場合において、監査委員は、当該通知に係る事項を請求人に通知するとともに、これを公表しなければならない。"],["１０　普通地方公共団体の議会は、第一項の規定による請求があつた後に、当該請求に係る行為又は怠る事実に関する損害賠償又は不当利得返還の請求権その他の権利の放棄に関する議決をしようとするときは、あらかじめ監査委員の意見を聴かなければならない。"],["１１　第四項の規定による勧告、第五項の規定による監査及び勧告並びに前項の規定による意見についての決定は、監査委員の合議によるものとする。"]]},"地方自治法242条の2":{"n":"地方自治法第二百四十二条の二","c":"（住民訴訟）","p":[["普通地方公共団体の住民は、前条第一項の規定による請求をした場合において、同条第五項の規定による監査委員の監査の結果若しくは勧告若しくは同条第九項の規定による普通地方公共団体の議会、長その他の執行機関若しくは職員の措置に不服があるとき、又は監査委員が同条第五項の規定による監査若しくは勧告を同条第六項の期間内に行わないとき、若しくは議会、長その他の執行機関若しくは職員が同条第九項の規定による措置を講じないときは、裁判所に対し、同条第一項の請求に係る違法な行為又は怠る事実につき、訴えをもつて次に掲げる請求をすることができる。","- 一　当該執行機関又は職員に対する当該行為の全部又は一部の差止めの請求","- 二　行政処分たる当該行為の取消し又は無効確認の請求","- 三　当該執行機関又は職員に対する当該怠る事実の違法確認の請求","- 四　当該職員又は当該行為若しくは怠る事実に係る相手方に損害賠償又は不当利得返還の請求をすることを当該普通地方公共団体の執行機関又は職員に対して求める請求。ただし、当該職員又は当該行為若しくは怠る事実に係る相手方が第二百四十三条の二の九第三項の規定による賠償の命令の対象となる者である場合には、当該賠償の命令をすることを求める請求"],["２　前項の規定による訴訟は、次の各号に掲げる場合の区分に応じ、当該各号に定める期間内に提起しなければならない。","- 一　監査委員の監査の結果又は勧告に不服がある場合　当該監査の結果又は当該勧告の内容の通知があつた日から三十日以内","- 二　監査委員の勧告を受けた議会、長その他の執行機関又は職員の措置に不服がある場合　当該措置に係る監査委員の通知があつた日から三十日以内","- 三　監査委員が請求をした日から六十日を経過しても監査又は勧告を行わない場合　当該六十日を経過した日から三十日以内","- 四　監査委員の勧告を受けた議会、長その他の執行機関又は職員が措置を講じない場合　当該勧告に示された期間を経過した日から三十日以内"],["３　前項の期間は、不変期間とする。"],["４　第一項の規定による訴訟が係属しているときは、当該普通地方公共団体の他の住民は、別訴をもつて同一の請求をすることができない。"],["５　第一項の規定による訴訟は、当該普通地方公共団体の事務所の所在地を管轄する地方裁判所の管轄に専属する。"],["６　第一項第一号の規定による請求に基づく差止めは、当該行為を差し止めることによつて人の生命又は身体に対する重大な危害の発生の防止その他公共の福祉を著しく阻害するおそれがあるときは、することができない。"],["７　第一項第四号の規定による訴訟が提起された場合には、当該職員又は当該行為若しくは怠る事実の相手方に対して、当該普通地方公共団体の執行機関又は職員は、遅滞なく、その訴訟の告知をしなければならない。"],["８　前項の訴訟告知があつたときは、第一項第四号の規定による訴訟が終了した日から六月を経過するまでの間は、当該訴訟に係る損害賠償又は不当利得返還の請求権の時効は、完成しない。"],["９　民法第百五十三条第二項の規定は、前項の規定による時効の完成猶予について準用する。"],["１０　第一項に規定する違法な行為又は怠る事実については、民事保全法（平成元年法律第九十一号）に規定する仮処分をすることができない。"],["１１　第二項から前項までに定めるもののほか、第一項の規定による訴訟については、行政事件訴訟法第四十三条の規定の適用があるものとする。"],["１２　第一項の規定による訴訟を提起した者が勝訴（一部勝訴を含む。）した場合において、弁護士、弁護士法人又は弁護士・外国法事務弁護士共同法人に報酬を支払うべきときは、当該普通地方公共団体に対し、その報酬額の範囲内で相当と認められる額の支払を請求することができる。"]]},"行政事件訴訟法36条":{"n":"行政事件訴訟法第三十六条","c":"（無効等確認の訴えの原告適格）","p":[["無効等確認の訴えは、当該処分又は裁決に続く処分により損害を受けるおそれのある者その他当該処分又は裁決の無効等の確認を求めるにつき法律上の利益を有する者で、当該処分若しくは裁決の存否又はその効力の有無を前提とする現在の法律関係に関する訴えによつて目的を達することができないものに限り、提起することができる。"]]},"民法93条":{"n":"民法第九十三条","c":"（心<ruby>裡<rt>り</rt></ruby>留保）","p":[["意思表示は、表意者がその真意ではないことを知ってしたときであっても、そのためにその効力を妨げられない。ただし、相手方がその意思表示が表意者の真意ではないことを知り、又は知ることができたときは、その意思表示は、無効とする。"],["２　前項ただし書の規定による意思表示の無効は、善意の第三者に対抗することができない。"]]},"民法94条":{"n":"民法第九十四条","c":"（虚偽表示）","p":[["相手方と通じてした虚偽の意思表示は、無効とする。"],["２　前項の規定による意思表示の無効は、善意の第三者に対抗することができない。"]]},"民法95条":{"n":"民法第九十五条","c":"（錯誤）","p":[["意思表示は、次に掲げる錯誤に基づくものであって、その錯誤が法律行為の目的及び取引上の社会通念に照らして重要なものであるときは、取り消すことができる。","- 一　意思表示に対応する意思を欠く錯誤","- 二　表意者が法律行為の基礎とした事情についてのその認識が真実に反する錯誤"],["２　前項第二号の規定による意思表示の取消しは、その事情が法律行為の基礎とされていることが表示されていたときに限り、することができる。"],["３　錯誤が表意者の重大な過失によるものであった場合には、次に掲げる場合を除き、第一項の規定による意思表示の取消しをすることができない。","- 一　相手方が表意者に錯誤があることを知り、又は重大な過失によって知らなかったとき。","- 二　相手方が表意者と同一の錯誤に陥っていたとき。"],["４　第一項の規定による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。"]]},"民法96条":{"n":"民法第九十六条","c":"（詐欺又は強迫）","p":[["詐欺又は強迫による意思表示は、取り消すことができる。"],["２　相手方に対する意思表示について第三者が詐欺を行った場合においては、相手方がその事実を知り、又は知ることができたときに限り、その意思表示を取り消すことができる。"],["３　前二項の規定による詐欺による意思表示の取消しは、善意でかつ過失がない第三者に対抗することができない。"]]},"民法102条":{"n":"民法第百二条","c":"（代理人の行為能力）","p":[["制限行為能力者が代理人としてした行為は、行為能力の制限によっては取り消すことができない。ただし、制限行為能力者が他の制限行為能力者の法定代理人としてした行為については、この限りでない。"]]},"民法104条":{"n":"民法第百四条","c":"（任意代理人による復代理人の選任）","p":[["委任による代理人は、本人の許諾を得たとき、又はやむを得ない事由があるときでなければ、復代理人を選任することができない。"]]},"民法114条":{"n":"民法第百十四条","c":"（無権代理の相手方の催告権）","p":[["前条の場合において、相手方は、本人に対し、相当の期間を定めて、その期間内に追認をするかどうかを確答すべき旨の催告をすることができる。この場合において、本人がその期間内に確答をしないときは、追認を拒絶したものとみなす。"]]},"民法116条":{"n":"民法第百十六条","c":"（無権代理行為の追認）","p":[["追認は、別段の意思表示がないときは、契約の時にさかのぼってその効力を生ずる。ただし、第三者の権利を害することはできない。"]]},"民法117条":{"n":"民法第百十七条","c":"（無権代理人の責任）","p":[["他人の代理人として契約をした者は、自己の代理権を証明したとき、又は本人の追認を得たときを除き、相手方の選択に従い、相手方に対して履行又は損害賠償の責任を負う。"],["２　前項の規定は、次に掲げる場合には、適用しない。","- 一　他人の代理人として契約をした者が代理権を有しないことを相手方が知っていたとき。","- 二　他人の代理人として契約をした者が代理権を有しないことを相手方が過失によって知らなかったとき。ただし、他人の代理人として契約をした者が自己に代理権がないことを知っていたときは、この限りでない。","- 三　他人の代理人として契約をした者が行為能力の制限を受けていたとき。"]]},"民法146条":{"n":"民法第百四十六条","c":"（時効の利益の放棄）","p":[["時効の利益は、あらかじめ放棄することができない。"]]},"民法147条":{"n":"民法第百四十七条","c":"（裁判上の請求等による時効の完成猶予及び更新）","p":[["次に掲げる事由がある場合には、その事由が終了する（確定判決又は確定判決と同一の効力を有するものによって権利が確定することなくその事由が終了した場合にあっては、その終了の時から六箇月を経過する）までの間は、時効は、完成しない。","- 一　裁判上の請求","- 二　支払督促","- 三　民事訴訟法第二百七十五条第一項の和解又は民事調停法（昭和二十六年法律第二百二十二号）若しくは家事事件手続法（平成二十三年法律第五十二号）による調停","- 四　破産手続参加、再生手続参加又は更生手続参加"],["２　前項の場合において、確定判決又は確定判決と同一の効力を有するものによって権利が確定したときは、時効は、同項各号に掲げる事由が終了した時から新たにその進行を始める。"]]},"民法150条":{"n":"民法第百五十条","c":"（催告による時効の完成猶予）","p":[["催告があったときは、その時から六箇月を経過するまでの間は、時効は、完成しない。"],["２　催告によって時効の完成が猶予されている間にされた再度の催告は、前項の規定による時効の完成猶予の効力を有しない。"]]},"民法151条":{"n":"民法第百五十一条","c":"（協議を行う旨の合意による時効の完成猶予）","p":[["権利についての協議を行う旨の合意が書面でされたときは、次に掲げる時のいずれか早い時までの間は、時効は、完成しない。","- 一　その合意があった時から一年を経過した時","- 二　その合意において当事者が協議を行う期間（一年に満たないものに限る。）を定めたときは、その期間を経過した時","- 三　当事者の一方から相手方に対して協議の続行を拒絶する旨の通知が書面でされたときは、その通知の時から六箇月を経過した時"],["２　前項の規定により時効の完成が猶予されている間にされた再度の同項の合意は、同項の規定による時効の完成猶予の効力を有する。ただし、その効力は、時効の完成が猶予されなかったとすれば時効が完成すべき時から通じて五年を超えることができない。"],["３　催告によって時効の完成が猶予されている間にされた第一項の合意は、同項の規定による時効の完成猶予の効力を有しない。同項の規定により時効の完成が猶予されている間にされた催告についても、同様とする。"],["４　第一項の合意がその内容を記録した電磁的記録（電子的方式、磁気的方式その他人の知覚によっては認識することができない方式で作られる記録であって、電子計算機による情報処理の用に供されるものをいう。以下同じ。）によってされたときは、その合意は、書面によってされたものとみなして、前三項の規定を適用する。"],["５　前項の規定は、第一項第三号の通知について準用する。"]]},"民法166条":{"n":"民法第百六十六条","c":"（債権等の消滅時効）","p":[["債権は、次に掲げる場合には、時効によって消滅する。","- 一　債権者が権利を行使することができることを知った時から五年間行使しないとき。","- 二　権利を行使することができる時から十年間行使しないとき。"],["２　債権又は所有権以外の財産権は、権利を行使することができる時から二十年間行使しないときは、時効によって消滅する。"],["３　前二項の規定は、始期付権利又は停止条件付権利の目的物を占有する第三者のために、その占有の開始の時から取得時効が進行することを妨げない。ただし、権利者は、その時効を更新するため、いつでも占有者の承認を求めることができる。"]]},"民法176条":{"n":"民法第百七十六条","c":"（物権の設定及び移転）","p":[["物権の設定及び移転は、当事者の意思表示のみによって、その効力を生ずる。"]]},"民法177条":{"n":"民法第百七十七条","c":"（不動産に関する物権の変動の対抗要件）","p":[["不動産に関する物権の得喪及び変更は、不動産登記法（平成十六年法律第百二十三号）その他の登記に関する法律の定めるところに従いその登記をしなければ、第三者に対抗することができない。"]]},"民法178条":{"n":"民法第百七十八条","c":"（動産に関する物権の譲渡の対抗要件）","p":[["動産に関する物権の譲渡は、その動産の引渡しがなければ、第三者に対抗することができない。"]]},"民法192条":{"n":"民法第百九十二条","c":"（即時取得）","p":[["取引行為によって、平穏に、かつ、公然と動産の占有を始めた者は、善意であり、かつ、過失がないときは、即時にその動産について行使する権利を取得する。"]]},"民法295条":{"n":"民法第二百九十五条","c":"（留置権の内容）","p":[["他人の物の占有者は、その物に関して生じた債権を有するときは、その債権の弁済を受けるまで、その物を留置することができる。ただし、その債権が弁済期にないときは、この限りでない。"],["２　前項の規定は、占有が不法行為によって始まった場合には、適用しない。"]]},"民法446条":{"n":"民法第四百四十六条","c":"（保証人の責任等）","p":[["保証人は、主たる債務者がその債務を履行しないときに、その履行をする責任を負う。"],["２　保証契約は、書面でしなければ、その効力を生じない。"],["３　保証契約がその内容を記録した電磁的記録によってされたときは、その保証契約は、書面によってされたものとみなして、前項の規定を適用する。"]]},"民法448条":{"n":"民法第四百四十八条","c":"（保証人の負担と主たる債務の目的又は態様）","p":[["保証人の負担が債務の目的又は態様において主たる債務より重いときは、これを主たる債務の限度に減縮する。"],["２　主たる債務の目的又は態様が保証契約の締結後に加重されたときであっても、保証人の負担は加重されない。"]]},"民法454条":{"n":"民法第四百五十四条","c":"（連帯保証の場合の特則）","p":[["保証人は、主たる債務者と連帯して債務を負担したときは、前二条の権利を有しない。"]]},"民法465条の2":{"n":"民法第四百六十五条の二","c":"（個人根保証契約の保証人の責任等）","p":[["一定の範囲に属する不特定の債務を主たる債務とする保証契約（以下「根保証契約」という。）であって保証人が法人でないもの（以下「個人根保証契約」という。）の保証人は、主たる債務の元本、主たる債務に関する利息、違約金、損害賠償その他その債務に従たる全てのもの及びその保証債務について約定された違約金又は損害賠償の額について、その全部に係る極度額を限度として、その履行をする責任を負う。"],["２　個人根保証契約は、前項に規定する極度額を定めなければ、その効力を生じない。"],["３　第四百四十六条第二項及び第三項の規定は、個人根保証契約における第一項に規定する極度額の定めについて準用する。"]]},"民法465条の6":{"n":"民法第四百六十五条の六","c":"（公正証書の作成と保証の効力）","p":[["事業のために負担した貸金等債務を主たる債務とする保証契約又は主たる債務の範囲に事業のために負担する貸金等債務が含まれる根保証契約は、その契約の締結に先立ち、その締結の日前一箇月以内に作成された公正証書で保証人になろうとする者が保証債務を履行する意思を表示していなければ、その効力を生じない。"],["２　前項の公正証書を作成するには、次に掲げる方式に従わなければならない。","- 一　保証人になろうとする者が、次のイ又はロに掲げる契約の区分に応じ、それぞれ当該イ又はロに定める事項を公証人に口授すること。","-- イ　保証契約（ロに掲げるものを除く。）　主たる債務の債権者及び債務者、主たる債務の元本、主たる債務に関する利息、違約金、損害賠償その他その債務に従たる全てのものの定めの有無及びその内容並びに主たる債務者がその債務を履行しないときには、その債務の全額について履行する意思（保証人になろうとする者が主たる債務者と連帯して債務を負担しようとするものである場合には、債権者が主たる債務者に対して催告をしたかどうか、主たる債務者がその債務を履行することができるかどうか、又は他に保証人があるかどうかにかかわらず、その全額について履行する意思）を有していること。","-- ロ　根保証契約　主たる債務の債権者及び債務者、主たる債務の範囲、根保証契約における極度額、元本確定期日の定めの有無及びその内容並びに主たる債務者がその債務を履行しないときには、極度額の限度において元本確定期日又は第四百六十五条の四第一項各号若しくは第二項各号に掲げる事由その他の元本を確定すべき事由が生ずる時までに生ずべき主たる債務の元本及び主たる債務に関する利息、違約金、損害賠償その他その債務に従たる全てのものの全額について履行する意思（保証人になろうとする者が主たる債務者と連帯して債務を負担しようとするものである場合には、債権者が主たる債務者に対して催告をしたかどうか、主たる債務者がその債務を履行することができるかどうか、又は他に保証人があるかどうかにかかわらず、その全額について履行する意思）を有していること。","- 二　公証人が、保証人になろうとする者の口述を筆記し、これを保証人になろうとする者に読み聞かせ、又は閲覧させること。","- 三　保証人になろうとする者が、筆記の正確なことを承認した後、署名し、印を押すこと。ただし、保証人になろうとする者が署名することができない場合は、公証人がその事由を付記して、署名に代えることができる。","- 四　公証人が、その証書は前三号に掲げる方式に従って作ったものである旨を付記して、これに署名し、印を押すこと。"],["３　前二項の規定は、保証人になろうとする者が法人である場合には、適用しない。"]]},"民法541条":{"n":"民法第五百四十一条","c":"（催告による解除）","p":[["当事者の一方がその債務を履行しない場合において、相手方が相当の期間を定めてその履行の催告をし、その期間内に履行がないときは、相手方は、契約の解除をすることができる。ただし、その期間を経過した時における債務の不履行がその契約及び取引上の社会通念に照らして軽微であるときは、この限りでない。"]]},"民法542条":{"n":"民法第五百四十二条","c":"（催告によらない解除）","p":[["次に掲げる場合には、債権者は、前条の催告をすることなく、直ちに契約の解除をすることができる。","- 一　債務の全部の履行が不能であるとき。","- 二　債務者がその債務の全部の履行を拒絶する意思を明確に表示したとき。","- 三　債務の一部の履行が不能である場合又は債務者がその債務の一部の履行を拒絶する意思を明確に表示した場合において、残存する部分のみでは契約をした目的を達することができないとき。","- 四　契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合において、債務者が履行をしないでその時期を経過したとき。","- 五　前各号に掲げる場合のほか、債務者がその債務の履行をせず、債権者が前条の催告をしても契約をした目的を達するのに足りる履行がされる見込みがないことが明らかであるとき。"],["２　次に掲げる場合には、債権者は、前条の催告をすることなく、直ちに契約の一部の解除をすることができる。","- 一　債務の一部の履行が不能であるとき。","- 二　債務者がその債務の一部の履行を拒絶する意思を明確に表示したとき。"]]},"民法562条":{"n":"民法第五百六十二条","c":"（買主の追完請求権）","p":[["引き渡された目的物が種類、品質又は数量に関して契約の内容に適合しないものであるときは、買主は、売主に対し、目的物の修補、代替物の引渡し又は不足分の引渡しによる履行の追完を請求することができる。ただし、売主は、買主に不相当な負担を課するものでないときは、買主が請求した方法と異なる方法による履行の追完をすることができる。"],["２　前項の不適合が買主の責めに帰すべき事由によるものであるときは、買主は、同項の規定による履行の追完の請求をすることができない。"]]},"民法563条":{"n":"民法第五百六十三条","c":"（買主の代金減額請求権）","p":[["前条第一項本文に規定する場合において、買主が相当の期間を定めて履行の追完の催告をし、その期間内に履行の追完がないときは、買主は、その不適合の程度に応じて代金の減額を請求することができる。"],["２　前項の規定にかかわらず、次に掲げる場合には、買主は、同項の催告をすることなく、直ちに代金の減額を請求することができる。","- 一　履行の追完が不能であるとき。","- 二　売主が履行の追完を拒絶する意思を明確に表示したとき。","- 三　契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合において、売主が履行の追完をしないでその時期を経過したとき。","- 四　前三号に掲げる場合のほか、買主が前項の催告をしても履行の追完を受ける見込みがないことが明らかであるとき。"],["３　第一項の不適合が買主の責めに帰すべき事由によるものであるときは、買主は、前二項の規定による代金の減額の請求をすることができない。"]]},"民法564条":{"n":"民法第五百六十四条","c":"（買主の損害賠償請求及び解除権の行使）","p":[["前二条の規定は、第四百十五条の規定による損害賠償の請求並びに第五百四十一条及び第五百四十二条の規定による解除権の行使を妨げない。"]]},"民法566条":{"n":"民法第五百六十六条","c":"（目的物の種類又は品質に関する担保責任の期間の制限）","p":[["売主が種類又は品質に関して契約の内容に適合しない目的物を買主に引き渡した場合において、買主がその不適合を知った時から一年以内にその旨を売主に通知しないときは、買主は、その不適合を理由として、履行の追完の請求、代金の減額の請求、損害賠償の請求及び契約の解除をすることができない。ただし、売主が引渡しの時にその不適合を知り、又は重大な過失によって知らなかったときは、この限りでない。"]]},"民法714条":{"n":"民法第七百十四条","c":"（責任無能力者の監督義務者等の責任）","p":[["前二条の規定により責任無能力者がその責任を負わない場合において、その責任無能力者を監督する法定の義務を負う者は、その責任無能力者が第三者に加えた損害を賠償する責任を負う。ただし、監督義務者がその義務を怠らなかったとき、又はその義務を怠らなくても損害が生ずべきであったときは、この限りでない。"],["２　監督義務者に代わって責任無能力者を監督する者も、前項の責任を負う。"]]},"民法715条":{"n":"民法第七百十五条","c":"（使用者等の責任）","p":[["ある事業のために他人を使用する者は、被用者がその事業の執行について第三者に加えた損害を賠償する責任を負う。ただし、使用者が被用者の選任及びその事業の監督について相当の注意をしたとき、又は相当の注意をしても損害が生ずべきであったときは、この限りでない。"],["２　使用者に代わって事業を監督する者も、前項の責任を負う。"],["３　前二項の規定は、使用者又は監督者から被用者に対する求償権の行使を妨げない。"]]},"民法721条":{"n":"民法第七百二十一条","c":"（損害賠償請求権に関する胎児の権利能力）","p":[["胎児は、損害賠償の請求権については、既に生まれたものとみなす。"]]},"民法723条":{"n":"民法第七百二十三条","c":"（名誉<ruby>毀<rt>き</rt></ruby>損における原状回復）","p":[["他人の名誉を<ruby>毀<rt>き</rt></ruby>損した者に対しては、裁判所は、被害者の請求により、損害賠償に代えて、又は損害賠償とともに、名誉を回復するのに適当な処分を命ずることができる。"]]},"民法724条":{"n":"民法第七百二十四条","c":"（不法行為による損害賠償請求権の消滅時効）","p":[["不法行為による損害賠償の請求権は、次に掲げる場合には、時効によって消滅する。","- 一　被害者又はその法定代理人が損害及び加害者を知った時から三年間行使しないとき。","- 二　不法行為の時から二十年間行使しないとき。"]]},"民法887条":{"n":"民法第八百八十七条","c":"（子及びその代襲者等の相続権）","p":[["被相続人の子は、相続人となる。"],["２　被相続人の子が、相続の開始以前に死亡したとき、又は第八百九十一条の規定に該当し、若しくは廃除によって、その相続権を失ったときは、その者の子がこれを代襲して相続人となる。ただし、被相続人の直系卑属でない者は、この限りでない。"],["３　前項の規定は、代襲者が、相続の開始以前に死亡し、又は第八百九十一条の規定に該当し、若しくは廃除によって、その代襲相続権を失った場合について準用する。"]]},"民法900条":{"n":"民法第九百条","c":"（法定相続分）","p":[["同順位の相続人が数人あるときは、その相続分は、次の各号の定めるところによる。","- 一　子及び配偶者が相続人であるときは、子の相続分及び配偶者の相続分は、各二分の一とする。","- 二　配偶者及び直系尊属が相続人であるときは、配偶者の相続分は、三分の二とし、直系尊属の相続分は、三分の一とする。","- 三　配偶者及び兄弟姉妹が相続人であるときは、配偶者の相続分は、四分の三とし、兄弟姉妹の相続分は、四分の一とする。","- 四　子、直系尊属又は兄弟姉妹が数人あるときは、各自の相続分は、相等しいものとする。ただし、父母の一方のみを同じくする兄弟姉妹の相続分は、父母の双方を同じくする兄弟姉妹の相続分の二分の一とする。"]]},"民法938条":{"n":"民法第九百三十八条","c":"（相続の放棄の方式）","p":[["相続の放棄をしようとする者は、その旨を家庭裁判所に申述しなければならない。"]]},"民法968条":{"n":"民法第九百六十八条","c":"（自筆証書遺言）","p":[["自筆証書によって遺言をするには、遺言者が、その全文、日付及び氏名を自書し、これに印を押さなければならない。"],["２　前項の規定にかかわらず、自筆証書にこれと一体のものとして相続財産（第九百九十七条第一項に規定する場合における同項に規定する権利を含む。）の全部又は一部の目録を添付する場合には、その目録については、自書することを要しない。この場合において、遺言者は、その目録の毎葉（自書によらない記載がその両面にある場合にあっては、その両面）に署名し、印を押さなければならない。"],["３　自筆証書（前項の目録を含む。）中の加除その他の変更は、遺言者が、その場所を指示し、これを変更した旨を付記して特にこれに署名し、かつ、その変更の場所に印を押さなければ、その効力を生じない。"]]},"民法1042条":{"n":"民法第千四十二条","c":"（遺留分の帰属及びその割合）","p":[["兄弟姉妹以外の相続人は、遺留分として、次条第一項に規定する遺留分を算定するための財産の価額に、次の各号に掲げる区分に応じてそれぞれ当該各号に定める割合を乗じた額を受ける。","- 一　直系尊属のみが相続人である場合　三分の一","- 二　前号に掲げる場合以外の場合　二分の一"],["２　相続人が数人ある場合には、前項各号に定める割合は、これらに第九百条及び第九百一条の規定により算定したその各自の相続分を乗じた割合とする。"]]},"行政代執行法2条":{"n":"行政代執行法第二条","c":"","p":[["法律（法律の委任に基く命令、規則及び条例を含む。以下同じ。）により直接に命ぜられ、又は法律に基き行政庁により命ぜられた行為（他人が代つてなすことのできる行為に限る。）について義務者がこれを履行しない場合、他の手段によつてその履行を確保することが困難であり、且つその不履行を放置することが著しく公益に反すると認められるときは、当該行政庁は、自ら義務者のなすべき行為をなし、又は第三者をしてこれをなさしめ、その費用を義務者から徴収することができる。"]]},"行政代執行法3条":{"n":"行政代執行法第三条","c":"","p":[["前条の規定による処分（代執行）をなすには、相当の履行期限を定め、その期限までに履行がなされないときは、代執行をなすべき旨を、予め文書で戒告しなければならない。"],["義務者が、前項の戒告を受けて、指定の期限までにその義務を履行しないときは、当該行政庁は、代執行令書をもつて、代執行をなすべき時期、代執行のために派遣する執行責任者の氏名及び代執行に要する費用の概算による見積額を義務者に通知する。"],["非常の場合又は危険切迫の場合において、当該行為の急速な実施について緊急の必要があり、前二項に規定する手続をとる暇がないときは、その手続を経ないで代執行をすることができる。"]]},"行政代執行法5条":{"n":"行政代執行法第五条","c":"","p":[["代執行に要した費用の徴収については、実際に要した費用の額及びその納期日を定め、義務者に対し、文書をもつてその納付を命じなければならない。"]]},"行政代執行法6条":{"n":"行政代執行法第六条","c":"","p":[["代執行に要した費用は、国税滞納処分の例により、これを徴収することができる。"],["代執行に要した費用については、行政庁は、国税及び地方税に次ぐ順位の先取特権を有する。"],["代執行に要した費用を徴収したときは、その徴収金は、事務費の所属に従い、国庫又は地方公共団体の経済の収入となる。"]]},"民法608条":{"n":"民法第六百八条","c":"（賃借人による費用の償還請求）","p":[["賃借人は、賃借物について賃貸人の負担に属する必要費を支出したときは、賃貸人に対し、直ちにその償還を請求することができる。"],["２　賃借人が賃借物について有益費を支出したときは、賃貸人は、賃貸借の終了の時に、第百九十六条第二項の規定に従い、その償還をしなければならない。ただし、裁判所は、賃貸人の請求により、その償還について相当の期限を許与することができる。"]]},"民法611条":{"n":"民法第六百十一条","c":"（賃借物の一部滅失等による賃料の減額等）","p":[["賃借物の一部が滅失その他の事由により使用及び収益をすることができなくなった場合において、それが賃借人の責めに帰することができない事由によるものであるときは、賃料は、その使用及び収益をすることができなくなった部分の割合に応じて、減額される。"],["２　賃借物の一部が滅失その他の事由により使用及び収益をすることができなくなった場合において、残存する部分のみでは賃借人が賃借をした目的を達することができないときは、賃借人は、契約の解除をすることができる。"]]},"民法612条":{"n":"民法第六百十二条","c":"（賃借権の譲渡及び転貸の制限）","p":[["賃借人は、賃貸人の承諾を得なければ、その賃借権を譲り渡し、又は賃借物を転貸することができない。"],["２　賃借人が前項の規定に違反して第三者に賃借物の使用又は収益をさせたときは、賃貸人は、契約の解除をすることができる。"]]},"民法621条":{"n":"民法第六百二十一条","c":"（賃借人の原状回復義務）","p":[["賃借人は、賃借物を受け取った後にこれに生じた損傷（通常の使用及び収益によって生じた賃借物の損耗並びに賃借物の経年変化を除く。以下この条において同じ。）がある場合において、賃貸借が終了したときは、その損傷を原状に復する義務を負う。ただし、その損傷が賃借人の責めに帰することができない事由によるものであるときは、この限りでない。"]]},"民法622条の2":{"n":"民法第六百二十二条の二","c":"","p":[["賃貸人は、敷金（いかなる名目によるかを問わず、賃料債務その他の賃貸借に基づいて生ずる賃借人の賃貸人に対する金銭の給付を目的とする債務を担保する目的で、賃借人が賃貸人に交付する金銭をいう。以下この条において同じ。）を受け取っている場合において、次に掲げるときは、賃借人に対し、その受け取った敷金の額から賃貸借に基づいて生じた賃借人の賃貸人に対する金銭の給付を目的とする債務の額を控除した残額を返還しなければならない。","- 一　賃貸借が終了し、かつ、賃貸物の返還を受けたとき。","- 二　賃借人が適法に賃借権を譲り渡したとき。"],["２　賃貸人は、賃借人が賃貸借に基づいて生じた金銭の給付を目的とする債務を履行しないときは、敷金をその債務の弁済に充てることができる。この場合において、賃借人は、賃貸人に対し、敷金をその債務の弁済に充てることを請求することができない。"]]},"憲法22条":{"n":"日本国憲法第二十二条","c":"","p":[["何人も、公共の福祉に反しない限り、居住、移転及び職業選択の自由を有する。"],["何人も、外国に移住し、又は国籍を離脱する自由を侵されない。"]]},"憲法27条":{"n":"日本国憲法第二十七条","c":"","p":[["すべて国民は、勤労の権利を有し、義務を負ふ。"],["賃金、就業時間、休息その他の勤労条件に関する基準は、法律でこれを定める。"],["児童は、これを酷使してはならない。"]]},"憲法56条":{"n":"日本国憲法第五十六条","c":"","p":[["両議院は、各々その総議員の三分の一以上の出席がなければ、議事を開き議決することができない。"],["両議院の議事は、この憲法に特別の定のある場合を除いては、出席議員の過半数でこれを決し、可否同数のときは、議長の決するところによる。"]]},"憲法59条":{"n":"日本国憲法第五十九条","c":"","p":[["法律案は、この憲法に特別の定のある場合を除いては、両議院で可決したとき法律となる。"],["衆議院で可決し、参議院でこれと異なつた議決をした法律案は、衆議院で出席議員の三分の二以上の多数で再び可決したときは、法律となる。"],["前項の規定は、法律の定めるところにより、衆議院が、両議院の協議会を開くことを求めることを妨げない。"],["参議院が、衆議院の可決した法律案を受け取つた後、国会休会中の期間を除いて六十日以内に、議決しないときは、衆議院は、参議院がその法律案を否決したものとみなすことができる。"]]},"憲法60条":{"n":"日本国憲法第六十条","c":"","p":[["予算は、さきに衆議院に提出しなければならない。"],["予算について、参議院で衆議院と異なつた議決をした場合に、法律の定めるところにより、両議院の協議会を開いても意見が一致しないとき、又は参議院が、衆議院の可決した予算を受け取つた後、国会休会中の期間を除いて三十日以内に、議決しないときは、衆議院の議決を国会の議決とする。"]]},"憲法61条":{"n":"日本国憲法第六十一条","c":"","p":[["条約の締結に必要な国会の承認については、前条第二項の規定を準用する。"]]},"憲法67条":{"n":"日本国憲法第六十七条","c":"","p":[["内閣総理大臣は、国会議員の中から国会の議決で、これを指名する。この指名は、他のすべての案件に先だつて、これを行ふ。"],["衆議院と参議院とが異なつた指名の議決をした場合に、法律の定めるところにより、両議院の協議会を開いても意見が一致しないとき、又は衆議院が指名の議決をした後、国会休会中の期間を除いて十日以内に、参議院が、指名の議決をしないときは、衆議院の議決を国会の議決とする。"]]},"憲法66条":{"n":"日本国憲法第六十六条","c":"","p":[["内閣は、法律の定めるところにより、その首長たる内閣総理大臣及びその他の国務大臣でこれを組織する。"],["内閣総理大臣その他の国務大臣は、文民でなければならない。"],["内閣は、行政権の行使について、国会に対し連帯して責任を負ふ。"]]},"憲法68条":{"n":"日本国憲法第六十八条","c":"","p":[["内閣総理大臣は、国務大臣を任命する。但し、その過半数は、国会議員の中から選ばれなければならない。"],["内閣総理大臣は、任意に国務大臣を罷免することができる。"]]},"憲法69条":{"n":"日本国憲法第六十九条","c":"","p":[["内閣は、衆議院で不信任の決議案を可決し、又は信任の決議案を否決したときは、十日以内に衆議院が解散されない限り、総辞職をしなければならない。"]]},"憲法79条":{"n":"日本国憲法第七十九条","c":"","p":[["最高裁判所は、その長たる裁判官及び法律の定める員数のその他の裁判官でこれを構成し、その長たる裁判官以外の裁判官は、内閣でこれを任命する。"],["最高裁判所の裁判官の任命は、その任命後初めて行はれる衆議院議員総選挙の際国民の審査に付し、その後十年を経過した後初めて行はれる衆議院議員総選挙の際更に審査に付し、その後も同様とする。"],["前項の場合において、投票者の多数が裁判官の罷免を可とするときは、その裁判官は、罷免される。"],["審査に関する事項は、法律でこれを定める。"],["最高裁判所の裁判官は、法律の定める年齢に達した時に退官する。"],["最高裁判所の裁判官は、すべて定期に相当額の報酬を受ける。この報酬は、在任中、これを減額することができない。"]]},"憲法80条":{"n":"日本国憲法第八十条","c":"","p":[["下級裁判所の裁判官は、最高裁判所の指名した者の名簿によつて、内閣でこれを任命する。その裁判官は、任期を十年とし、再任されることができる。但し、法律の定める年齢に達した時には退官する。"],["下級裁判所の裁判官は、すべて定期に相当額の報酬を受ける。この報酬は、在任中、これを減額することができない。"]]},"会社法309条":{"n":"会社法第三百九条","c":"（株主総会の決議）","p":[["株主総会の決議は、定款に別段の定めがある場合を除き、議決権を行使することができる株主の議決権の過半数を有する株主が出席し、出席した当該株主の議決権の過半数をもって行う。"],["２　前項の規定にかかわらず、次に掲げる株主総会の決議は、当該株主総会において議決権を行使することができる株主の議決権の過半数（三分の一以上の割合を定款で定めた場合にあっては、その割合以上）を有する株主が出席し、出席した当該株主の議決権の三分の二（これを上回る割合を定款で定めた場合にあっては、その割合）以上に当たる多数をもって行わなければならない。この場合においては、当該決議の要件に加えて、一定の数以上の株主の賛成を要する旨その他の要件を定款で定めることを妨げない。","- 一　第百四十条第二項及び第五項の株主総会","- 二　第百五十六条第一項の株主総会（第百六十条第一項の特定の株主を定める場合に限る。）","- 三　第百七十一条第一項及び第百七十五条第一項の株主総会","- 四　第百八十条第二項の株主総会","- 五　第百九十九条第二項、第二百条第一項、第二百二条第三項第四号、第二百四条第二項及び第二百五条第二項の株主総会","- 六　第二百三十八条第二項、第二百三十九条第一項、第二百四十一条第三項第四号、第二百四十三条第二項及び第二百四十四条第三項の株主総会","- 七　第三百三十九条第一項の株主総会（第三百四十二条第三項から第五項までの規定により選任された取締役（監査等委員である取締役を除く。）を解任する場合又は監査等委員である取締役若しくは監査役を解任する場合に限る。）","- 八　第四百二十五条第一項の株主総会","- 九　第四百四十七条第一項の株主総会（次のいずれにも該当する場合を除く。）","-- イ　定時株主総会において第四百四十七条第一項各号に掲げる事項を定めること。","-- ロ　第四百四十七条第一項第一号の額がイの定時株主総会の日（第四百三十九条前段に規定する場合にあっては、第四百三十六条第三項の承認があった日）における欠損の額として法務省令で定める方法により算定される額を超えないこと。","- 十　第四百五十四条第四項の株主総会（配当財産が金銭以外の財産であり、かつ、株主に対して同項第一号に規定する金銭分配請求権を与えないこととする場合に限る。）","- 十一　第六章から第八章までの規定により株主総会の決議を要する場合における当該株主総会","- 十二　第五編の規定により株主総会の決議を要する場合における当該株主総会"],["３　前二項の規定にかかわらず、次に掲げる株主総会（種類株式発行会社の株主総会を除く。）の決議は、当該株主総会において議決権を行使することができる株主の半数以上（これを上回る割合を定款で定めた場合にあっては、その割合以上）であって、当該株主の議決権の三分の二（これを上回る割合を定款で定めた場合にあっては、その割合）以上に当たる多数をもって行わなければならない。","- 一　その発行する全部の株式の内容として譲渡による当該株式の取得について当該株式会社の承認を要する旨の定款の定めを設ける定款の変更を行う株主総会","- 二　第七百八十三条第一項の株主総会（合併により消滅する株式会社又は株式交換をする株式会社が公開会社であり、かつ、当該株式会社の株主に対して交付する金銭等の全部又は一部が譲渡制限株式等（同条第三項に規定する譲渡制限株式等をいう。次号において同じ。）である場合における当該株主総会に限る。）","- 三　第八百四条第一項の株主総会（合併又は株式移転をする株式会社が公開会社であり、かつ、当該株式会社の株主に対して交付する金銭等の全部又は一部が譲渡制限株式等である場合における当該株主総会に限る。）"],["４　前三項の規定にかかわらず、第百九条第二項の規定による定款の定めについての定款の変更（当該定款の定めを廃止するものを除く。）を行う株主総会の決議は、総株主の半数以上（これを上回る割合を定款で定めた場合にあっては、その割合以上）であって、総株主の議決権の四分の三（これを上回る割合を定款で定めた場合にあっては、その割合）以上に当たる多数をもって行わなければならない。"],["５　取締役会設置会社においては、株主総会は、第二百九十八条第一項第二号に掲げる事項以外の事項については、決議をすることができない。ただし、第三百十六条第一項若しくは第二項に規定する者の選任又は第三百九十八条第二項の会計監査人の出席を求めることについては、この限りでない。"]]},"会社法327条":{"n":"会社法第三百二十七条","c":"（取締役会等の設置義務等）","p":[["次に掲げる株式会社は、取締役会を置かなければならない。","- 一　公開会社","- 二　監査役会設置会社","- 三　監査等委員会設置会社","- 四　指名委員会等設置会社"],["２　取締役会設置会社（監査等委員会設置会社及び指名委員会等設置会社を除く。）は、監査役を置かなければならない。ただし、公開会社でない会計参与設置会社については、この限りでない。"],["３　会計監査人設置会社（監査等委員会設置会社及び指名委員会等設置会社を除く。）は、監査役を置かなければならない。"],["４　監査等委員会設置会社及び指名委員会等設置会社は、監査役を置いてはならない。"],["５　監査等委員会設置会社及び指名委員会等設置会社は、会計監査人を置かなければならない。"],["６　指名委員会等設置会社は、監査等委員会を置いてはならない。"]]},"会社法331条":{"n":"会社法第三百三十一条","c":"（取締役の資格等）","p":[["次に掲げる者は、取締役となることができない。","- 一　法人","- 二　削除","- 三　この法律若しくは一般社団法人及び一般財団法人に関する法律（平成十八年法律第四十八号）の規定に違反し、又は金融商品取引法第百九十七条第一項第一号から第四号の二まで、第五号若しくは第六号若しくは第二項、第百九十七条の二第一項第一号から第十号の三まで若しくは第十三号から第十五号まで、第百九十八条第一項第八号、第百九十九条、第二百条第一号から第十二号の二まで、第二十号若しくは第二十一号、第二百三条第三項若しくは第二百五条第一号から第六号まで、第十九号若しくは第二十号の罪、民事再生法（平成十一年法律第二百二十五号）第二百五十五条、第二百五十六条、第二百五十八条から第二百六十条まで若しくは第二百六十二条の罪、外国倒産処理手続の承認援助に関する法律（平成十二年法律第百二十九号）第六十五条、第六十六条、第六十八条若しくは第六十九条の罪、会社更生法（平成十四年法律第百五十四号）第二百六十六条、第二百六十七条、第二百六十九条から第二百七十一条まで若しくは第二百七十三条の罪若しくは破産法（平成十六年法律第七十五号）第二百六十五条、第二百六十六条、第二百六十八条から第二百七十二条まで若しくは第二百七十四条の罪を犯し、刑に処せられ、その執行を終わり、又はその執行を受けることがなくなった日から二年を経過しない者","- 四　前号に規定する法律の規定以外の法令の規定に違反し、拘禁刑以上の刑に処せられ、その執行を終わるまで又はその執行を受けることがなくなるまでの者（刑の執行猶予中の者を除く。）"],["２　株式会社は、取締役が株主でなければならない旨を定款で定めることができない。ただし、公開会社でない株式会社においては、この限りでない。"],["３　監査等委員である取締役は、監査等委員会設置会社若しくはその子会社の業務執行取締役若しくは支配人その他の使用人又は当該子会社の会計参与（会計参与が法人であるときは、その職務を行うべき社員）若しくは執行役を兼ねることができない。"],["４　指名委員会等設置会社の取締役は、当該指名委員会等設置会社の支配人その他の使用人を兼ねることができない。"],["５　取締役会設置会社においては、取締役は、三人以上でなければならない。"],["６　監査等委員会設置会社においては、監査等委員である取締役は、三人以上で、その過半数は、社外取締役でなければならない。"]]},"会社法332条":{"n":"会社法第三百三十二条","c":"（取締役の任期）","p":[["取締役の任期は、選任後二年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。ただし、定款又は株主総会の決議によって、その任期を短縮することを妨げない。"],["２　前項の規定は、公開会社でない株式会社（監査等委員会設置会社及び指名委員会等設置会社を除く。）において、定款によって、同項の任期を選任後十年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで伸長することを妨げない。"],["３　監査等委員会設置会社の取締役（監査等委員であるものを除く。）についての第一項の規定の適用については、同項中「二年」とあるのは、「一年」とする。"],["４　監査等委員である取締役の任期については、第一項ただし書の規定は、適用しない。"],["５　第一項本文の規定は、定款によって、任期の満了前に退任した監査等委員である取締役の補欠として選任された監査等委員である取締役の任期を退任した監査等委員である取締役の任期の満了する時までとすることを妨げない。"],["６　指名委員会等設置会社の取締役についての第一項の規定の適用については、同項中「二年」とあるのは、「一年」とする。"],["７　前各項の規定にかかわらず、次に掲げる定款の変更をした場合には、取締役の任期は、当該定款の変更の効力が生じた時に満了する。","- 一　監査等委員会又は指名委員会等を置く旨の定款の変更","- 二　監査等委員会又は指名委員会等を置く旨の定款の定めを廃止する定款の変更","- 三　その発行する株式の全部の内容として譲渡による当該株式の取得について当該株式会社の承認を要する旨の定款の定めを廃止する定款の変更（監査等委員会設置会社及び指名委員会等設置会社がするものを除く。）"]]},"会社法335条":{"n":"会社法第三百三十五条","c":"（監査役の資格等）","p":[["第三百三十一条第一項及び第二項並びに第三百三十一条の二の規定は、監査役について準用する。"],["２　監査役は、株式会社若しくはその子会社の取締役若しくは支配人その他の使用人又は当該子会社の会計参与（会計参与が法人であるときは、その職務を行うべき社員）若しくは執行役を兼ねることができない。"],["３　監査役会設置会社においては、監査役は、三人以上で、そのうち半数以上は、社外監査役でなければならない。"]]},"会社法336条":{"n":"会社法第三百三十六条","c":"（監査役の任期）","p":[["監査役の任期は、選任後四年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までとする。"],["２　前項の規定は、公開会社でない株式会社において、定款によって、同項の任期を選任後十年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時まで伸長することを妨げない。"],["３　第一項の規定は、定款によって、任期の満了前に退任した監査役の補欠として選任された監査役の任期を退任した監査役の任期の満了する時までとすることを妨げない。"],["４　前三項の規定にかかわらず、次に掲げる定款の変更をした場合には、監査役の任期は、当該定款の変更の効力が生じた時に満了する。","- 一　監査役を置く旨の定款の定めを廃止する定款の変更","- 二　監査等委員会又は指名委員会等を置く旨の定款の変更","- 三　監査役の監査の範囲を会計に関するものに限定する旨の定款の定めを廃止する定款の変更","- 四　その発行する全部の株式の内容として譲渡による当該株式の取得について当該株式会社の承認を要する旨の定款の定めを廃止する定款の変更"]]},"商法504条":{"n":"商法第五百四条","c":"（商行為の代理）","p":[["商行為の代理人が本人のためにすることを示さないでこれをした場合であっても、その行為は、本人に対してその効力を生ずる。ただし、相手方が、代理人が本人のためにすることを知らなかったときは、代理人に対して履行の請求をすることを妨げない。"]]},"商法511条":{"n":"商法第五百十一条","c":"（多数当事者間の債務の連帯）","p":[["数人の者がその一人又は全員のために商行為となる行為によって債務を負担したときは、その債務は、各自が連帯して負担する。"],["２　保証人がある場合において、債務が主たる債務者の商行為によって生じたものであるとき、又は保証が商行為であるときは、主たる債務者及び保証人が各別の行為によって債務を負担したときであっても、その債務は、各自が連帯して負担する。"]]},"商法512条":{"n":"商法第五百十二条","c":"（報酬請求権）","p":[["商人がその営業の範囲内において他人のために行為をしたときは、相当な報酬を請求することができる。"]]},"商法526条":{"n":"商法第五百二十六条","c":"（買主による目的物の検査及び通知）","p":[["商人間の売買において、買主は、その売買の目的物を受領したときは、遅滞なく、その物を検査しなければならない。"],["２　前項に規定する場合において、買主は、同項の規定による検査により売買の目的物が種類、品質又は数量に関して契約の内容に適合しないことを発見したときは、直ちに売主に対してその旨の通知を発しなければ、その不適合を理由とする履行の追完の請求、代金の減額の請求、損害賠償の請求及び契約の解除をすることができない。売買の目的物が種類又は品質に関して契約の内容に適合しないことを直ちに発見することができない場合において、買主が六箇月以内にその不適合を発見したときも、同様とする。"],["３　前項の規定は、売買の目的物が種類、品質又は数量に関して契約の内容に適合しないことにつき売主が悪意であった場合には、適用しない。"]]},"民法404条":{"n":"民法第四百四条","c":"（法定利率）","p":[["利息を生ずべき債権について別段の意思表示がないときは、その利率は、その利息が生じた最初の時点における法定利率による。"],["２　法定利率は、年三パーセントとする。"],["３　前項の規定にかかわらず、法定利率は、法務省令で定めるところにより、三年を一期とし、一期ごとに、次項の規定により変動するものとする。"],["４　各期における法定利率は、この項の規定により法定利率に変動があった期のうち直近のもの（以下この項において「直近変動期」という。）における基準割合と当期における基準割合との差に相当する割合（その割合に一パーセント未満の端数があるときは、これを切り捨てる。）を直近変動期における法定利率に加算し、又は減算した割合とする。"],["５　前項に規定する「基準割合」とは、法務省令で定めるところにより、各期の初日の属する年の六年前の年の一月から前々年の十二月までの各月における短期貸付けの平均利率（当該各月において銀行が新たに行った貸付け（貸付期間が一年未満のものに限る。）に係る利率の平均をいう。）の合計を六十で除して計算した割合（その割合に〇・一パーセント未満の端数があるときは、これを切り捨てる。）として法務大臣が告示するものをいう。"]]},"法の適用に関する通則法2条":{"n":"法の適用に関する通則法第二条","c":"（法律の施行期日）","p":[["法律は、公布の日から起算して二十日を経過した日から施行する。ただし、法律でこれと異なる施行期日を定めたときは、その定めによる。"]]},"憲法31条":{"n":"日本国憲法第三十一条","c":"","p":[["何人も、法律の定める手続によらなければ、その生命若しくは自由を奪はれ、又はその他の刑罰を科せられない。"]]},"憲法6条":{"n":"日本国憲法第六条","c":"","p":[["天皇は、国会の指名に基いて、内閣総理大臣を任命する。"],["天皇は、内閣の指名に基いて、最高裁判所の長たる裁判官を任命する。"]]},"憲法76条":{"n":"日本国憲法第七十六条","c":"","p":[["すべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。"],["特別裁判所は、これを設置することができない。行政機関は、終審として裁判を行ふことができない。"],["すべて裁判官は、その良心に従ひ独立してその職権を行ひ、この憲法及び法律にのみ拘束される。"]]},"裁判所法5条":{"n":"裁判所法第五条","c":"（裁判官）","p":[["最高裁判所の裁判官は、その長たる裁判官を最高裁判所長官とし、その他の裁判官を最高裁判所判事とする。"],["下級裁判所の裁判官は、高等裁判所の長たる裁判官を高等裁判所長官とし、その他の裁判官を判事、判事補及び簡易裁判所判事とする。"],["最高裁判所判事の員数は、十四人とし、下級裁判所の裁判官の員数は、別に法律でこれを定める。"]]},"裁判所法33条":{"n":"裁判所法第三十三条","c":"（裁判権）","p":[["簡易裁判所は、次の事項について第一審の裁判権を有する。","- 一　訴訟の目的の価額が百四十万円を超えない請求（行政事件訴訟に係る請求を除く。）","- 二　罰金以下の刑に当たる罪、選択刑として罰金が定められている罪又は刑法第百八十六条、第二百五十二条若しくは第二百五十六条の罪に係る訴訟"],["簡易裁判所は、拘禁刑以上の刑を科することができない。ただし、刑法第百三十条の罪若しくはその未遂罪、同法第百八十六条の罪、同法第二百三十五条の罪若しくはその未遂罪、同法第二百五十二条、第二百五十四条若しくは第二百五十六条の罪、古物営業法（昭和二十四年法律第百八号）第三十一条から第三十三条までの罪若しくは質屋営業法（昭和二十五年法律第百五十八号）第三十条から第三十二条までの罪に係る事件又はこれらの罪と他の罪とにつき刑法第五十四条第一項の規定によりこれらの罪の刑をもつて処断すべき事件においては、三年以下の拘禁刑を科することができる。"],["簡易裁判所は、前項の制限を超える刑を科するのを相当と認めるときは、訴訟法の定めるところにより事件を地方裁判所に移さなければならない。"]]},"行政書士法1条":{"n":"行政書士法第一条","c":"（行政書士の使命）","p":[["行政書士は、その業務を通じて、行政に関する手続の円滑な実施に寄与するとともに国民の利便に資し、もつて国民の権利利益の実現に資することを使命とする。"]]},"行政書士法1条の2":{"n":"行政書士法第一条の二","c":"（職責）","p":[["行政書士は、常に品位を保持し、業務に関する法令及び実務に精通して、公正かつ誠実にその業務を行わなければならない。"],["２　行政書士は、その業務を行うに当たつては、デジタル社会の進展を踏まえ、情報通信技術の活用その他の取組を通じて、国民の利便の向上及び当該業務の改善進歩を図るよう努めなければならない。"]]},"行政書士法1条の3":{"n":"行政書士法第一条の三","c":"（業務）","p":[["行政書士は、他人の依頼を受け報酬を得て、官公署に提出する書類（その作成に代えて電磁的記録（電子的方式、磁気的方式その他人の知覚によつては認識することができない方式で作られる記録であつて、電子計算機による情報処理の用に供されるものをいう。以下同じ。）を作成する場合における当該電磁的記録を含む。以下この条及び次条において同じ。）その他権利義務又は事実証明に関する書類（実地調査に基づく図面類を含む。）を作成することを業とする。"],["２　行政書士は、前項の書類の作成であつても、その業務を行うことが他の法律において制限されているものについては、業務を行うことができない。"]]},"行政書士法1条の4":{"n":"行政書士法第一条の四","c":"","p":[["行政書士は、前条に規定する業務のほか、他人の依頼を受け報酬を得て、次に掲げる事務を業とすることができる。ただし、他の法律においてその業務を行うことが制限されている事項については、この限りでない。","- 一　前条の規定により行政書士が作成することができる官公署に提出する書類を官公署に提出する手続及び当該官公署に提出する書類に係る許認可等（行政手続法（平成五年法律第八十八号）第二条第三号に規定する許認可等及び当該書類の受理をいう。次号において同じ。）に関して行われる聴聞又は弁明の機会の付与の手続その他の意見陳述のための手続において当該官公署に対してする行為（弁護士法（昭和二十四年法律第二百五号）第七十二条に規定する法律事件に関する法律事務に該当するものを除く。）について代理すること。","- 二　前条の規定により行政書士が作成することができる官公署に提出する書類に係る許認可等に関する審査請求、再調査の請求、再審査請求等行政庁に対する不服申立ての手続について代理し、及びその手続について官公署に提出する書類を作成すること。","- 三　前条の規定により行政書士が作成することができる契約その他に関する書類を代理人として作成すること。","- 四　前条の規定により行政書士が作成することができる書類の作成について相談に応ずること。"],["２　前項第二号に掲げる業務は、当該業務について日本行政書士会連合会がその会則で定めるところにより実施する研修の課程を修了した行政書士（以下「特定行政書士」という。）に限り、行うことができる。"]]},"個人情報保護法2条":{"n":"個人情報の保護に関する法律第二条","c":"（定義）","p":[["この法律において「個人情報」とは、生存する個人に関する情報であって、次の各号のいずれかに該当するものをいう。","- 一　当該情報に含まれる氏名、生年月日その他の記述等（文書、図画若しくは電磁的記録（電磁的方式（電子的方式、磁気的方式その他人の知覚によっては認識することができない方式をいう。次項第二号において同じ。）で作られる記録をいう。以下同じ。）に記載され、若しくは記録され、又は音声、動作その他の方法を用いて表された一切の事項（個人識別符号を除く。）をいう。以下同じ。）により特定の個人を識別することができるもの（他の情報と容易に照合することができ、それにより特定の個人を識別することができることとなるものを含む。）","- 二　個人識別符号が含まれるもの"],["２　この法律において「個人識別符号」とは、次の各号のいずれかに該当する文字、番号、記号その他の符号のうち、政令で定めるものをいう。","- 一　特定の個人の身体の一部の特徴を電子計算機の用に供するために変換した文字、番号、記号その他の符号であって、当該特定の個人を識別することができるもの","- 二　個人に提供される役務の利用若しくは個人に販売される商品の購入に関し割り当てられ、又は個人に発行されるカードその他の書類に記載され、若しくは電磁的方式により記録された文字、番号、記号その他の符号であって、その利用者若しくは購入者又は発行を受ける者ごとに異なるものとなるように割り当てられ、又は記載され、若しくは記録されることにより、特定の利用者若しくは購入者又は発行を受ける者を識別することができるもの"],["３　この法律において「要配慮個人情報」とは、本人の人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実その他本人に対する不当な差別、偏見その他の不利益が生じないようにその取扱いに特に配慮を要するものとして政令で定める記述等が含まれる個人情報をいう。"],["４　この法律において個人情報について「本人」とは、個人情報によって識別される特定の個人をいう。"],["５　この法律において「仮名加工情報」とは、次の各号に掲げる個人情報の区分に応じて当該各号に定める措置を講じて他の情報と照合しない限り特定の個人を識別することができないように個人情報を加工して得られる個人に関する情報をいう。","- 一　第一項第一号に該当する個人情報　当該個人情報に含まれる記述等の一部を削除すること（当該一部の記述等を復元することのできる規則性を有しない方法により他の記述等に置き換えることを含む。）。","- 二　第一項第二号に該当する個人情報　当該個人情報に含まれる個人識別符号の全部を削除すること（当該個人識別符号を復元することのできる規則性を有しない方法により他の記述等に置き換えることを含む。）。"],["６　この法律において「匿名加工情報」とは、次の各号に掲げる個人情報の区分に応じて当該各号に定める措置を講じて特定の個人を識別することができないように個人情報を加工して得られる個人に関する情報であって、当該個人情報を復元することができないようにしたものをいう。","- 一　第一項第一号に該当する個人情報　当該個人情報に含まれる記述等の一部を削除すること（当該一部の記述等を復元することのできる規則性を有しない方法により他の記述等に置き換えることを含む。）。","- 二　第一項第二号に該当する個人情報　当該個人情報に含まれる個人識別符号の全部を削除すること（当該個人識別符号を復元することのできる規則性を有しない方法により他の記述等に置き換えることを含む。）。"],["７　この法律において「個人関連情報」とは、生存する個人に関する情報であって、個人情報、仮名加工情報及び匿名加工情報のいずれにも該当しないものをいう。"],["８　この法律において「行政機関」とは、次に掲げる機関をいう。","- 一　法律の規定に基づき内閣に置かれる機関（内閣府を除く。）及び内閣の所轄の下に置かれる機関","- 二　内閣府、宮内庁並びに内閣府設置法（平成十一年法律第八十九号）第四十九条第一項及び第二項に規定する機関（これらの機関のうち第四号の政令で定める機関が置かれる機関にあっては、当該政令で定める機関を除く。）","- 三　国家行政組織法（昭和二十三年法律第百二十号）第三条第二項に規定する機関（第五号の政令で定める機関が置かれる機関にあっては、当該政令で定める機関を除く。）","- 四　内閣府設置法第三十九条及び第五十五条並びに宮内庁法（昭和二十二年法律第七十号）第十六条第二項の機関並びに内閣府設置法第四十条及び第五十六条（宮内庁法第十八条第一項において準用する場合を含む。）の特別の機関で、政令で定めるもの","- 五　国家行政組織法第八条の二の施設等機関及び同法第八条の三の特別の機関で、政令で定めるもの","- 六　会計検査院"],["９　この法律において「独立行政法人等」とは、独立行政法人通則法（平成十一年法律第百三号）第二条第一項に規定する独立行政法人及び別表第一に掲げる法人をいう。"],["１０　この法律において「地方独立行政法人」とは、地方独立行政法人法（平成十五年法律第百十八号）第二条第一項に規定する地方独立行政法人をいう。"],["１１　この法律において「行政機関等」とは、次に掲げる機関をいう。","- 一　行政機関","- 二　地方公共団体の機関（議会を除く。次章、第三章及び第六十九条第二項第三号を除き、以下同じ。）","- 三　独立行政法人等（別表第二に掲げる法人を除く。第十六条第二項第三号、第六十三条、第七十八条第一項第七号イ及びロ、第八十九条第四項から第六項まで、第百十九条第五項から第七項まで並びに第百二十五条第二項において同じ。）","- 四　地方独立行政法人（地方独立行政法人法第二十一条第一号に掲げる業務を主たる目的とするもの又は同条第二号若しくは第三号（チに係る部分に限る。）に掲げる業務を目的とするものを除く。第十六条第二項第四号、第六十三条、第七十八条第一項第七号イ及びロ、第八十九条第七項から第九項まで、第百十九条第八項から第十項まで並びに第百二十五条第二項において同じ。）"]]},"個人情報保護法17条":{"n":"個人情報の保護に関する法律第十七条","c":"（利用目的の特定）","p":[["個人情報取扱事業者は、個人情報を取り扱うに当たっては、その利用の目的（以下「利用目的」という。）をできる限り特定しなければならない。"],["２　個人情報取扱事業者は、利用目的を変更する場合には、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて行ってはならない。"]]},"個人情報保護法20条":{"n":"個人情報の保護に関する法律第二十条","c":"（適正な取得）","p":[["個人情報取扱事業者は、偽りその他不正の手段により個人情報を取得してはならない。"],["２　個人情報取扱事業者は、次に掲げる場合を除くほか、あらかじめ本人の同意を得ないで、要配慮個人情報を取得してはならない。","- 一　法令に基づく場合","- 二　人の生命、身体又は財産の保護のために必要がある場合であって、本人の同意を得ることが困難であるとき。","- 三　公衆衛生の向上又は児童の健全な育成の推進のために特に必要がある場合であって、本人の同意を得ることが困難であるとき。","- 四　国の機関若しくは地方公共団体又はその委託を受けた者が法令の定める事務を遂行することに対して協力する必要がある場合であって、本人の同意を得ることにより当該事務の遂行に支障を及ぼすおそれがあるとき。","- 五　当該個人情報取扱事業者が学術研究機関等である場合であって、当該要配慮個人情報を学術研究目的で取り扱う必要があるとき（当該要配慮個人情報を取り扱う目的の一部が学術研究目的である場合を含み、個人の権利利益を不当に侵害するおそれがある場合を除く。）。","- 六　学術研究機関等から当該要配慮個人情報を取得する場合であって、当該要配慮個人情報を学術研究目的で取得する必要があるとき（当該要配慮個人情報を取得する目的の一部が学術研究目的である場合を含み、個人の権利利益を不当に侵害するおそれがある場合を除く。）（当該個人情報取扱事業者と当該学術研究機関等が共同して学術研究を行う場合に限る。）。","- 七　当該要配慮個人情報が、本人、国の機関、地方公共団体、学術研究機関等、第五十七条第一項各号に掲げる者その他個人情報保護委員会規則で定める者により公開されている場合","- 八　その他前各号に掲げる場合に準ずるものとして政令で定める場合"]]},"個人情報保護法27条":{"n":"個人情報の保護に関する法律第二十七条","c":"（第三者提供の制限）","p":[["個人情報取扱事業者は、次に掲げる場合を除くほか、あらかじめ本人の同意を得ないで、個人データを第三者に提供してはならない。","- 一　法令に基づく場合","- 二　人の生命、身体又は財産の保護のために必要がある場合であって、本人の同意を得ることが困難であるとき。","- 三　公衆衛生の向上又は児童の健全な育成の推進のために特に必要がある場合であって、本人の同意を得ることが困難であるとき。","- 四　国の機関若しくは地方公共団体又はその委託を受けた者が法令の定める事務を遂行することに対して協力する必要がある場合であって、本人の同意を得ることにより当該事務の遂行に支障を及ぼすおそれがある
