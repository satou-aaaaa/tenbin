<style>
/* Layout: one column like a bound statute book: deep green cloth, gold-foil rules and mincho headings. Deliberate single dark look. */
:root {
  --night: #14302a;      /* cloth binding */
  --window: #1a3a32;     /* panel */
  --deep: #10261f;       /* writing field */
  --chalk: #efe9d8;      /* text (paper) */
  --muted: #b2c0b6;
  --line: #2f5a4e;       /* quiet rule */
  --gold: #d4b25a;       /* gold foil / accent */
  --hit: #9fe0b6;        /* correct */
  --miss: #f3a08f;       /* wrong */
  --font-pixel: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--night);
  background-image: radial-gradient(circle at 50% -10%, #1c3f36 0%, transparent 55%), repeating-linear-gradient(45deg, rgb(255 255 255 / .012) 0 2px, transparent 2px 5px);
  color: var(--chalk);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wgrid, .wcol { display: flex; flex-direction: column; gap: 16px; }
.due { color: var(--gold); font-weight: 700; }
.today { display: grid; gap: 8px; border-color: var(--gold); }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.todo .linkish { width: 100%; display: flex; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 6px 2px; min-height: 44px; font-size: 14px; }
.todo .linkish:hover:not(:disabled) { background: rgb(255 255 255 / .04); }
.todo .num { color: var(--gold); font-size: 16px; }
.today .big { width: 100%; min-height: 48px; font-size: 16px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles button { display: grid; justify-items: center; gap: 2px; padding: 10px 4px; background: var(--window); }
.tiles b { font-family: var(--font-pixel); color: var(--gold); font-size: 22px; line-height: 1.2; }
.tiles .note { margin: 0; font-size: 11px; }
.wrap details.kgroup > summary .mbar { width: 64px; flex: none; margin-left: auto; }
.wrap details.kgroup > summary .kcount { margin-left: 8px; width: 128px; flex: none; text-align: right; }
.others > summary { color: var(--gold); }
.others .fsw { justify-content: flex-start; margin: 8px 0; }
.others details.win { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 0; box-shadow: none; margin: 0; }
.kname { white-space: nowrap; }
@media (max-width: 420px) { .wrap details.kgroup > summary .kcount { width: 108px; font-size: 11px; } .wrap details.kgroup > summary .mbar { width: 48px; } }
@media (max-width: 420px) { html[data-fs="l"] .wrap details.kgroup > summary .mbar { display: none; } html[data-fs="l"] .tiles .note { font-size: 10px; } }
.hs { margin: 6px 0; padding-left: 1.2em; font-size: 13px; line-height: 1.7; }
.xfer { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.xfer button { min-height: 44px; font-size: 13px; }
#xferBox { min-height: 0; font-size: 12px; word-break: break-all; }
.others details.training > summary.section-label { margin: 12px 0 6px; }
.wlist .new { color: var(--muted); }
.chapter-head { position: relative; padding-inline: 64px; }
.topback { position: absolute; left: 0; top: 50%; transform: translateY(-50%); min-height: 40px; padding: 4px 10px; font-size: 13px; font-family: var(--font-body); }
.fsw { display: flex; gap: 6px; justify-content: center; align-items: center; }
.fsw button { min-height: 36px; padding: 4px 12px; font-size: 13px; }
.fsw button[aria-pressed="true"], .fsw button[aria-pressed="true"]:hover { background: var(--gold); color: var(--deep); border-color: var(--gold); }
html[data-fs="l"] .wrap { zoom: 1.15; }
.factbtn { position: fixed; right: 16px; bottom: 16px; z-index: 20; border-color: var(--gold); background: var(--window); color: var(--gold); box-shadow: 0 4px 14px rgb(0 0 0 / .45); }
.factdlg { max-width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--window); color: var(--chalk); border: 2px solid var(--gold); border-radius: 6px; padding: 16px; }
.factdlg::backdrop { background: rgb(0 0 0 / .6); }
.modeld > summary { font-size: 14px; }
.modeld[open] > summary { margin-bottom: 4px; }
.stickybar { position: sticky; bottom: 0; z-index: 10; box-shadow: 0 -6px 16px rgb(0 0 0 / .4); padding-block: 8px; }
.win.msg.stickybar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stickybar .row { flex-wrap: nowrap; gap: 6px; }
.stickybar button { padding: 8px 10px; font-size: 14px; white-space: nowrap; }
.stickybar p { margin: 0; }
@media (min-width: 1000px) {
  .wrap:has(> .wgrid), .wrap:has(> .cmpwide) { max-width: 1200px; }
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .wgrid > .facts { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
}
.win {
  background: var(--window);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 14px 16px;
  box-shadow: 0 1px 0 rgb(0 0 0 / .25);
}
.pixel { font-family: var(--font-pixel); letter-spacing: .04em; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
button {
  font: inherit; color: inherit; cursor: pointer;
  background: transparent; border: 1px solid var(--muted); border-radius: 3px;
  padding: 10px 14px;
}
button:hover:not(:disabled) { background: #22473d; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button:disabled { cursor: default; opacity: .55; }
.btn-gold { border-color: var(--gold); background: var(--gold); color: #14302a; font-weight: 700; }
.btn-gold:hover:not(:disabled) { background: #e2c374; }

/* title */
.title { text-align: center; padding-block: 18px; display: grid; gap: 6px; }
.title h1 { font-family: var(--font-pixel); font-size: clamp(34px, 9vw, 54px); color: var(--gold); line-height: 1.2; font-weight: 800; letter-spacing: .08em; }
.title p { margin: 0; color: var(--muted); font-size: 14px; }

/* status bar */
.status { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-family: var(--font-pixel); }
.status .hearts { color: var(--miss); letter-spacing: .1em; }
.expbar { flex: 1 1 140px; min-width: 120px; height: 8px; border: 1px solid var(--muted); border-radius: 2px; overflow: hidden; }
.expbar i { display: block; height: 100%; background: var(--gold); transition: width .4s; }
.tnum { font-variant-numeric: tabular-nums; }

/* map */
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.area { text-align: left; display: grid; gap: 6px; padding: 12px; border-width: 2px; background: var(--window); }
.area canvas { width: 72px; height: 72px; image-rendering: pixelated; }
.area .name { font-family: var(--font-pixel); font-size: 17px; }
.area .law { font-size: 12px; color: var(--muted); }
.area .badge { font-family: var(--font-pixel); font-size: 12px; color: var(--gold); min-height: 1.4em; }
.area.cleared { border-color: var(--gold); }
.note { color: var(--muted); font-size: 13px; margin: 0; }

/* battle */
.stage { display: grid; justify-items: center; gap: 8px; padding-block: 4px; }
.enemy-name { font-family: var(--font-pixel); font-size: 18px; }
.hpbar { width: min(320px, 100%); height: 12px; border: 2px solid var(--chalk); border-radius: 2px; overflow: hidden; background: #2a1f14; }
.hpbar i { display: block; height: 100%; background: var(--miss); transition: width .5s; }
#enemyCanvas { width: 168px; height: 168px; image-rendering: pixelated; }
.shake { animation: shake .35s; }
.flash { animation: flash .35s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 50%{transform:translateX(7px)} 75%{transform:translateX(-4px)} }
@keyframes flash { 0%,100%{filter:none} 50%{filter:brightness(2.4)} }
.hurt { animation: hurt .4s; }
@keyframes hurt { 0%,100%{background:var(--night)} 40%{background:#3d2a1d} }
@media (prefers-reduced-motion: reduce) { .shake, .flash, .hurt { animation: none; } }

.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.tag { font-family: var(--font-pixel); font-weight: 600; font-size: 12px; border: 1px solid var(--gold); color: var(--gold); padding: 0 8px; border-radius: 2px; }
.qcount { font-family: var(--font-pixel); font-size: 12px; color: var(--muted); margin-left: auto; }
.question { font-size: 17px; margin: 0 0 12px; }
.choices { display: grid; gap: 8px; }
.choices.ox { grid-template-columns: 1fr 1fr; }
.choices.ox button { font-family: var(--font-pixel); font-size: 34px; padding-block: 6px; }
.choices button { text-align: left; display: flex; gap: 10px; align-items: baseline; }
.choices.ox button { justify-content: center; }
.choices .key { font-family: var(--font-pixel); color: var(--muted); font-size: 13px; }
.choices button.right { border-color: var(--hit); color: var(--hit); opacity: 1; background: rgba(159,224,182,.10); }
.choices button.right::after { content: "✓ 正解"; margin-left: auto; padding-left: 8px; font-size: 13px; white-space: nowrap; }
.choices button.wrong::after { content: "✗"; margin-left: auto; padding-left: 8px; font-size: 13px; }
.choices button.wrong { border-color: var(--miss); color: var(--miss); opacity: 1; background: rgba(243,160,143,.10); }

.msg { display: grid; gap: 8px; }
.msg .line { font-family: var(--font-pixel); font-size: 16px; margin: 0; }
.msg .line.good { color: var(--hit); }
.msg .line.bad { color: var(--miss); }
.explain { margin: 0; }
.article { font-size: 13px; color: var(--gold); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

/* review */
.review { display: grid; gap: 10px; }
.review article { border-top: 1px dashed var(--line); padding-top: 10px; }
.review article:first-child { border-top: 0; padding-top: 0; }
.review h3 { font-size: 15px; font-weight: 700; }
.review p { margin: 2px 0 0; font-size: 14px; }

/* story */
.section-label { font-family: var(--font-pixel); color: var(--gold); font-size: 15px; margin: 4px 0 -6px; }
.chapters { display: grid; gap: 8px; }
.chapter { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--window); }
.chapter canvas { width: 48px; height: 48px; image-rendering: pixelated; }
.chapter .ch-title { font-family: var(--font-pixel); font-size: 16px; display: block; }
.chapter .ch-sub { font-size: 12px; color: var(--muted); display: block; }
.chapter .ch-state { font-family: var(--font-pixel); font-size: 12px; color: var(--gold); }
.chapter.done { border-color: var(--gold); }
.chapter-head { font-family: var(--font-pixel); color: var(--gold); text-align: center; font-size: 18px; padding-block: 6px; }
.scene { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; min-height: 140px; }
.scene canvas { width: 84px; height: 84px; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 4px; }
.scene .speaker { font-family: var(--font-pixel); color: var(--gold); font-size: 14px; }
.scene p { margin: 4px 0 0; font-size: 16px; }
.scene > div { min-width: 0; }
.facts { border-color: var(--gold); }
.facts p { margin: 6px 0 0; }
@media (max-width: 420px) { .scene canvas { width: 60px; height: 60px; } }

/* adventure */
.bunya-label { font-size: 13px; font-weight: 700; color: var(--chalk); margin: 10px 0 -2px; padding-left: 8px; border-left: 3px solid var(--gold); }
.sub-label { font-family: var(--font-pixel); font-weight: 400; font-size: 14px; color: var(--muted); margin: 6px 0 -4px; }
.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0 0 4px; justify-content: center; }
.steps li { font-family: var(--font-pixel); font-size: 12px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 2px; color: var(--muted); }
.steps li.now { border-color: var(--gold); color: var(--gold); }
.steps li.done { border-color: var(--hit); color: var(--hit); }
.memo { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
.memo li { font-size: 14px; }
.asks { display: grid; gap: 8px; }
.asks button { text-align: left; }
.board { border-color: var(--gold); display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; align-items: start; border-top: 1px dashed var(--line); padding-top: 8px; }
.brow .blabel { display: grid; font-size: 11px; color: var(--muted); }
.brow .blabel .pixel { font-size: 14px; color: var(--chalk); }
.brow .bval { font-size: 14px; min-width: 0; color: var(--muted); }
.brow.filled .bval { color: var(--chalk); }
.brow.filled .blabel .pixel { color: var(--gold); }
.factpick { display: grid; gap: 8px; }
.factpick button { text-align: left; font-size: 14px; }
.factpick button[aria-pressed="true"] { border-color: var(--gold); background: #2a2614; }
.factpick button.right { border-color: var(--hit); color: var(--hit); opacity: 1; }
.factpick button.wrong { border-color: var(--miss); color: var(--miss); opacity: 1; }
.factpick button.dim { opacity: .45; }
.drillcard { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; border-color: var(--gold); }
.drill-main { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.streak { display: grid; justify-items: center; text-align: center; gap: 2px; }
.streak-num { font-family: var(--font-pixel); font-size: 34px; color: var(--gold); line-height: 1; }
.streak-inline .streak-num { font-size: 24px; }
.mastery { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 6.5em 1fr 7.5em; gap: 10px; align-items: center; font-size: 14px; }
.mbar, .dprog { height: 8px; border: 1px solid var(--muted); border-radius: 2px; overflow: hidden; display: block; }
.mbar i, .dprog i { display: block; height: 100%; background: var(--hit); }
.dprog i { background: var(--gold); transition: width .3s; }
@media (max-width: 420px) { .mrow { grid-template-columns: 1fr auto; grid-template-areas: "l n" "b b"; row-gap: 4px; } .mrow > span:first-child { grid-area: l; } .mrow .mbar { grid-area: b; } .mrow .note { grid-area: n; text-align: right; } .drillcard { grid-template-columns: 1fr; } .brow { grid-template-columns: 1fr; gap: 2px; } }

.cites { margin: 6px 0 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.cites b { color: var(--chalk); font-weight: 700; }
.cites a { color: var(--gold); display: inline-block; padding: 10px 4px; margin: -10px -4px; }
.cites .cnote { display: block; font-size: 11.5px; }

textarea { width: 100%; font: inherit; color: inherit; background: var(--deep); border: 2px solid var(--line); border-radius: 4px; padding: 8px 10px; resize: vertical; line-height: 1.7; }
textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-color: var(--gold); }
textarea::placeholder { color: #7f978b; }
.wpart label { margin-bottom: 8px; }
.cmp { display: grid; gap: 6px; }
.cmp h4 { margin: 4px 0 0; font-family: var(--font-pixel); font-weight: 400; font-size: 12px; color: var(--muted); }
.cmp .mine { white-space: pre-wrap; overflow-wrap: anywhere; border-left: 3px solid var(--muted); padding-left: 10px; }
.cmp .model { border-left: 3px solid var(--gold); padding-left: 10px; }
.checks { display: grid; gap: 2px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.checks label { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; min-height: 44px; padding: 10px 8px; margin: 0 -8px; border-radius: 4px; box-sizing: border-box; }
.checks label:hover { background: rgba(239,233,216,.05); }
.checks label:has(input:checked) { color: var(--chalk); background: rgba(212,178,90,.10); }
.checks input { width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: var(--gold); }
.ph { margin: 10px 0 4px; font-family: var(--font-pixel); font-weight: 400; font-size: 13px; color: var(--gold); }
.quote { margin: 4px 0 0; font-size: 14px; }
.timerbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; position: sticky; top: 0; z-index: 2; padding-block: 8px; }
.timerbar .hints { display: flex; gap: 8px; margin-left: auto; }
.timerbar .hints button { padding: 4px 10px; font-size: 13px; }
.subdrill { display: grid; gap: 10px; justify-items: start; }
.timerbar .over { color: var(--gold); }
.menu { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; }
.menu li > span { display: block; margin-bottom: 6px; }
.normcard { display: grid; gap: 10px; border-color: var(--gold); }
.normcard .front { font-family: var(--font-pixel); font-size: 19px; line-height: 1.6; margin: 0; }
.normcard .back { white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.ai .aiout { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; }
.ai .aiout:empty { display: none; }
details.training > summary.section-label { margin: 22px 0 6px; }
.wlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 6px; }
.wlist button { text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 6px 12px; background: var(--window); }
.wlist .ch-title { font-family: var(--font-pixel); font-size: 14px; line-height: 1.4; }
.wlist .ch-title .star { color: var(--gold); margin-right: 4px; font-weight: 400; }
.wlist .ch-sub { font-size: 12px; color: var(--gold); white-space: nowrap; flex: none; }
details.kgroup { border-bottom: 1px solid var(--line); }
details.kgroup > summary { justify-content: space-between; padding: 2px; margin: 0; font-size: 16px; color: var(--chalk); }
details.kgroup > summary .kcount { margin-left: auto; font-family: var(--font-body); font-size: 12px; color: var(--muted); }
details.kgroup[open] { padding-bottom: 10px; }
details summary { cursor: pointer; font-family: var(--font-pixel); color: var(--gold); min-height: 44px; display: flex; align-items: center; gap: 6px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "▶"; font-size: 11px; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
details ul { margin: 8px 0 0; padding-left: 1.2em; font-size: 14px; }
details li + li { margin-top: 4px; }

/* 六法全書: gold double rule under the title, and gold frames on the featured panels */
.title { border-bottom: 3px double var(--gold); padding-bottom: 16px; }
.title p { letter-spacing: .06em; }
.drillcard, .facts { border-color: var(--gold); }
.section-label { font-weight: 600; letter-spacing: .06em; }
.chapter-head { font-weight: 600; letter-spacing: .06em; }
.cmp .model { color: var(--chalk); white-space: pre-wrap; }
</style>

<script>
// ===== Questions (2026年10月時点の法令に基づく) =====
const AREAS = [
  {
    id: "kenpo", name: "憲法の城", law: "日本国憲法", boss: "違憲審査の番人", sprite: "knight",
    qs: [

  const base = SPRITES[key], n = 12;
  const s = { map: base.map, pal: Object.assign({}, base.pal, palOverride || {}) };
  canvas.width = n * scale; canvas.height = n * scale;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  s.map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (s.pal[ch]) { ctx.fillStyle = s.pal[ch]; ctx.fillRect(x * scale, y * scale, scale, scale); }
  }));
}

function fieldOf(q, areaId) {
  const tag = (q.src || "") + " " + (q.art || "");
  if (areaId === "tower" || areaId === "koho") {
    if (/行政/.test(tag)) return "行政法";
    if (/民法|民事/.test(tag)) return "民法";
    if (/刑法|刑事/.test(tag)) return "刑法";
    return "憲法";
  }
  return FIELD_OF_AREA[areaId];
}

  essays: saved.essays || {},          // id -> best self-check ratio (0-1)

  review: saved.review || {},          // "e:依頼id" / "n:カードid" -> { box, due }（論文の間隔反復）
};
const save = () => store.set(S);
const INTERVALS = [1, 3, 7, 14, 30];

function record(q, ok) {
  const st = S.stats[q.id] || [0, 0]; st[1]++; if (ok) st[0]++; S.stats[q.id] = st;
  const r = S.srs[q.id] || { box: -1, due: today() };
  if (ok) { r.box = Math.min(r.box + 1, INTERVALS.length - 1); r.due = today() + INTERVALS[r.box]; }
  else { r.box = 0; r.due = today(); }
  S.srs[q.id] = r; save();
}
// 論文の復習: できた（依頼はA以上・カードは覚えていた）なら間隔をのばし、だめなら翌日にもう一度
function schedule(key, ok) {
  const r = S.review[key] || { box: -1 };
  if (ok) { r.box = Math.min(r.box + 1, INTERVALS.length - 1); r.due = today() + INTERVALS[r.box]; }
  else { r.box = 0; r.due = today() + 1; }
  S.review[key] = r; save();
}
const isDue = key => S.review[key] && S.review[key].due <= today();
function dueList() {
  const t = today();
  return Object.entries(S.srs).filter(([id, r]) => BANK[id] && r.due <= t).sort((a, b) => a[1].due - b[1].due).map(([id]) => BANK[id]);
}
function refillFreeze() {
  const k = S.streak;
  if (k.freezes < 1 && today() - k.refill >= 7) { k.freezes = 1; k.refill = today(); save(); }
}
function streakAlive() {
  const k = S.streak; if (k.last == null) return 0;
  const gap = today() - k.last;
  if (gap <= 1) return k.count;
  if (gap === 2 && k.freezes > 0) return k.count;
  return 0;
}
function completeDay() {
  const k = S.streak, t = today();
  let note = "";
  if (k.last === t) return "";
  if (k.last === t - 1) k.count++;
  else if (k.last === t - 2 && k.freezes > 0) { k.freezes--; k.refill = t; k.count++; note = "きのうはお休みでしたが、おやすみ券を1枚使って記録をつなぎました。"; }
  else k.count = 1;
  k.last = t; save();
  return note;
}

const XFER_KEYS = ["roppo-quest-v2", "tenbin-fs", "tenbin-open"];
function bindXfer() {
  const box = document.getElementById("xferBox"), msg = document.getElementById("xferMsg");
  document.getElementById("expBtn").onclick = async () => {
    const o = { app: "tenbin", v: 1, at: new Date().toISOString(), data: {} };
    XFER_KEYS.forEach(k => { try { const v = localStorage.getItem(k); if (v != null) o.data[k] = v; } catch {} });
    box.value = btoa(unescape(encodeURIComponent(JSON.stringify(o))));
    box.select();
    let copied = false; try { await navigator.clipboard.writeText(box.value); copied = true; } catch {}
    msg.textContent = copied ? "コードをコピーしました。移し先の「コードを読み込む」で貼りつけてください。" : "コードを全部選んでコピーし、移し先で貼りつけてください。";
  };
  document.getElementById("impBtn").onclick = () => {
    let o; try { o = JSON.parse(decodeURIComponent(escape(atob(box.value.trim())))); } catch {}
    if (!o || o.app !== "tenbin" || !o.data || typeof o.data["roppo-quest-v2"] !== "string") { msg.textContent = "コードを読み取れませんでした。書き出したコードを全部貼りつけてください。"; return; }
    if (!confirm("いまのこのブラウザの記録を、読み込んだ記録で置きかえます。よろしいですか？")) return;
    try { XFER_KEYS.forEach(k => { if (typeof o.data[k] === "string") localStorage.setItem(k, o.data[k]); }); } catch { msg.textContent = "このブラウザでは保存できませんでした。"; return; }
    location.reload();
  };
}
const rating = r => r >= 0.9 ? "S" : r >= 0.7 ? "A" : r >= 0.5 ? "B" : "C";

// ===== Case flow: hearing → issues → syllogism → closing =====
function caseHead(c, step) {
  const steps = ["聞き取り", "論点チェック", "三段論法", "解決"];
  return `<div class="chapter-head">${esc(c.label)}「${esc(c.title)}」</div>
    <ol class="steps" aria-label="進み具合">${steps.map((s, i) => `<li class="${i < step ? "done" : i === step ? "now" : ""}">${s}</li>`).join("")}</ol>`;
}
function memoHTML(c, got) {
  return `<section class="win facts">
    <div class="qhead"><span class="tag">事件メモ</span><span class="qcount">${esc(CHARS[c.client].name)}</span></div>
    ${got.length ? `<ul class="memo">${got.map(i => `<li>${esc(c.facts[i].fact)}</li>`).join("")}</ul>` : `<p class="note">まだ何も聞いていません。下の質問をタップして話を聞きましょう。</p>`}
  </section>`;
}
function startCase(id) {
  const c = CASES.find(x => x.id === id);
  const run = { c, score: 0, total: c.issues.length + 3, missed: [], order: shuffle(c.facts.map((f, i) => i)) };
  playScenes(`${c.label}「${c.title}」`, c.intro, () => hearing(run, []));
}
function hearing(run, got) {
  const c = run.c; quiz = null;
  const left = run.order.filter(i => !got.includes(i));
  $app.innerHTML = `${caseHead(c, 0)}
    ${memoHTML(c, got)}
    <section class="win">
      <div class="qhead"><span class="tag">聞き取り</span><span class="qcount tnum">${got.length}/${c.facts.length}</span></div>
      <p class="question" style="font-size:15px">相談者に何を聞きますか？ 事件メモに書いた事実は、あとで「あてはめ」に使います。</p>
      <div class="asks">${left.map(i => `<button data-f="${i}">「${esc(c.facts[i].ask)}」</button>`).join("")}</div>
      ${left.length ? "" : `<div class="row"><button class="btn-gold" id="next">論点チェックへ ▶</button></div>`}
    </section>`;
  $app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => hearing(run, [...got, +b.dataset.f]));
  const nx = document.getElementById("next");
  if (nx) { nx.focus({ preventScroll: true }); nx.onclick = () => issue(run, 0); }
}
function issue(run, k) {
  const c = run.c, orig = c.issues[k], q = viewQ(orig);
  $app.innerHTML = `${caseHead(c, 1)}
    ${memoHTML(c, c.facts.map((f, i) => i))}
    <section class="win" id="qwin">${questionHTML(q, [TAGS[q.t], c.field], `論点 ${k + 1}/${c.issues.length}`)}</section>
    <section class="win msg" id="msg" hidden></section>`;
  toTop();
  bindQuiz(q, ok => {
    record(q, ok);
    if (ok) run.score++; else run.missed.push(q);
    const msg = document.getElementById("msg"); msg.hidden = false;
    msg.innerHTML = explainHTML(ok ? `<p class="line good">せいかい！ 天秤先生「うむ、よく見抜いた」</p>` : `<p class="line bad">おしい… 天秤先生「この問題は復習ドリルに入れておこう」</p>`, q);
    const last = k === c.issues.length - 1;
    showNext(msg, last ? "三段論法で答案をつくる ▶" : "つぎの論点へ ▶", () => last ? sanpo(run) : issue(run, k + 1));
  });
}
function boardHTML(c, st) {
  const sp = c.sanpo;
  const facts = st.picked == null ? "" : c.facts.map((f, i) => i).filter(i => c.facts[i].key).map(i => c.facts[i].fact).join("。") + "。";
  const row = (label, sub, val) => `<div class="brow ${val ? "filled" : ""}"><div class="blabel"><span class="pixel">${label}</span><span>${sub}</span></div><div class="bval">${val ? esc(val) : "　"}</div></div>`;
  return `<section class="win board" aria-label="答案ボード">
    <div class="qhead"><span class="tag">答案ボード</span><span class="qcount">法的三段論法</span></div>
    ${row("大前提", "規範", st.rule != null ? sp.rule.c[sp.rule.a] : "")}
    ${row("小前提", "あてはめ", facts ? `本件では、${facts}` : "")}
    ${row("結論", "", st.concl != null ? `よって、${sp.concl.c[sp.concl.a]}。` : "")}
  </section>`;
}
function sanpo(run, st = {}) {
  const c = run.c, sp = c.sanpo;
  const step = st.rule == null ? 0 : st.picked == null ? 1 : 2;
  const prompts = ["① 大前提：この事件に使う規範（条文・判例のルール）を選ぶ", "② 小前提：規範にあてはまる事実を、事件メモからすべて選ぶ", "③ 結論：規範に事実をあてはめた結論を選ぶ"];
  $app.innerHTML = `${caseHead(c, 2)}
    ${boardHTML(c, st)}
    <section class="win" id="qwin">
      <div class="qhead"><span class="tag">三段論法</span><span class="tag" style="border-color:var(--muted);color:var(--muted)">${esc(c.field)}</span><span class="qcount">${step + 1}/3</span></div>
      <p class="question" style="font-size:15px">${prompts[step]}</p>
      <div id="stepbody"></div>
    </section>
    <section class="win msg" id="msg" hidden></section>`;
  const body = document.getElementById("stepbody");
  const finish = (ok, html, nextSt, label) => {
    if (ok) run.score++;
    const msg = document.getElementById("msg"); msg.hidden = false;
    msg.innerHTML = html;
    showNext(msg, label, () => nextSt ? sanpo(run, nextSt) : closing(run));
  };
  if (step === 0 || step === 2) {
    const part = step === 0 ? sp.rule : sp.concl;
    const q = viewQ({ t: "choice", c: part.c, a: part.a });
    body.innerHTML = `<div class="choices">${q.c.map((o, i) => `<button data-i="${i}"><span class="key">${i + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
    bindQuiz(q, ok => {
      if (step === 0) finish(ok, `<p class="line ${ok ? "good" : "bad"}">${ok ? "せいかい！ 正しい規範を選べた。" : "おしい… 正しい規範を答案ボードに書いておくぞ。"}</p><p class="explain">${esc(sp.rule.e)}</p>`, { ...st, rule: 0 }, "あてはめへ ▶");
      else finish(ok, `<p class="line ${ok ? "good" : "bad"}">${ok ? "せいかい！ 答案が完成した。" : "おしい… 正しい結論を答案ボードに書いておくぞ。"}</p><p class="article">根拠：${esc(sp.art)}</p>${citeList(sp.art)}${sp.src ? `<p class="article" style="color:var(--muted)">司法試験との関係：${esc(sp.src)}</p>` : ""}`, null, "事件の解決へ ▶");
      if (step === 2) { const b = document.querySelector(".board"); b.outerHTML = boardHTML(c, { ...st, concl: 0 }); }
    }, body);
  } else {
    quiz = null;
    const sel = new Set();
    body.innerHTML = `<div class="factpick">${run.order.map(i => `<button data-p="${i}" aria-pressed="false">${esc(c.facts[i].fact)}</button>`).join("")}</div>
      <div class="row"><button class="btn-gold" id="decide" disabled>あてはめを確定</button></div>`;
    const decide = document.getElementById("decide");
    body.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
      const i = +b.dataset.p; sel.has(i) ? sel.delete(i) : sel.add(i);
      b.setAttribute("aria-pressed", sel.has(i)); decide.disabled = sel.size === 0;
    });
    decide.onclick = () => {
      const need = c.facts.map((f, i) => i).filter(i => c.facts[i].key);
      const ok = need.length === sel.size && need.every(i => sel.has(i));
      body.querySelectorAll("[data-p]").forEach(b => {
        const i = +b.dataset.p; b.disabled = true;
        b.classList.add(c.facts[i].key ? "right" : sel.has(i) ? "wrong" : "dim");
      });
      decide.remove();
      const extra = [...sel].filter(i => !c.facts[i].key).length, miss = need.filter(i => !sel.has(i)).length;
      finish(ok, `<p class="line ${ok ? "good" : "bad"}">${ok ? "せいかい！ 必要な事実をすべて拾えた。" : `おしい… ${miss ? `拾い忘れが${miss}つ` : ""}${miss && extra ? "、" : ""}${extra ? `関係のない事実が${extra}つ` : ""}あった。`}</p>
        <p class="explain">緑の枠が、規範の要件にあたる事実です。採点実感でも、事実を書き写すだけでなく、要件にあたる事実を拾って評価することが求められています。</p>`, { ...st, picked: [...sel] }, "結論へ ▶");
      document.querySelector(".board").outerHTML = boardHTML(c, { ...st, picked: [...sel] });
    };
  }
}
function closing(run) {
  const c = run.c;
  const ratio = run.score / run.total;
  const prev = S.cases[c.id];
  S.cases[c.id] = Math.max(prev || 0, ratio); save();
  const lines = [...(c.outro || [])];
  if (c.real) lines.push(["sensei", `モデルになった事件：${c.real}。`]);
  playScenes(`${c.label}「${c.title}」`, lines, () => {
    $app.innerHTML = `${caseHead(c, 4)}
      <section class="win msg">
        <p class="line good" style="font-size:20px">事件解決！　評価 ${rating(ratio)}</p>
        <p class="note tnum">論点チェックと三段論法　${run.total}問中 ${run.score}問正解</p>
        ${run.missed.length ? `<p>まちがえた論点 ${run.missed.length}問は、復習ドリルに入れました。</p>` : "<p>まちがいなし。見事じゃ！</p>"}
      </section>

      <div class="row"><button id="again">もう一度</button><button id="write">意見書（答案）を書く ✎</button><button class="btn-gold" id="home">目次にもどる</button></div>`;

    document.getElementById("write").onclick = () => startWrite(c.id);

    toTop();
  });
}

    </section>`
      : `<p class="note">事例には、答案に使わない事実もまじっています。法的三段論法の型にそって、自分の言葉で書きましょう。書き終えたら模範答案と見比べて、自分で採点します。書いた内容はこのブラウザに自動で保存されます。</p>
    ${WPARTS.map(([t, sub, ph], i) => `<section class="win wpart">
      <label class="qhead" for="w${i}"><span class="tag">${i + 1}. ${t}</span>${sub ? `<span class="note">${sub}</span>` : ""}<span class="qcount tnum" id="n${i}">${draft[i].length}字</span></label>
      <textarea id="w${i}" rows="${[2, 3, 4, 2][i]}" placeholder="${esc(ph)}">${esc(draft[i])}</textarea>
    </section>`).join("")}`}
    <div class="row"><button id="quit">目次にもどる</button><button class="btn-gold" id="done">模範答案と比べる ▶</button></div>`;
  // PCでは事例を左、答案を右に並べる。スマホでは事例が見えなくなったら「事例を見る」ボタンを出す
  const factsEl = $app.querySelector(".facts"), grid = document.createElement("div"), right = document.createElement("div");
  grid.className = "wgrid"; right.className = "wcol";
  [...$app.children].filter(e => e !== factsEl && !e.classList.contains("chapter-head")).forEach(e => right.append(e));
  factsEl.replaceWith(grid); grid.append(factsEl, right);
  const fbtn = document.createElement("button"), dlg = document.createElement("dialog");
  fbtn.className = "factbtn"; fbtn.textContent = "事例を見る"; fbtn.hidden = true;
  dlg.className = "factdlg"; dlg.innerHTML = factsEl.innerHTML + `<div class="row"><button class="btn-gold" id="dlgClose">答案にもどる</button></div>`;
  $app.append(fbtn, dlg);
  fbtn.onclick = () => dlg.showModal();
  dlg.querySelector("#dlgClose").onclick = () => dlg.close();
  new IntersectionObserver(([e]) => { fbtn.hidden = e.isIntersecting || wideNow(); }).observe(factsEl);
  const areas = blank.map((_, i) => document.getElementById("w" + i));
  const done = document.getElementById("done");
  const sync = () => {
    S.drafts[id] = areas.map(a => a.value); save();
    areas.forEach((a, i) => document.getElementById("n" + i).textContent = a.value.length + "字");
    done.disabled = areas.every(a => !a.value.trim());
  };
  // 書いた分だけ欄が伸びる（最初は小さく表示して画面を短くする）
  const grow = a => { a.style.height = "auto"; a.style.height = a.scrollHeight + 4 + "px"; };
  areas.forEach(a => { a.oninput = () => { grow(a); sync(); }; if (a.value) grow(a); });
  done.disabled = areas.every(a => !a.value.trim());
  const t0 = Date.now(), hints = new Set();
  const clock = document.getElementById("clock");
  const limit = (big ? p.minutes : 20) * 60;
  const timer = setInterval(() => {
    if (!document.body.contains(clock)) return clearInterval(timer);
    const sec = Math.floor((Date.now() - t0) / 1000);
    clock.textContent = "経過 " + fmtTime(sec) + (sec > limit ? "（目安を過ぎました）" : "");
    clock.classList.toggle("over", sec > limit);
  }, 1000);
  const hintBox = document.getElementById("hint");
  hintSets.forEach((_, i) => document.getElementById("h" + i).onclick = () => {
    hints.add(i); hintBox.hidden = false;
    hintBox.innerHTML = [...hints].sort().map(j => `<p style="margin:4px 0 0">${j ? "規範で書くこと" : "論点"}：${hintSets[j].map(esc).join("／")}</p>`).join("");
  });
  done.onclick = () => { clearInterval(timer); writeCompare(id, { time: fmtTime(Math.floor((Date.now() - t0) / 1000)), hints: hints.size }); };
  document.getElementById("quit").onclick = () => { clearInterval(timer); showOffice(); };
  toTop();
}
const wideNow = () => matchMedia("(min-width: 1000px)").matches;
function writeCompare(id, meta = { time: null, hints: 0 }) {
  quiz = null;
  const p = probOf(id), big = !!p.big;
  const mine = S.drafts[id] || (big ? [""] : ["", "", "", ""]);
  const checks = writeChecks(p), total = checks.flat().length;
  const checkHTML = list => `<div class="checks">${list.map(t => `<label><input type="checkbox" data-c><span>${esc(t)}</span></label>`).join("")}</div>`;
  const mineHTML = t => t.trim() ? esc(t) : `<span class="note">（未記入）</span>`;
  const modelText = big ? p.secs.map(s => s.text).join("\n") : p.m.join("");
  $app.innerHTML = `<div class="chapter-head">${big ? "★ 大問" : "依頼"}「${esc(p.title)}」</div>
    <p class="note cmpwide">あなたの答案と模範答案を見比べて、できている観点にチェックを入れましょう。模範答案は一例です。言い回しがちがっても、観点がそろっていればチェックして構いません。</p>
    ${big
      ? `<section class="win cmp"><div class="qhead"><span class="tag">あなたの答案</span><span class="qcount tnum">${mine[0].length}字</span></div><div class="mine">${mineHTML(mine[0])}</div></section>
    ${p.secs.map((s, i) => `<section class="win cmp">
      <div class="qhead"><span class="tag">論点${i + 1}</span><span class="note" style="margin:0">${esc(s.h)}</span></div>
      <details class="modeld"${wideNow() ? " open" : ""}><summary>模範答案を見る</summary><div class="model">${esc(s.text)}</div></details>
      ${checkHTML(checks[i])}
    </section>`).join("")}`
      : WPARTS.map(([t], i) => `<section class="win cmp">
      <div class="qhead"><span class="tag">${i + 1}. ${t}</span></div>
      <div class="pair"><div><h4>あなたの答案</h4><div class="mine">${mineHTML(mine[i])}</div></div>
      <details class="modeld"${wideNow() ? " open" : ""}><summary>模範答案を見る</summary><div class="model">${esc(p.m[i])}</div></details></div>
      ${checkHTML(checks[i])}
    </section>`).join("")}
    ${(() => { const cs = citesIn(modelText); return cs.length ? `<section class="win"><div class="qhead"><span class="tag">参考判例</span></div><ul class="cites">${cs.map(citeHTML).join("")}</ul></section>` : ""; })()}
    <section class="win ai" id="ai" hidden>
      <div class="qhead"><span class="tag">Claudeの添削</span></div>
      <p class="note">あなたの答案をClaudeが読んで、良い点と直すとよい点をコメントします。添削にはあなたのClaudeの利用枠を使います。最初に使うときは、許可を求める画面が出ます。</p>
      <div class="row" style="justify-content:flex-start"><button class="btn-gold" id="aiGo">Claudeに添削してもらう</button><button id="aiStop" hidden>止める</button></div>
      <div class="aiout" id="aiOut" aria-live="polite"></div>
      <p class="note" id="aiNote"></p>
      <div class="row" style="justify-content:flex-start"><button id="aiApply" hidden>Claudeの判定をチェックに反映</button></div>
      <p class="note">添削はAIによる参考意見です。誤りがありうるので、模範答案と観点もあわせて確かめてください。</p>
    </section>
    <section class="win msg stickybar" id="msg"><div><p class="tnum" id="cnt">チェック 0/${total}</p>${meta.time ? `<p class="note tnum" style="font-size:12px">${meta.time}・ヒント${meta.hints}回</p>` : ""}</div>
      <div class="row" style="margin:0"><button id="back">書き直す</button><button class="btn-gold" id="grade">自己採点を確定</button></div></section>`;
  const boxes = [...$app.querySelectorAll("[data-c]")];
  const cnt = document.getElementById("cnt");
  boxes.forEach(b => b.onchange = () => cnt.textContent = `チェック ${boxes.filter(x => x.checked).length}/${total}`);
  bindAI(p, mine, checks, boxes, () => {});
  document.getElementById("back").onclick = () => startWrite(id);
  document.getElementById("grade").onclick = () => {
    const n = boxes.filter(x => x.checked).length, ratio = n / total;
    S.essays[id] = Math.max(S.essays[id] || 0, ratio); save();
    boxes.forEach(b => b.disabled = true);
    const miss = boxes.filter(x => !x.checked).map(x => x.nextElementSibling.textContent);
    S.miss[id] = miss; schedule("e:" + id, ratio >= 0.7);
    const note = completeDay();
    const msg = document.getElementById("msg");
    msg.innerHTML = `<p class="line good" style="font-size:20px">意見書の評価 ${rating(ratio)}</p>
      <p class="note tnum">${total}の観点のうち ${n}つができていました。${meta.time ? `（${meta.time}・ヒント${meta.hints}回）` : ""}</p>
      <p class="streak-inline"><span class="streak-num tnum">${S.streak.count}</span> 日連続で学習中</p>${note ? `<p class="note">${note}</p>` : ""}
      <p class="note">${ratio >= 0.7 ? `この依頼は${INTERVALS[S.review["e:" + id].box]}日後に、今日のメニューで復習に出ます。` : "評価がA未満だったので、あしたの今日のメニューで書き直しに出ます。"}</p>
      ${miss.length ? `<p>次に書くときは、ここを意識しよう。</p><ul class="memo">${miss.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "<p>天秤先生「すべての観点がそろっておる。見事な答案じゃ！」</p>"}
      <div class="row"><button id="again">書き直す</button><button class="btn-gold" id="home">目次にもどる</button></div>`;
    document.getElementById("again").onclick = () => startWrite(id);
    document.getElementById("home").onclick = showOffice;
    document.getElementById("home").focus({ preventScroll: true });
  };
  toTop();
}

// ===== Claudeによる添削（sample capability。使えない環境ではボタンごと隠す） =====
const useSample = () => (window.claude && window.claude.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null));
const AI_ERR = {
  rate_limited: "いまは混み合っているか、利用の上限に達しています。少し時間をおいて試してください。",
  session_expired: "もう一度ログインしてから試してください。",
  refused: "この答案では添削できませんでした。内容を見直して試してください。",
  empty_completion: "添削の結果が返ってきませんでした。もう一度試してください。",
  prompt_too_large: "答案が長すぎて送れませんでした。",
};
function aiPrompt(p, mine, checks) {
  const answer = p.big ? mine[0] : WPARTS.map(([t], i) => `【${t}】\n${mine[i] || "（未記入）"}`).join("\n\n");
  const model = p.big ? p.secs.map(s => s.text).join("\n\n") : WPARTS.map(([t], i) => `【${t}】\n${p.m[i]}`).join("\n\n");
  const list = checks.flat().map((t, i) => `${i + 1}. ${t}`).join("\n");
  return `あなたは司法試験の論文式試験の採点に慣れた指導者です。受験生の答案を添削してください。

# ルール
- 日本語で、受験生に話しかけるように、ていねいに書く。
- Markdownの記号（#、**、表）は使わない。見出しは【 】で示す。
- 評価の根拠は、下の「事例」「設問」「模範答案」「採点の観点」にある内容に限る。そこにない判例や条文を新たに持ち出す場合は、「（一般論として）」と明記し、事件番号や日付は書かない。
- 模範答案と言い回しが違っても、内容が同じなら正しく評価する。
- 法的三段論法（問題提起→規範→あてはめ→結論）ができているか、事実を規範の要件にあてはめて評価しているか（事実の書き写しになっていないか）を重視する。

# 出力の形
【総評】2〜3文
【良い点】箇条書き（・）で1〜3個
【直すとよい点】箇条書き（・）で1〜4個。どこをどう直すか具体的に
【書き直し例】いちばん直すとよい部分を1段落だけ書き直した例
最後の1行に「観点判定：」に続けて、採点の観点の番号順に、満たしていれば○、満たしていなければ×を、区切りなしで並べる（例：観点判定：○×○）

# 事例
${p.story.join("\n")}
${p.facts ? p.facts.map(f => "・" + f.fact).join("\n") : ""}

# 設問
${p.toi}

# 模範答案
${model}

# 採点の観点
${list}

# 受験生の答案
${answer}`;
}
function bindAI(p, mine, checks, boxes, onApplied) {
  const box = document.getElementById("ai");
  useSample().then(sample => {
    if (!sample || !box) return;
    box.hidden = false;
    const go = document.getElementById("aiGo"), stop = document.getElementById("aiStop");
    const out = document.getElementById("aiOut"), note = document.getElementById("aiNote"), apply = document.getElementById("aiApply");
    let ctl = null, verdict = null;
    stop.onclick = () => ctl && ctl.abort();
    go.onclick = async () => {
      ctl = new AbortController(); verdict = null;
      go.disabled = true; stop.hidden = false; apply.hidden = true; note.textContent = "";
      out.textContent = "Claudeが答案を読んでいます…";
      const strip = t => t.replace(/\n?観点判定[:：].*$/s, "").trim();
      try {
        const { text, truncated } = await sample(aiPrompt(p, mine, checks), { signal: ctl.signal, onText: ({ text }) => { out.textContent = strip(text); } });
        out.textContent = strip(text);
        const m = text.match(/観点判定[:：]\s*([○◯×xX✕ ]+)/);
        if (m) {
          const marks = m[1].replace(/\s/g, "").split("");
          if (marks.length === boxes.length) { verdict = marks.map(c => c === "○" || c === "◯"); apply.hidden = false; }
        }
        if (truncated) note.textContent = "添削が途中で切れています。";
      } catch (e) {
        out.textContent = e.code === "refused" ? "" : (e.text || "");
        if (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "capability_disabled" || e.code === "not_declared") { box.hidden = true; return; }
        if (e.code !== "cancelled") note.textContent = AI_ERR[e.code] || "通信がうまくいきませんでした。もう一度試してください。";
      } finally {
        go.disabled = false; stop.hidden = true; go.textContent = "もう一度添削してもらう";
      }
    };
    apply.onclick = () => {
      if (!verdict) return;
      boxes.forEach((b, i) => { if (!b.disabled) b.checked = verdict[i]; b.dispatchEvent(new Event("change")); });
      apply.hidden = true; onApplied();
    };
  });
}

// ===== 規範カード（論点 → 規範を思い出す） =====
let _norms = null;
const NORMS = () => _norms || (_norms = probs().flatMap(p => p.big
  ? p.secs.map((sec, i) => ({ id: `${p.id}#${i}`, title: p.title, kamoku: p.kamoku, front: sec.h, list: sec.k, cite: sec.text }))
  : [{ id: p.id, title: p.title, kamoku: p.kamoku, front: p.p.replace(/を問題にした$/, ""), back: p.m[1], cite: p.m[1] }]));
const dueNorms = () => NORMS().filter(c => isDue("n:" + c.id));
function startNorms(dueOnly) {
  quiz = null;
  const all = dueOnly === true ? dueNorms() : NORMS();
  const rank = c => isDue("n:" + c.id) ? 0 : S.norms[c.id] === false ? 1 : S.norms[c.id] == null ? 2 : 3;
  const deck = shuffle(all).sort((a, b) => rank(a) - rank(b)).slice(0, 10);
  normCard({ deck, i: 0, ok: 0 });
}
function normCard(d) {
  if (d.i >= d.deck.length) return normEnd(d);
  const c = d.deck[d.i];
  $app.innerHTML = `
    <div class="chapter-head">規範カード</div>
    <div class="dprog" aria-hidden="true"><i style="width:${d.i / d.deck.length * 100}%"></i></div>
    <section class="win normcard">
      <div class="qhead"><span class="tag">${esc(c.kamoku)}</span><span class="note" style="margin:0">${esc(c.title)}</span><span class="qcount tnum">${d.i + 1}/${d.deck.length}</span></div>
      <p class="note" style="margin:0">この論点の規範（答案に書くこと）を、頭の中で言ってみよう。</p>
      <p class="front">${esc(c.front)}</p>
      <div id="back" hidden></div>
      <div class="row" id="acts"><button class="btn-gold" id="flip">規範を見る</button></div>
    </section>
    <div class="row"><button id="quit">やめる</button></div>`;
  document.getElementById("quit").onclick = showOffice;
  const flip = document.getElementById("flip");
  flip.onclick = () => {
    const back = document.getElementById("back"); back.hidden = false;
    back.innerHTML = c.list
      ? `<div class="back"><b>答案に書くこと</b><ul class="memo">${c.list.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`
      : `<div class="back">${esc(c.back)}</div>`;
    back.insertAdjacentHTML("beforeend", citeList(c.cite));
    document.getElementById("acts").innerHTML = `<button id="no">まだ</button><button class="btn-gold" id="yes">覚えていた</button>`;
    const mark = ok => { S.norms[c.id] = ok; schedule("n:" + c.id, ok); if (ok) d.ok++; d.i++; normCard(d); };
    document.getElementById("no").onclick = () => mark(false);
    document.getElementById("yes").onclick = () => mark(true);
    document.getElementById("yes").focus({ preventScroll: true });
  };
  flip.focus({ preventScroll: true });
  toTop();
}
function normEnd(d) {
  const all = NORMS();
  $app.innerHTML = `
    <div class="chapter-head">規範カード</div>
    <section class="win msg">
      <p class="line good" style="font-size:20px">${d.deck.length}枚中 ${d.ok}枚 覚えていた</p>
      <p class="tnum">覚えたカード ${all.filter(c => S.norms[c.id]).length}/${all.length}枚</p>
      <p class="note">「まだ」にしたカードは、次にめくるとき先に出ます。規範を覚えたら、依頼の答案で使ってみましょう。</p>
    </section>
    <div class="row"><button id="again">もう10枚</button><button class="btn-gold" id="home">目次にもどる</button></div>`;
  document.getElementById("again").onclick = startNorms;
  document.getElementById("home").onclick = showOffice;
  document.getElementById("home").focus({ preventScroll: true });
  toTop();
}

// ===== Daily drill =====
function startDrill() {
  const due = dueList();
  const unseen = shuffle(Object.values(BANK).filter(q => !S.srs[q.id]));
  const learned = shuffle(Object.values(BANK).filter(q => S.srs[q.id] && !due.includes(q)));
  const deck = [...due, ...unseen, ...learned].slice(0, 10);
  drillQ({ deck, i: 0, right: 0, retry: [] });
}
function drillQ(d) {
  if (d.i >= d.deck.length) return drillEnd(d);
  const orig = d.deck[d.i], q = viewQ(orig);
  const isRetry = d.i >= 10;
  $app.innerHTML = `
    <div class="chapter-head">今日の復習ドリル</div>
    <div class="dprog" aria-hidden="true"><i style="width:${Math.min(100, d.i / d.deck.length * 100)}%"></i></div>
    <section class="win">${questionHTML(q, [TAGS[q.t], q.field], isRetry ? "もう一度" : `${d.i + 1}/${Math.min(10, d.deck.length)}`)}</section>
    <section class="win msg" id="msg" hidden></section>
    <div class="row"><button id="quit">やめる</button></div>`;
  document.getElementById("quit").onclick = showOffice;
  toTop();
  bindQuiz(q, ok => {
    if (!isRetry) { record(q, ok); if (ok) d.right++; }
    if (!ok && !isRetry) d.deck.push(orig);
    const msg = document.getElementById("msg"); msg.hidden = false;
    msg.innerHTML = explainHTML(ok ? `<p class="line good">せいかい！</p>` : `<p class="line bad">ざんねん… ${isRetry ? "" : "最後にもう一度出題します。"}</p>`, q);
    showNext(msg, d.i + 1 >= d.deck.length ? "結果を見る" : "つぎへ ▶", () => { d.i++; drillQ(d); });
  });
}
function drillEnd(d) {
  quiz = null;
  const note = completeDay();
  $app.innerHTML = `
    <div class="chapter-head">今日の復習ドリル</div>
    <section class="win msg">
      <p class="line good" style="font-size:20px">ドリル完了！</p>
      <p class="tnum">${Math.min(10, d.deck.length)}問中 ${d.right}問正解</p>
      <p class="streak-inline"><span class="streak-num tnum">${S.streak.count}</span> 日連続で学習中</p>
      ${note ? `<p class="note">${note}</p>` : ""}
      <p class="note">正解した問題は、1日後・3日後・1週間後と、間隔をあけて出題されます。まちがえた問題は、次のドリルでまた出ます。</p>
    </section>
    <div class="row"><button class="btn-gold" id="home">目次にもどる</button></div>`;
  document.getElementById("home").onclick = showOffice;
  document.getElementById("home").focus({ preventScroll: true });
  toTop();
}

// keyboard: 1-4 / o x to answer, Enter for next
document.addEventListener("keydown", e => {
  const next = document.getElementById("next");
  if (!quiz || quiz.answered) { if (e.key === "Enter" && next && document.activeElement !== next && !(document.activeElement && document.activeElement.tagName === "BUTTON")) { e.preventDefault(); next.click(); } return; }
  const q = quiz.q, n = q.t === "ox" ? 2 : q.c.length;
  let idx = -1;
  if (/^[1-4]$/.test(e.key)) idx = +e.key - 1;
  if (q.t === "ox" && (e.key === "o" || e.key === "O")) idx = 0;
  if (q.t === "ox" && (e.key === "x" || e.key === "X")) idx = 1;
  if (idx >= 0 && idx < n) quiz.pick(idx);
});

showOffice();
</script>
